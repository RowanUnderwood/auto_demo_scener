<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Solar System</title>
<style>
* { margin: 0; padding: 0; }
body { overflow: hidden; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 25, 45);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Sun
const sunGeo = new THREE.SphereGeometry(2, 32, 32);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
const sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);

const sunLight = new THREE.PointLight(0xffffff, 2, 200);
sun.add(sunLight);

const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
scene.add(ambientLight);

// Planets config
const planets = [
  { name: 'Mercury', orbitRadius: 4, radius: 0.3, color: 0x8c7e6d, speed: 0.04 },
  { name: 'Venus', orbitRadius: 7.7, radius: 0.5, color: 0xe8cda0, speed: 0.03 },
  { name: 'Earth', orbitRadius: 11.4, radius: 0.55, color: 0x4488cc, speed: 0.025 },
  { name: 'Mars', orbitRadius: 15.1, radius: 0.4, color: 0xcc5533, speed: 0.02 },
  { name: 'Jupiter', orbitRadius: 18.9, radius: 1.5, color: 0xd4a56a, speed: 0.012 },
  { name: 'Saturn', orbitRadius: 22.6, radius: 1.3, color: 0xead6a6, speed: 0.009 },
  { name: 'Uranus', orbitRadius: 26.3, radius: 0.8, color: 0x88ccdd, speed: 0.006 },
  { name: 'Neptune', orbitRadius: 30, radius: 0.75, color: 0x3355cc, speed: 0.004 }
];

const planetMeshes = [];

planets.forEach(p => {
  // Planet mesh
  const geo = new THREE.SphereGeometry(p.radius, 32, 32);
  const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.8, metalness: 0.1 });
  const mesh = new THREE.Mesh(geo, mat);

  // Orbit line
  const orbitPoints = [];
  for (let i = 0; i <= 128; i++) {
    const angle = (i / 128) * Math.PI * 2;
    orbitPoints.push(new THREE.Vector3(Math.cos(angle) * p.orbitRadius, 0, Math.sin(angle) * p.orbitRadius));
  }
  const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
  const orbitMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
  const orbitLine = new THREE.Line(orbitGeo, orbitMat);
  scene.add(orbitLine);

  scene.add(mesh);

  // Saturn ring
  if (p.name === 'Saturn') {
    const ringGeo = new THREE.RingGeometry(p.radius * 1.4, p.radius * 2.2, 64);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xc8b88a,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.7
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2.5;
    mesh.add(ring);
  }

  // Earth's moon
  let moon = null;
  if (p.name === 'Earth') {
    const moonGeo = new THREE.SphereGeometry(0.15, 16, 16);
    const moonMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.9 });
    moon = new THREE.Mesh(moonGeo, moonMat);
    scene.add(moon);
  }

  planetMeshes.push({
    mesh,
    moon,
    orbitRadius: p.orbitRadius,
    speed: p.speed,
    angle: Math.random() * Math.PI * 2
  });
});

// Stars
const starGeo = new THREE.BufferGeometry();
const starPositions = new Float32Array(2000 * 3);
for (let i = 0; i < 2000; i++) {
  const r = 100 + Math.random() * 400;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  starPositions[i * 3 + 2] = r * Math.cos(phi);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, sizeAttenuation: true });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// Animation
let cameraAngle = 0;
const cameraOrbitSpeed = 0.001;
const cameraRadius = 52;
const cameraHeight = 25;

function animate() {
  requestAnimationFrame(animate);

  // Slow camera orbit
  cameraAngle += cameraOrbitSpeed;
  camera.position.x = Math.cos(cameraAngle) * cameraRadius;
  camera.position.z = Math.sin(cameraAngle) * cameraRadius;
  camera.position.y = cameraHeight;
  camera.lookAt(0, 0, 0);

  // Update planets
  planetMeshes.forEach(p => {
    p.angle += p.speed;
    p.mesh.position.x = Math.cos(p.angle) * p.orbitRadius;
    p.mesh.position.z = Math.sin(p.angle) * p.orbitRadius;
    p.mesh.position.y = 0;

    // Earth's moon
    if (p.moon) {
      const moonAngle = p.angle * 5;
      const moonOrbitR = 1.2;
      p.moon.position.x = p.mesh.position.x + Math.cos(moonAngle) * moonOrbitR;
      p.moon.position.z = p.mesh.position.z + Math.sin(moonAngle) * moonOrbitR;
      p.moon.position.y = 0;
    }
  });

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
