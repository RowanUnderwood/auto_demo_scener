<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crystalline Depth</title>
    <style>
        body { margin: 0; overflow: hidden; background: #06030e; }
        canvas { display: block; }
        #vignette {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 60%, transparent 35%, rgba(4,2,12,0.85) 100%);
        }
        #caption {
            position: fixed;
            left: 50%;
            bottom: 38px;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            font-size: 10px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: rgba(160, 120, 255, 0.0);
            pointer-events: none;
            text-shadow: 0 0 14px rgba(120, 80, 255, 0.7);
            animation: capFade 5s ease-out 2s forwards, capPulse 6s ease-in-out 7s infinite;
        }
        @keyframes capFade { to { color: rgba(160, 120, 255, 0.4); } }
        @keyframes capPulse {
            0%, 100% { color: rgba(160, 120, 255, 0.4); }
            50% { color: rgba(160, 120, 255, 0.15); }
        }
    </style>
</head>
<body>
<div id="vignette"></div>
<div id="caption">Crystalline Depth</div>
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>
<script type="module">
import * as THREE from 'three';

const vertexShader = `
    varying float vElevation;
    varying vec2 vUv;
    varying vec3 vWorldPos;
    uniform float uTime;

    vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

    float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }

    float ridgeFbm(vec3 p) {
        float value = 0.0;
        float amplitude = 0.6;
        float frequency = 1.0;
        for(int i = 0; i < 5; i++) {
            float n = snoise(p * frequency);
            value += amplitude * (1.0 - abs(n));
            amplitude *= 0.5;
            frequency *= 2.3;
        }
        return value;
    }

    float fbm(vec3 p) {
        float value = 0.0;
        float amplitude = 0.5;
        float frequency = 1.0;
        for(int i = 0; i < 4; i++) {
            value += amplitude * snoise(p * frequency);
            amplitude *= 0.5;
            frequency *= 2.0;
        }
        return value;
    }

    void main() {
        vUv = uv;
        vec3 noiseCoord = vec3(position.xy * 0.035, uTime * 0.08);
        float ridge = ridgeFbm(noiseCoord) * 18.0;
        float smoothNoise = fbm(vec3(position.xy * 0.02 + 50.0, uTime * 0.05)) * 5.0;
        float wave = sin(position.x * 0.06 + uTime * 0.2) * sin(position.y * 0.04 - uTime * 0.15) * 2.5;
        float displacement = ridge + smoothNoise + wave;

        vec3 newPos = position;
        newPos.z += displacement;
        vElevation = displacement;
        vWorldPos = (modelMatrix * vec4(newPos, 1.0)).xyz;

        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
    }
`;

const fragmentShader = `
    varying float vElevation;
    varying vec2 vUv;
    varying vec3 vWorldPos;
    uniform float uTime;
    uniform vec3 uCamPos;

    vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

    float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }

    void main() {
        vec3 dx = dFdx(vWorldPos);
        vec3 dy = dFdy(vWorldPos);
        vec3 normal = normalize(cross(dx, dy));

        float h = vElevation / 22.0;
        h = clamp(h * 0.5 + 0.5, 0.0, 1.0);

        vec3 deepVoid = vec3(0.02, 0.0, 0.06);
        vec3 darkAmethyst = vec3(0.08, 0.02, 0.22);
        vec3 electricViolet = vec3(0.3, 0.08, 0.75);
        vec3 crystalCyan = vec3(0.2, 0.6, 0.95);
        vec3 whiteCore = vec3(0.9, 0.95, 1.0);

        vec3 color = mix(deepVoid, darkAmethyst, smoothstep(0.0, 0.25, h));
        color = mix(color, electricViolet, smoothstep(0.25, 0.55, h));
        color = mix(color, crystalCyan, smoothstep(0.55, 0.8, h));
        color = mix(color, whiteCore, smoothstep(0.82, 1.0, h));

        // Crystal facet specular
        vec3 lightDir1 = normalize(vec3(0.3, 0.8, 0.4));
        vec3 lightDir2 = normalize(vec3(-0.5, 0.6, -0.3));
        float spec1 = pow(max(dot(reflect(-lightDir1, normal), normalize(uCamPos - vWorldPos)), 0.0), 32.0);
        float spec2 = pow(max(dot(reflect(-lightDir2, normal), normalize(uCamPos - vWorldPos)), 0.0), 24.0);
        color += vec3(0.6, 0.4, 1.0) * spec1 * 0.5;
        color += vec3(0.3, 0.7, 1.0) * spec2 * 0.35;

        // Volumetric light beams
        float beam1 = snoise(vec3(vWorldPos.x * 0.04, vWorldPos.z * 0.04, uTime * 0.06));
        float beam2 = snoise(vec3(vWorldPos.x * 0.08 + 200.0, vWorldPos.z * 0.06, uTime * 0.04 + 100.0));
        float beam = pow(abs(sin(beam1 * 2.5 + beam2 * 1.5)), 8.0);
        float beamMask = smoothstep(0.3, 0.7, h);
        color += vec3(0.4, 0.2, 0.9) * beam * beamMask * 0.4;

        // Internal glow pulsing
        float pulse = sin(uTime * 0.5 + vWorldPos.x * 0.15 + vWorldPos.z * 0.1) * 0.5 + 0.5;
        float deepPulse = smoothstep(0.1, 0.4, h) * (1.0 - smoothstep(0.5, 0.8, h));
        color += vec3(0.2, 0.05, 0.5) * deepPulse * pulse * 0.3;

        // Fresnel
        vec3 viewDir = normalize(uCamPos - vWorldPos);
        float fresnel = pow(1.0 - abs(dot(viewDir, normal)), 4.0);
        color += vec3(0.3, 0.15, 0.7) * fresnel * 0.5;

        // Camera proximity glow
        vec2 toCamXZ = uCamPos.xz - vWorldPos.xz;
        float pool = exp(-dot(toCamXZ, toCamXZ) * 0.0006);
        color += vec3(0.15, 0.05, 0.35) * pool * (0.5 + 0.5 * pulse);

        // Drifting light source
        vec2 drift = vec2(sin(uTime * 0.09) * 55.0, cos(uTime * 0.07) * 55.0);
        vec2 toDrift = drift - vWorldPos.xz;
        color += vec3(0.1, 0.3, 0.5) * exp(-dot(toDrift, toDrift) * 0.00025) * 0.4;

        // Fog
        float dist = length(uCamPos - vWorldPos);
        float fogFactor = exp(-dist * 0.022);
        color = mix(vec3(0.01, 0.0, 0.04), color, fogFactor);

        gl_FragColor = vec4(color, 1.0);
    }
`;

const particleVertexShader = `
    attribute float aSize;
    attribute float aPhase;
    attribute float aSpeed;
    attribute float aOrbit;
    varying float vAlpha;
    varying float vSparkle;
    uniform float uTime;

    void main() {
        vec3 pos = position;
        float t = uTime * aSpeed + aPhase;

        // Circular orbital drift
        float radius = aOrbit;
        float angle = t * 0.4 + aPhase;
        pos.x += cos(angle) * radius;
        pos.z += sin(angle) * radius;

        // Vertical oscillation
        float rise = mod(position.y + uTime * aSpeed * 0.8, 22.0);
        pos.y = rise + 0.5 + sin(t * 0.8 + aPhase * 2.0) * 2.0;

        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * mvPosition;

        float dist = -mvPosition.z;
        vAlpha = smoothstep(100.0, 20.0, dist) * 0.6;
        vAlpha *= 0.5 + 0.5 * sin(uTime * aSpeed * 5.0 + aPhase * 3.0);
        vSparkle = pow(0.5 + 0.5 * sin(uTime * 8.0 * aSpeed + aPhase * 7.0), 4.0);
        gl_PointSize = aSize * (140.0 / dist);
    }
`;

const particleFragmentShader = `
    varying float vAlpha;
    varying float vSparkle;

    void main() {
        float d = length(gl_PointCoord - 0.5);
        if(d > 0.5) discard;
        float glow = 1.0 - smoothstep(0.0, 0.5, d);
        glow = pow(glow, 3.0);
        vec3 core = mix(vec3(0.5, 0.3, 1.0), vec3(0.9, 0.95, 1.0), vSparkle);
        vec3 halo = vec3(0.2, 0.1, 0.5);
        vec3 color = mix(halo, core, glow);
        color += vec3(0.2, 0.5, 0.8) * vSparkle * glow;
        gl_FragColor = vec4(color, glow * vAlpha);
    }
`;

let scene, camera, renderer, mesh, material, particles, particleMaterial;
let elapsed = 0;
let lastTime = performance.now();
const mouse = { x: 0, y: 0 };
const smoothMouse = { x: 0, y: 0 };

init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06030e);
    scene.fog = new THREE.FogExp2(0x06030e, 0.018);

    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 4, 20);
    camera.lookAt(0, 1, -20);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.PlaneGeometry(180, 280, 256, 384);
    geometry.rotateX(-Math.PI / 2);

    material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uCamPos: { value: new THREE.Vector3() }
        },
        vertexShader,
        fragmentShader,
        side: THREE.DoubleSide
    });

    mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    const particleCount = 1400;
    const positions = new Float32Array(particleCount * 3);
    const sizes = new Float32Array(particleCount);
    const phases = new Float32Array(particleCount);
    const speeds = new Float32Array(particleCount);
    const orbits = new Float32Array(particleCount);

    for(let i = 0; i < particleCount; i++) {
        positions[i*3] = (Math.random() - 0.5) * 140;
        positions[i*3+1] = Math.random() * 22 + 0.5;
        positions[i*3+2] = (Math.random() - 0.5) * 200;
        sizes[i] = Math.random() < 0.06 ? (Math.random() * 4.0 + 5.0) : (Math.random() * 2.0 + 0.8);
        phases[i] = Math.random() * Math.PI * 2;
        speeds[i] = Math.random() * 0.4 + 0.1;
        orbits[i] = Math.random() * 4.0 + 0.5;
    }

    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
    particleGeo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
    particleGeo.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));
    particleGeo.setAttribute('aOrbit', new THREE.BufferAttribute(orbits, 1));

    particleMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 }
        },
        vertexShader: particleVertexShader,
        fragmentShader: particleFragmentShader,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    particles = new THREE.Points(particleGeo, particleMaterial);
    scene.add(particles);

    window.addEventListener('resize', onWindowResize, false);
    window.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
    }, false);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;
    elapsed += dt;

    smoothMouse.x += (mouse.x - smoothMouse.x) * 0.03;
    smoothMouse.y += (mouse.y - smoothMouse.y) * 0.03;

    material.uniforms.uTime.value = elapsed;
    particleMaterial.uniforms.uTime.value = elapsed;

    const t = elapsed;
    const angle = t * 0.06;
    const radius = 18 + Math.sin(t * 0.11) * 5.0;
    const camX = Math.cos(angle) * radius + smoothMouse.x * 4.0;
    const camY = 3.5 + Math.sin(t * 0.25) * 2.0 - smoothMouse.y * 3.0;
    const camZ = Math.sin(angle) * radius + 8.0;

    camera.position.set(camX, camY, camZ);
    camera.lookAt(Math.cos(angle + 0.5) * 5.0, 1.0, Math.sin(angle + 0.5) * 5.0 - 10.0);

    material.uniforms.uCamPos.value.copy(camera.position);

    renderer.render(scene, camera);
}
</script>
</body>
</html>
