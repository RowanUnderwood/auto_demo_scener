<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cosine Palette Shader</title>
<style>
* { margin: 0; padding: 0; }
canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const geometry = new THREE.PlaneGeometry(2, 2);

const material = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;

    vec3 palette(float x) {
      vec3 c0 = vec3(0.5);
      vec3 c1 = vec3(0.5);
      vec3 c2 = vec3(1.0);
      vec3 c3 = vec3(0.0, 0.33, 0.67);
      return c0 + c1 * cos(6.28318 * (c2 * x + c3));
    }

    void main() {
      float t = uTime;
      float x = (sin(vUv.x * 10.0 + t) + sin(vUv.y * 8.0 + t) + sin(length(vUv - 0.5) * 15.0 + t * 2.0)) * 0.7;
      vec3 color = palette(x);
      color = pow(color, vec3(1.4));
      gl_FragColor = vec4(color, 1.0);
    }
  `
});

const mesh = new THREE.Mesh(geometry, material);
scene = new THREE.Scene();
scene.add(mesh);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  material.uniforms.uTime.value = clock.getElapsedTime();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
