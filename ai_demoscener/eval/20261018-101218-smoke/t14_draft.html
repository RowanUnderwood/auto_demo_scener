<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solar System</title>
<style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 25, 45);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Sun
const sunGeo = new THREE.SphereGeometry(2, 64, 64);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
const sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);

const sunLight = new THREE.PointLight(0xffffff, 2, 200, 1);
sun.add(sunLight);
scene.add(new THREE.AmbientLight(0x111111));

// Planet definitions
const planetData = [
    { name: 'Mercury', orbit: 4,    size: 0.3,  color: 0x999999, speed: 4.15 },
    { name: 'Venus',   orbit: 7.71, size: 0.5,  color: 0xe8c060, speed: 1.62 },
    { name: 'Earth',   orbit: 11.43,size: 0.55, color: 0x3388ff, speed: 1.0  },
    { name: 'Mars',    orbit: 15.14,size: 0.4,  color: 0xcc5533, speed: 0.53 },
    { name: 'Jupiter', orbit: 18.86,size: 1.5,  color: 0xddaa66, speed: 0.084},
    { name: 'Saturn',  orbit: 22.57,size: 1.3,  color: 0xeedd99, speed: 0.034},
    { name: 'Uranus',  orbit: 26.29,size: 0.9,  color: 0x88ccee, speed: 0.012},
    { name: 'Neptune', orbit: 30,   size: 0.85, color: 0x4466dd, speed: 0.006}
];

const planets = [];

planetData.forEach(data => {
    const geo = new THREE.SphereGeometry(data.size, 32, 32);
    const mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.8, metalness: 0.1 });
    const mesh = new THREE.Mesh(geo, mat);

    const pivot = new THREE.Object3D();
    pivot.rotation.y = Math.random() * Math.PI * 2;
    mesh.position.x = data.orbit;
    pivot.add(mesh);
    scene.add(pivot);

    // Orbit line
    const pts = [];
    for (let i = 0; i <= 128; i++) {
        const a = (i / 128) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * data.orbit, 0, Math.sin(a) * data.orbit));
    }
    const orbitGeo = new THREE.BufferGeometry().setFromPoints(pts);
    const orbitLine = new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: 0x555555, transparent: true, opacity: 0.25 }));
    scene.add(orbitLine);

    // Saturn ring
    if (data.name === 'Saturn') {
        const ringGeo = new THREE.RingGeometry(data.size * 1.5, data.size * 2.4, 64);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xccbb88, side: THREE.DoubleSide, transparent: true, opacity: 0.6, roughness: 0.9 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2.6;
        mesh.add(ring);
    }

    // Earth's moon
    let moonPivot = null;
    if (data.name === 'Earth') {
        moonPivot = new THREE.Object3D();
        const moonGeo = new THREE.SphereGeometry(0.12, 16, 16);
        const moonMat = new THREE.MeshStandardMaterial({ color: 0xbbbbbb, roughness: 0.95 });
        const moonMesh = new THREE.Mesh(moonGeo, moonMat);
        moonMesh.position.x = 1.3;
        moonPivot.add(moonMesh);
        mesh.add(moonPivot);
    }

    planets.push({ pivot, speed: data.speed, moonPivot, moonSpeed: 5.0 });
});

// Stars
const starCount = 2000;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 150 + Math.random() * 150;
    starPos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    starPos[i * 3 + 2] = r * Math.cos(phi);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, sizeAttenuation: true })));

// Animation
const clock = new THREE.Clock();
let camAngle = 0;

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    planets.forEach(p => {
        p.pivot.rotation.y += p.speed * dt * 0.4;
        if (p.moonPivot) p.moonPivot.rotation.y += p.moonSpeed * dt;
    });

    camAngle += dt * 0.06;
    camera.position.set(Math.sin(camAngle) * 45, 25, Math.cos(camAngle) * 45);
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
