<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body{margin:0;overflow:hidden;background:#000}
canvas{display:block}
</style>
</head>
<body>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import*as THREE from'three';
const W=innerWidth,H=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(W,H);
document.body.appendChild(renderer.domElement);
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const scene=new THREE.Scene();
const uniforms={
  u_time:{value:0},
  u_resolution:{value:new THREE.Vector2(W,H)}
};
const material=new THREE.ShaderMaterial({
  uniforms,
  vertexShader:`void main(){gl_Position=vec4(position,1.0);}`,
  fragmentShader:`
uniform float u_time;
uniform vec2 u_resolution;

vec3 palette(float t){
  return 0.5+0.5*cos(6.28318*(t+vec3(0.0,0.33,0.67)));
}

void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;
  float t=u_time*0.5;

  vec3 rd=normalize(vec3(uv,-1.0));

  float camA=u_time*0.06;
  mat3 camRot=mat3(cos(camA),0,sin(camA),0,1,0,-sin(camA),0,cos(camA));
  rd=camRot*rd;

  float latA=u_time*0.1;
  float latB=u_time*0.05;
  mat3 r1=mat3(cos(latA),0,sin(latA),0,1,0,-sin(latA),0,cos(latA));
  mat3 r2=mat3(1,0,0,0,cos(latB),-sin(latB),0,sin(latB),cos(latB));
  mat3 latRot=r2*r1;

  float spacing=0.6;
  int layers=28;

  float breath=0.8+0.2*sin(u_time*0.3);
  float freq=6.0+2.0*sin(t*0.2);

  vec3 col=vec3(0.0);

  for(int i=0;i<layers;i++){
    float d=(float(i)+0.5)*spacing;
    vec3 pos=latRot*(rd*d);

    vec3 cell=floor(pos/spacing+0.5);
    vec3 nearest=(cell+0.5)*spacing;
    float dNode=length(pos-nearest);

    float wave=sin(dNode*freq-t*4.0);

    float node=smoothstep(0.12,0.0,dNode);
    float bond=smoothstep(0.08,0.2,dNode)*smoothstep(0.45,0.2,dNode);
    float waveVal=wave*bond;

    float intensity=node*1.0+abs(waveVal)*0.8;
    float fade=exp(-d*0.1);

    float hue=dNode*4.0+t*0.15+d*0.03;
    vec3 c=palette(hue);
    c=mix(vec3(0.8,0.9,1.0),c,bond);
    c*=0.7+0.3*(wave*0.5+0.5);

    col+=c*intensity*fade*0.2*breath;
  }

  col+=vec3(0.01,0.02,0.04)*exp(-length(uv)*2.5);

  col=1.0-exp(-col*2.5);
  col*=1.0-0.4*dot(uv,uv);
  col=pow(col,vec3(0.4545));

  gl_FragColor=vec4(col,1.0);
}`
});
const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),material);
scene.add(quad);

function animate(){
  requestAnimationFrame(animate);
  uniforms.u_time.value=performance.now()*0.001;
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  uniforms.u_resolution.value.set(innerWidth,innerHeight);
});
</script>
</body>
</html>
