<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Boids</title>
<style>
body { margin: 0; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const NUM_BOIDS = 200;
const HALF = 10;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080820);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 6, 28);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// Wireframe boundary cube
const boundsGeo = new THREE.BoxGeometry(HALF * 2, HALF * 2, HALF * 2);
const boundsMat = new THREE.MeshBasicMaterial({
  color: 0x222266, wireframe: true, transparent: true, opacity: 0.25
});
scene.add(new THREE.Mesh(boundsGeo, boundsMat));

// Instanced boid mesh
const coneGeo = new THREE.ConeGeometry(0.2, 0.8, 5);
const coneMat = new THREE.MeshBasicMaterial();
const mesh = new THREE.InstancedMesh(coneGeo, coneMat, NUM_BOIDS);
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(mesh);

// State arrays
const pos = new Float32Array(NUM_BOIDS * 3);
const vel = new Float32Array(NUM_BOIDS * 3);

for (let i = 0; i < NUM_BOIDS; i++) {
  pos[i*3]   = (Math.random() - 0.5) * HALF * 1.8;
  pos[i*3+1] = (Math.random() - 0.5) * HALF * 1.8;
  pos[i*3+2] = (Math.random() - 0.5) * HALF * 1.8;
  vel[i*3]   = (Math.random() - 0.5) * 2;
  vel[i*3+1] = (Math.random() - 0.5) * 2;
  vel[i*3+2] = (Math.random() - 0.5) * 2;
}

// Parameters
const SEP_SQ = 1.0;
const ALI_SQ = 9.0;
const COH_SQ = 25.0;
const SEP_W = 0.08;
const ALI_W = 0.05;
const COH_W = 0.02;
const MAX_SPD = 2.5;
const MIN_SPD = 0.5;

// Palette
const cSlow = new THREE.Color(0x2a1a8a);
const cFast = new THREE.Color(0x00ffee);
const cTmp  = new THREE.Color();

// Reusable temporaries
const _m = new THREE.Matrix4();
const _p = new THREE.Vector3();
const _q = new THREE.Quaternion();
const _s = new THREE.Vector3(1, 1, 1);
const _up = new THREE.Vector3(0, 1, 0);
const _v = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);

  for (let i = 0; i < NUM_BOIDS; i++) {
    const px = pos[i*3], py = pos[i*3+1], pz = pos[i*3+2];

    let sx=0, sy=0, sz=0, sc=0;
    let ax=0, ay=0, az=0, ac=0;
    let cx=0, cy=0, cz=0, cc=0;

    for (let j = 0; j < NUM_BOIDS; j++) {
      if (j === i) continue;
      const dx = pos[j*3]   - px;
      const dy = pos[j*3+1] - py;
      const dz = pos[j*3+2] - pz;
      const d2 = dx*dx + dy*dy + dz*dz;

      if (d2 < SEP_SQ && d2 > 1e-4) {
        const inv = 1.0 / d2;
        sx -= dx * inv;
        sy -= dy * inv;
        sz -= dz * inv;
        sc++;
      }
      if (d2 < ALI_SQ) {
        ax += vel[j*3];
        ay += vel[j*3+1];
        az += vel[j*3+2];
        ac++;
      }
      if (d2 < COH_SQ) {
        cx += pos[j*3];
        cy += pos[j*3+1];
        cz += pos[j*3+2];
        cc++;
      }
    }

    let vx = vel[i*3], vy = vel[i*3+1], vz = vel[i*3+2];

    if (sc) { vx += sx * SEP_W; vy += sy * SEP_W; vz += sz * SEP_W; }
    if (ac) { vx += (ax/ac - vx) * ALI_W; vy += (ay/ac - vy) * ALI_W; vz += (az/ac - vz) * ALI_W; }
    if (cc) { vx += (cx/cc - px) * COH_W; vy += (cy/cc - py) * COH_W; vz += (cz/cc - pz) * COH_W; }

    const spd2 = vx*vx + vy*vy + vz*vz;
    if (spd2 > MAX_SPD * MAX_SPD) {
      const s = MAX_SPD / Math.sqrt(spd2);
      vx *= s; vy *= s; vz *= s;
    } else if (spd2 < MIN_SPD * MIN_SPD && spd2 > 1e-6) {
      const s = MIN_SPD / Math.sqrt(spd2);
      vx *= s; vy *= s; vz *= s;
    }

    vel[i*3] = vx; vel[i*3+1] = vy; vel[i*3+2] = vz;

    let nx = px + vx, ny = py + vy, nz = pz + vz;
    if (nx >  HALF) nx -= HALF * 2;
    if (nx < -HALF) nx += HALF * 2;
    if (ny >  HALF) ny -= HALF * 2;
    if (ny < -HALF) ny += HALF * 2;
    if (nz >  HALF) nz -= HALF * 2;
    if (nz < -HALF) nz += HALF * 2;
    pos[i*3] = nx; pos[i*3+1] = ny; pos[i*3+2] = nz;

    // Compose matrix
    _p.set(nx, ny, nz);
    _v.set(vx, vy, vz);
    if (_v.lengthSq() > 1e-6) {
      _v.normalize();
      _q.setFromUnitVectors(_up, _v);
    } else {
      _q.identity();
    }
    _m.compose(_p, _q, _s);
    mesh.setMatrixAt(i, _m);

    // Color based on actual clamped speed
    const actualSpd2 = vx*vx + vy*vy + vz*vz;
    const spd = Math.sqrt(actualSpd2);
    const t = Math.min(1, Math.max(0, (spd - MIN_SPD) / (MAX_SPD - MIN_SPD)));
    cTmp.lerpColors(cSlow, cFast, t);
    mesh.setColorAt(i, cTmp);
  }

  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;

  renderer.render(scene, camera);
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
