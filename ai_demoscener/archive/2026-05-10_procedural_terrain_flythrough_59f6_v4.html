<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bioluminescent Abyss</title>
    <style>
        body { margin: 0; overflow: hidden; background: #001014; }
        canvas { display: block; }
        #vignette {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 45%, rgba(0,8,12,0.78) 100%);
        }
        #caption {
            position: fixed;
            left: 50%;
            bottom: 38px;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(120, 255, 210, 0.0);
            pointer-events: none;
            text-shadow: 0 0 12px rgba(80, 255, 190, 0.6);
            animation: capFade 4s ease-out 1.5s forwards, capPulse 5s ease-in-out 5.5s infinite;
        }
        @keyframes capFade { to { color: rgba(120, 255, 210, 0.45); } }
        @keyframes capPulse {
            0%, 100% { color: rgba(120, 255, 210, 0.45); }
            50% { color: rgba(120, 255, 210, 0.22); }
        }
    </style>
</head>
<body>
<div id="vignette"></div>
<div id="caption">Bioluminescent Abyss</div>
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>
<script type="module">
import * as THREE from 'three';

const vertexShader = `
    varying float vElevation;
    varying vec2 vUv;
    varying vec3 vWorldPos;
    uniform float uTime;

    vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

    float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }

    float fbm(vec3 p) {
        float value = 0.0;
        float amplitude = 0.5;
        float frequency = 1.0;
        for(int i = 0; i < 4; i++) {
            value += amplitude * snoise(p * frequency);
            amplitude *= 0.5;
            frequency *= 2.1;
        }
        return value;
    }

    void main() {
        vUv = uv;
        vec3 noiseCoord = vec3(position.xy * 0.025, uTime * 0.12);
        float noise = fbm(noiseCoord) * 11.0;
        float wave = sin(position.x * 0.08 + uTime * 0.3) * 0.6;
        float swell = sin(position.y * 0.05 - uTime * 0.45) * 1.4;
        noise += wave + swell;

        vec3 newPos = position;
        newPos.z += noise;
        vElevation = noise;
        vWorldPos = (modelMatrix * vec4(newPos, 1.0)).xyz;

        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
    }
`;

const fragmentShader = `
    varying float vElevation;
    varying vec2 vUv;
    varying vec3 vWorldPos;
    uniform float uTime;
    uniform vec3 uCamPos;

    vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

    float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }

    void main() {
        vec3 dx = dFdx(vWorldPos);
        vec3 dy = dFdy(vWorldPos);
        vec3 normal = normalize(cross(dx, dy));

        float h = vElevation / 12.0;
        h = clamp(h * 0.5 + 0.5, 0.0, 1.0);

        vec3 deepVoid = vec3(0.0, 0.03, 0.06);
        vec3 deepTeal = vec3(0.0, 0.10, 0.16);
        vec3 midGlow = vec3(0.0, 0.34, 0.40);
        vec3 bioGreen = vec3(0.12, 0.95, 0.62);
        vec3 brightCore = vec3(0.75, 1.0, 0.92);

        vec3 color = mix(deepVoid, deepTeal, smoothstep(0.0, 0.28, h));
        color = mix(color, midGlow, smoothstep(0.28, 0.55, h));
        color = mix(color, bioGreen, smoothstep(0.55, 0.8, h));
        color = mix(color, brightCore, smoothstep(0.8, 1.0, h));

        float caustic1 = snoise(vec3(vWorldPos.xz * 0.15, uTime * 0.2));
        float caustic2 = snoise(vec3(vWorldPos.xz * 0.3 + 100.0, uTime * 0.35));
        float caustic = pow(abs(sin(caustic1 * 3.14159 + caustic2 * 2.0)), 4.0);
        color += vec3(0.0, 0.22, 0.16) * caustic * (1.0 - h * 0.4);
        color += vec3(0.0, 0.10, 0.14) * pow(abs(sin(caustic2 * 4.0 - uTime * 0.5)), 6.0) * (1.0 - h * 0.3);

        vec3 viewDir = normalize(uCamPos - vWorldPos);
        float fresnel = pow(1.0 - abs(dot(viewDir, normal)), 3.0);
        color += vec3(0.0, 0.45, 0.40) * fresnel * 0.7;

        float pulse = sin(uTime * 0.8 + vWorldPos.x * 0.1 + vWorldPos.z * 0.1) * 0.5 + 0.5;
        float peakGlow = smoothstep(0.6, 0.95, h) * pulse * 0.55;
        color += vec3(0.25, 0.9, 0.55) * peakGlow;

        vec2 toCamXZ = uCamPos.xz - vWorldPos.xz;
        float pool = exp(-dot(toCamXZ, toCamXZ) * 0.0009);
        color += vec3(0.06, 0.26, 0.22) * pool * (0.45 + 0.55 * pulse);

        vec2 drift = vec2(sin(uTime * 0.13) * 45.0, cos(uTime * 0.1) * 45.0);
        vec2 toDrift = drift - vWorldPos.xz;
        color += vec3(0.0, 0.4, 0.28) * exp(-dot(toDrift, toDrift) * 0.00035) * 0.5;

        float dist = length(uCamPos - vWorldPos);
        float fogFactor = exp(-dist * 0.032);
        color = mix(vec3(0.0, 0.04, 0.06), color, fogFactor);

        gl_FragColor = vec4(color, 1.0);
    }
`;

const particleVertexShader = `
    attribute float aSize;
    attribute float aPhase;
    attribute float aSpeed;
    varying float vAlpha;
    varying float vGlow;
    uniform float uTime;

    void main() {
        vec3 pos = position;
        float t = uTime * aSpeed + aPhase;
        float rise = mod(position.y + uTime * aSpeed * 1.6, 18.0);
        pos.x += sin(t * 0.7) * 2.0;
        pos.y = rise + 1.0 + sin(t * 0.5 + 1.0) * 1.2;
        pos.z += cos(t * 0.3) * 3.0;

        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * mvPosition;

        float dist = -mvPosition.z;
        vAlpha = smoothstep(90.0, 18.0, dist) * 0.7;
        vAlpha *= 0.6 + 0.4 * sin(uTime * aSpeed * 3.0 + aPhase);
        vGlow = clamp(aSize / 8.0, 0.0, 1.0);
        gl_PointSize = aSize * (160.0 / dist);
    }
`;

const particleFragmentShader = `
    varying float vAlpha;
    varying float vGlow;

    void main() {
        float d = length(gl_PointCoord - 0.5);
        if(d > 0.5) discard;
        float glow = 1.0 - smoothstep(0.0, 0.5, d);
        glow = pow(glow, 2.0);
        vec3 core = mix(vec3(0.3, 1.0, 0.7), vec3(0.8, 1.0, 0.95), vGlow);
        vec3 halo = vec3(0.0, 0.55, 0.4);
        vec3 color = mix(halo, core, glow);
        gl_FragColor = vec4(color, glow * vAlpha);
    }
`;

let scene, camera, renderer, mesh, material, particles, particleMaterial;
let elapsed = 0;
let lastTime = performance.now();
const mouse = { x: 0, y: 0 };
const smoothMouse = { x: 0, y: 0 };

init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x001014);
    scene.fog = new THREE.FogExp2(0x001014, 0.024);

    camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 6, 24);
    camera.lookAt(0, 2, -20);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.PlaneGeometry(140, 220, 220, 320);
    geometry.rotateX(-Math.PI / 2);

    material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uCamPos: { value: new THREE.Vector3() }
        },
        vertexShader,
        fragmentShader,
        side: THREE.DoubleSide
    });

    mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    const particleCount = 1000;
    const positions = new Float32Array(particleCount * 3);
    const sizes = new Float32Array(particleCount);
    const phases = new Float32Array(particleCount);
    const speeds = new Float32Array(particleCount);

    for(let i = 0; i < particleCount; i++) {
        positions[i*3] = (Math.random() - 0.5) * 120;
        positions[i*3+1] = Math.random() * 18 + 1;
        positions[i*3+2] = (Math.random() - 0.5) * 170;
        sizes[i] = Math.random() < 0.08 ? (Math.random() * 5.0 + 6.0) : (Math.random() * 2.5 + 1.0);
        phases[i] = Math.random() * Math.PI * 2;
        speeds[i] = Math.random() * 0.5 + 0.18;
    }

    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
    particleGeo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
    particleGeo.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));

    particleMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 }
        },
        vertexShader: particleVertexShader,
        fragmentShader: particleFragmentShader,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    particles = new THREE.Points(particleGeo, particleMaterial);
    scene.add(particles);

    window.addEventListener('resize', onWindowResize, false);
    window.addEventListener('mousemove', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
    }, false);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;
    elapsed += dt;

    smoothMouse.x += (mouse.x - smoothMouse.x) * 0.04;
    smoothMouse.y += (mouse.y - smoothMouse.y) * 0.04;

    material.uniforms.uTime.value = elapsed;
    particleMaterial.uniforms.uTime.value = elapsed;

    const t = elapsed;
    const camX = Math.sin(t * 0.12) * 7.0 + smoothMouse.x * 5.0;
    const camY = 6.0 + Math.sin(t * 0.35) * 1.3 - smoothMouse.y * 3.5;
    const camZ = 22.0 + Math.cos(t * 0.08) * 9.0;

    camera.position.set(camX, camY, camZ);
    camera.lookAt(camX * 0.4, 2.5, camZ - 32.0);

    material.uniforms.uCamPos.value.copy(camera.position);

    renderer.render(scene, camera);
}
</script>
</body>
