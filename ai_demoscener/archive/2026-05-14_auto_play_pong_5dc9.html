<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js Pong</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const aspect = window.innerWidth / window.innerHeight;
const frustum = 12;
const camera = new THREE.OrthographicCamera(
  -frustum * aspect, frustum * aspect, frustum, -frustum, 0.1, 200
);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// --- Score CanvasTexture ---
const scoreCanvas = document.createElement('canvas');
scoreCanvas.width = 512;
scoreCanvas.height = 64;
const scoreCtx = scoreCanvas.getContext('2d');
const scoreTexture = new THREE.CanvasTexture(scoreCanvas);
scoreTexture.minFilter = THREE.LinearFilter;

function drawScore(left, right) {
  scoreCtx.clearRect(0, 0, scoreCanvas.width, scoreCanvas.height);
  scoreCtx.font = 'bold 44px "Courier New", monospace';
  scoreCtx.textAlign = 'center';
  scoreCtx.fillStyle = '#ffffff';
  scoreCtx.fillText(String(left).padStart(2, '0') + '   ' + String(right).padStart(2, '0'), 256, 48);
  scoreTexture.needsUpdate = true;
}

const scorePlane = new THREE.PlaneGeometry(10, 1.25);
const scoreMat = new THREE.MeshBasicMaterial({ map: scoreTexture, transparent: true, depthWrite: false });
const scoreMesh = new THREE.Mesh(scorePlane, scoreMat);
scoreMesh.position.z = 1;
scene.add(scoreMesh);

// --- Walls (invisible bounds) ---
const TOP = 10;
const BOTTOM = -10;
const PADDLE_X_LEFT = -13;
const PADDLE_X_RIGHT = 13;
const BALL_RADIUS = 0.3;
const PADDLE_HALF_W = 0.3;
const PADDLE_HALF_H = 2.5;

// --- Dashed center line with cyan glow ---
const dashLength = 0.4;
const dashGap = 0.4;
const totalDashes = Math.ceil(2 * TOP / (dashLength + dashGap));

const glowMaterial = new THREE.ShaderMaterial({
  uniforms: {
    time: { value: 0 },
    glowColor: { value: new THREE.Color(0x00ffff) }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 glowColor;
    uniform float time;
    varying vec2 vUv;
    void main() {
      float pulse = 0.85 + 0.15 * sin(time * 2.0);
      vec3 col = glowColor * pulse;
      float alpha = 0.6 * pulse;
      gl_FragColor = vec4(col, alpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const glowPlane = new THREE.PlaneGeometry(0.15, 2 * TOP);
const glowMesh = new THREE.Mesh(glowPlane, glowMaterial);
glowMesh.position.z = 0.05;
scene.add(glowMesh);

// Sharp dashed line on top
const dashPositions = [];
for (let i = 0; i < totalDashes; i++) {
  const y = -TOP + i * (dashLength + dashGap) + dashLength / 2;
  dashPositions.push(0, y - dashLength / 2, 0.1);
  dashPositions.push(0, y + dashLength / 2, 0.1);
}
const dashGeo = new THREE.BufferGeometry();
dashGeo.setAttribute('position', new THREE.Float32BufferAttribute(dashPositions, 3));
const dashMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.9 });
const dashLine = new THREE.LineSegments(dashGeo, dashMat);
scene.add(dashLine);

// --- Paddles ---
const paddleGeo = new THREE.PlaneGeometry(PADDLE_HALF_W * 2, PADDLE_HALF_H * 2);
const paddleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

const paddleLeft = new THREE.Mesh(paddleGeo, paddleMat);
paddleLeft.position.set(PADDLE_X_LEFT, 0, 0.2);
scene.add(paddleLeft);

const paddleRight = new THREE.Mesh(paddleGeo, paddleMat);
paddleRight.position.set(PADDLE_X_RIGHT, 0, 0.2);
scene.add(paddleRight);

// --- Ball ---
const ballGeo = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);
const ballMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const ball = new THREE.Mesh(ballGeo, ballMat);
ball.position.set(0, 0, 0.2);
scene.add(ball);

// Ball subtle glow
const ballGlowGeo = new THREE.SphereGeometry(BALL_RADIUS * 1.6, 16, 16);
const ballGlowMat = new THREE.MeshBasicMaterial({
  color: 0x00ffff, transparent: true, opacity: 0.15, depthWrite: false
});
const ballGlow = new THREE.Mesh(ballGlowGeo, ballGlowMat);
scene.add(ballGlow);

// --- Trail ---
const TRAIL_LENGTH = 18;
const trailPoints = [];
for (let i = 0; i < TRAIL_LENGTH; i++) {
  const tGeo = new THREE.SphereGeometry(BALL_RADIUS * (1 - i / TRAIL_LENGTH) * 0.9, 8, 8);
  const tMat = new THREE.MeshBasicMaterial({
    color: 0x00ffff,
    transparent: true,
    opacity: (1 - i / TRAIL_LENGTH) * 0.25,
    depthWrite: false
  });
  const tMesh = new THREE.Mesh(tGeo, tMat);
  tMesh.visible = false;
  scene.add(tMesh);
  trailPoints.push({ mesh: tMesh, active: false });
}

// --- Game state ---
let ballVx = 0.12;
let ballVy = 0.06;
let scoreLeft = 0;
let scoreRight = 0;
const LERP_FACTOR = 0.07;

function resetBall(direction) {
  ball.position.set(0, (Math.random() - 0.5) * 4, 0.2);
  const speed = 0.12;
  ballVx = speed * direction;
  ballVy = (Math.random() - 0.5) * 0.1;
  trailPoints.forEach(t => { t.mesh.visible = false; t.active = false; });
}

function scorePoint(side) {
  if (side < 0) scoreRight++;
  else scoreLeft++;
  drawScore(scoreLeft, scoreRight);
  resetBall(side < 0 ? -1 : 1);
}

// --- Initialize ---
resetBall(Math.random() < 0.5 ? 1 : -1);
drawScore(0, 0);

// --- Animation ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  // Update glow pulse
  glowMaterial.uniforms.time.value = elapsed;

  // Ball trail: shift positions
  for (let i = trailPoints.length - 1; i > 0; i--) {
    trailPoints[i].mesh.position.copy(trailPoints[i - 1].mesh.position);
    trailPoints[i].active = trailPoints[i - 1].active;
    trailPoints[i].mesh.visible = trailPoints[i].active;
  }
  trailPoints[0].mesh.position.copy(ball.position);
  trailPoints[0].active = true;
  trailPoints[0].mesh.visible = true;

  // Move ball
  ball.position.x += ballVx;
  ball.position.y += ballVy;
  ballGlow.position.copy(ball.position);

  // Top/bottom walls
  if (ball.position.y + BALL_RADIUS > TOP) {
    ball.position.y = TOP - BALL_RADIUS;
    ballVy = -Math.abs(ballVy);
  }
  if (ball.position.y - BALL_RADIUS < BOTTOM) {
    ball.position.y = BOTTOM + BALL_RADIUS;
    ballVy = Math.abs(ballVy);
  }

  // Left paddle collision
  const leftPaddleTop = paddleLeft.position.y + PADDLE_HALF_H;
  const leftPaddleBottom = paddleLeft.position.y - PADDLE_HALF_H;
  if (ball.position.x - BALL_RADIUS < PADDLE_X_LEFT + PADDLE_HALF_W &&
      ball.position.x + BALL_RADIUS > PADDLE_X_LEFT - PADDLE_HALF_W &&
      ball.position.y > leftPaddleBottom - BALL_RADIUS &&
      ball.position.y < leftPaddleTop + BALL_RADIUS &&
      ballVx < 0) {
    ball.position.x = PADDLE_X_LEFT + PADDLE_HALF_W + BALL_RADIUS;
    const hit = (ball.position.y - paddleLeft.position.y) / PADDLE_HALF_H;
    ballVy = hit * 0.18;
    ballVx = Math.abs(ballVx) * 1.05;
  }

  // Right paddle collision
  const rightPaddleTop = paddleRight.position.y + PADDLE_HALF_H;
  const rightPaddleBottom = paddleRight.position.y - PADDLE_HALF_H;
  if (ball.position.x + BALL_RADIUS > PADDLE_X_RIGHT - PADDLE_HALF_W &&
      ball.position.x - BALL_RADIUS < PADDLE_X_RIGHT + PADDLE_HALF_W &&
      ball.position.y > rightPaddleBottom - BALL_RADIUS &&
      ball.position.y < rightPaddleTop + BALL_RADIUS &&
      ballVx > 0) {
    ball.position.x = PADDLE_X_RIGHT - PADDLE_HALF_W - BALL_RADIUS;
    const hit = (ball.position.y - paddleRight.position.y) / PADDLE_HALF_H;
    ballVy = hit * 0.18;
    ballVx = -Math.abs(ballVx) * 1.05;
  }

  // Score detection (ball past paddles)
  if (ball.position.x < PADDLE_X_LEFT - PADDLE_HALF_W - BALL_RADIUS - 1) {
    scorePoint(1);
  }
  if (ball.position.x > PADDLE_X_RIGHT + PADDLE_HALF_W + BALL_RADIUS + 1) {
    scorePoint(-1);
  }

  // Clamp ball speed
  const maxSpeed = 0.5;
  const currentSpeed = Math.sqrt(ballVx * ballVx + ballVy * ballVy);
  if (currentSpeed > maxSpeed) {
    const scale = maxSpeed / currentSpeed;
    ballVx *= scale;
    ballVy *= scale;
  }

  // Lerp paddles toward ball.y with jitter
  const jitterL = (Math.random() - 0.5) * 0.06;
  const jitterR = (Math.random() - 0.5) * 0.06;

  const targetLeft = ball.position.y;
  const targetRight = ball.position.y;

  paddleLeft.position.y += (targetLeft - paddleLeft.position.y) * LERP_FACTOR + jitterL;
  paddleRight.position.y += (targetRight - paddleRight.position.y) * LERP_FACTOR + jitterR;

  // Clamp paddle positions
  paddleLeft.position.y = Math.max(BOTTOM + PADDLE_HALF_H, Math.min(TOP - PADDLE_HALF_H, paddleLeft.position.y));
  paddleRight.position.y = Math.max(BOTTOM + PADDLE_HALF_H, Math.min(TOP - PADDLE_HALF_H, paddleRight.position.y));

  renderer.render(scene, camera);
}

animate();

// --- Resize ---
window.addEventListener('resize', () => {
  const a = window.innerWidth / window.innerHeight;
  camera.left = -frustum * a;
  camera.right = frustum * a;
  camera.top = frustum;
  camera.bottom = -frustum;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
