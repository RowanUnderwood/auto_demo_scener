<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neon Frequency Analyzer</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 4, 12);
camera.lookAt(0, 2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const BAR_COUNT = 48;
const BAR_WIDTH = 0.4;
const SPACING = 0.5;
const TOTAL_WIDTH = BAR_COUNT * SPACING;
const startX = -TOTAL_WIDTH / 2 + SPACING / 2;

const bars = [];
const glows = [];

function makeGlowTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  gradient.addColorStop(0, 'rgba(255,255,255,1.0)');
  gradient.addColorStop(0.2, 'rgba(255,255,255,0.6)');
  gradient.addColorStop(0.5, 'rgba(255,255,255,0.2)');
  gradient.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 128, 128);
  const texture = new THREE.CanvasTexture(canvas);
  return texture;
}

const glowTexture = makeGlowTexture();
const barGeometry = new THREE.BoxGeometry(BAR_WIDTH, 1, BAR_WIDTH);

const floorGeo = new THREE.PlaneGeometry(30, 10);
const floorMat = new THREE.MeshBasicMaterial({ color: 0x111122, side: THREE.DoubleSide });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
scene.add(floor);

for (let i = 0; i < BAR_COUNT; i++) {
  const color = new THREE.Color();
  color.setHSL(i / BAR_COUNT, 1.0, 0.55);

  const material = new THREE.MeshBasicMaterial({ color: color });
  const bar = new THREE.Mesh(barGeometry, material);
  bar.position.set(startX + i * SPACING, 0.5, 0);
  bar.scale.y = 1.0;
  scene.add(bar);
  bars.push(bar);

  const spriteMaterial = new THREE.SpriteMaterial({
    map: glowTexture,
    color: color,
    blending: THREE.AdditiveBlending,
    transparent: true,
    opacity: 0.8,
    depthWrite: false
  });
  const sprite = new THREE.Sprite(spriteMaterial);
  sprite.position.set(startX + i * SPACING, 0.5, 0.3);
  sprite.scale.set(2.0, 3.0, 1);
  scene.add(sprite);
  glows.push(sprite);
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  for (let i = 0; i < BAR_COUNT; i++) {
    const raw = Math.sin(time * 1.3 + i * 0.2)
              + Math.sin(time * 2.1 + i * 0.31) * 0.6
              + Math.sin(time * 3.7 + i * 0.11) * 0.4;
    const scaleY = 1.0 + Math.abs(raw) * 3.0;

    bars[i].scale.y = scaleY;
    bars[i].position.y = scaleY / 2;

    glows[i].scale.set(1.5, Math.max(scaleY * 1.5, 1.5), 1);
    glows[i].position.y = scaleY / 2;
    glows[i].material.opacity = 0.4 + Math.min(scaleY * 0.1, 0.6);
  }

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
