<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synthwave</title>
<style>
*{margin:0;padding:0}
body{overflow:hidden;background:#000}
canvas{display:block}
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 1.8, 0);
camera.lookAt(0, 2.5, -80);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();
const uTime = { value: 0 };

// ─── SKY ───────────────────────────────────────────────────────────────────
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: { uTime },
  vertexShader: `
    varying vec3 vPos;
    void main(){
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    varying vec3 vPos;
    uniform float uTime;
    void main(){
      float h = normalize(vPos).y;
      vec3 indigo  = vec3(0.04, 0.0, 0.16);
      vec3 purple  = vec3(0.30, 0.05, 0.45);
      vec3 pink    = vec3(0.92, 0.12, 0.48);
      vec3 orange  = vec3(1.0, 0.42, 0.12);
      vec3 col;
      if(h > 0.35)      col = mix(purple, indigo, smoothstep(0.35, 0.95, h));
      else if(h > -0.02) col = mix(orange, pink, smoothstep(-0.02, 0.35, h));
      else               col = mix(vec3(0.55,0.05,0.35), orange, smoothstep(-0.45,-0.02,h));
      // hot horizon band
      float band = exp(-pow((h-0.02)/0.06,2.0));
      col += vec3(1.0,0.35,0.55) * band * 0.5;
      // subtle breathing
      col *= 0.98 + 0.02*sin(uTime*0.3);
      gl_FragColor = vec4(col, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(450, 32, 32), skyMat));

// ─── FLOOR ─────────────────────────────────────────────────────────────────
const floorMat = new THREE.ShaderMaterial({
  depthWrite: true,
  uniforms: { uTime },
  vertexShader: `
    varying float vViewZ;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      vViewZ = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vViewZ;
    uniform float uTime;
    void main(){
      vec3 near = vec3(0.09, 0.015, 0.16);
      vec3 far  = vec3(0.42, 0.04, 0.46);
      vec3 col = mix(near, far, smoothstep(4.0, 150.0, vViewZ));
      float horizon = exp(-pow((vViewZ-100.0)/14.0,2.0));
      col += vec3(1.0,0.2,0.7) * horizon * 0.85;
      float scan = 0.5+0.5*sin(vViewZ*0.12 - uTime*1.4);
      col += vec3(0.0,0.85,1.0) * 0.05 * smoothstep(0.6,1.0,scan);
      gl_FragColor = vec4(col, 1.0);
    }`
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(600, 400), floorMat);
floor.rotation.x = -Math.PI/2;
floor.position.set(0, -0.02, -100);
scene.add(floor);

// ─── SUN ───────────────────────────────────────────────────────────────────
const sunMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  uniforms: { uTime },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    void main(){
      vec2 c = vUv - 0.5;
      float d = length(c);
      float circle = 1.0 - smoothstep(0.47, 0.5, d);
      float y = vUv.y;
      float numBars = 16.0;
      float sy = y + (1.0 - y) * 0.55;
      float bar = fract(sy * numBars);
      float gapW = mix(0.10, 0.55, 1.0 - y);
      float visible = smoothstep(gapW, gapW + 0.05, bar);
      vec3 magenta = vec3(1.0, 0.05, 0.78);
      vec3 yellow  = vec3(1.0, 0.97, 0.18);
      vec3 col = mix(magenta, yellow, 1.0 - y);
      col *= 1.05 + 0.1*sin(uTime*1.2);
      float alpha = circle * visible;
      gl_FragColor = vec4(col, alpha);
    }`
});
const sun = new THREE.Mesh(new THREE.CircleGeometry(34, 64), sunMat);
sun.position.set(0, 7, -120);
scene.add(sun);

// sun halo
const haloMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  uniforms: { uTime },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    void main(){
      vec2 c = vUv - 0.5;
      float d = length(c);
      float g = smoothstep(0.5, 0.0, d);
      g = pow(g, 2.2);
      vec3 col = mix(vec3(1.0,0.5,0.2), vec3(1.0,0.15,0.6), 1.0-d*2.0);
      gl_FragColor = vec4(col * g * (0.7+0.15*sin(uTime*0.8)), 1.0);
    }`
});
const halo = new THREE.Mesh(new THREE.CircleGeometry(60, 64), haloMat);
halo.position.set(0, 7, -121);
scene.add(halo);

// ─── GRID ──────────────────────────────────────────────────────────────────
const cellSize = 4;
const gridDepth = 220;
const gridWidth = 120;
const zStart = cellSize;
const zEnd = -gridDepth;
const numZLines = Math.floor((zStart - zEnd) / cellSize);
const numXLines = Math.floor(gridWidth / cellSize);

const gridShader = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    uTime,
    uColorA: { value: new THREE.Color(0xff2bd6) },
    uColorB: { value: new THREE.Color(0x00e0ff) }
  },
  vertexShader: `
    varying float vViewZ;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      vViewZ = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vViewZ;
    uniform float uTime;
    uniform vec3 uColorA;
    uniform vec3 uColorB;
    void main(){
      float horizon = exp(-pow((vViewZ-95.0)/38.0,2.0));
      float farFade = 1.0 - smoothstep(150.0, 230.0, vViewZ);
      float pulse = 0.5+0.5*sin(vViewZ*0.22 - uTime*3.0);
      vec3 col = mix(uColorA, uColorB, clamp(vViewZ/170.0,0.0,1.0));
      float intensity = (0.18 + 1.3*horizon) * farFade * (0.65+0.55*pulse);
      gl_FragColor = vec4(col * intensity, 1.0);
    }`
});

const hLines = [];
for (let i = 0; i <= numZLines; i++) {
  const z = zStart - i * cellSize;
  hLines.push(-gridWidth/2, 0, z,  gridWidth/2, 0, z);
}
const hGeo = new THREE.BufferGeometry();
hGeo.setAttribute('position', new THREE.Float32BufferAttribute(hLines, 3));
scene.add(new THREE.LineSegments(hGeo, gridShader));

const vLines = [];
for (let i = 0; i <= numXLines; i++) {
  const x = -gridWidth/2 + i * cellSize;
  vLines.push(x, 0, zStart,  x, 0, zEnd);
}
const vGeo = new THREE.BufferGeometry();
vGeo.setAttribute('position', new THREE.Float32BufferAttribute(vLines, 3));
scene.add(new THREE.LineSegments(vGeo, gridShader));

let scrollOffset = 0;
const scrollSpeed = 3.5;

// ─── STARS ─────────────────────────────────────────────────────────────────
const starCount = 700;
const sPos = new Float32Array(starCount * 3);
const sPhase = new Float32Array(starCount);
const sSize = new Float32Array(starCount);
for (let i = 0; i < starCount; i++) {
  sPos[i*3]   = (Math.random() - 0.5) * 520;
  sPos[i*3+1] = 25 + Math.random() * 190;
  sPos[i*3+2] = -120 - Math.random() * 300;
  sPhase[i] = Math.random() * Math.PI * 2;
  sSize[i] = 0.6 + Math.random() * 1.8;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
starGeo.setAttribute('phase', new THREE.Float32BufferAttribute(sPhase, 1));
starGeo.setAttribute('size', new THREE.Float32BufferAttribute(sSize, 1));
const starMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: { uTime },
  vertexShader: `
    attribute float phase;
    attribute float size;
    varying float vPhase;
    uniform float uTime;
    void main(){
      vPhase = phase;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float tw = 0.6 + 0.4 * sin(uTime*2.0 + phase*3.0);
      gl_PointSize = max(1.0, size * tw * (240.0 / -mv.z));
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vPhase;
    uniform float uTime;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      float circle = 1.0 - smoothstep(0.3, 0.5, d);
      float tw = 0.55 + 0.45 * sin(uTime*2.0 + vPhase*3.0);
      vec3 col = mix(vec3(1.0,0.8,1.0), vec3(0.7,0.9,1.0), 0.5+0.5*sin(vPhase));
      gl_FragColor = vec4(col, circle * tw);
    }`
});
scene.add(new THREE.Points(starGeo, starMat));

// ─── BLOOM ─────────────────────────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.85,
  0.55,
  0.6
);
composer.addPass(bloom);

// ─── ANIMATE ───────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  uTime.value = t;

  scrollOffset += scrollSpeed * dt;
  if (scrollOffset >= cellSize) scrollOffset -= cellSize;
  // apply scroll to both line sets via their position (share via userData)
  scene.children.forEach(o => {
    if (o.isLineSegments) o.position.z = scrollOffset;
  });

  // gentle camera drift + bob
  camera.position.x = Math.sin(t * 0.10) * 0.6;
  camera.position.y = 1.8 + Math.sin(t * 0.5) * 0.12;
  camera.lookAt(0, 2.5, -80);

  // sun slow bob + pulse
  sun.position.y = 7 + Math.sin(t * 0.4) * 0.6;
  halo.position.y = sun.position.y - 1;
  const sp = 1.0 + 0.03 * Math.sin(t * 0.8);
  sun.scale.set(sp, sp, sp);
  halo.scale.set(sp, sp, sp);

  composer.render();
}
animate();

// ─── RESIZE ────────────────────────────────────────────────────────────────
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
