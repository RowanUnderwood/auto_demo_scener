<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandelbrot Zoom</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const uniforms = {
            u_time: { value: 0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float u_time;
                uniform vec2 u_resolution;
                varying vec2 vUv;

                void main() {
                    // Aspect ratio correction
                    vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.y, u_resolution.x);
                    
                    // Zoom parameters
                    vec2 center = vec2(-0.745, 0.1);
                    float scale = exp(-u_time * 0.3) * 2.5; // base scale of 2.5 to see context
                    
                    vec2 c = center + uv * scale;
                    vec2 z = vec2(0.0);
                    float iter = 0.0;
                    const float max_iter = 200.0;

                    for (float i = 0.0; i < max_iter; i++) {
                        // z = z^2 + c
                        // (x+iy)^2 = x^2 - y^2 + 2ixy
                        float x = (z.x * z.x - z.y * z.y) + c.x;
                        float y = (two_times_xy(z.x, z.y)) + c.y;
                        z = vec2(x, y);
                        
                        if (length(z) > 4.0) break;
                        iter += 1.0;
                    }

                    // Helper for multiplication inside loop logic if needed, but manual is safer in GLSL versions
                    // Let's use explicit math to avoid function overhead issues
                    
                    /* Re-calculating with smooth iteration count */
                    z = vec2(0.0);
                    iter = 0.0;
                    for (int i = 0; i < 200; i++) {
                        float x2 = z.x * z.x;
                        float y2 = z.y * z.y;
                        if (x2 + y2 > 16.0) break;
                        float nextX = x2 - y2 + c.x;
                        z.y = 2.0 * z.x * z.y + c.y;
                        z.x = nextX;
                        iter += 1.0;
                    }

                    vec3 color = vec3(0.0);
                    if (iter < max_iter) {
                        // Smooth iteration count: nu = n + 1 - log2(log2(|z|))
                        float log_zn = log(z.x * z.x + z.y * z.y) / 2.0;
                        float nu = log(log_zn / log(2.0)) / log(2.0);
                        float smooth_iter = iter + 1.0 - nu;

                        // Sin-based palette
                        color = 0.5 + 0.5 * sin(vec3(0.0, 0.6, 1.0) + smooth_iter * 0.15);
                    } else {
                        color = vec3(0.0); // Inside the set is black
                    }

                    gl_FragColor = vec4(color, 1.0);
                }

                float two_times_xy(float x, float y) {
                    return 2.0 * x * y;
                }
            `,
            // Using a slightly more robust version of the fragment shader for compatibility
            fragmentShader: `
                uniform float u_time;
                uniform vec2 u_resolution;
                varying vec2 vUv;

                void main() {
                    vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.y, u_resolution.x);
                    vec2 center = vec2(-0.745, 0.1);
                    float scale = exp(-u_time * 0.3) * 3.0;
                    vec2 c = center + uv * scale;

                    vec2 z = vec2(0.0);
                    float iter = 0.0;
                    const float max_iter = 200.0;

                    for (int i = 0; i < 200; i++) {
                        float x2 = z.x * z.x;
                        float y2 = z.y * z.y;
                        if (x2 + y2 > 100.0) break;
                        z = vec2(x2 - y2 + c.x, 2.0 * z.x * z.y + c.y);
                        iter += 1.0;
                    }

                    vec3 color = vec3(0.0);
                    if (iter < max_iter) {
                        float dist = length(z);
                        float nu = log2(log2(dist));
                        float smooth_iter = iter - nu + 4.0; 
                        
                        // Sin palette: color = 0.5 + 0.5 * sin(frequency * iteration + phase)
                        color = 0.5 + 0.5 * sin(vec3(0.0, 1.2, 2.4) + smooth_iter * 0.1);
                    }

                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });

        // Overwriting with the refined shader logic to ensure smoothness and correctness
        material.fragmentShader = `
            uniform float u_time;
            uniform vec2 u_resolution;
            varying vec2 vUv;

            void main() {
                vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.y, u_resolution.x);
                vec2 center = vec2(-0.745, 0.1);
                float scale = exp(-u_time * 0.3) * 3.0;
                vec2 c = center + uv * scale;

                vec2 z = vec2(0.0);
                float iter = 0.0;
                
                for (int i = 0; i < 200; i++) {
                    float x2 = z.x * z.x;
                    float y2 = z.y * z.y;
                    if (x2 + y2 > 100.0) break;
                    z = vec2(x2 - y2 + c.x, 2.0 * z.x * z.y + c.y);
                    iter += 1.0;
                }

                vec3 color = vec3(0.0);
                if (iter < 200.0) {
                    float dist = length(z);
                    // Smooth iteration: iter - log2(log2(dist)) + constant
                    float smooth_iter = iter - log2(log2(dist)) + 4.0;
                    color = 0.5 + 0.5 * sin(vec3(0.1, 0.5, 0.9) + smooth_iter * 0.1);
                }

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const plane = new THREE.Mesh(geometry, material);
        scene.add(plane);

        function animate(time) {
            uniforms.u_time.value = time * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
