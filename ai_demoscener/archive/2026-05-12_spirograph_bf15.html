<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const width = window.innerWidth;
const height = window.innerHeight;
const aspect = width / height;

// Orthographic Camera setup
const frustumSize = 20;
const camera = new THREE.OrthographicCamera(
    frustumSize * aspect / -2, 
    frustumSize * aspect / 2, 
    frustumSize / 2, 
    frustumSize / -2, 
    0.1, 
    1000
);
camera.position.z = 50;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(width, height);
document.body.appendChild(renderer.domElement);

// Constants for the curve
const T_MAX = 200 * Math.PI;
const STEPS = 10000; // High resolution for complex parametric paths
const dt = T_MAX / STEPS;

const geometry = new THREE.BufferGeometry();
const positions = new Float32Array((STEPS + 1) * 3);
const colors = new Float32Array((STEPS + 1) * 3);

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.8 });
const line = new THREE.Line(geometry, material);
scene.add(line);

const colorObj = new THREE.Color();

function updateGeometry(time) {
    // Mutate R, r, d smoothly over time
    const R = 10 + Math.sin(time * 0.3) * 4;
    const r = 5 + Math.cos(time * 0.5) * 3; // Ensure r > 0 to avoid division by zero
    const d = 3 + Math.sin(time * 0.7) * 2.5;

    const posAttr = geometry.attributes.position;
    const colAttr = geometry.attributes.color;

    for (let i = 0; i <= STEPS; i++) {
        const t = i * dt;
        
        // Parametric equations provided:
        // x = (R-r)*cos(t) + d*cos((R-r)/r * t)
        // y = (R-r)*sin(t) - d*sin((R-r)/r * t)
        const ratio = (R - r) / r;
        const x = (R - r) * Math.cos(t) + d * Math.cos(ratio * t);
        const y = (R - r) * Math.sin(t) - d * Math.sin(ratio * t);
        const z = 0;

        posAttr.setXYZ(i, x, y, z);

        // Color by t through HSL hue
        colorObj.setHSL((t / T_MAX), 1.0, 0.5);
        colAttr.setXYZ(i, colorObj.r, colorObj.g, colorObj.b);
    }

    posAttr.needsUpdate = true;
    colAttr.needsUpdate = true;
    geometry.computeBoundingSphere();

    // Rotate the result
    line.rotation.z = time * 0.2;
    line.rotation.x = Math.sin(time * 0.1) * 0.5;
    line.rotation.y = Math.cos(time * 0.1) * 0.5;
}

function animate() {
    requestAnimationFrame(animate);
    const time = performance.now() * 0.001;
    updateGeometry(time);
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const a = w / h;
    camera.left = -frustumSize * a / 2;
    camera.right = frustumSize * a / 2;
    camera.top = frustumSize / 2;
    camera.bottom = -frustumSize / 2;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
</script>
</body>
</html>
