<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js Starfield</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
    <!-- Import map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        
        // Camera at origin looking down -Z
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0);
        camera.lookAt(0, 0, -1);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Create Star System
        const STAR_COUNT = 5000;
        const geometry = new THREE.BufferGeometry();
        const positions = [];

        for (let i = 0; i < STAR_COUNT; i++) {
            // Expanded XY range to fill the screen at distance
            const x = Math.random() * 40 - 20; 
            const y = Math.random() * 40 - 20; 
            // Z starts further back for effect, but visible size is key
            positions.push(x, y, -100); 
        }

        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 5.0, // Increased significantly from 0.5 to ensure visibility at distance
            sizeAttenuation: false, // Prevents shrinking as they get close for better effect
            transparent: true,
            opacity: 0.8,
            depthWrite: false
        });

        const starField = new THREE.Points(geometry, material);
        scene.add(starField);

        // 3. Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            const positionsArray = starField.geometry.attributes.position.array;

            for (let i = 0; i < STAR_COUNT; i++) {
                // Calculate index of Z position (x=0, y=1, z=2)
                const index = i * 3 + 2;

                // Move star towards camera (+Z direction)
                positionsArray[index] += 0.5; // Speed up slightly for better visibility

                // Respawn logic: if Z > 0, send back to -100 and randomize XY
                if (positionsArray[index] > 0) {
                    positionsArray[index] = -100;
                    
                    positionsArray[i * 3] = Math.random() * 40 - 20;      // New X
                    positionsArray[i * 3 + 1] = Math.random() * 40 - 20; // New Y
                }
            }

            starField.geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
