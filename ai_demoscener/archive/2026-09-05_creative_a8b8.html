<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Quantum Bloom</title>
<style>
*{margin:0;padding:0;overflow:hidden}
body{background:#000}
canvas{display:block}
#hud{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#8af;font-family:'Courier New',monospace;font-size:11px;letter-spacing:4px;text-transform:uppercase;opacity:0.5;pointer-events:none}
</style>
</head>
<body>
<div id="hud">quantum bloom // cycle 7</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const W=innerWidth,H=innerHeight;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x050510,0.025);
const camera=new THREE.PerspectiveCamera(60,W/H,0.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setSize(W,H);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

// Color palette
const C1=new THREE.Color(0.1,0.05,0.3);
const C2=new THREE.Color(0,0.9,1.0);
const C3=new THREE.Color(1.0,0.2,0.8);
const C4=new THREE.Color(1.0,0.85,0.2);

// --- Central Quantum Crystal ---
const crystalGeo=new THREE.IcosahedronGeometry(1.2,3);
const crystalMat=new THREE.ShaderMaterial({
uniforms:{
uTime:{value:0},
uBloom:{value:0},
uC1:{value:C1},uC2:{value:C2},uC3:{value:C3},uC4:{value:C4}
},
vertexShader:`
uniform float uTime;
uniform float uBloom;
varying vec3 vPos;
varying vec3 vNorm;
varying float vDisp;
void main(){
vec3 p=position;
float n=sin(p.x*4.0+uTime*2.0)*sin(p.y*5.0+uTime*1.5)*sin(p.z*3.0+uTime);
float disp=n*0.15*uBloom;
p+=normal*disp;
p+=normal*uBloom*0.6;
vDisp=disp;
vPos=p;
vNorm=normalMatrix*normal;
gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
}`,
fragmentShader:`
uniform float uTime;
uniform float uBloom;
uniform vec3 uC1;uniform vec3 uC2;uniform vec3 uC3;uniform vec3 uC4;
varying vec3 vPos;
varying vec3 vNorm;
varying float vDisp;
void main(){
float fres=pow(1.0-abs(dot(normalize(vNorm),normalize(cameraPosition-vPos))),2.5);
vec3 base=mix(uC1,uC2,fres);
base=mix(base,uC3,sin(vPos.y*3.0+uTime)*0.5+0.5);
base=mix(base,uC4,fres*0.4*vDisp*8.0);
float pulse=0.5+0.5*sin(uTime*3.0);
base*=0.6+0.4*pulse;
base+=fres*vec3(0.3,0.6,1.0)*0.5;
gl_FragColor=vec4(base,1.0);
}`
});
const crystal=new THREE.Mesh(crystalGeo,crystalMat);
scene.add(crystal);

// --- Petal System ---
const petals=[];
const petalCount=12;
for(let i=0;i<petalCount;i++){
const pg=new THREE.ConeGeometry(0.15,1.0,4,1);
pg.translate(0,0.5,0);
const pm=new THREE.ShaderMaterial({
uniforms:{
uTime:{value:0},
uSeed:{value:i*1.7},
uC2:{value:C2},uC3:{value:C3}
},
vertexShader:`
uniform float uTime;
uniform float uSeed;
varying vec3 vP;
void main(){
vec3 p=position;
float a=uTime*1.5+uSeed;
mat2 rot=mat2(cos(a),-sin(a),sin(a),cos(a));
p.xz=rot*p.xz;
vP=p;
gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
}`,
fragmentShader:`
uniform float uTime;
uniform float uSeed;
uniform vec3 uC2;uniform vec3 uC3;
varying vec3 vP;
void main(){
float t=vP.y;
vec3 col=mix(uC2,uC3,t*0.8+sin(uTime+uSeed)*0.2);
float a=smoothstep(1.0,0.0,t)*0.9;
gl_FragColor=vec4(col,a);
}`,
transparent:true,
side:THREE.DoubleSide,
depthWrite:false
});
const petal=new THREE.Mesh(pg,pm);
const angle=(i/petalCount)*Math.PI*2;
petal.position.set(Math.cos(angle)*2.0,0,Math.sin(angle)*2.0);
petal.lookAt(0,0,0);
petal.rotateX(Math.PI/2);
petal.userData={angle,offset:i*0.5};
scene.add(petal);
petals.push(petal);
}

// --- Lissajous Particle Field ---
const pCount=2000;
const pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(pCount*3);
const pCol=new Float32Array(pCount*3);
const pSize=new Float32Array(pCount);
for(let i=0;i<pCount;i++){
pPos[i*3]=0;pPos[i*3+1]=0;pPos[i*3+2]=0;
pCol[i*3]=0.3;pCol[i*3+1]=0.8;pCol[i*3+2]=1.0;
pSize[i]=Math.random()*3+1;
}
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
pGeo.setAttribute('size',new THREE.BufferAttribute(pSize,1));

const pMat=new THREE.ShaderMaterial({
uniforms:{uTime:{value:0}},
vertexShader:`
attribute float size;
attribute vec3 color;
uniform float uTime;
varying vec3 vCol;
void main(){
vCol=color;
gl_PointSize=size*(200.0/length(modelViewMatrix*vec4(position,1.0)));
gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`,
fragmentShader:`
varying vec3 vCol;
void main(){
float d=length(gl_PointCoord-0.5);
if(d>0.5)discard;
float a=smoothstep(0.5,0.0,d)*0.7;
gl_FragColor=vec4(vCol,a);
}`,
transparent:true,
blending:THREE.AdditiveBlending,
depthWrite:false
});
const particles=new THREE.Points(pGeo,pMat);
scene.add(particles);

// --- Warping Grid Floor ---
const gridGeo=new THREE.PlaneGeometry(60,60,80,80);
gridGeo.rotateX(-Math.PI/2);
const gridMat=new THREE.ShaderMaterial({
uniforms:{uTime:{value:0}},
vertexShader:`
uniform float uTime;
varying vec2 vUv;
varying float vH;
void main(){
vec3 p=position;
float d=length(p.xz);
p.y+=sin(d*0.5-uTime*2.0)*0.3*smoothstep(20.0,0.0,d);
vH=p.y;
vUv=uv;
gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
}`,
fragmentShader:`
uniform float uTime;
varying vec2 vUv;
varying float vH;
void main(){
vec2 g=abs(fract(vUv*40.0)-0.5);
float line=1.0-smoothstep(0.0,0.05,min(g.x,g.y));
float fade=smoothstep(0.5,0.1,length(vUv-0.5));
vec3 col=mix(vec3(0.05,0.0,0.15),vec3(0.0,0.5,0.8),line*fade);
col+=vec3(0.3,0.0,0.5)*vH*0.5*fade;
gl_FragColor=vec4(col,line*fade*0.6);
}`,
transparent:true,
depthWrite:false
});
const grid=new THREE.Mesh(gridGeo,gridMat);
grid.position.y=-3;
scene.add(grid);

// --- Orbiting Rings ---
const rings=[];
for(let i=0;i<3;i++){
const rg=new THREE.TorusGeometry(2.5+i*1.2,0.02,8,128);
const rm=new THREE.ShaderMaterial({
uniforms:{uTime:{value:0},uIdx:{value:i}},
vertexShader:`
varying vec2 vUv;
void main(){
vUv=uv;
gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`,
fragmentShader:`
uniform float uTime;
uniform float uIdx;
varying vec2 vUv;
void main(){
float pulse=sin(vUv.x*20.0-uTime*4.0+uIdx*2.0)*0.5+0.5;
vec3 col=mix(vec3(0.0,0.7,1.0),vec3(1.0,0.3,0.8),pulse);
float a=pulse*0.8;
gl_FragColor=vec4(col,a);
}`,
transparent:true,
blending:THREE.AdditiveBlending,
depthWrite:false
});
const ring=new THREE.Mesh(rg,rm);
ring.rotation.x=Math.PI/2+i*0.4;
ring.rotation.y=i*0.8;
scene.add(ring);
rings.push(ring);
}

// --- Animation ---
const clock=new THREE.Clock();
function animate(){
requestAnimationFrame(animate);
const t=clock.getElapsedTime();
const cycle=Math.sin(t*0.4);
const bloom=Math.max(0,cycle);
const bloomEase=bloom*bloom*(3-2*bloom);

crystalMat.uniforms.uTime.value=t;
crystalMat.uniforms.uBloom.value=bloomEase;
crystal.rotation.y=t*0.2;
crystal.rotation.x=Math.sin(t*0.3)*0.2;

petals.forEach((p,i)=>{
const phase=t*0.8+p.userData.offset;
const dist=2.0+Math.sin(phase)*1.5+bloomEase*2.0;
const a=p.userData.angle+t*0.15;
p.position.set(Math.cos(a)*dist,Math.sin(phase*0.7)*1.0,Math.sin(a)*dist);
p.lookAt(0,0,0);
p.rotateX(Math.PI/2);
const s=0.5+Math.sin(phase)*0.3+bloomEase*0.8;
p.scale.setScalar(s);
p.material.uniforms.uTime.value=t;
p.material.uniforms.uSeed.value=p.userData.offset;
});

// Update particle positions along Lissajous
const pos=pGeo.attributes.position.array;
const col=pGeo.attributes.color.array;
for(let i=0;i<pCount;i++){
const s=i/pCount*Math.PI*2;
const freq1=3+Math.sin(t*0.1)*0.5;
const freq2=2+Math.cos(t*0.13)*0.5;
const freq3=5;
const r=3.0+bloomEase*2.0;
pos[i*3]=Math.sin(s*freq1+t*0.3)*r;
pos[i*3+1]=Math.sin(s*freq2+t*0.2)*r*0.5;
pos[i*3+2]=Math.sin(s*freq3+t*0.4)*r;
const c1=Math.sin(s+t)*0.5+0.5;
col[i*3]=0.2+c1*0.8;
col[i*3+1]=0.3+c1*0.5;
col[i*3+2]=0.8+c1*0.2;
}
pGeo.attributes.position.needsUpdate=true;
pGeo.attributes.color.needsUpdate=true;
pMat.uniforms.uTime.value=t;

gridMat.uniforms.uTime.value=t;

rings.forEach((r,i)=>{
r.rotation.z=t*0.1*(i+1);
r.material.uniforms.uTime.value=t;
r.material.uniforms.uIdx.value=i;
});

// Camera orbit
const camA=t*0.1;
const camR=8+Math.sin(t*0.2)*2;
const camH=2+Math.sin(t*0.15)*1.5;
camera.position.set(Math.cos(camA)*camR,camH,Math.sin(camA)*camR);
camera.lookAt(0,0,0);

renderer.render(scene,camera);
}
animate();

// Resize
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
</body>
</html>
