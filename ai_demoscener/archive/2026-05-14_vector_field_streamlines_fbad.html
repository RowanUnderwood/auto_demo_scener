<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Analytic Field Advection</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    // Initialize scene, camera, and renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000);
    document.body.appendChild(renderer.domElement);
    
    // Create particle system
    const particles = [];
    const particleGeometry = new THREE.BufferGeometry();
    const particleMaterial = new THREE.PointsMaterial({
        size: 0.02,
        vertexColors: true,
        transparent: true,
        opacity: 1.0,
        blending: THREE.AdditiveBlending
    });
    
    // Create 1500 particles
    const particleCount = 1500;
    const positions = new Float32Array(particleCount * 3);
    const velocities = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    
    // Initialize particles with random positions
    for (let i = 0; i < particleCount; i++) {
        const x = (Math.random() - 0.5) * 4;
        const y = (Math.random() - 0.5) * 4;
        const z = 0;
        
        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;
        
        // Initialize velocities
        velocities[i * 3] = 0;
        velocities[i * 3 + 1] = 0;
        velocities[i * 3 + 2] = 0;
        
        // Initialize colors (white)
        colors[i * 3] = 1;
        colors[i * 3 + 1] = 1;
        colors[i * 3 + 2] = 1;
    }
    
    particleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    particleGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    particleGeometry.setAttribute('velocity', new THREE.Float32BufferAttribute(velocities, 3));
    
    const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particleSystem);
    
    // Define analytic field: (sin(y) + cos(x*0.5 + t), sin(x) - cos(y*0.5 + t))
    const field = {
        compute: function(x, y, t) {
            const fieldX = Math.sin(y) + Math.cos(x * 0.5 + t);
            const fieldY = Math.sin(x) - Math.cos(y * 0.5 + t);
            return { x: fieldX, y: fieldY };
        }
    };
    
    // Animation loop
    let time = 0;
    const dt = 0.016;
    
    function animate() {
        requestAnimationFrame(animate);
        
        time += dt;
        
        // Update particle positions and velocities
        const positions = particleGeometry.attributes.position.array;
        const velocities = particleGeometry.attributes.velocity.array;
        const colors = particleGeometry.attributes.color.array;
        
        for (let i = 0; i < particleCount; i++) {
            const x = positions[i * 3];
            const y = positions[i * 3 + 1];
            const z = positions[i * 3 + 2];
            
            // Compute field at current position
            const fieldAtPoint = field.compute(x, y, time);
            const fieldX = fieldAtPoint.x;
            const fieldY = fieldAtPoint.y;
            
            // Update velocity (advection)
            velocities[i * 3] = fieldX;
            velocities[i * 3 + 1] = fieldY;
            velocities[i * 3 + 2] = 0;
            
            // Update position
            positions[i * 3] += fieldX * dt;
            positions[i * 3 + 1] += fieldY * dt;
            positions[i * 3 + 2] += 0;
            
            // Calculate speed for coloring
            const speed = Math.sqrt(fieldX * fieldX + fieldY * fieldY);
            colors[i * 3] = speed * 0.5 + 0.5; // Normalize to [0.5, 1.0]
            colors[i * 3 + 1] = speed * 0.5 + 0.5;
            colors[i * 3 + 2] = speed * 0.5 + 0.5;
            
            // Check if particle is outside bounds or has low speed for too long
            if (Math.abs(x) > 4 || Math.abs(y) > 4) {
                // Re-seed particle
                positions[i * 3] = (Math.random() - 0.5) * 4;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 4;
                positions[i * 3 + 2] = 0;
                
                // Reset velocity
                velocities[i * 3] = 0;
                velocities[i * 3 + 1] = 0;
                velocities[i * 3 + 2] = 0;
            }
        }
        
        // Apply updates
        particleGeometry.attributes.position.needsUpdate = true;
        particleGeometry.attributes.velocity.needsUpdate = true;
        particleGeometry.attributes.color.needsUpdate = true;
        
        // Clear trails (partial clear)
        renderer.setClearColor(0x000000, 0.2); // Set to black with 20% opacity for trails
        
        // Render
        renderer.render(scene, camera);
    }
    
    // Handle window resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    animate();
</script>
</body>
</html>
