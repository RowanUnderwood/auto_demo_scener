<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Toaster Drift</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
  body {
    background: linear-gradient(to bottom, #bcd8f5 0%, #dfeeff 45%, #f4faff 100%);
  }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 14);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(5, 8, 10);
scene.add(dir);
const fill = new THREE.DirectionalLight(0xaaccff, 0.3);
fill.position.set(-6, -4, 6);
scene.add(fill);

const toasters = [];
const toasts = [];

function makeToaster() {
  const g = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd8dbe2, metalness: 0.6, roughness: 0.35 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 1.1), bodyMat);
  g.add(body);

  const slotMat = new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: 0.9 });
  const slot = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.06, 0.5), slotMat);
  slot.position.y = 0.52;
  g.add(slot);

  // base feet
  const footMat = new THREE.MeshStandardMaterial({ color: 0x555a63, roughness: 0.7 });
  for (const sx of [-0.55, 0.55]) {
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.7), footMat);
    foot.position.set(sx, -0.55, 0);
    g.add(foot);
  }

  // little lever
  const lever = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.15), footMat);
  lever.position.set(0.85, -0.25, 0.3);
  g.add(lever);

  const wingMat = new THREE.MeshStandardMaterial({
    color: 0xf0f3f8, metalness: 0.4, roughness: 0.4, side: THREE.DoubleSide
  });
  const wingGeo = new THREE.PlaneGeometry(1.4, 0.7);
  wingGeo.translate(0.7, 0, 0); // pivot at inner edge

  const wingL = new THREE.Mesh(wingGeo, wingMat);
  wingL.position.set(-0.8, 0.1, 0);
  g.add(wingL);

  const wingR = new THREE.Mesh(wingGeo, wingMat);
  wingR.position.set(0.8, 0.1, 0);
  wingR.rotation.y = Math.PI;
  g.add(wingR);

  return { group: g, wingL, wingR };
}

function makeToast() {
  const geo = new THREE.BoxGeometry(0.9, 0.28, 0.9);
  const mat = new THREE.MeshStandardMaterial({ color: 0x9c6b3f, roughness: 0.95 });
  const m = new THREE.Mesh(geo, mat);
  // slightly irregular shade
  m.material.color.offsetHSL(0, 0, (Math.random() - 0.5) * 0.08);
  return m;
}

function upperRightSpawn(pos) {
  // off-screen upper-right in camera space, converted roughly to world
  pos.x = 14 + Math.random() * 6;
  pos.y = 9 + Math.random() * 6;
  pos.z = (Math.random() - 0.5) * 4;
}

const DRIFT = new THREE.Vector3(-1.0, -0.6).normalize();

function spawnToaster() {
  const t = makeToaster();
  upperRightSpawn(t.group.position);
  t.group.rotation.set(
    (Math.random() - 0.5) * 0.6,
    (Math.random() - 0.5) * 1.2,
    (Math.random() - 0.5) * 0.6
  );
  const s = 0.7 + Math.random() * 0.7;
  t.group.scale.setScalar(s);
  scene.add(t.group);
  toasters.push({
    ...t,
    speed: 2.2 + Math.random() * 1.6,
    phase: Math.random() * Math.PI * 2,
    bob: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.4
  });
}

function spawnToast() {
  const m = makeToast();
  upperRightSpawn(m.position);
  m.rotation.set(
    (Math.random() - 0.5) * 1.5,
    (Math.random() - 0.5) * 1.5,
    (Math.random() - 0.5) * 1.5
  );
  scene.add(m);
  toasts.push({
    mesh: m,
    speed: 2.0 + Math.random() * 1.4,
    spinX: (Math.random() - 0.5) * 1.2,
    spinY: (Math.random() - 0.5) * 1.2
  });
}

for (let i = 0; i < 20; i++) {
  spawnToaster();
  // spread initial toasters across the screen
  const t = toasters[toasters.length - 1];
  t.group.position.x = 14 + (i / 20) * -32;
  t.group.position.y = 9 + (i / 20) * -18;
}
for (let i = 0; i < 6; i++) {
  spawnToast();
  const t = toasts[toasts.length - 1];
  t.mesh.position.x = 14 + (i / 6) * -32;
  t.mesh.position.y = 9 + (i / 6) * -18;
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta ? 0.016 : 0.016, 0.05);

  for (let i = toasters.length - 1; i >= 0; i--) {
    const s = toasters[i];
    s.group.position.addScaledVector(DRIFT, s.speed * 0.016);
    s.group.position.y += Math.sin(t * 1.3 + s.bob) * 0.004;
    s.group.rotation.y += s.spin * 0.016;

    const flap = Math.sin(t * 8 + s.phase) * 0.55;
    s.wingL.rotation.z = flap;
    s.wingR.rotation.z = flap;

    if (s.group.position.x < -16 || s.group.position.y < -11) {
      scene.remove(s.group);
      toasters.splice(i, 1);
      spawnToaster();
    }
  }

  for (let i = toasts.length - 1; i >= 0; i--) {
    const s = toasts[i];
    s.mesh.position.addScaledVector(DRIFT, s.speed * 0.016);
    s.mesh.rotation.x += s.spinX * 0.016;
    s.mesh.rotation.y += s.spinY * 0.016;

    if (s.mesh.position.x < -16 || s.mesh.position.y < -11) {
      scene.remove(s.mesh);
      toasts.splice(i, 1);
      spawnToast();
    }
  }

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
