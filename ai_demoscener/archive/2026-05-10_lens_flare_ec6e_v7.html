<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Monolith - Cybernetic Core</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const CONFIG = {
        accent: 0x00ffcc,      // Cyber Teal
        secondary: 0xff0066,   // Neon Pink
        bg: 0x050508,
        particleCount: 25000,
        gridSize: 40,
        monolithScale: 1.2
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(CONFIG.bg);
    scene.fog = new THREE.FogExp2(CONFIG.bg, 0.05);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // --- The Monolith (Geometric Core) ---
    const monolithGeo = new THREE.BoxGeometry(1, 3, 1);
    // Wireframe overlay for a "hologram" look
    const wireframeGeo = new THREE.BoxGeometry(1.05, 3.05, 1.05);
    const wireframeMat = new THREE.MeshBasicMaterial({ 
        color: CONFIG.accent, 
        wireframe: true, 
        transparent: true, 
        opacity: 0.3 
    });
    const wireframe = new THREE.Mesh(wireframeGeo, wireframeMat);

    const monolithMat = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uColor1: { value: new THREE.Color(CONFIG.accent) },
            uColor2: { value: new THREE.Color(CONFIG.secondary) }
        },
        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vPosition;
            uniform float uTime;
            void main() {
                vNormal = normalize(normalMatrix * normal);
                vec3 pos = position;
                // Glitchy vertical vibration
                pos.x += sin(uTime * 10.0 + pos.y * 5.0) * 0.02 * sin(uTime * 2.0);
                vPosition = pos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `,
        fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vPosition;
            uniform float uTime;
            uniform vec3 uColor1;
            uniform vec3 uColor2;
            void main() {
                float scanline = sin(vPosition.y * 50.0 - uTime * 10.0) * 0.1 + 0.9;
                float rim = pow(1.0 - max(dot(vNormal, vec3(0,0,1)), 0.0), 4.0);
                vec3 color = mix(uColor1, uColor2, vPosition.y * 0.5 + 0.5);
                color *= scanline;
                gl_FragColor = vec4(color + rim * uColor1, 1.0);
            }
        `
    });

    const monolith = new THREE.Mesh(monolithGeo, monolithMat);
    monolith.add(wireframe);
    scene.add(monolith);

    // --- Data Rain (Particle Field) ---
    const pCount = CONFIG.particleCount;
    const pPos = new Float32Array(pCount * 3);
    const pVel = new Float32Array(pCount);
    const pCol = new Float32Array(pCount * 3);

    for (let i = 0; i < pCount; i++) {
        pPos[i*3] = (Math.random() - 0.5) * 40;
        pPos[i*3+1] = (Math.random() - 0.5) * 40;
        pPos[i*3+2] = (Math.random() - 0.5) * 40;
        
        pVel[i] = 0.05 + Math.random() * 0.15;

        const color = new THREE.Color();
        if(Math.random() > 0.8) {
            color.set(CONFIG.secondary);
        } else {
            color.set(CONFIG.accent);
        }
        pCol[i*3] = color.r;
        pCol[i*3+1] = color.g;
        pCol[i*3+2] = color.b;
    }

    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));

    const pMat = new THREE.PointsMaterial({
        size: 0.04,
        vertexColors: true,
        transparent: true,
        opacity: 0.5,
        blending: THREE.AdditiveBlending
    });

    const particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);

    // --- Digital Floor (Grid) ---
    const gridHelper = new THREE.GridHelper(60, 40, CONFIG.accent, 0x111111);
    gridHelper.position.y = -3;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.2;
    scene.add(gridHelper);

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();
        const delta = clock.getDelta();

        monolithMat.uniforms.uTime.value = elapsed;

        // Monolith Hover & Rotation
        monolith.position.y = Math.sin(elapsed * 0.5) * 0.2;
        monolith.rotation.y += delta * 0.3;
        monolith.rotation.z = Math.sin(elapsed * 0.8) * 0.05;

        // Particle Movement (Descending "Rain")
        const posAttr = pGeo.attributes.position;
        for(let i = 0; i < pCount; i++) {
            posAttr.array[i*3+1] -= pVel[i]; // Move Y down
            
            // Reset if particle goes below floor
            if (posAttr.array[i*3+1] < -5) {
                posAttr.array[i*3+1] = 20;
                posAttr.array[i*3] = (Math.random() - 0.5) * 40;
                posAttr.array[i*3+2] = (Math.random() - 0.5) * 40;
            }
        }
        posAttr.needsUpdate = true;

        // Camera Cinematic Movement
        camera.position.x = Math.sin(elapsed * 0.2) * 5;
        camera.position.z = 10 + Math.cos(elapsed * 0.2) * 3;
        camera.lookAt(0, 0, 0);

        // Grid pulse effect via opacity trick (simulated)
        gridHelper.material.opacity = 0.1 + Math.abs(Math.sin(elapsed)) * 0.15;

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
