<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fractal Singularity Garden</title>
<style>
*{margin:0;padding:0;overflow:hidden}
body{background:#000}
canvas{display:block}
#info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font:12px monospace;letter-spacing:2px;pointer-events:none}
</style>
</head>
<body>
<div id="info">FRACTAL SINGULARITY GARDEN</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x000000,0.015);

const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,500);
camera.position.set(0,4,14);
camera.lookAt(0,0,0);

const mouse={x:0,y:0,px:0,py:0};
window.addEventListener('mousemove',e=>{
mouse.x=(e.clientX/window.innerWidth)*2-1;
mouse.y=-(e.clientY/window.innerHeight)*2+1;
});

// Post processing
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),1.8,0.4,0.1);
composer.addPass(bloom);

// --- Central Singularity Object ---
const singularityGeo=new THREE.IcosahedronGeometry(2,6);
const singularityMat=new THREE.ShaderMaterial({
uniforms:{
uTime:{value:0},
uMouse:{value:new THREE.Vector2()},
uColorA:{value:new THREE.Color(0.1,0.4,1.0)},
uColorB:{value:new THREE.Color(1.0,0.1,0.6)},
uColorC:{value:new THREE.Color(0.0,1.0,0.8)}
},
vertexShader:`
uniform float uTime;
uniform vec2 uMouse;
varying vec3 vNormal;
varying vec3 vPos;
varying float vDisp;

vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
const vec2 C=vec2(1.0/6.0,1.0/3.0);
const vec4 D=vec4(0.0,0.5,1.0,2.0);
vec3 i=floor(v+dot(v,C.yyy));
vec3 x0=v-i+dot(i,C.xxx);
vec3 g=step(x0.yzx,x0.xyz);
vec3 l=1.0-g;
vec3 i1=min(g.xyz,l.zxy);
vec3 i2=max(g.xyz,l.zxy);
vec3 x1=x0-i1+C.xxx;
vec3 x2=x0-i2+C.yyy;
vec3 x3=x0-D.yyy;
i=mod289(i);
vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
float n_=0.142857142857;
vec3 ns=n_*D.wyz-D.xzx;
vec4 j=p-49.0*floor(p*ns.z*ns.z);
vec4 x_=floor(j*ns.z);
vec4 y_=floor(j-7.0*x_);
vec4 x=x_*ns.x+ns.yyyy;
vec4 y=y_*ns.x+ns.yyyy;
vec4 h=1.0-abs(x)-abs(y);
vec4 b0=vec4(x.xy,y.xy);
vec4 b1=vec4(x.zw,y.zw);
vec4 s0=floor(b0)*2.0+1.0;
vec4 s1=floor(b1)*2.0+1.0;
vec4 sh=-step(h,vec4(0.0));
vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
vec3 p0=vec3(a0.xy,h.x);
vec3 p1=vec3(a0.zw,h.y);
vec3 p2=vec3(a1.xy,h.z);
vec3 p3=vec3(a1.zw,h.w);
vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
m=m*m;
return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

void main(){
vec3 pos=position;
float t=uTime*0.3;
float n1=snoise(pos*0.8+t)*0.6;
float n2=snoise(pos*2.0-t*0.7)*0.3;
float n3=snoise(pos*4.0+t*1.2)*0.15;
float disp=n1+n2+n3;
disp+=snoise(pos*3.0+uMouse*2.0+t)*0.2;
vec3 newPos=pos+normal*disp*1.2;
newPos+=uMouse*0.3*length(pos);
vNormal=normalMatrix*normal;
vPos=(modelViewMatrix*vec4(newPos,1.0)).xyz;
vDisp=disp;
gl_Position=projectionMatrix*modelViewMatrix*vec4(newPos,1.0);
}
`,
fragmentShader:`
uniform float uTime;
uniform vec3 uColorA;
uniform vec3 uColorB;
uniform vec3 uColorC;
varying vec3 vNormal;
varying vec3 vPos;
varying float vDisp;

void main(){
float fresnel=pow(1.0-abs(dot(normalize(vNormal),normalize(-vPos))),2.0);
float t=uTime*0.15;
vec3 col=mix(uColorA,uColorB,sin(vDisp*4.0+t)*0.5+0.5);
col=mix(col,uColorC,sin(vDisp*6.0-t*1.3)*0.5+0.5);
col+=fresnel*vec3(0.8,0.3,1.0)*2.0;
col+=vDisp*vec3(0.3,0.8,0.5);
float pulse=0.8+0.2*sin(uTime*2.0);
col*=pulse;
gl_FragColor=vec4(col,0.95);
}
`
});
const singularity=new THREE.Mesh(singularityGeo,singularityMat);
scene.add(singularity);

// --- Orbital Particles ---
const P_COUNT=8000;
const pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(P_COUNT*3);
const pCol=new Float32Array(P_COUNT*3);
const pSize=new Float32Array(P_COUNT);
const pData=[];
for(let i=0;i<P_COUNT;i++){
const r=3+Math.random()*12;
const theta=Math.random()*Math.PI*2;
const phi=Math.acos(2*Math.random()-1);
const speed=0.2+Math.random()*0.8;
const axis=new THREE.Vector3(Math.random()-0.5,Math.random()-0.5,Math.random()-0.5).normalize();
pData.push({r,theta,phi,speed,axis,offset:Math.random()*100,wobble:Math.random()*0.5});
pSize[i]=1.0+Math.random()*3.0;
}
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
pGeo.setAttribute('size',new THREE.BufferAttribute(pSize,1));

const pMat=new THREE.ShaderMaterial({
uniforms:{uTime:{value:0}},
vertexShader:`
attribute float size;
attribute vec3 color;
varying vec3 vColor;
varying float vAlpha;
void main(){
vColor=color;
vec4 mv=modelViewMatrix*vec4(position,1.0);
float dist=length(position);
vAlpha=smoothstep(14.0,4.0,dist);
gl_PointSize=size*(200.0/max(1.0,-mv.z));
gl_Position=projectionMatrix*mv;
}
`,
fragmentShader:`
varying vec3 vColor;
varying float vAlpha;
void main(){
vec2 uv=gl_PointCoord-0.5;
float d=length(uv);
float a=smoothstep(0.5,0.0,d)*vAlpha;
gl_FragColor=vec4(vColor,a);
}
`,
transparent:true,
blending:THREE.AdditiveBlending,
depthWrite:false
});
const particles=new THREE.Points(pGeo,pMat);
scene.add(particles);

// --- Warped Grid ---
const gridGeo=new THREE.PlaneGeometry(60,60,120,120);
const gridMat=new THREE.ShaderMaterial({
uniforms:{uTime:{value:0},uMouse:{value:new THREE.Vector2()}},
vertexShader:`
uniform float uTime;
uniform vec2 uMouse;
varying vec2 vUv;
varying float vH;
void main(){
vec3 pos=position;
float t=uTime*0.5;
float d=length(pos.xy+uMouse*3.0);
float wave=sin(d*0.8-t*2.0)*0.5*exp(-d*0.08);
wave+=sin(pos.x*0.3+t)*sin(pos.y*0.3-t*0.7)*0.3;
pos.z+=wave+uMouse.x*0.2*pos.y*0.1;
vH=wave;
vUv=uv;
gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.0);
}
`,
fragmentShader:`
uniform float uTime;
varying vec2 vUv;
varying float vH;
void main(){
float grid=step(0.96,fract(vUv.x*60.0))*step(0.96,fract(vUv.y*60.0));
float glow=smoothstep(0.0,1.0,abs(vH)*3.0);
vec3 col=mix(vec3(0.05,0.0,0.15),vec3(0.2,0.0,0.4),glow);
col+=grid*vec3(0.1,0.3,0.8)*0.5;
col+=vH*vec3(0.0,0.5,0.8);
float fade=1.0-length(vUv-0.5)*1.8;
gl_FragColor=vec4(col,clamp(fade,0.0,1.0)*0.7);
}
`,
transparent:true,
side:THREE.DoubleSide,
depthWrite:false
});
const grid=new THREE.Mesh(gridGeo,gridMat);
grid.rotation.x=-Math.PI/2;
grid.position.y=-4;
scene.add(grid);

// --- Ring structures ---
const rings=[];
for(let i=0;i<5;i++){
const ringGeo=new THREE.TorusGeometry(4+i*1.5,0.03,8,128);
const ringMat=new THREE.MeshBasicMaterial({
color:new THREE.Color().setHSL(0.55+i*0.08,1.0,0.5),
transparent:true,
opacity:0.4,
blending:THREE.AdditiveBlending
});
const ring=new THREE.Mesh(ringGeo,ringMat);
ring.rotation.x=Math.PI/2+i*0.3;
ring.rotation.y=i*0.5;
rings.push(ring);
scene.add(ring);
}

// --- Petal structures ---
const petals=[];
for(let i=0;i<8;i++){
const petalGeo=new THREE.BufferGeometry();
const pts=[];
const cols=[];
const segs=20;
for(let j=0;j<segs;j++){
const t=j/segs;
const angle=t*Math.PI*2;
const r2=1.5+t*2.0;
const x=Math.cos(angle)*r2;
const y=Math.sin(angle)*r2;
const z=(t-0.5)*1.5;
pts.push(x,y,z);
const c=new THREE.Color().setHSL((i/8+t*0.3)%1,0.9,0.5);
cols.push(c.r,c.g,c.b);
}
petalGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
petalGeo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
const petalMat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending});
const petal=new THREE.Line(petalGeo,petalMat);
petal.rotation.set(i*0.4,i*0.6,0);
petals.push(petal);
scene.add(petal);
}

// --- Animate ---
const clock=new THREE.Clock();
function animate(){
requestAnimationFrame(animate);
const t=clock.getElapsedTime();

singularityMat.uniforms.uTime.value=t;
singularityMat.uniforms.uMouse.value.set(mouse.x,mouse.y);
singularity.rotation.y=t*0.1;
singularity.rotation.x=Math.sin(t*0.2)*0.2;
const s=1.0+Math.sin(t*0.5)*0.1;
singularity.scale.set(s,s,s);

pMat.uniforms.uTime.value=t;
gridMat.uniforms.uTime.value=t;
gridMat.uniforms.uMouse.value.set(mouse.x,mouse.y);

// Update particles
const pos=pGeo.attributes.position.array;
const col=pGeo.attributes.color.array;
for(let i=0;i<P_COUNT;i++){
const d=pData[i];
d.theta+=d.speed*0.016;
d.phi+=Math.sin(t*0.5+d.offset)*0.003;
const r2=d.r+Math.sin(t*0.3+d.offset)*d.wobble;
const x=r2*Math.sin(d.phi)*Math.cos(d.theta);
const y=r2*Math.cos(d.phi);
const z=r2*Math.sin(d.phi)*Math.sin(d.theta);
const ca=Math.cos(t*0.1+d.offset);
const sa=Math.sin(t*0.1+d.offset);
pos[i*3]=x*ca-z*sa;
pos[i*3+1]=y+Math.sin(t*2.0+d.offset*0.1)*0.3;
pos[i*3+2]=x*sa+z*ca;
const dist=Math.sqrt(pos[i*3]*pos[i*3]+pos[i*3+1]*pos[i*3+1]+pos[i*3+2]*pos[i*3+2]);
const hue=(t*0.05+dist*0.05+d.offset*0.01)%1.0;
const c=new THREE.Color().setHSL(hue,0.8,0.4+0.3*Math.sin(t+d.offset));
col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
}
pGeo.attributes.position.needsUpdate=true;
pGeo.attributes.color.needsUpdate=true;

// Rings
rings.forEach((ring,i)=>{
ring.rotation.z=t*0.2*(i%2===0?1:-1);
ring.rotation.x=Math.PI/2+i*0.3+Math.sin(t*0.3+i)*0.2;
const rs=1.0+Math.sin(t*0.5+i*1.2)*0.15;
ring.scale.set(rs,rs,rs);
ring.material.opacity=0.3+0.2*Math.sin(t+i);
});

// Petals
petals.forEach((p,i)=>{
p.rotation.x=i*0.4+t*0.15;
p.rotation.y=i*0.6+t*0.1;
p.rotation.z=Math.sin(t*0.2+i)*0.5;
const ps=0.8+Math.sin(t*0.4+i*0.8)*0.3;
p.scale.set(ps,ps,ps);
p.material.opacity=0.3+0.3*Math.sin(t*0.6+i);
});

// Camera orbit
const camAngle=t*0.08+mouse.x*0.5;
const camH=4+mouse.y*3+Math.sin(t*0.15)*1.0;
camera.position.x=Math.sin(camAngle)*14;
camera.position.z=Math.cos(camAngle)*14;
camera.position.y=camH;
camera.lookAt(0,0,0);

// Bloom pulse
bloom.strength=1.5+Math.sin(t*0.8)*0.4;

composer.render();
}
animate();

window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
composer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
