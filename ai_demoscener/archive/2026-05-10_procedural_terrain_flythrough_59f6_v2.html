<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cybernetic Grid Flow</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>
<script type="module">
import * as THREE from 'three';

/**
 * CONCEPT: "Neon Data Stream"
 * Instead of organic terrain, we create a structured, synthetic digital landscape.
 * Using high-frequency geometric noise to create "data peaks".
 * Aesthetic: Cyberpunk/Synthwave (Dark background, neon grid lines, glowing pulses).
 */

const vertexShader = `
    varying float vElevation;
    varying vec2 vUv;
    varying vec3 vNormal;
    uniform float uTime;

    // Simplex-style noise for sharper peaks than Perlin
    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

    float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);

        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);

        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;

        i = mod289(i);
        vec4 p = permute(permute(permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0))
                  + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                  + i.x + vec4(0.0, i1.x, i2.x, 1.0));

        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;

        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);

        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);

        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);

        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));

        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;

        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);

        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x;
        p1 *= norm.y;
        p2 *= norm.z;
        p3 *= norm.w;

        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }

    void main() {
        vUv = uv;
        // Moving noise coordinates to simulate forward motion
        vec3 noisePos = vec3(position.xy * 0.15, uTime * 0.5);
        float noise = snoise(noisePos) * 6.0;
        
        // Create sharp ridges using pow
        float ridge = pow(abs(noise), 2.0) * 3.0;
        
        vec3 newPos = position;
        newPos.z += ridge;
        
        vElevation = ridge;
        vNormal = normal;
        
        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
    }
`;

const fragmentShader = `
    varying float vElevation;
    varying vec2 vUv;
    varying vec3 vNormal;
    uniform float uTime;

    void main() {
        // Base color: deep dark blue/black
        vec3 baseColor = vec3(0.01, 0.02, 0.05);
        
        // Grid lines logic based on UVs
        float gridLines = smoothstep(0.97, 1.0, fract(vUv.x * 40.0)) + 
                          smoothstep(0.97, 1.0, fract(vUv.y * 40.0));
        
        // Neon glow based on elevation and grid lines
        vec3 neonColor = vec3(0.0, 1.0, 0.8); // Cyan/Teal
        if (vElevation > 2.5) neonColor = vec3(1.0, 0.0, 0.5); // Magenta peaks
        
        // Pulse effect
        float pulse = sin(uTime * 3.0 + vElevation * 2.0) * 0.5 + 0.5;
        
        vec3 finalColor = mix(baseColor, neonColor, gridLines * 0.4);
        finalColor += neonColor * (vElevation * 0.15) * pulse;
        
        // Add "lightning" glints on highest points
        float glint = smoothstep(5.0, 7.0, vElevation) * sin(uTime * 10.0);
        finalColor += vec3(1.0) * glint;

        gl_FragColor = vec4(finalColor, 1.0);
    }
`;

let scene, camera, renderer, mesh, material;

init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020205);
    scene.fog = new THREE.FogExp2(0x020205, 0.03);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    // Low angle for dramatic perspective
    camera.position.set(0, 8, 15);
    camera.lookAt(0, 0, -20);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Large enough plane for movement buffer
    const geometry = new THREE.PlaneGeometry(150, 150, 300, 300);
    geometry.rotateX(-Math.PI / 2);

    material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 }
        },
        vertexShader,
        fragmentShader,
        side: THREE.DoubleSide
    });

    mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    window.addEventListener('resize', onWindowResize, false);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);

    const timeScale = 0.5;
    material.uniforms.uTime.value += 0.01 * timeScale;

    // Move the camera forward through the grid
    camera.position.z -= 0.2;

    // Infinite loop mechanism: reset mesh/camera position to avoid floating point jitter and infinite distance
    if (camera.position.z < -50) {
        camera.position.z = 50;
        mesh.position.z = 0; // Keep it centered relative to movement
    }

    renderer.render(scene, camera);
}
</script>
</body>
</html>
