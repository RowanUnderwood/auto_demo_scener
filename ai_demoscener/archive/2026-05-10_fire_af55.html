<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Shader</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const vertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;

    const fragmentShader = `
        uniform float u_time;
        uniform vec2 u_resolution;
        varying vec2 vUv;

        float hash(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
        }

        float valueNoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            
            float a = hash(i);
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));

            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            vec2 shift = vec2(100.0);
            // 3 Octaves
            for (int i = 0; i < 3; i++) {
                v += a * valueNoise(p);
                p = p * 2.0 + shift;
                a *= 0.5;
            }
            return v;
        }

        vec3 getPalette(float t) {
            // Black -> Red -> Orange -> Yellow -> White
            if (t < 0.15) return mix(vec3(0.0, 0.0, 0.0), vec3(1.0, 0.0, 0.0), t / 0.15);
            if (t < 0.4)  return mix(vec3(1.0, 0.0, 0.0), vec3(1.0, 0.5, 0.0), (t - 0.15) / 0.25);
            if (t < 0.7)  return mix(vec3(1.0, 0.5, 0.0), vec3(1.0, 1.0, 0.0), (t - 0.4) / 0.3);
            return mix(vec3(1.0, 1.0, 0.0), vec3(1.0, 1.0, 1.0), (t - 0.7) / 0.3);
        }

        void main() {
            vec2 uv = vUv;
            
            // Sampling noise at scale and with time offset
            vec2 noiseCoord = uv * vec2(3.0, 1.0);
            noiseCoord.y -= u_time * 0.5;
            
            float n = fbm(noiseCoord);

            // Masking: Inverted smoothstep for vertical (more at bottom)
            // smoothstep(0.0, 0.4, uv.y) goes from 0 to 1. 
            // We invert it so bottom is high and top is low.
            float vMask = 1.0 - smoothstep(0.0, 0.5, uv.y);

            // Horizontal falloff (edges of screen)
            float hMask = smoothstep(0.0, 0.2, uv.x) * smoothstep(1.0, 0.8, uv.x);

            float intensity = n * vMask * hMask;
            
            // Boost and clamp for better color range mapping
            intensity = pow(intensity, 0.8);

            vec3 color = getPalette(intensity);
            
            gl_FragColor = vec4(color, 1.0);
        }
    `;

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.PlaneGeometry(2, 2);
    const uniforms = {
        u_time: { value: 0.0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader,
        fragmentShader
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    function animate(time) {
        uniforms.u_time.value = time * 0.001;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height);
        uniforms.u_resolution.value.set(width, height);
    });

    requestAnimationFrame(animate);
</script>
</body>
</html>
