<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voronoi Perturbation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const vertexShader = `
varying vec2 v_uv;
void main() {
    v_uv = uv;
    gl_Position = vec4(position, 1.0);
}`;

const fragmentShader = `
precision highp float;

uniform float u_time;
varying vec2 v_uv;

#define LAYER_COUNT 3

float voronoiLayer(vec2 uv, float scale, vec2 offset, vec2 speed, float seed) {
    vec2 p = uv * scale;
    vec2 base = floor(p);
    vec2 f = fract(p);

    float minDist = 1.0;

    for (int yOff = -1; yOff <= 1; yOff++) {
        for (int xOff = -1; xOff <= 1; xOff++) {
            vec2 neighbor = vec2(float(xOff), float(yOff));
            vec2 cell = base + neighbor;

            // Moving feature points via sin/cos
            float sx = sin(cell.x * 1.2 + cell.y * 0.7 + offset.x + u_time * speed.x + seed);
            float sy = cos(cell.y * 1.1 + cell.x * 0.9 + offset.y + u_time * speed.y + seed);
            vec2 move = vec2(sx, sy) * 0.38;

            vec2 point = cell + 0.5 + move;
            vec2 diff = p - point;
            float dist = length(diff);
            minDist = min(minDist, dist);
        }
    }

    return minDist / scale;
}

void main() {
    vec2 uv = v_uv;

    // Perturb UV using sin/cos(uv * freq + time)
    float freq = 3.5;
    float amp = 0.06;
    vec2 pUv = uv + vec2(
        sin(uv.y * freq * 6.2831 + u_time * 0.7),
        cos(uv.x * freq * 6.2831 + u_time * 0.5 + 1.3)
    ) * amp;

    // Accumulate pow(1-d, 60) over 3 layers
    float acc = 0.0;
    float weights[3];
    float d[3];

    // Layer 1 — coarse, slow
    d[0] = voronoiLayer(pUv, 5.0, vec2(0.0, 0.0), vec2(0.25, 0.18), 0.0);
    weights[0] = pow(max(1.0 - d[0], 0.0), 60.0);
    acc += weights[0];

    // Layer 2 — medium
    d[1] = voronoiLayer(pUv, 8.5, vec2(5.0, 3.0), vec2(-0.3, 0.35), 7.0);
    weights[1] = pow(max(1.0 - d[1], 0.0), 60.0);
    acc += weights[1];

    // Layer 3 — fine, faster
    d[2] = voronoiLayer(pUv, 13.0, vec2(10.0, 7.0), vec2(0.2, -0.4), 14.0);
    weights[2] = pow(max(1.0 - d[2], 0.0), 60.0);
    acc += weights[2];

    acc /= 3.0;

    // Blue-green tint palette
    vec3 deepColor = vec3(0.0, 0.12, 0.22);
    vec3 midColor = vec3(0.0, 0.45, 0.55);
    vec3 brightColor = vec3(0.1, 0.85, 0.7);
    vec3 hotColor = vec3(0.3, 1.0, 0.95);

    vec3 col = mix(deepColor, midColor, smoothstep(0.0, 0.3, acc));
    col = mix(col, brightColor, smoothstep(0.3, 0.6, acc));
    col = mix(col, hotColor, smoothstep(0.6, 1.0, acc));

    // Add subtle glow around Voronoi edges
    float edge = pow(max(1.0 - d[1], 0.0), 12.0) * 0.15;
    col += vec3(0.0, 0.3, 0.4) * edge;

    // Subtle vignette
    float vig = 1.0 - 0.55 * length(uv - 0.5);
    vig = smoothstep(0.0, 1.0, vig);
    col *= vig;

    // Tone mapping
    col = col / (col + 0.5);

    gl_FragColor = vec4(col, 1.0);
}`;

const uniforms = {
    u_time: { value: 0.0 }
};

const geometry = new THREE.PlaneGeometry(2, 2);
const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms
});

const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    uniforms.u_time.value = clock.getElapsedTime();
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
</body>
</html>
