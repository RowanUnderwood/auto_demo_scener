<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chromatic Cascade</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let particles = [];
        const particleCount = 5000;

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 2;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Light
            const light = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(light);

            // Particles
            for (let i = 0; i < particleCount; i++) {
                const particle = createParticle();
                scene.add(particle);
                particles.push({ particle, color: new THREE.Color(`hsl(${Math.random() * 360}, 100%, 50%}`), speed: Math.random() * 0.02 });
            }

            window.addEventListener('resize', onWindowResize, false);
        }

        function createParticle() {
            const geometry = new THREE.SphereGeometry(0.02, 8, 8);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
            return new THREE.Mesh(geometry, material);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            particles.forEach(p => {
                p.particle.position.y += p.speed;
                if (p.particle.position.y > 2) p.particle.position.y = -2;
                p.particle.material.color.lerp(p.color, 0.1);
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
