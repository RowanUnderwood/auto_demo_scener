<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LUMINESCENT BIO-FLUX: ORGANIC NEBULA</title>
    <style>
        body { margin: 0; overflow: hidden; background: #01030d; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #aaffff;
            text-align: left; pointer-events: none; font-size: 12px;
            letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.8;
        }
        #title {
            position: absolute; top: 30px; right: 30px; color: #ffccff;
            font-weight: 200; letter-spacing: 5px; text-transform: uppercase; font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="title">Bio-Flux Bloom</div>
    <div id="ui">
        Ecosystem Density: <span id="densityVal">0.5</span><br>
        Energy Flow Rate: <span id="flowRate">1.2</span><br>
        Growth State: Cyclic
    </div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        /**
         * CONCEPT: "LUMINESCENT BIO-FLUX"
         * Shifting the aesthetic from rigid geometry to fluid, organic growth.
         * Uses Raymarching for a soft, volumetric biological structure 
         * combined with large, slow-moving gaseous/plasma particles.
         */

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 50);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- ORGANIC VOLUMETRIC SHADER ---
        const fragmentShader = `
            uniform float uTime;
            uniform vec2 uRes;
            uniform float uDensity; // New parameter for organic density

            // Mandelbrot-like function adapted for 3D volume (Simplex/Worley inspired)
            float map(vec3 p) {
                p *= 1.5; // Scale factor
                float d = length(sin(p * 4.0)) - 1.0; // Smooth noise field (like Perlin/Voronoi blend)
                
                // Add a central growth attractor over time
                float centerInfluence = exp(-pow(length(p - vec3(0.0, 0.0, -2.0)) * 1.5, 2.0));
                
                // Control the overall shape using density uniform
                return (d + uDensity) * 1.5;
            }

            vec3 getNormal(vec3 p) {
                vec2 e = vec2(0.001, 0.0);
                return normalize(vec3(
                    map(p + e.xyy) - map(p - e.xyy),
                    map(p + e.yxy) - map(p - e.yxy),
                    map(p + e.yyx) - map(p - e.yyx)
                ));
            }

            // Bioluminescent color mapping (shifting towards cyan/magenta/gold)
            vec3 palette(float t, float distFromCenter) {
                if (distFromCenter < 0.2) {
                    // Core glow: bright cyan-green
                    return vec3(0.5 + sin(t * 1.5), 1.0, 0.8);
                } else if (distFromCenter < 0.5) {
                    // Mid-layer transition: soft pink/purple
                    float mixFactor = smoothstep(0.2, 0.5, distFromCenter);
                    return mix(vec3(0.1, 1.0, 1.0), vec3(1.0, 0.2, 0.8), mixFactor);
                } else {
                    // Outer haze: deep indigo/magenta bleed
                    float outerFactor = smoothstep(0.5, 1.0, distFromCenter);
                    return mix(vec3(0.0, 0.0, 0.2), vec3(0.8, 0.1, 0.6), outerFactor);
                }
            }

            void main() {
                // Camera setup: slightly zoomed in view looking into the nebula
                vec2 uv = (gl_FragCoord.xy - 0.5 * uRes.xy) / min(uRes.y, uRes.x);
                vec3 ro = vec3(0.0, 0.0, 0.0); // Start at origin
                vec3 rd = normalize(vec3(uv * 1.2, 1.0)); // Ray direction adjusted

                float t = 0.0;
                bool hit = false;
                vec3 p;

                // Ray Marching loop
                for(int i = 0; i < 80; i++) {
                    p = ro + rd * t;
                    float d = map(p);
                    if(d < 0.01) { // Hit threshold for organic matter
                        hit = true;
                        break;
                    }
                    t += d;
                    if(t > 25.0) break;
                }

                vec3 color = vec3(0.0, 0.0, 0.1); // Deep space background

                if(hit) {
                    vec3 n = getNormal(p);
                    vec3 viewDir = normalize(ro - p);
                    float distFromCenter = length(p - vec3(0.0, 0.0, -2.0));

                    // Lighting: Soft, internal glow simulation (subsurface scattering feel)
                    vec3 lightColor = vec3(1.0, 0.5, 1.0); // Warm internal source
                    float diff = max(dot(n, normalize(lightColor)), 0.0);
                    
                    // Fresnel for soft edges
                    float fresnel = pow(1.0 - max(dot(n, viewDir), 0.0), 2.5);
                    
                    vec3 crystalColor = palette(uTime * 0.4, distFromCenter);
                    
                    color = mix(crystalColor * diff * 0.8, vec3(1.0) * fresnel, 0.2); // Blend glow and surface
                }

                // Atmospheric Haze/Bloom Simulation (always present)
                float hazeFactor = 1.0 - smoothstep(0.0, 4.0, length(rd.xz));
                color += vec3(0.05) * hazeFactor;
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const vertexShader = `
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `;

        // Initialize the quad that covers the viewport
        const quadGeom = new THREE.PlaneGeometry(2, 2);
        const shaderMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                uDensity: { value: 0.5 } // Initial density value
            },
            vertexShader,
            fragmentShader,
            transparent: true // Important for soft rendering
        });
        const quad = new THREE.Mesh(quadGeom, shaderMat);
        scene.add(quad);

        // --- GASEOUS PARTICLE FIELD (Nebula effect) ---
        const particleCount = 2000;
        const pGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            // Distribution within a large, slightly elongated volume
            const r1 = Math.pow(Math.random(), 1/3) * 8; // Cube-like distribution scaled out to radius 8
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(Math.random() * 2 - 1);

            positions[i*3] = r1 * Math.sin(phi) * Math.cos(theta);
            positions[i*3+1] = r1 * Math.cos(phi); // Vertical spread is more constrained in this model
            positions[i*3+2] = r1 * Math.sin(phi) * Math.sin(theta);

            // HSL coloring that shifts slowly over time for 'flow'
            const hue = (Math.random() * 0.4 + 0.6).toFixed(2); // Bias towards cyan/magenta range
            const col = new THREE.Color().setHSL(parseFloat(hue), 1.0, 0.9 + Math.random() * 0.1);
            colors[i*3] = col.r;
            colors[i*3+1] = col.g;
            colors[i*3+2] = col.b;
        }

        pGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        pGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const pMaterial = new THREE.PointsMaterial({
            size: 0.15, // Larger particles for gaseous look
            vertexColors: true,
            transparent: true,
            opacity: 0.2 + Math.random() * 0.1, // Slight variance
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(pGeometry, pMaterial);
        scene.add(particleSystem);

        camera.position.z = 4;

        const clock = new THREE.Clock();
        const densityEl = document.getElementById('densityVal');
        const flowRateEl = document.getElementById('flowRate');


        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            // --- Dynamic Parameters Update ---
            
            // 1. Simulate environmental fluctuation affecting density (0.4 to 0.7)
            const targetDensity = 0.5 + Math.sin(elapsed * 0.12) * 0.2;
            shaderMat.uniforms.uDensity.value += (targetDensity - shaderMat.uniforms.uDensity.value) * 0.01;

            // 2. Animate Particles: slow, rotational drift mimicking gas currents
            const posAttr = pGeometry.attributes.position;
            for (let i = 0; i < particleCount; i++) {
                let x = posAttr.array[i*3];
                let y = posAttr.array[i*3+1];
                let z = posAttr.array[i*3+2];

                // Slow rotational drift (turbulence)
                const rotSpeedX = 0.0005;
                const rotSpeedY = -0.0008;
                const t = elapsed * 0.1;
                
                let newX = x * Math.cos(rotSpeedY * t) + z * Math.sin(rotSpeedY * t);
                let newZ = -x * Math.sin(rotSpeedY * t) + z * Math.cos(rotSpeedY * t);

                posAttr.array[i*3] = newX;
                posAttr.array[i*3+2] = newZ;
            }
            posAttr.needsUpdate = true;
            
            particleSystem.rotation.y += 0.0001;
            particleSystem.rotation.x -= 0.00005;


            // Update UI values based on simulation state
            const currentDensity = shaderMat.uniforms.uDensity.value;
            const flowRate = 1.2 + Math.cos(elapsed * 0.3) * (currentDensity - 0.5) * 0.5;

            densityEl.innerText = currentDensity.toFixed(3);
            flowRateEl.innerText = parseFloat(flowRate.toFixed(2));


            shaderMat.uniforms.uTime.value = elapsed;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            shaderMat.uniforms.uRes.value.set(w, h);
        });

        animate();
    </script>
</body>
</html>
