<!DOCTYPE html>
<html>
<head>
    <title>Neural Network Bloom</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000;
        }
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Create neural network visualization
        const neurons = [];
        const connections = [];
        const particleSystem = new THREE.Group();
        scene.add(particleSystem);
        
        // Create neuron nodes
        for (let i = 0; i < 100; i++) {
            const geometry = new THREE.SphereGeometry(0.05, 8, 8);
            const material = new THREE.MeshBasicMaterial({ 
                color: new THREE.Color(Math.random() * 0xffffff),
                transparent: true,
                opacity: 0.8
            });
            const neuron = new THREE.Mesh(geometry, material);
            
            neuron.position.x = (Math.random() - 0.5) * 10;
            neuron.position.y = (Math.random() - 0.5) * 10;
            neuron.position.z = (Math.random() - 0.5) * 10;
            
            neurons.push(neuron);
            scene.add(neuron);
        }
        
        // Create connections between neurons
        for (let i = 0; i < neurons.length; i++) {
            for (let j = i + 1; j < neurons.length; j++) {
                if (Math.random() > 0.9) {
                    const connectionGeometry = new THREE.BufferGeometry();
                    const positions = new Float32Array([
                        neurons[i].position.x, neurons[i].position.y, neurons[i].position.z,
                        neurons[j].position.x, neurons[j].position.y, neurons[j].position.z
                    ]);
                    connectionGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    
                    const connectionMaterial = new THREE.LineBasicMaterial({
                        color: 0x00ffff,
                        transparent: true,
                        opacity: 0.3
                    });
                    
                    const connection = new THREE.Line(connectionGeometry, connectionMaterial);
                    scene.add(connection);
                    connections.push(connection);
                }
            }
        }
        
        // Create particle system for neural activity
        const particleCount = 2000;
        const particles = new THREE.BufferGeometry();
        const posArray = new Float32Array(particleCount * 3);
        const colorArray = new Float32Array(particleCount * 3);
        const sizeArray = new Float32Array(particleCount);
        
        for (let i = 0; i < particleCount; i++) {
            posArray[i * 3] = (Math.random() - 0.5) * 20;
            posArray[i * 3 + 1] = (Math.random() - 0.5) * 20;
            posArray[i * 3 + 2] = (Math.random() - 0.5) * 20;
            
            colorArray[i * 3] = Math.random();
            colorArray[i * 3 + 1] = Math.random();
            colorArray[i * 3 + 2] = Math.random();
            
            sizeArray[i] = Math.random() * 0.1 + 0.05;
        }
        
        particles.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        particles.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
        particles.setAttribute('size', new THREE.BufferAttribute(sizeArray, 1));
        
        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                color: { value: new THREE.Color(0x00ffff) }
            },
            vertexShader: `
                attribute float size;
                attribute vec3 color;
                varying vec3 vColor;
                void main() {
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                void main() {
                    float distance = length(gl_PointCoord - vec2(0.5));
                    if (distance > 0.5) discard;
                    gl_FragColor = vec4(vColor, 1.0);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending
        });
        
        const particleSystemMesh = new THREE.Points(particles, particleMaterial);
        scene.add(particleSystemMesh);
        
        // Create bloom effect with custom shader
        const bloomPass = {
            uniforms: {
                tDiffuse: { value: null },
                time: { value: 0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float time;
                varying vec2 vUv;
                
                void main() {
                    vec2 uv = vUv;
                    vec4 color = texture2D(tDiffuse, uv);
                    
                    // Add pulsing glow effect
                    float pulse = sin(time * 2.0) * 0.5 + 0.5;
                    color.rgb += color.rgb * pulse * 0.3;
                    
                    // Add radial distortion
                    vec2 center = vec2(0.5, 0.5);
                    vec2 dist = uv - center;
                    float distVal = length(dist);
                    float distortion = sin(distVal * 10.0 + time) * 0.02;
                    uv += dist * distortion;
                    
                    // Add color shift
                    color.r += sin(time * 0.5) * 0.1;
                    color.g += cos(time * 0.3) * 0.1;
                    color.b += sin(time * 0.7) * 0.1;
                    
                    gl_FragColor = color;
                }
            `
        };
        
        const bloomMaterial = new THREE.ShaderMaterial(bloomPass);
        const bloomPassMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(2, 2),
            bloomMaterial
        );
        scene.add(bloomPassMesh);
        
        // Add ambient light
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);
        
        // Add directional lights for highlights
        const directionalLight1 = new THREE.DirectionalLight(0x00ffff, 1);
        directionalLight1.position.set(1, 1, 1);
        scene.add(directionalLight1);
        
        const directionalLight2 = new THREE.DirectionalLight(0xff00ff, 1);
        directionalLight2.position.set(-1, -1, -1);
        scene.add(directionalLight2);
        
        // Animation loop
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            const delta = clock.getDelta();
            
            // Rotate entire scene
            scene.rotation.x = time * 0.1;
            scene.rotation.y = time * 0.05;
            
            // Animate neurons
            neurons.forEach(neuron => {
                neuron.scale.x = 0.8 + Math.sin(time + neuron.position.x) * 0.2;
                neuron.scale.y = 0.8 + Math.sin(time + neuron.position.y) * 0.2;
                neuron.scale.z = 0.8 + Math.sin(time + neuron.position.z) * 0.2;
                
                neuron.material.color.setHSL(
                    (time * 0.1 + neuron.position.x) % 1,
                    0.8,
                    0.5
                );
            });
            
            // Animate connections
            connections.forEach(connection => {
                const positions = connection.geometry.attributes.position.array;
                positions[0] = neurons[Math.floor(Math.random() * neurons.length)].position.x;
                positions[1] = neurons[Math.floor(Math.random() * neurons.length)].position.y;
                positions[2] = neurons[Math.floor(Math.random() * neurons.length)].position.z;
                connection.geometry.attributes.position.needsUpdate = true;
            });
            
            // Animate particles
            const positions = particles.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] += Math.sin(time + i) * 0.01;
                positions[i * 3 + 1] += Math.cos(time + i) * 0.01;
                positions[i * 3 + 2] += Math.sin(time * 0.5 + i) * 0.01;
            }
            particles.attributes.position.needsUpdate = true;
            
            // Update particle material
            particleMaterial.uniforms.time.value = time;
            bloomMaterial.uniforms.time.value = time;
            
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
    </script>
</body>
</html>
