<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shader Bars</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const uniforms = {
            uTime: { value: 0 }
        };

        const material = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                precision highp float;
                uniform float uTime;
                varying vec2 vUv;

                void main() {
                    // Dark background base
                    vec3 bgColor = vec3(0.02, 0.02, 0.05);
                    vec3 finalColor = bgColor;
                    
                    float phase = 1.2;
                    int numBars = 8;

                    for (int i = 0; i < 8; i++) {
                        float fi = float(i);
                        // Vertical position logic: sin(time + i*phase)*0.4 + 0.5
                        float yPos = sin(uTime * 1.2 + fi * phase) * 0.4 + 0.5;
                        
                        // Smoothstep falloff in Y around center
                        // dist is distance from current pixel to bar center
                        float dist = abs(vUv.y - yPos);
                        float thickness = 0.12;
                        float mask = smoothstep(thickness, 0.0, dist);

                        // Color Palette: Blue -> Red -> Gold
                        vec3 colorBlue  = vec3(0.0, 0.4, 1.0);
                        vec3 colorRed   = vec3(1.0, 0.1, 0.2);
                        vec3 colorGold  = vec3(1.0, 0.8, 0.2);
                        
                        vec3 barColor;
                        if (fi < 3.0) {
                            barColor = mix(colorBlue, colorRed, fi / 3.0);
                        } else if (fi < 6.0) {
                            barColor = mix(colorRed, colorGold, (fi - 3.0) / 3.0);
                        } else {
                            barColor = colorGold;
                        }

                        // Highlight -> Shadow gradient within the bar itself (Y-axis)
                        // Center of bar is brightest, edges are darker
                        float highlight = smoothstep(thickness, 0.0, dist * 1.5);
                        
                        finalColor += barColor * mask * (0.6 + 0.4 * highlight);
                    }

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        function animate(time) {
            uniforms.uTime.value = time * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
