<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pulse - Demoscene Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            color: #0f0;
        }
        canvas {
            display: block;
        }
        .header {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            font-size: 24px;
            text-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
            letter-spacing: 3px;
        }
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            font-size: 14px;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
        }
    </style>
</head>
<body>
    <div class="header">NEON PULSE DEMOSCENE EXPERIENCE</div>
    <div class="instructions">MOVE MOUSE TO DISTORT SPACE | SCROLL TO CHANE SPEED</div>
    <script>
        // Main Three.js variables
        let scene, camera, renderer;
        let particles, particleSystem;
        let geometry, material;
        let mouseX = 0, mouseY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;
        let time = 0;
        
        // Initialize the scene
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000011);
            scene.fog = new THREE.FogExp2(0x000011, 0.001);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.z = 1000;
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);
            
            // Create particles
            createParticles();
            
            // Add event listeners
            document.addEventListener('mousemove', onDocumentMouseMove);
            document.addEventListener('wheel', onDocumentMouseWheel);
            window.addEventListener('resize', onWindowResize);
            
            // Start animation
            animate();
        }
        
        function createParticles() {
            // Create particle geometry
            geometry = new THREE.BufferGeometry();
            const vertices = [];
            const colors = [];
            const sizes = [];
            
            const colorPalette = [
                new THREE.Color(0x00ff00),
                new THREE.Color(0xff00ff),
                new THREE.Color(0x00ffff),
                new THREE.Color(0xffff00),
                new THREE.Color(0xff0000)
            ];
            
            for (let i = 0; i < 5000; i++) {
                const x = Math.random() * 2000 - 1000;
                const y = Math.random() * 2000 - 1000;
                const z = Math.random() * 2000 - 1000;
                
                vertices.push(x, y, z);
                
                // Assign random color from palette
                const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                colors.push(color.r, color.g, color.b);
                
                sizes.push(Math.random() * 20 + 5);
            }
            
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            
            // Create particle material
            material = new THREE.PointsMaterial({
                size: 5,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            
            // Create particle system
            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }
        
        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - windowHalfX) * 2;
            mouseY = (event.clientY - windowHalfY) * 2;
        }
        
        function onDocumentMouseWheel(event) {
            camera.position.z += event.deltaY * 0.1;
            camera.position.z = Math.max(500, Math.min(2000, camera.position.z));
        }
        
        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.01;
            
            // Update particles
            const positions = particleSystem.geometry.attributes.position.array;
            const colors = particleSystem.geometry.attributes.color.array;
            
            for (let i = 0; i < positions.length; i += 3) {
                // Apply noise-based movement
                positions[i] += Math.sin(time + positions[i]) * 2;
                positions[i+1] += Math.cos(time + positions[i+1]) * 2;
                positions[i+2] += Math.sin(time*0.5 + positions[i+2]) * 2;
                
                // Apply mouse distortion
                const dx = positions[i] - mouseX;
                const dy = positions[i+1] - mouseY;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance < 300) {
                    const force = (300 - distance) / 300 * 50;
                    positions[i] += dx/distance * force;
                    positions[i+1] += dy/distance * force;
                }
                
                // Color cycling
                const colorIndex = i / 3;
                colors[colorIndex*3] = (Math.sin(time + colorIndex) + 1) / 2;
                colors[colorIndex*3+1] = (Math.cos(time + colorIndex) + 1) / 2;
                colors[colorIndex*3+2] = (Math.sin(time*0.7 + colorIndex) + 1) / 2;
            }
            
            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.geometry.attributes.color.needsUpdate = true;
            
            // Rotate camera slightly
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            
            renderer.render(scene, camera);
        }
        
        // Start everything
        init();
    </script>
</body>
</html>
