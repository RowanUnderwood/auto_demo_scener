<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Icosahedron</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.150.0';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.IcosahedronGeometry(2, 1);
    const edges = new THREE.EdgesGeometry(geometry);
    const neonColor = 0x00ff88;

    // Main Wireframe
    const mainMaterial = new THREE.LineBasicMaterial({ color: neonColor });
    const mainWireframe = new THREE.LineSegments(edges, mainMaterial);

    // Glow Hint Wireframe
    const glowMaterial = new THREE.LineBasicMaterial({ 
        color: neonColor, 
        transparent: true, 
        opacity: 0.3 
    });
    const glowWireframe = new THREE.LineSegments(edges, glowMaterial);
    glowWireframe.scale.set(1.05, 1.05, 1.05);

    // Group to rotate both together
    const group = new THREE.Group();
    group.add(mainWireframe);
    group.add(glowWireframe);
    scene.add(group);

    function animate() {
        requestAnimationFrame(animate);

        group.rotation.x += 0.005;
        group.rotation.y += 0.008;

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
