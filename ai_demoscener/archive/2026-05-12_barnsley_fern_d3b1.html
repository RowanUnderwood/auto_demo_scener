<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barnsley Fern IFS</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    // Setup Scene
    const scene = new THREE.Scene();
    const aspect = window.innerWidth / window.innerHeight;
    const d = 6; 
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 1000);
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Constants for IFS
    const NUM_POINTS = 100000; // Increased density
    const posArray = new Float32Array(NUM_POINTS * 3);

    // Pre-calculate the Barnsley Fern once on CPU to prevent performance hang
    function generateFern() {
        let x = 0, y = 0;
        for (let i = 0; i < NUM_POINTS; i++) {
            const r = Math.random();
            if (r < 0.01) {
                x = 0;
                y = 0.16 * y;
            } else if (r < 0.86) {
                const nextX = 0.85 * x + 0.04 * y;
                const nextY = -0.04 * x + 0.85 * y + 1.6;
                x = nextX;
                y = nextY;
            } else if (r < 0.93) {
                const nextX = 0.2 * x - 0.26 * y;
                const nextY = 0.23 * x + 0.22 * y + 1.6;
                x = nextX;
                y = nextY;
            } else {
                const nextX = -0.15 * x + 0.28 * y;
                const nextY = 0.26 * x + 0.24 * y + 0.4;
                x = nextX;
                y = nextY;
            }

            const idx = i * 3;
            posArray[idx] = x;
            // Center the fern: original y is [0, 10], so shift by -5 to get [-5, 5]
            posArray[idx + 1] = y - 5.0;
            posArray[idx + 2] = 0;
        }
    }

    generateFern();

    const material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 }
        },
        vertexShader: `
            varying vec3 vPos;
            uniform float uTime;
            void main() {
                vPos = position;
                vec3 pos = position;
                
                // Animate sway based on height (position.y)
                // Base is at y = -5, Tip is at y = 5
                float heightFactor = position.y + 5.0; 
                float sway = sin(uTime * 1.2 + position.y * 0.3) * (heightFactor * 0.06);
                pos.x += sway;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_PointSize = 2.5;
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            varying vec3 vPos;
            void main() {
                float dist = length(gl_PointCoord - vec2(0.5));
                if (dist > 0.5) discard;
                
                // Base Green
                vec3 color = vec3(0.1, 0.8, 0.3);
                
                // Color shift based on position for depth/variety
                color.r += vPos.x * 0.02;
                color.g += (vPos.y + 5.0) * 0.03;
                color.b += 0.1;
                
                float alpha = 1.0 - smoothstep(0.3, 0.5, dist);
                gl_FragColor = vec4(color, alpha);
            }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const points = new THREE.Points(geometry, material);
    scene.add(points);

    function animate(time) {
        const t = time * 0.001;
        requestAnimationFrame(animate);

        material.uniforms.uTime.value = t;
        
        // Gentle rotation for a bit of 3D feel
        points.rotation.y = Math.sin(t * 0.2) * 0.05;

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        const aspect = window.innerWidth / window.innerHeight;
        camera.left = -d * aspect;
        camera.right = d * aspect;
        camera.top = d;
        camera.bottom = -d;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(animate);
</script>
</body>
</html>
