<!DOCTYPE html>
<html>
<head>
    <title>Star Wars Text Crawl</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        canvas { display: block; }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script type="text/javascript">
    let scene, camera, renderer;
    let textPlane, material;
    const SCROLL_SPEED = 0.05;
    let scrollOffset = 0;

    // The Demoscene Manifesto Content
    const MANIFESTO_CONTENT = `THE GLOW OF THE MACHINE: A DEMOSCENE CREATIVE MANIFESTO

In the flickering shadows of late nights and caffeine jitters, a new form of divinity emerges—the code. We are the digital alchemists, transmuting logic into luminous spectacle. The demoscene is not merely a showcase of technical prowess; it is a shared act of creation, where bytes become beauty.

We dream in 1s and 0s, building worlds that defy physics, crafting narratives with pure computational elegance. Creativity here is the ultimate compiler—taking the chaotic potential of an idea and optimizing it into undeniable visual impact. Code is not a constraint; it is our canvas, our brush, and our orchestra conductor all at once.

Machines are dreaming alongside us. They process, they iterate, they render the impossible geometries that leap from our screens. When a perfect loop finally snaps into place, when those pixels ignite into glorious color, there is an electric joy—a primal satisfaction in making something glow against the void.

Let the machines dance. Let the vectors sing. Embrace the glitch, celebrate the overflow. For in this intersection of art and algorithm lies the purest form of digital magic. Make it shine.`;

    function init() {
        // 1. Setup Scene and Camera
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 2;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Create Text Canvas Texture
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set dimensions for the texture (must be large enough to hold content)
        canvas.width = 1024;
        canvas.height = 512;

        ctx.fillStyle = '#FFFFFF'; // Text color
        ctx.font = 'Bold 36px monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        
        // Simple text wrapping simulation (Crude but effective for this scale)
        const lines = MANIFESTO_CONTENT.split('\n');
        let currentY = 10; // Padding from top

        lines.forEach(line => {
            if (line.trim() === '') return;
            // Simple word wrap approximation: if the line is too long, break it.
            const words = line.split(' ');
            let currentLine = '';
            for (let i = 0; i < words.length; i++) {
                const testLine = currentLine + (currentLine ? ' ' : '') + words[i];
                // Rough character count check for wrapping
                if (testLine.length > canvas.width / 15) { 
                    ctx.fillText(currentLine, 20, currentY);
                    currentLine = words[i];
                    currentY += 38; // Line height + padding
                } else {
                    currentLine = testLine;
                }
            }
            // Draw the last line of the segment
            ctx.fillText(currentLine, 20, currentY);
            currentY += 38;
        });

        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping; // Crucial for scrolling
        texture.repeat.set(1, 1); // Initial repeat setting
        texture.needsUpdate = true;


        // 3. Create the Plane Geometry (Long and Tilted)
        const planeWidth = 20;
        const planeHeight = 60; // Very tall to allow for long scroll duration
        const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight);

        material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
        textPlane = new THREE.Mesh(geometry, material);

        // Tilt 45 degrees on X axis (making it look like a scroll passing by)
        textPlane.rotation.x = -Math.PI / 4;
        
        // Position it slightly down the Z axis to give depth perception
        textPlane.position.z = -10; 

        scene.add(textPlane);


        // 4. Fade-to-Black Overlay Setup (using a simple plane that covers the top view)
        const fadeGeometry = new THREE.PlaneGeometry(window.innerWidth, window.innerHeight * 0.25); // Only cover the top quarter
        // Use transparent black color with low opacity
        const fadeMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x000000, 
            transparent: true, 
            opacity: 0.8 
        });
        const fadeOverlay = new THREE.Mesh(fadeGeometry, fadeMaterial);
        fadeOverlay.position.z = -1; // Position slightly in front of the text plane for blending
        scene.add(fadeOverlay);


        // Handle window resizing
        window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);

        // Update scroll offset (UV coordinate Y)
        scrollOffset += SCROLL_SPEED * 0.1; 

        // Apply the new UV offset to the texture map
        material.map.offset.y = scrollOffset;

        renderer.render(scene, camera);
    }

    init();
    animate();

</script>
</body>
</html>
