<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Frequency Visualizer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
    const BAR_COUNT = 64;
    const BAR_SPACING = 0.55;
    const BAR_WIDTH = 0.35;
    const BAR_DEPTH = 0.35;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 6, 14);
    camera.lookAt(0, 3, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Create glow texture
    function createGlowTexture() {
        const size = 128;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.15, 'rgba(255,255,255,0.6)');
        gradient.addColorStop(0.4, 'rgba(255,255,255,0.15)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);
        const texture = new THREE.CanvasTexture(canvas);
        return texture;
    }

    const glowTexture = createGlowTexture();

    // Bar parameters: 4 sine waves each with frequency and phase multiplier
    const waves = [
        { freq: 0.7,  phase: 0.025 },
        { freq: 1.3,  phase: 0.041 },
        { freq: 2.1,  phase: 0.067 },
        { freq: 3.7,  phase: 0.011 }
    ];

    const bars = [];
    const barGroup = new THREE.Group();
    scene.add(barGroup);

    const offset = (BAR_COUNT * BAR_SPACING) / 2 - BAR_SPACING / 2;

    for (let i = 0; i < BAR_COUNT; i++) {
        const t = i / (BAR_COUNT - 1);
        const hue = t * 0.8; // 0 = red, 0.8 = violet
        const color = new THREE.Color().setHSL(hue, 1.0, 0.55);

        const geometry = new THREE.BoxGeometry(BAR_WIDTH, 1, BAR_DEPTH);
        geometry.translate(0, 0.5, 0); // pivot at bottom

        const material = new THREE.MeshStandardMaterial({
            color: color,
            emissive: color,
            emissiveIntensity: 0.6,
            roughness: 0.2,
            metalness: 0.8
        });

        const bar = new THREE.Mesh(geometry, material);
        const x = i * BAR_SPACING - offset;
        bar.position.set(x, 0, 0);
        bar.scale.y = 0.01;
        barGroup.add(bar);

        // Glow sprite behind bar
        const spriteMaterial = new THREE.SpriteMaterial({
            map: glowTexture,
            color: color,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.position.set(x, 0, -0.15);
        sprite.scale.set(1.5, 8, 1);
        barGroup.add(sprite);

        // Secondary wider, dimmer glow
        const sprite2Material = new THREE.SpriteMaterial({
            map: glowTexture,
            color: color,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const sprite2 = new THREE.Sprite(sprite2Material);
        sprite2.position.set(x, 0, -0.3);
        sprite2.scale.set(2.5, 10, 1);
        barGroup.add(sprite2);

        bars.push({
            mesh: bar,
            sprite: sprite,
            sprite2: sprite2,
            material: material,
            spriteMaterial: spriteMaterial,
            sprite2Material: sprite2Material,
            index: i
        });
    }

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x111111);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffffff, 0.5, 50);
    pointLight.position.set(0, 10, 8);
    scene.add(pointLight);

    // Floor reflection plane
    const floorGeo = new THREE.PlaneGeometry(60, 20);
    const floorMat = new THREE.MeshStandardMaterial({
        color: 0x000000,
        roughness: 0.15,
        metalness: 0.9,
        transparent: true,
        opacity: 0.5
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.01;
    scene.add(floor);

    // Animation
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        const elapsed = clock.getElapsedTime();

        for (let i = 0; i < BAR_COUNT; i++) {
            const b = bars[i];

            // Calculate height from sum of 4 sine waves
            let sum = 0;
            for (let w = 0; w < waves.length; w++) {
                sum += Math.sin(elapsed * waves[w].freq * Math.PI * 2 + b.index * waves[w].phase * Math.PI * 2);
            }
            const raw = Math.abs(sum) / waves.length;

            // Apply some shaping for more dynamic look
            let height = Math.pow(raw, 0.7);
            height = THREE.MathUtils.clamp(height, 0.02, 1.0);

            // Add some envelope variation over time for each bar
            const envelope = 0.7 + 0.3 * Math.sin(elapsed * 0.3 + b.index * 0.15);
            height *= envelope;

            // Smooth interpolation
            const targetScale = height * 7;
            b.mesh.scale.y += (targetScale - b.mesh.scale.y) * 0.15;

            // Update sprites to match bar height
            const spriteHeight = b.mesh.scale.y + 1.5;
            b.sprite.scale.y = spriteHeight;
            b.sprite.position.y = b.mesh.scale.y * 0.35;
            b.sprite2.scale.y = spriteHeight + 2;
            b.sprite2.position.y = b.mesh.scale.y * 0.3;

            // Pulse glow intensity with bar height
            b.spriteMaterial.opacity = 0.3 + height * 0.6;
            b.sprite2Material.opacity = 0.1 + height * 0.25;

            // Pulse emissive intensity
            b.material.emissiveIntensity = 0.4 + height * 0.8;
        }

        // Subtle camera sway
        camera.position.x = Math.sin(elapsed * 0.15) * 0.8;
        camera.position.y = 6 + Math.sin(elapsed * 0.1) * 0.3;
        camera.lookAt(0, 2.5, 0);

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
})();
</script>
</body>
</html>
