<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry Shader</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.PlaneGeometry(2, 2);
    const uniforms = {
        uTime: { value: 0 },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    const material = new THREE.ShaderMaterial({
        uniforms: uniforms,
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime;
            uniform vec2 uResolution;
            varying vec2 vUv;

            #define PI 3.14159265359

            void main() {
                // Center UVs and normalize aspect ratio
                vec2 uv = (gl_FragCoord.xy * 2.0 - uResolution.xy) / min(uResolution.y, uResolution.x);
                
                // Convert to Polar
                float r = length(uv);
                float a = atan(uv.y, uv.x);

                // Symmetry folding: N=8
                // Formula: a = abs(mod(a, 2*PI/N) - PI/N)
                float N = 8.0;
                float sector = (2.0 * PI) / N;
                a = abs(mod(a, sector) - (sector * 0.5));

                // Convert back to Cartesian for pattern sampling
                vec2 p = vec2(cos(a), sin(a)) * r;

                // Colorful procedural pattern: sums of sin(p*freq + time)
                vec3 color = vec3(0.0);
                float freq = 4.0;
                
                color.r = sin(p.x * freq + uTime) * 0.5 + 0.5;
                color.g = sin(p.y * freq + uTime * 1.2) * 0.5 + 0.5;
                color.b = sin((p.x + p.y) * freq * 0.5 + uTime * 0.8) * 0.5 + 0.5;

                // Add some depth/contrast
                color *= smoothstep(1.2, 0.0, r); // Vignette-like fade
                
                gl_FragColor = vec4(color, 1.0);
            }
        `
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    function animate(time) {
        uniforms.uTime.value = time * 0.001;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height);
        uniforms.uResolution.value.set(width, height);
    });

    requestAnimationFrame(animate);
</script>
</body>
</html>
