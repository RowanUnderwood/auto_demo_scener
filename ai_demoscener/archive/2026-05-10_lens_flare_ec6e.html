<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js Sprite Projection Effect</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Central Torus Knot
    const geometry = new THREE.TorusKnotGeometry(1, 0.3, 128, 32);
    const material = new THREE.MeshNormalMaterial();
    const torusKnot = new THREE.Mesh(geometry, material);
    scene.add(torusKnot);

    // Create a soft circular texture for sprites via Canvas
    function createCircleTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.8)');
        gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.3)');
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        const texture = new THREE.CanvasTexture(canvas);
        return texture;
    }

    const spriteTexture = createCircleTexture();

    // Main Bright Sprite
    const mainSpriteMat = new THREE.SpriteMaterial({
        map: spriteTexture,
        color: 0xffffff,
        transparent: true,
        blending: THREE.AdditiveBlending
    });
    const mainSprite = new THREE.Sprite(mainSpriteMat);
    mainSprite.scale.set(0.8, 0.8, 1);
    scene.add(mainSprite);

    // 6 smaller sprites
    const smallSprites = [];
    const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff];
    for (let i = 0; i < 6; i++) {
        const mat = new THREE.SpriteMaterial({
            map: spriteTexture,
            color: colors[i],
            transparent: true,
            blending: THREE.AdditiveBlending
        });
        const s = new THREE.Sprite(mat);
        const scaleVal = 0.1 + (Math.random() * 0.2);
        s.scale.set(scaleVal, scaleVal, 1);
        scene.add(s);
        smallSprites.push(s);
    }

    // Target point for projection logic
    const targetPoint = new THREE.Vector3();
    const screenPos = new THREE.Vector3();
    const centerNDC = new THREE.Vector2(0, 0); // Screen Center in NDC

    function animate() {
        requestAnimationFrame(animate);

        torusKnot.rotation.x += 0.01;
        torusKnot.rotation.y += 0.015;

        // Pick a point on the torus knot to track (using time for movement)
        const time = Date.now() * 0.002;
        targetPoint.set(
            Math.sin(time) * 1.5,
            Math.cos(time * 0.8) * 1.5,
            Math.sin(time * 0.5) * 1.5
        );

        // Project target point to screen space (NDC)
        targetPoint.project(camera);
        
        // Main Sprite position in world space is tricky when "at a position projected to screen" 
        // interpreted as the sprite following the visual location of an object.
        // We place the main sprite at the target point in world space for visibility, 
        // but we need it to look like it's part of the projection effect.
        // Let's position the sprites so they align visually from the projected screen coordinate back to center.
        
        // Actually, let's place main sprite at a fixed depth or following target
        mainSprite.position.copy(targetPoint).unproject(camera);
        // Note: unprojecting gives world pos. To keep it visible, we ensure it stays near the object.

        // We want 6 sprites along the line from projected position to screen center.
        // The "line" in 3D space is a ray from camera through target point? 
        // Or simply interpolation in screen/NDC space for visual effect.
        
        for (let i = 0; i < 6; i++) {
            // Interpolate between the projected target and center (0,0) in NDC
            const t = (i + 1) / 7;
            const ndcX = targetPoint.x * t;
            const ndcY = targetPoint.y * t;

            // Convert back to world space at a specific depth (e.g., near the knot/camera range)
            const pos = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(camera);
            smallSprites[i].position.copy(pos);
        }

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
