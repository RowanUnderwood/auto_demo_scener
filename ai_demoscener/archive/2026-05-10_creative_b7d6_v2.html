<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONOLITHIC SINGULARITY</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        canvas { display: block; }
        #overlay { 
            position: absolute; top: 30px; left: 30px; color: rgba(255,255,255,0.6); 
            pointer-events: none; font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
            border-left: 1px solid rgba(255,255,255,0.3); padding-left: 15px;
        }
    </style>
</head>
<body>
    <div id="overlay">Event Horizon<br>Temporal Displacement: Active<br>Coordinate: [X: 0.00 Y: 0.00 Z: -∞]</div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        /**
         * CONCEPT: "MONOLITHIC SINGULARITY"
         * Instead of a wireframe, we use an abstract geometric core that warps space.
         * The particles flow in an accretion disk pattern rather than a linear drift,
         * using a custom shader-like approach for iridescent colors and gravitational pull.
         */

        let scene, camera, renderer, clock;
        let coreGroup, particleSystem, rings = [];
        const PARTICLE_COUNT = 40000;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050508, 0.1);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // --- The Core (The Singularity) ---
            coreGroup = new THREE.Group();
            const coreGeo = new THREE.IcosahedronGeometry(1, 0);
            const coreMat = new THREE.MeshPhongMaterial({ 
                color: 0x000000, 
                emissive: 0x111122, 
                shininess: 100, 
                flatShading: true 
            });
            const core = new THREE.Mesh(coreGeo, coreMat);
            coreGroup.add(core);

            // Add a "glitch" outer shell to the core
            const shellGeo = new THREE.IcosahedronGeometry(1.2, 1);
            const shellMat = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, 
                wireframe: true, 
                transparent: true, 
                opacity: 0.1 
            });
            const shell = new THREE.Mesh(shellGeo, shellMat);
            coreGroup.add(shell);

            scene.add(coreGroup);

            // Lights for the core
            const pLight = new THREE.PointLight(0x4433ff, 2, 10);
            pLight.position.set(0, 0, 0);
            scene.add(pLight);
            scene.add(new THREE.AmbientLight(0x111111));

            // --- The Accretion Disk (Particles) ---
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            const sizes = new Float32Array(PARTICLE_COUNT);
            const data = []; // Store individual particle metadata

            const colorPalette = [
                new THREE.Color(0x44aaff), // Cyan
                new THREE.Color(0xff44aa), // Magenta
                new THREE.Color(0xaa44ff), // Purple
                new THREE.Color(0xffffff)  // White
            ];

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const theta = Math.random() * Math.PI * 2;
                const radius = 2 + Math.random() * 15;
                const phi = (Math.random() - 0.5) * 0.4; // Flattened disk

                pos[i * 3] = Math.cos(theta) * radius;
                pos[i * 3 + 1] = Math.sin(phi) * radius;
                pos[i * 3 + 2] = Math.sin(theta) * radius;

                const col = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                colors[i * 3] = col.r;
                colors[i * 3 + 1] = col.g;
                colors[i * 3 + 2] = col.b;

                sizes[i] = Math.random() * 0.05;

                data.push({
                    angle: theta,
                    dist: radius,
                    speed: 0.01 + Math.random() * 0.02,
                    phase: Math.random() * Math.PI * 2
                });
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const mat = new THREE.PointsMaterial({
                size: 0.04,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });

            particleSystem = new THREE.Points(geo, mat);
            particleSystem.userData = { particleData: data };
            scene.add(particleSystem);

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // Animate Core
            coreGroup.rotation.x += 0.01;
            coreGroup.rotation.y += 0.015;
            const scale = 1 + Math.sin(t * 2) * 0.1;
            coreGroup.scale.set(scale, scale, scale);

            // Animate Accretion Disk
            const positions = particleSystem.geometry.attributes.position.array;
            const data = particleSystem.userData.particleData;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const p = data[i];
                p.angle += p.speed;
                
                // Gravitational "breathing" effect on radius
                const currentRadius = p.dist + Math.sin(t * 0.5 + p.phase) * 0.5;
                
                positions[i * 3] = Math.cos(p.angle) * currentRadius;
                positions[i * 3 + 1] = Math.sin(p.angle * 0.5 + t * 0.2) * (currentRadius * 0.2);
                positions[i * 3 + 2] = Math.sin(p.angle) * currentRadius;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            // Cinematic Camera Motion
            camera.position.x = Math.sin(t * 0.3) * 10;
            camera.position.z = Math.cos(t * 0.3) * 10;
            camera.position.y = 2 + Math.sin(t * 0.5) * 2;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
