<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hyperbolic Garden</title>
<style>
* { margin: 0; padding: 0; }
body { overflow: hidden; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.008);
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const PARTICLE_COUNT = 80000;
const positions = new Float32Array(PARTICLE_COUNT * 3);
const aSpeed = new Float32Array(PARTICLE_COUNT);
const aOffset = new Float32Array(PARTICLE_COUNT);
const aLayer = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
    const theta = Math.random() * Math.PI * 2;
    const y = (Math.random() - 0.5) * 30;
    const r = 8 + Math.abs(y) * 0.4 + Math.random() * 2;
    positions[i * 3] = r * Math.cos(theta);
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = r * Math.sin(theta);
    aSpeed[i] = 0.3 + Math.random() * 0.7;
    aOffset[i] = Math.random() * 100.0;
    aLayer[i] = Math.floor(Math.random() * 3);
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('aSpeed', new THREE.BufferAttribute(aSpeed, 1));
geometry.setAttribute('aOffset', new THREE.BufferAttribute(aOffset, 1));
geometry.setAttribute('aLayer', new THREE.BufferAttribute(aLayer, 1));

const vertexShader = `
attribute float aSpeed;
attribute float aOffset;
attribute float aLayer;
uniform float uTime;
varying vec3 vColor;
varying float vAlpha;

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v) {
    const vec2 C = vec2(1.0/6.0, 1.0/3.0);
    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
    vec3 i = floor(v + dot(v, C.yyy));
    vec3 x0 = v - i + dot(i, C.xxx);
    vec3 g = step(x0.yzx, x0.xyz);
    vec3 l = 1.0 - g;
    vec3 i1 = min(g.xyz, l.zxy);
    vec3 i2 = max(g.xyz, l.zxy);
    vec3 x1 = x0 - i1 + C.xxx;
    vec3 x2 = x0 - i2 + C.yyy;
    vec3 x3 = x0 - D.yyy;
    i = mod289(i);
    vec4 p = permute(permute(permute(
        i.z + vec4(0.0, i1.z, i2.z, 1.0))
        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
        + i.x + vec4(0.0, i1.x, i2.x, 1.0));
    float n_ = 0.142857142857;
    vec3 ns = n_ * D.wyz - D.xzx;
    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
    vec4 x_ = floor(j * ns.z);
    vec4 y_ = floor(j - 7.0 * x_);
    vec4 x = x_ * ns.x + ns.yyyy;
    vec4 y = y_ * ns.x + ns.yyyy;
    vec4 h = 1.0 - abs(x) - abs(y);
    vec4 b0 = vec4(x.xy, y.xy);
    vec4 b1 = vec4(x.zw, y.zw);
    vec4 s0 = floor(b0)*2.0 + 1.0;
    vec4 s1 = floor(b1)*2.0 + 1.0;
    vec4 sh = -step(h, vec4(0.0));
    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
    vec3 p0 = vec3(a0.xy, h.x);
    vec3 p1 = vec3(a0.zw, h.y);
    vec3 p2 = vec3(a1.xy, h.z);
    vec3 p3 = vec3(a1.zw, h.w);
    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
    m = m * m;
    return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}

vec3 hsv2rgb(vec3 c) {
    vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
    vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
    return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

void main() {
    float t = uTime * 0.4;
    vec3 pos = position;

    float layerPhase = aLayer * 2.094;
    float breathe = sin(t * aSpeed + aOffset + layerPhase) * 3.0;
    float n1 = snoise(pos * 0.08 + vec3(0.0, t * 0.3, 0.0)) * 5.0;
    float n2 = snoise(pos * 0.15 + vec3(t * 0.2, 0.0, t * 0.1)) * 2.5;

    float radial = length(pos.xz);
    float newRadial = radial + breathe + n1 + n2;
    float angle = atan(pos.z, pos.x);
    float twist = t * 0.15 * aSpeed + snoise(vec3(0.0, pos.y * 0.1, 0.0) + t * 0.1) * 0.5;
    angle += twist;

    pos.x = newRadial * cos(angle);
    pos.z = newRadial * sin(angle);
    pos.y += n2 * 0.5 + sin(t + aOffset) * 1.0;

    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
    gl_Position = projectionMatrix * mvPosition;

    float dist = -mvPosition.z;
    gl_PointSize = max(1.5, 22.0 / max(dist, 1.0)) * (1.0 + n1 * 0.1);

    float hue = fract(aLayer * 0.33 + t * 0.05 + n1 * 0.05 + pos.y * 0.02);
    float sat = 0.7 + n2 * 0.1;
    float val = 0.6 + breathe * 0.05 + n1 * 0.08;
    sat = clamp(sat, 0.0, 1.0);
    val = clamp(val, 0.3, 1.0);

    vColor = hsv2rgb(vec3(hue, sat, val));

    vAlpha = smoothstep(80.0, 20.0, dist) * 0.9;
}
`;

const fragmentShader = `
varying vec3 vColor;
varying float vAlpha;
void main() {
    float d = length(gl_PointCoord - 0.5);
    if (d > 0.5) discard;
    float glow = 1.0 - smoothstep(0.0, 0.5, d);
    glow = pow(glow, 2.0);
    gl_FragColor = vec4(vColor * glow, vAlpha * glow);
}
`;

const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms: { uTime: { value: 0 } },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
});

const points = new THREE.Points(geometry, material);
scene.add(points);

const CORE_COUNT = 5000;
const corePos = new Float32Array(CORE_COUNT * 3);
const coreOff = new Float32Array(CORE_COUNT);
for (let i = 0; i < CORE_COUNT; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 2 + Math.random() * 4;
    const y = (Math.random() - 0.5) * 12;
    corePos[i*3] = r * Math.cos(a);
    corePos[i*3+1] = y;
    corePos[i*3+2] = r * Math.sin(a);
    coreOff[i] = Math.random() * 100;
}
const coreGeo = new THREE.BufferGeometry();
coreGeo.setAttribute('position', new THREE.BufferAttribute(corePos, 3));
coreGeo.setAttribute('aSpeed', new THREE.BufferAttribute(new Float32Array(CORE_COUNT).fill(1.0), 1));
coreGeo.setAttribute('aOffset', new THREE.BufferAttribute(coreOff, 1));
coreGeo.setAttribute('aLayer', new THREE.BufferAttribute(new Float32Array(CORE_COUNT).fill(2.0), 1));
const coreMat = material.clone();
coreMat.uniforms.uTime = material.uniforms.uTime;
const corePoints = new THREE.Points(coreGeo, coreMat);
scene.add(corePoints);

const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    material.uniforms.uTime.value = t;

    camera.position.x = Math.sin(t * 0.1) * 25;
    camera.position.z = Math.cos(t * 0.1) * 25;
    camera.position.y = Math.sin(t * 0.05) * 8 + 5;
    camera.lookAt(0, 0, 0);

    points.rotation.y = t * 0.03;
    corePoints.rotation.y = -t * 0.05;
    corePoints.rotation.x = Math.sin(t * 0.2) * 0.1;

    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
