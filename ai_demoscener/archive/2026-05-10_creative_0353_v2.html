<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VOID CRYSTAL FRACTAL</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/**
 * CONCEPT: "VOID CRYSTAL FRACTAL"
 * A departure from the nebula aesthetic, this version focuses on sharp, 
 * crystalline geometry using heavy space folding (Mandelbox-inspired)
 * and high-contrast monochromatic/gold lighting. It feels architectural,
 * cold, and mathematically precise rather than organic.
 */

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const geometry = new THREE.PlaneGeometry(2, 2);
const uniforms = {
    u_time: { value: 0 },
    u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
};

const fragmentShader = `
    uniform float u_time;
    uniform vec2 u_resolution;

    #define MAX_STEPS 80
    #define SURF_DIST .0015
    #define MAX_DIST 30.

    mat2 rot(float a) {
        float s = sin(a), c = cos(a);
        return mat2(c, -s, s, c);
    }

    // Crystalline space folding function
    vec3 fold(vec3 p) {
        for (int i = 0; i < 5; i++) {
            p = abs(p) - vec3(0.6, 1.2, 0.8);
            if (p.x < p.y) p.xy = p.yx;
            if (p.x < p.z) p.xz = p.zx;
            if (p.y < p.z) p.yz = p.zy;
            
            p.x = p.x * 1.8 - 0.5;
            p.y *= 0.9;
            p.z *= 0.9;
            p *= rot(u_time * 0.05 + float(i) * 0.2);
        }
        return p;
    }

    float getDist(vec3 p) {
        vec3 folded = fold(p);
        // Sharp geometric primitive: Box/Octahedron hybrid
        float box = length(max(abs(folded) - 0.4, 0.0));
        float sphere = length(folded) - 0.5;
        return mix(box, sphere, 0.5);
    }

    float rayMarch(vec3 ro, vec3 rd) {
        float dO = 0.0;
        for(int i = 0; i < MAX_STEPS; i++) {
            vec3 p = ro + rd * dO;
            float dS = getDist(p);
            dO += dS;
            if(dO > MAX_DIST || abs(dS) < SURF_DIST) break;
        }
        return dO;
    }

    vec3 getNormal(vec3 p) {
        float d = getDist(p);
        vec2 e = vec2(.005, 0);
        vec3 n = d - vec3(
            getDist(p - e.xyy),
            getDist(p - e.yxy),
            getDist(p - e.yyx)
        );
        return normalize(n);
    }

    void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.y, u_resolution.x);
        
        // Cinematic camera movement: slow drift and zoom
        float t = u_time * 0.15;
        vec3 ro = vec3(sin(t)*2.5, cos(t*0.7)*1.5, -4.0 + sin(t*0.3));
        vec3 lookAt = vec3(0, 0, 0);
        
        // Manual LookAt rotation logic for ray direction
        vec3 f = normalize(lookAt - ro);
        vec3 r = normalize(cross(vec3(0,1,0), f));
        vec3 u = cross(f, r);
        vec3 rd = normalize(f + uv.x * r + uv.y * u);

        float d = rayMarch(ro, rd);
        vec3 col = vec3(0.02, 0.015, 0.03); // Deep obsidian background

        if(d < MAX_DIST) {
            vec3 p = ro + rd * d;
            vec3 n = getNormal(p);
            
            // Sharp directional lighting (high contrast)
            vec3 lightPos = vec3(2.0 * sin(u_time), 4.0, -3.0);
            vec3 l = normalize(lightPos - p);
            float diff = max(dot(n, l), 0.0);
            float spec = pow(max(dot(reflect(-l, n), -rd), 0.0), 64.0);
            float rim = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);

            // Color palette: Obsidian, Gold, and Electric Cyan
            vec3 gold = vec3(1.0, 0.85, 0.4) * diff;
            vec3 edge = vec3(0.2, 0.9, 1.0) * rim;
            vec3 ambient = vec3(0.05, 0.05, 0.1);

            col = ambient + gold + spec + edge;
            
            // Add micro-detail "glitch" lines based on normal orientation
            if (mod(p.x * p.y * p.z, 2.0) > 1.98) col += 0.5;
        }

        // Distance fog for depth perception
        col = mix(col, vec3(0.0), 1.0 - exp(-0.1 * d));
        
        // Final Post-processing: Grain and Vignette
        float vignette = smoothstep(1.5, 0.3, length(uv));
        col *= vignette;
        
        // Subtle scanline effect
        col *= 0.9 + 0.1 * sin(gl_FragCoord.y * 1.5);

        gl_FragColor = vec4(col, 1.0);
    }
`;

const material = new THREE.ShaderMaterial({
    uniforms: uniforms,
    fragmentShader: fragmentShader
});

const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

function animate(time) {
    uniforms.u_time.value = time * 0.001;
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    uniforms.u_resolution.value.set(w, h);
});

requestAnimationFrame(animate);
</script>
</body>
</html>
