<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raymarching SDF</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.150.0';

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.PlaneGeometry(2, 2);
    const uniforms = {
        u_time: { value: 0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float u_time;
            uniform vec2 u_resolution;
            varying vec2 vUv;

            float smin(float a, float b, float k) {
                float h = max(k - abs(a - b), 0.0) / k;
                return min(a, b) - h * h * k * (1.0 / 4.0);
            }

            float sdSphere(vec3 p, float s) {
                return length(p) - s;
            }

            float sdBox(vec3 p, vec3 b) {
                vec3 q = abs(p) - b;
                return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
            }

            float map(vec3 p) {
                // Infinite repetition logic requested: mod(p, 4.0) - 2.0
                vec3 q = mod(p, 4.0) - 2.0;
                
                // Dynamic movement for visual interest
                q.y += sin(u_time * 0.5 + p.x * 0.2) * 0.5;

                float sphere = sdSphere(q, 1.0);
                float box = sdBox(q, vec3(0.8, 0.8, 0.8));
                
                return smin(sphere, box, 0.6);
            }

            vec3 getNormal(vec3 p) {
                const float h = 0.001;
                const vec2 k = vec2(1, -1);
                return normalize(
                    k.xyy * map(p + k.xyy * h) +
                    k.yyx * map(p + k.yyx * h) +
                    k.yxy * map(p + k.yxy * h) +
                    k.xxx * map(p + k.xxx * h)
                );
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.y, u_resolution.x);
                
                // Ray setup
                vec3 ro = vec3(0.0, 0.0, -6.0); // Camera origin
                vec3 rd = normalize(vec3(uv, 1.5)); // Ray direction
                
                float t = 0.0;
                bool hit = false;
                int steps = 0;

                // Raymarching loop (80 steps max)
                for(int i = 0; i < 80; i++) {
                    vec3 p = ro + rd * t;
                    float d = map(p);
                    if(d < 0.001) {
                        hit = true;
                        break;
                    }
                    t += d;
                    steps = i;
                    if(t > 20.0) break;
                }

                vec3 color = vec3(0.05, 0.05, 0.1); // Background

                if(hit) {
                    vec3 p = ro + rd * t;
                    vec3 n = getNormal(p);
                    
                    // Directional Light
                    vec3 lightDir = normalize(vec3(1.0, 1.0, -1.0));
                    float diff = max(dot(n, lightDir), 0.0);
                    
                    // Base color of object
                    vec3 objCol = vec3(0.2, 0.5, 0.8) + 0.2 * n;
                    
                    // Simple shading
                    color = objCol * (diff + 0.1); // diffuse + ambient
                    
                    // Depth Fog
                    float fogDensity = 0.15;
                    float fogFactor = exp(-t * fogDensity);
                    vec3 fogColor = vec3(0.05, 0.05, 0.1);
                    color = mix(fogColor, color, fogFactor);
                } else {
                    // Background Fog
                    color = mix(vec3(0.02), color, 0.1);
                }

                gl_FragColor = vec4(color, 1.0);
            }
        `
    });

    scene.add(new THREE.Mesh(geometry, material));

    function animate(time) {
        uniforms.u_time.value = time * 0.001;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(animate);
</script>
</body>
</html>
