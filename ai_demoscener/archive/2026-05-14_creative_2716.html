<!DOCTYPE html>
<html>
<head>
    <title>Neon Chroma</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Initialize scene, camera, and renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000);
        document.body.appendChild(renderer.domElement);

        // Set camera position
        camera.position.z = 5;

        // Create ambient light
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        // Create directional light
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(1, 1, 1);
        scene.add(directionalLight);

        // Create a grid for the base
        const gridHelper = new THREE.GridHelper(10, 10);
        scene.add(gridHelper);

        // Create a neon chroma effect with particles
        const particles = [];
        const particleCount = 500;
        const particleGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleColors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            const x = (Math.random() - 0.5) * 8;
            const y = (Math.random() - 0.5) * 8;
            const z = (Math.random() - 0.5) * 8;
            particlePositions[i * 3] = x;
            particlePositions[i * 3 + 1] = y;
            particlePositions[i * 3 + 2] = z;

            const r = Math.random();
            const g = Math.random();
            const b = Math.random();
            particleColors[i * 3] = r;
            particleColors[i * 3 + 1] = g;
            particleColors[i * 3 + 2] = b;
        }

        particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.1,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        // Create a pulsing neon ring
        const ringGeometry = new THREE.RingGeometry(1, 2, 32);
        const ringMaterial = new THREE.MeshBasicMaterial({
            color: 0xff00ff,
            transparent: true,
            opacity: 0.7,
            side: THREE.DoubleSide
        });
        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.position.set(0, 0, 0);
        scene.add(ring);

        // Add a floating sphere
        const sphereGeometry = new THREE.SphereGeometry(1, 32, 32);
        const sphereMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.8
        });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(0, 2, 0);
        scene.add(sphere);

        // Add a rotating cube
        const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
        const cubeMaterial = new THREE.MeshBasicMaterial({
            color: 0x0000ff,
            transparent: true,
            opacity: 0.7
        });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.position.set(2, 0, 0);
        scene.add(cube);

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Rotate the cube
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;

            // Pulse the ring
            const pulse = Math.sin(Date.now() * 0.001) * 0.1 + 0.9;
            ring.scale.set(pulse, pulse, pulse);

            // Move the sphere
            sphere.position.y += Math.sin(Date.now() * 0.002) * 0.05;

            // Animate particles
            for (let i = 0; i < particleCount; i++) {
                const x = particlePositions[i * 3];
                const y = particlePositions[i * 3 + 1];
                const z = particlePositions[i * 3 + 2];

                // Random movement
                particlePositions[i * 3] = x + (Math.random() - 0.5) * 0.1;
                particlePositions[i * 3 + 1] = y + (Math.random() - 0.5) * 0.1;
                particlePositions[i * 3 + 2] = z + (Math.random() - 0.5) * 0.1;

                // Change color based on position
                const r = Math.sin(Date.now() * 0.001 + i * 0.01) * 0.5 + 0.5;
                const g = Math.sin(Date.now() * 0.001 + i * 0.01 + 0.5) * 0.5 + 0.5;
                const b = Math.sin(Date.now() * 0.001 + i * 0.01 + 1) * 0.5 + 0.5;
                particleColors[i * 3] = r;
                particleColors[i * 3 + 1] = g;
                particleColors[i * 3 + 2] = b;
            }

            particleGeometry.attributes.position.needsUpdate = true;
            particleGeometry.attributes.color.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
