<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Bars Shader</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const uniforms = {
            u_time: { value: 0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float u_time;
                uniform vec2 u_resolution;
                varying vec2 vUv;

                void main() {
                    vec2 uv = vUv;
                    // Background color
                    vec3 finalColor = vec3(0.02, 0.02, 0.05); 
                    
                    float phase = 1.8; // Constant phase for the wave

                    for (int i = 0; i < 8; i++) {
                        float fi = float(i);
                        // Vertical position logic: sin(time + i * phase) * 0.4 + 0.5
                        float y_pos = sin(u_time + fi * phase) * 0.4 + 0.5;
                        
                        // Distance from current fragment Y to bar center
                        float dist = abs(uv.y - y_pos);
                        
                        // Smoothstep falloff for the overall thickness/presence of the bar
                        float mask = smoothstep(0.3, 0.0, dist);

                        // Color Palette: Blue, Red, Gold
                        vec3 blue  = vec3(0.0, 0.45, 1.0);
                        vec3 red   = vec3(1.0, 0.1, 0.2);
                        vec3 gold  = vec3(1.0, 0.8, 0.1);

                        // Select color based on index i
                        vec3 baseColor;
                        int colorIdx = i % 3;
                        if (colorIdx == 0) baseColor = blue;
                        else if (colorIdx == 1) baseColor = red;
                        else baseColor = gold;

                        // highlight -> shadow gradient logic within the bar
                        // Higher intensity at the center of the bar
                        float intensity = smoothstep(0.15, 0.0, dist);
                        vec3 highlight = baseColor * 2.0; // Bright core
                        vec3 shadow    = baseColor * 0.1; // Dark edge
                        vec3 barColor  = mix(shadow, highlight, intensity);

                        // Accumulate color with mask for soft edges
                        finalColor += barColor * mask;
                    }

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        function animate(time) {
            uniforms.u_time.value = time * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            uniforms.u_resolution.value.set(w, h);
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
