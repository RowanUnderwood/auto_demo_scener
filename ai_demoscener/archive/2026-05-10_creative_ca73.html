<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON_FRACTAL_VOID</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        canvas { display: block; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: #0ff; pointer-events: none; text-shadow: 0 0 5px #0ff; font-size: 12px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div id="ui">SYSTEM_STATUS: HYPERSPACE_RESONANCE // FREQ: <span id="freq">0.0</span></div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        /**
         * CONCEPT: "NEON_FRACTAL_VOID"
         * A hybrid of Raymarched SDFs, Kaleidoscope symmetry, and Glitch Post-processing.
         * It renders a recursive, folding fractal structure that pulses with a simulated 
         * audio-reactive beat using procedural trigonometric synthesis.
         */

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const shaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                u_time: { value: 0 },
                u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                u_glitch: { value: 0.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float u_time;
                uniform vec2 u_resolution;
                uniform float u_glitch;
                varying vec2 vUv;

                #define MAX_STEPS 80
                #define SURF_DIST .001
                #define MAX_DIST 20.

                // Rotation matrix
                mat2 rot(float a) {
                    float s = sin(a), c = cos(a);
                    return mat2(c, -s, s, c);
                }

                // Smooth Minimum for organic blending
                float smin(float a, float b, float k) {
                    float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);
                    return mix(b, a, h) - k*h*(1.0-h);
                }

                // Fractal SDF: Folding space using absolute values and rotation
                float map(vec3 p) {
                    p.z += u_time * 0.5; // Move forward through the void
                    
                    // Kaleidoscope folding logic applied to 3D space
                    for(int i = 0; i < 4; i++) {
                        p = abs(p) - vec3(0.5, 1.2, 0.8);
                        p.xy *= rot(u_time * 0.2 + float(i));
                        p.yz *= rot(u_time * 0.15);
                    }

                    float sphere = length(p) - 0.6;
                    float box = length(max(abs(p) - vec3(0.4), 0.0));
                    
                    // Mix geometric primitives with a periodic sine interference pattern
                    float noise = sin(p.x*5.0 + u_time) * sin(p.y*5.0) * sin(p.z*5.0);
                    return smin(sphere, box, 0.5) + noise * 0.1;
                }

                vec3 getNormal(vec3 p) {
                    vec2 e = vec2(.01, 0);
                    float d = map(p);
                    vec3 n = d - vec3(
                        map(p-e.xyy),
                        map(p-e.yxy),
                        map(p-e.yyx)
                    );
                    return normalize(n);
                }

                void main() {
                    // Glitch effect: UV offset based on u_glitch uniform
                    vec2 uv = vUv;
                    if(u_glitch > 0.5) {
                        uv.x += sin(u_time * 100.0) * 0.02 * u_glitch;
                    }

                    vec2 aspect = vec2(u_resolution.x / u_resolution.y, 1.0);
                    vec2 p_uv = (vUv - 0.5) * aspect;
                    
                    // Raymarching setup
                    vec3 ro = vec3(0, 0, -2); // Ray Origin
                    vec3 rd = normalize(vec3(p_uv, 1.0)); // Ray Direction
                    
                    float dO = 0.0;
                    float dS;
                    vec3 p;

                    for(int i=0; i<MAX_STEPS; i++) {
                        p = ro + rd * dO;
                        dS = map(p);
                        dO += dS;
                        if(dO > MAX_DIST || abs(dS) < SURF_DIST) break;
                    }

                    vec3 color = vec3(0.0);

                    if(dO < MAX_DIST) {
                        vec3 n = getNormal(p);
                        float diff = dot(n, normalize(vec3(1, 2, -3))) * 0.5 + 0.5;
                        
                        // Color palette based on distance and normal
                        vec3 baseCol = 0.5 + 0.5 * cos(u_time * 0.5 + p.xyx + vec3(0, 2, 4));
                        color = baseCol * diff;
                        
                        // Add rim lighting/glow
                        float rim = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
                        color += rim * vec3(0.0, 1.0, 1.0) * 0.5;

                        // Fog effect
                        color = mix(color, vec3(0.0), 1.0 - exp(-0.15 * dO));
                    } else {
                        // Background stars/dust
                        float stars = pow(fract(sin(dot(p_uv, vec2(12.9898, 78.233))) * 43758.5453), 20.0);
                        color = vec3(stars) * 0.5;
                    }

                    // Post-process scanlines
                    color *= 0.9 + 0.1 * sin(vUv.y * 400.0);

                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });

        scene.add(new THREE.Mesh(geometry, shaderMaterial));

        const freqEl = document.getElementById('freq');
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            shaderMaterial.uniforms.u_time.value = time;
            shaderMaterial.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
            
            // Simulate audio reactivity with a noise-like pulse
            const pulse = Math.sin(time * 4.0) * 0.5 + 0.5;
            shaderMaterial.uniforms.u_glitch.value = (pulse > 0.85) ? (pulse - 0.85) * 10.0 : 0.0;
            
            freqEl.innerText = (pulse * 440 + 220).toFixed(2);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            shaderMaterial.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
