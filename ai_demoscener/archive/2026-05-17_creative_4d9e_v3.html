<!DOCTYPE html>
<html>
<head>
    <title>Bioluminescent Backprop</title>
    <style>
        html, body { margin: 0; overflow: hidden; height: 100%; }
        body {
            background: radial-gradient(ellipse at 50% 55%, #08181c 0%, #030b10 45%, #010407 100%);
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x02070c, 0.0075);

        const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 240);
        camera.position.set(0, 2, 42);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 0);
        document.body.appendChild(renderer.domElement);

        const TEAL = 0x00e2c4;
        const MAGENTA = 0xff2d8a;

        // Glow texture
        const glowCanvas = document.createElement('canvas');
        glowCanvas.width = 128; glowCanvas.height = 128;
        const gctx = glowCanvas.getContext('2d');
        const grad = gctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        grad.addColorStop(0, 'rgba(225,255,248,0.95)');
        grad.addColorStop(0.22, 'rgba(0,232,198,0.5)');
        grad.addColorStop(0.55, 'rgba(0,170,215,0.14)');
        grad.addColorStop(1, 'rgba(0,120,170,0)');
        gctx.fillStyle = grad;
        gctx.fillRect(0, 0, 128, 128);
        const glowTexture = new THREE.CanvasTexture(glowCanvas);

        const layers = [4, 8, 12, 16, 12, 8, 4];
        const layerSpacing = 6.5;
        const span = (layers.length - 1) * layerSpacing;
        const nodes = [];
        const connections = [];
        const pulses = [];

        const networkGroup = new THREE.Group();
        scene.add(networkGroup);

        // Nodes — sharp crystalline octahedra
        layers.forEach((count, li) => {
            const x = (li - (layers.length - 1) / 2) * layerSpacing;
            for (let i = 0; i < count; i++) {
                const spread = count * 1.5;
                const y = (i - (count - 1) / 2) * (spread / count) + (Math.random() - 0.5) * 0.5;
                const z = (Math.random() - 0.5) * 4;
                const size = 0.42 + Math.random() * 0.3;

                const geo = new THREE.OctahedronGeometry(size, 0);
                const mat = new THREE.MeshPhongMaterial({
                    color: 0x03100e,
                    emissive: TEAL,
                    emissiveIntensity: 0.5,
                    shininess: 100,
                    flatShading: true
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);

                const coreGeo = new THREE.OctahedronGeometry(size * 0.62, 0);
                const coreMat = new THREE.MeshBasicMaterial({
                    color: 0xd8fff4,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending
                });
                const core = new THREE.Mesh(coreGeo, coreMat);
                mesh.add(core);

                const spriteMat = new THREE.SpriteMaterial({
                    map: glowTexture,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                                         opacity: 0.7,
                     depthWrite: false
                 });
                 const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.setScalar(5.5 + Math.random() * 3);
                mesh.add(sprite);

                mesh.userData = {
                    baseY: y, baseZ: z, x,
                    layer: li,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.15 + Math.random() * 0.35,
                    amp: 0.25 + Math.random() * 0.35,
                    spin: (Math.random() - 0.5) * 0.6,
                    core, sprite
                };
                networkGroup.add(mesh);
                nodes.push(mesh);
            }
        });

        // Curved connections with gradient vertex colors
        const CURVE_SEG = 18;
        const tealC = new THREE.Color(TEAL);
        const magC = new THREE.Color(MAGENTA);

        let nodeOffset = 0;
        for (let l = 0; l < layers.length - 1; l++) {
            const startIdx = nodeOffset;
            const endIdx = nodeOffset + layers[l];
            const nextStart = endIdx;
            const nextEnd = endIdx + layers[l + 1];
            nodeOffset += layers[l];

            for (let i = startIdx; i < endIdx; i++) {
                const nodeA = nodes[i];
                const connectTo = 2 + Math.floor(Math.random() * 2);
                const candidates = [];
                for (let j = nextStart; j < nextEnd; j++) candidates.push(j);
                candidates.sort((a, b) => (a - b) + (Math.random() - 0.5) * 4);

                for (let c = 0; c < Math.min(connectTo, candidates.length); c++) {
                    const nodeB = nodes[candidates[c]];

                    const positions = new Float32Array((CURVE_SEG + 1) * 3);
                    const colors = new Float32Array((CURVE_SEG + 1) * 3);
                    const tmp = new THREE.Color();
                    for (let s = 0; s <= CURVE_SEG; s++) {
                        tmp.copy(tealC).lerp(magC, s / CURVE_SEG);
                        colors[s * 3] = tmp.r; colors[s * 3 + 1] = tmp.g; colors[s * 3 + 2] = tmp.b;
                    }
                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
                        vertexColors: true,
                        transparent: true,
                        opacity: 0.3,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    }));
                    networkGroup.add(line);
                    connections.push({
                        line, start: nodeA, end: nodeB,
                        midOffset: new THREE.Vector3(
                            (Math.random() - 0.5) * 2.5,
                            (Math.random() - 0.5) * 3,
                            (Math.random() - 0.5) * 5
                        ),
                        baseOpacity: 0.14 + Math.random() * 0.2,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }
        }

        // Pulses — travel mostly backwards (backprop feel)
        const pulseGeo = new THREE.OctahedronGeometry(0.2, 0);
        for (let i = 0; i < 72; i++) {
            const back = Math.random() < 0.75;
            const mat = new THREE.MeshBasicMaterial({
                color: back ? 0xff55a8 : 0x66fff0,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const mesh = new THREE.Mesh(pulseGeo, mat);
            const pSpriteMat = new THREE.SpriteMaterial({
                map: glowTexture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                opacity: 0.85,
                depthWrite: false
            });
            const pSprite = new THREE.Sprite(pSpriteMat);
            pSprite.scale.setScalar(2);
            mesh.add(pSprite);
            const conn = connections[Math.floor(Math.random() * connections.length)];
            mesh.userData = { conn, back, t: Math.random(), speed: 0.01 + Math.random() * 0.016, sprite: pSprite };
            scene.add(mesh);
            pulses.push(mesh);
        }

        // Central anchor glow
        const centerGlow = new THREE.Sprite(new THREE.SpriteMaterial({
            map: glowTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            opacity: 0.16,
            depthWrite: false
        }));
        centerGlow.scale.setScalar(42);
        scene.add(centerGlow);

        // Background particles
        const pCount = 1400;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount * 3; i += 3) {
            pPos[i] = (Math.random() - 0.5) * 130;
            pPos[i + 1] = (Math.random() - 0.5) * 130;
            pPos[i + 2] = (Math.random() - 0.5) * 130;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const particleSystem = new THREE.Points(pGeo, new THREE.PointsMaterial({
            color: 0x2dd6e8,
            size: 0.15,
            transparent: true,
            opacity: 0.45,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        }));
        scene.add(particleSystem);

        // Lights
        scene.add(new THREE.AmbientLight(0x07241f, 1.2));
        const keyLight = new THREE.PointLight(MAGENTA, 2.2, 95);
        keyLight.position.set(-18, 14, 28);
        scene.add(keyLight);
        const rimLight = new THREE.PointLight(TEAL, 1.6, 75);
        rimLight.position.set(22, -10, 12);
        scene.add(rimLight);
        const centerLight = new THREE.PointLight(0x22ddc8, 0.7, 55);
        centerLight.position.set(0, 0, 0);
        scene.add(centerLight);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // Sweeping activation wave (left -> right, repeats)
            const waveX = ((t * 2.4) % (span + 16)) - span / 2 - 8;

            nodes.forEach(node => {
                const ud = node.userData;
                const wobble = Math.sin(t * ud.speed + ud.phase) * ud.amp;
                node.position.y = ud.baseY + wobble;
                node.position.z = ud.baseZ + Math.cos(t * ud.speed * 0.55 + ud.phase * 1.4) * ud.amp * 0.45;

                const localPulse = 0.5 + 0.5 * Math.sin(t * 1.5 + ud.phase);
                const dist = Math.abs(node.position.x - waveX);
                let flash = Math.max(0, 1 - dist / 4.5);
                flash *= flash;
                const pulse = 0.3 + 0.4 * localPulse + 0.9 * flash;

                node.material.emissiveIntensity = pulse;
                node.rotation.y += ud.spin * 0.02;
                const s = 1 + 0.12 * Math.sin(t * 1.1 + ud.phase) + 0.2 * flash;
                node.scale.setScalar(s);
                ud.core.material.opacity = 0.5 + 0.5 * pulse;
                ud.sprite.material.opacity = Math.min(1, 0.2 + 0.4 * pulse + 0.6 * flash);
                ud.sprite.scale.setScalar(3 + 2 * pulse + 3 * flash);
            });

            connections.forEach(conn => {
                const a = conn.start.position, b = conn.end.position;
                const mx = (a.x + b.x) / 2 + conn.midOffset.x;
                const my = (a.y + b.y) / 2 + conn.midOffset.y;
                const mz = (a.z + b.z) / 2 + conn.midOffset.z;
                const arr = conn.line.geometry.attributes.position.array;
                for (let s = 0; s <= CURVE_SEG; s++) {
                    const u = s / CURVE_SEG, v = 1 - u;
                    const wu = v * v, wu2 = 2 * v * u, wu3 = u * u;
                    arr[s * 3] = wu * a.x + wu2 * mx + wu3 * b.x;
                    arr[s * 3 + 1] = wu * a.y + wu2 * my + wu3 * b.y;
                    arr[s * 3 + 2] = wu * a.z + wu2 * mz + wu3 * b.z;
                }
                conn.line.geometry.attributes.position.needsUpdate = true;
                const midX = (a.x + b.x) / 2;
                const d = Math.abs(midX - waveX);
                const flash = Math.max(0, 1 - d / 4.5);
                conn.line.material.opacity = conn.baseOpacity + 0.1 * Math.sin(t * 1.8 + conn.phase) + 0.5 * flash * flash;
            });

            pulses.forEach(p => {
                const ud = p.userData;
                ud.t += ud.speed;
                if (ud.t > 1) {
                    ud.t = 0;
                    ud.conn = connections[Math.floor(Math.random() * connections.length)];
                    ud.back = Math.random() < 0.75;
                    ud.speed = 0.01 + Math.random() * 0.016;
                }
                const from = ud.back ? ud.conn.end : ud.conn.start;
                const to = ud.back ? ud.conn.start : ud.conn.end;
                const a = from.position, b = to.position, mo = ud.conn.midOffset;
                const mx = (a.x + b.x) / 2 + mo.x, my = (a.y + b.y) / 2 + mo.y, mz = (a.z + b.z) / 2 + mo.z;
                const u = ud.t, v = 1 - u;
                const w1 = v * v, w2 = 2 * v * u, w3 = u * u;
                p.position.set(
                    w1 * a.x + w2 * mx + w3 * b.x,
                    w1 * a.y + w2 * my + w3 * b.y,
                    w1 * a.z + w2 * mz + w3 * b.z
                );
                const fade = Math.sin(u * Math.PI);
                p.material.opacity = fade;
                p.scale.setScalar(0.35 + fade * 0.75);
                ud.sprite.material.opacity = fade * 0.95;
                ud.sprite.scale.setScalar(1.4 + fade * 2.6);
            });

            networkGroup.rotation.y = Math.sin(t * 0.06) * 0.38;
            networkGroup.rotation.x = Math.sin(t * 0.045) * 0.1;

            camera.position.x = Math.sin(t * 0.07) * 15;
            camera.position.y = 2 + Math.sin(t * 0.05) * 4.5;
            camera.position.z = 60 - Math.sin(t * 0.028) * 10;
            camera.lookAt(0, 0, 0);

            particleSystem.rotation.y = -t * 0.015;
            particleSystem.rotation.z = Math.sin(t * 0.012) * 0.08;

            centerGlow.material.opacity = 0.12 + 0.07 * Math.sin(t * 0.45);
            centerGlow.scale.setScalar(40 + 5 * Math.sin(t * 0.45));

            keyLight.position.x = -18 * Math.cos(t * 0.18);
            keyLight.position.y = 14 + 6 * Math.sin(t * 0.13);
            rimLight.position.x = 22 * Math.sin(t * 0.14);
            centerLight.intensity = 0.45 + 0.35 * Math.sin(t * 0.45);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
