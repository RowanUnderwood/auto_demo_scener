<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quantum Resonance</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 40;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Quantum core
    const coreGeometry = new THREE.SphereGeometry(2.5, 32, 32);
    const coreMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        },
        vertexShader: `
            varying vec3 vPosition;
            void main() {
                vPosition = position;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime;
            uniform vec2 uResolution;
            varying vec3 vPosition;

            void main() {
                vec2 uv = gl_FragCoord.xy / uResolution;
                float time = uTime * 0.5;
                
                // Quantum field
                float dist = length(vPosition);
                float phase = mod(dist + time, 1.0) - 0.5;
                float alpha = smoothstep(0.2, 0.8, abs(phase));
                
                vec3 color = mix(vec3(0.6, 0.4, 1.0), vec3(0.2, 0.7, 1.0), phase * 0.5 + 0.5);
                gl_FragColor = vec4(color, alpha * 0.8);
            }
        `,
        transparent: true
    });
    const core = new THREE.Mesh(coreGeometry, coreMaterial);
    scene.add(core);

    // Resonant particles
    const particleCount = 2000;
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const sizes = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 15 + Math.random() * 10;
        const theta = Math.acos(2 * Math.random() - 1);
        
        positions[i*3] = radius * Math.sin(theta) * Math.cos(angle);
        positions[i*3+1] = radius * Math.sin(theta) * Math.sin(angle);
        positions[i*3+2] = radius * Math.cos(theta);

        colors[i*3] = 0.8 + Math.random() * 0.2;
        colors[i*3+1] = 0.5 + Math.random() * 0.4;
        colors[i*3+2] = 0.3 + Math.random() * 0.6;

        sizes[i] = 0.1 + Math.random() * 0.3;
    }

    const particleGeometry = new THREE.BufferGeometry();
    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    particleGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const particleMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        },
        vertexShader: `
            attribute float size;
            varying vec3 vColor;
            void main() {
                vColor = color;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = size * (300.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            varying vec3 vColor;
            void main() {
                if (length(gl_PointCoord - vec2(0.5)) > 0.5) discard;
                gl_FragColor = vec4(vColor, 1.0);
            }
        `,
        transparent: true,
        depthTest: false
    });

    const particles = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particles);

    // Ambient light
    const ambientLight = new THREE.AmbientLight(0x404040);
    scene.add(ambientLight);

    // Update loop
    function animate() {
        requestAnimationFrame(animate);
        
        coreMaterial.uniforms.uTime.value += 0.01;
        particleMaterial.uniforms.uTime.value += 0.02;
        
        particles.rotation.y += 0.0005;
        camera.position.x = Math.sin(Date.now() * 0.0003) * 45;
        camera.position.z = 40 + Math.cos(Date.now() * 0.0002) * 15;
        
        renderer.render(scene, camera);
    }

    // Handle resize
    window.addEventListener('resize', () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        
        renderer.setSize(width, height);
        coreMaterial.uniforms.uResolution.value.set(width, height);
        particleMaterial.uniforms.uResolution.value.set(width, height);
    });

    animate();
</script>
</body>
</html>
