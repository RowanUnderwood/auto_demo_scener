<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0}
body{overflow:hidden;background:#020a12}
canvas{display:block}
#info{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(100,255,220,0.25);font:11px monospace;letter-spacing:3px;text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>
<div id="info">bioluminescent drift</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020a12, 0.022);
const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const RINGS = 50;
const SPACING = 4.0;
const TOTAL = SPACING * RINGS;

// Jellyfish bells
const jellies = [];
const bellGeo = new THREE.SphereGeometry(1, 12, 8, 0, Math.PI*2, 0, Math.PI*0.6);
const innerGeo = new THREE.SphereGeometry(0.5, 8, 6, 0, Math.PI*2, 0, Math.PI*0.45);

for (let i = 0; i < RINGS; i++) {
    const group = new THREE.Group();
    const hue = 0.45 + Math.sin(i * 0.3) * 0.12;
    
    const bellMat = new THREE.MeshPhongMaterial({
        color: new THREE.Color().setHSL(hue, 0.6, 0.25),
        emissive: new THREE.Color().setHSL(hue, 0.9, 0.12),
        transparent: true, opacity: 0.55,
        side: THREE.DoubleSide, shininess: 90,
        blending: THREE.AdditiveBlending, depthWrite: false
    });
    const bell = new THREE.Mesh(bellGeo, bellMat);
    bell.scale.set(1.5, 1.0, 1.5);
    group.add(bell);

    const innerMat = new THREE.MeshBasicMaterial({
        color: new THREE.Color().setHSL(hue + 0.05, 1.0, 0.45),
        transparent: true, opacity: 0.35,
        blending: THREE.AdditiveBlending, depthWrite: false
    });
    const inner = new THREE.Mesh(innerGeo, innerMat);
    inner.scale.set(0.9, 0.6, 0.9);
    group.add(inner);

    // Tentacles as lines
    const tentacles = [];
    const tentCount = 4 + (i % 3);
    for (let t = 0; t < tentCount; t++) {
        const angle = (t / tentCount) * Math.PI * 2;
        const pts = [];
        const segs = 10;
        for (let s = 0; s <= segs; s++) {
            const pr = s / segs;
            pts.push(new THREE.Vector3(
                Math.cos(angle) * (0.9 + Math.sin(pr*4+t)*0.2*pr),
                -pr * 2.8,
                Math.sin(angle) * (0.9 + Math.cos(pr*3+t)*0.2*pr)
            ));
        }
        const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
        const lineMat = new THREE.LineBasicMaterial({
            color: new THREE.Color().setHSL(hue + 0.08, 0.7, 0.35),
            transparent: true, opacity: 0.25,
            blending: THREE.AdditiveBlending, depthWrite: false
        });
        const line = new THREE.Line(lineGeo, lineMat);
        group.add(line);
        tentacles.push(line);
    }

    const angle = i * 0.47;
    const radius = 2.5 + Math.sin(i * 0.35) * 1.8;
    group.position.set(
        Math.cos(angle) * radius,
        Math.sin(angle) * radius,
        -i * SPACING
    );
    group.rotation.set(
        (Math.random()-0.5)*0.4,
        Math.random()*Math.PI*2,
        (Math.random()-0.5)*0.4
    );
    scene.add(group);
    jellies.push({
        group, bell, inner, tentacles,
        phase: i*0.5,
        bobSpeed: 0.25+Math.random()*0.25,
        bobAmt: 0.4+Math.random()*0.5,
        pulseSpd: 0.6+Math.random()*0.4,
        hue
    });
}

// Bioluminescent particles
const PCOUNT = 2500;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PCOUNT*3);
const pColors = new Float32Array(PCOUNT*3);
const pData = [];
for (let i = 0; i < PCOUNT; i++) {
    const ang = Math.random()*Math.PI*2;
    const rad = 1+Math.random()*7;
    const z = -Math.random()*TOTAL;
    pPos[i*3]=Math.cos(ang)*rad;
    pPos[i*3+1]=Math.sin(ang)*rad;
    pPos[i*3+2]=z;
    const c = Math.random();
    let r,g,b;
    if(c<0.45){r=0.05;g=0.7+Math.random()*0.3;b=0.6+Math.random()*0.4;}
    else if(c<0.75){r=0.7+Math.random()*0.3;g=0.25+Math.random()*0.3;b=0.5+Math.random()*0.4;}
    else{r=0.2+Math.random()*0.2;g=0.8+Math.random()*0.2;b=0.3+Math.random()*0.3;}
    pColors[i*3]=r;pColors[i*3+1]=g;pColors[i*3+2]=b;
    pData.push({
        baseX:pPos[i*3],baseY:pPos[i*3+1],
        drift:Math.random()*Math.PI*2,
        driftSpd:0.15+Math.random()*0.35,
        driftAmt:0.6+Math.random()*1.2,
        zSpd:0.2+Math.random()*0.6,
        pulsePh:Math.random()*Math.PI*2
    });
}
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pColors,3));
const pMat = new THREE.PointsMaterial({
    size:0.07,transparent:true,opacity:0.65,
    blending:THREE.AdditiveBlending,depthWrite:false,
    vertexColors:true,sizeAttenuation:true
});
scene.add(new THREE.Points(pGeo,pMat));

// Light shafts
const shafts=[];
for(let i=0;i<10;i++){
    const sGeo=new THREE.CylinderGeometry(0.08,0.6,25,4,1,true);
    const sMat=new THREE.MeshBasicMaterial({
        color:0x3399aa,transparent:true,opacity:0.025,
        blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide
    });
    const shaft=new THREE.Mesh(sGeo,sMat);
    const ang=(i/10)*Math.PI*2;
    const rad=3+Math.random()*5;
    shaft.position.set(Math.cos(ang)*rad,4,-Math.random()*TOTAL);
    shaft.rotation.z=(Math.random()-0.5)*0.25;
    scene.add(shaft);
    shafts.push(shaft);
}

// Core cluster
const coreGroup=new THREE.Group();
const coreSpheres=[];
for(let i=0;i<10;i++){
    const sz=0.12+Math.random()*0.25;
    const cGeo=new THREE.SphereGeometry(sz,8,6);
    const cMat=new THREE.MeshBasicMaterial({
        color:new THREE.Color().setHSL(0.45+Math.random()*0.15,1.0,0.55),
        transparent:true,opacity:0.7,
        blending:THREE.AdditiveBlending,depthWrite:false
    });
    const sph=new THREE.Mesh(cGeo,cMat);
    sph.position.set((Math.random()-0.5)*1.8,(Math.random()-0.5)*1.8,(Math.random()-0.5)*1.8);
    coreGroup.add(sph);
    coreSpheres.push(sph);
}
scene.add(coreGroup);

const ambientLight=new THREE.AmbientLight(0x081820,0.4);
scene.add(ambientLight);
const coreLight=new THREE.PointLight(0x00ffcc,1.2,18);
scene.add(coreLight);

let time=0,camZ=0;
const clock=new THREE.Clock();

function animate(){
    requestAnimationFrame(animate);
    const dt=Math.min(clock.getDelta(),0.05);
    time+=dt;
    camZ-=dt*2.2;
    if(camZ<-TOTAL)camZ+=TOTAL;

    camera.position.set(
        Math.sin(time*0.12)*1.5,
        Math.cos(time*0.08)*1.0,
        camZ
    );
    camera.fov=65+Math.sin(time*0.4)*3;
    camera.updateProjectionMatrix();
    camera.lookAt(0,0,camZ-15);

    coreGroup.position.z=camZ-10;
    coreLight.position.z=camZ-10;
    coreLight.color.setHSL(0.45+Math.sin(time*0.25)*0.08,0.9,0.45);

    const breath=1+Math.sin(time*0.5)*0.18;

    for(let i=0;i<RINGS;i++){
        const j=jellies[i];
        let relZ=-i*SPACING-camZ;
        while(relZ>TOTAL/2)relZ-=TOTAL;
        while(relZ<-TOTAL/2)relZ+=TOTAL;
        j.group.position.z=camZ+relZ;

        const bob=Math.sin(time*j.bobSpeed+j.phase)*j.bobAmt;
        j.group.position.y+=bob*0.25;

        const pulse=breath*(1+Math.sin(time*j.pulseSpd+j.phase)*0.22);
        j.bell.scale.set(1.5*pulse,1.0*pulse,1.5*pulse);
        j.inner.scale.set(0.9*pulse,0.6*pulse,0.9*pulse);

        j.group.rotation.y+=dt*0.08;
        j.group.rotation.x+=dt*0.04;

        const hue=(j.hue+Math.sin(time*0.18+j.phase)*0.04)%1;
        j.bell.material.emissive.setHSL(hue,0.9,0.08+Math.sin(time*1.2+j.phase)*0.04);
        j.inner.material.color.setHSL(hue+0.05,1.0,0.35+Math.sin(time*1.8+j.phase)*0.1);

        const dist=Math.abs(relZ)/(TOTAL/2);
        const fade=Math.max(0,1-dist*dist);
        j.bell.material.opacity=0.55*fade;
        j.inner.material.opacity=0.35*fade;
        j.tentacles.forEach(t=>t.material.opacity=0.25*fade);
    }

    const pos=pGeo.attributes.position.array;
    for(let i=0;i<PCOUNT;i++){
        const p=pData[i];
        p.drift+=p.driftSpd*dt;
        pos[i*3]=p.baseX+Math.sin(p.drift)*p.driftAmt;
        pos[i*3+1]=p.baseY+Math.cos(p.drift*0.7)*p.driftAmt*0.5;
        pos[i*3+2]+=p.zSpd*dt;
        if(pos[i*3+2]>camZ)pos[i*3+2]-=TOTAL;
        let relZ=pos[i*3+2]-camZ;
        while(relZ>TOTAL/2){relZ-=TOTAL;pos[i*3+2]-=TOTAL;}
        while(relZ<-TOTAL/2){relZ+=TOTAL;pos[i*3+2]+=TOTAL;}
    }
    pGeo.attributes.position.needsUpdate=true;

    for(let i=0;i<shafts.length;i++){
        const s=shafts[i];
        s.rotation.y+=dt*0.08;
        s.material.opacity=0.02+Math.sin(time*0.4+i*1.2)*0.012;
    }

    for(let i=0;i<coreSpheres.length;i++){
        const s=coreSpheres[i];
        const pl=0.7+Math.sin(time*1.8+i*0.9)*0.35;
        s.scale.setScalar(pl);
        s.material.color.setHSL(0.45+Math.sin(time*0.2+i)*0.1,1.0,0.45+Math.sin(time*1.5+i)*0.15);
    }

    renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
