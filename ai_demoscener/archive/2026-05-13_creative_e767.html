<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA SYNTAX // DEMO</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 10px;
            pointer-events: none;
            text-shadow: 0 0 5px #0ff;
        }
    </style>
</head>
<body>
    <div id="ui">System.Status: Fluctuating // Protocol: Lumina_Syntax</div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        /** 
         * SHADER SOURCE 
         */
        const vertexShader = `
            varying vec3 vColor;
            varying float vOpacity;
            uniform float uTime;
            uniform float uSize;

            // GLSL Noise function for organic movement
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);

                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);

                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;

                i = mod289(i);
                vec4 p = permute(permute(permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0))
                          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                          + i.x + vec4(0.0, i1.x, i2.x, 1.0));

                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;

                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);

                vec4 x = x_ * ns.x + ns.yyyy;
                vec4 y = y_ * ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);

                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);

                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));

                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;

                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);

                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;

                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }

            void main() {
                vec3 pos = position;
                
                // Distort position with 3D noise
                float noise = snoise(pos * 0.5 + uTime * 0.2);
                pos += normal * noise * 1.5;

                // Pulse effect
                float pulse = sin(uTime * 0.5) * 0.2 + 1.0;
                pos *= pulse;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_PointSize = uSize * (300.0 / -mvPosition.z) * (1.0 + noise * 0.5);
                gl_Position = projectionMatrix * mvPosition;

                // Color based on position and noise
                vColor = mix(vec3(0.0, 1.0, 1.0), vec3(0.8, 0.0, 1.0), noise * 0.5 + 0.5);
                vColor = mix(vColor, vec3(1.0, 1.0, 1.0), pow(abs(noise), 4.0));
                vOpacity = smoothstep(0.0, 1.0, abs(noise));
            }
        `;

        const fragmentShader = `
            varying vec3 vColor;
            varying float vOpacity;

            void main() {
                float dist = distance(gl_PointCoord, vec2(0.5));
                if (dist > 0.5) discard;
                
                float glow = pow(1.0 - dist * 2.0, 2.0);
                gl_FragColor = vec4(vColor, glow * vOpacity);
            }
        `;

        /**
         * CORE ENGINE
         */
        class Demo {
            constructor() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.clock = new THREE.Clock();
                
                this.init();
            }

            init() {
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                document.body.appendChild(this.renderer.domElement);

                this.camera.position.z = 30;

                // Create Geometry: A complex Torus Knot composed of points
                const geometry = new THREE.TorusKnotGeometry(10, 3, 400, 128);
                const count = geometry.attributes.position.count;
                
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        uTime: { value: 0 },
                        uSize: { value: 2.5 }
                    },
                    vertexShader,
                    fragmentShader,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                this.points = new THREE.Points(geometry, this.material);
                this.scene.add(this.points);

                // Background subtle particles (Stars)
                const starGeo = new THREE.BufferGeometry();
                const starCoords = [];
                for(let i=0; i<5000; i++) {
                    starCoords.push((Math.random()-0.5)*200, (Math.random()-0.5)*200, (Math.random()-0.5)*200);
                }
                starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
                const starMat = new THREE.PointsMaterial({ color: 0x444444, size: 0.1 });
                this.stars = new THREE.Points(starGeo, starMat);
                this.scene.add(this.stars);

                window.addEventListener('resize', () => this.onResize());
                this.animate();
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                const elapsed = this.clock.getElapsedTime();

                this.material.uniforms.uTime.value = elapsed;
                
                // Slow rotation and orbital movement
                this.points.rotation.y = elapsed * 0.1;
                this.points.rotation.z = elapsed * 0.05;
                
                this.stars.rotation.y = -elapsed * 0.02;

                // Camera drift
                this.camera.position.x = Math.sin(elapsed * 0.3) * 5;
                this.camera.position.y = Math.cos(elapsed * 0.4) * 5;
                this.camera.lookAt(0, 0, 0);

                this.renderer.render(this.scene, this.camera);
            }
        }

        new Demo();
    </script>
</body>
</html>
