<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shader Effect</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const uniforms = {
            uTime: { value: 0 }
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec2 vUv;

                vec2 hash2(vec2 p) {
                    return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453123);
                }

                float getMinDist(vec2 uv, float scale, float t) {
                    vec2 g = floor(uv * scale);
                    vec2 f = fract(uv * scale);
                    float minDist = 1.0;

                    for (int y = -1; y <= 1; y++) {
                        for (int x = -1; x <= 1; x++) {
                            vec2 neighbor = vec2(float(x), float(y));
                            vec2 pointBase = hash2(g + neighbor);
                            // Animate the feature points within their cells
                            vec2 movingPoint = 0.5 + 0.5 * sin(t + pointBase * 6.28318);
                            vec2 distVec = neighbor + movingPoint - f;
                            minDist = min(minDist, length(distVec) / scale);
                        }
                    }
                    return minDist;
                }

                void main() {
                    // Perturb UVs
                    float freq = 4.0;
                    vec2 perturbedUv = vUv;
                    perturbedUv.x += sin(vUv.y * freq + uTime) * 0.03;
                    perturbedUv.y += cos(vUv.x * freq + uTime) * 0.03;

                    float accumulation = 0.0;
                    
                    // 3 layers of distance fields
                    for (int i = 1; i <= 3; i++) {
                        float f = float(i);
                        float scale = 3.0 * f + 2.0;
                        float t = uTime * (0.5 + 0.3 * f);
                        float d = getMinDist(perturbedUv, scale, t);
                        // Accumulate pow(1-d, 60)
                        accumulation += pow(clamp(1.0 - d, 0.0, 1.0), 60.0) * (1.0 / f);
                    }

                    // Tint blue-green
                    vec3 tint = vec3(0.1, 0.8, 0.7);
                    vec3 color = accumulation * tint;

                    // Subtle vignette
                    float distToCenter = length(vUv - 0.5);
                    color *= smoothstep(0.8, 0.2, distToCenter);

                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        function animate(time) {
            uniforms.uTime.value = time * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
