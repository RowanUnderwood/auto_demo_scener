<!DOCTYPE html>
<html>
<head>
<style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const material = new THREE.ShaderMaterial({
    uniforms: {
        u_time: { value: 0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    },
    vertexShader: `
        void main() {
            gl_Position = vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform float u_time;
        uniform vec2 u_resolution;

        float wave(vec3 p, vec3 mode, float t) {
            return sin(mode.x * p.x) * sin(mode.y * p.y) * sin(mode.z * p.z)
                 * cos(length(mode) * 0.4 * t);
        }

        void main() {
            vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;
            float t = u_time;

            // Slow orbital rotation of the sampling frame
            float rot = t * 0.04;
            float tilt = sin(t * 0.02) * 0.35;
            vec2 ruv;
            ruv.x = uv.x * cos(rot) - uv.y * sin(rot);
            ruv.y = (uv.x * sin(rot) + uv.y * cos(rot)) * cos(tilt);

            // Map to 3D point inside the chamber with radial depth
            vec3 p = vec3(ruv * 3.2, 0.6 + length(ruv) * 1.8);

            // Standing wave modes with organic frequency drift
            float pressure = 0.0;
            float n = 0.0;

            // (1,1,1)
            pressure += wave(p, vec3(1.0,1.0,1.0) + 0.09*sin(t*0.13), t); n += 1.0;
            // (2,1,1)
            pressure += wave(p, vec3(2.0,1.0,1.0) + 0.06*cos(t*0.11), t*1.08); n += 1.0;
            // (1,2,1)
            pressure += wave(p, vec3(1.0,2.0,1.0) + 0.07*sin(t*0.09), t*0.92); n += 1.0;
            // (1,1,2)
            pressure += wave(p, vec3(1.0,1.0,2.0) + 0.05*cos(t*0.14), t*1.05); n += 1.0;
            // (2,2,1)
            pressure += wave(p, vec3(2.0,2.0,1.0) + 0.06*sin(t*0.08), t*0.85); n += 1.0;
            // (2,1,2)
            pressure += wave(p, vec3(2.0,1.0,2.0) + 0.04*cos(t*0.12), t*1.15); n += 1.0;
            // (3,1,1)
            pressure += wave(p, vec3(3.0,1.0,1.0) + 0.05*sin(t*0.1), t*0.72); n += 1.0;
            // (1,3,1)
            pressure += wave(p, vec3(1.0,3.0,1.0) + 0.04*cos(t*0.15), t*0.95); n += 1.0;
            // (1,2,2)
            pressure += wave(p, vec3(1.0,2.0,2.0) + 0.05*sin(t*0.07), t*1.1); n += 1.0;
            // (2,2,2)
            pressure += wave(p, vec3(2.0,2.0,2.0) + 0.04*cos(t*0.11), t*0.8); n += 1.0;

            pressure /= n;

            // Amplify so the bright bands of the palette are actually reached
            float f = pressure * 2.6;
            float mag = abs(f);

            // Palette: deep void -> indigo -> teal -> gold -> white-hot
            vec3 cVoid  = vec3(0.04, 0.02, 0.10);
            vec3 cInd   = vec3(0.10, 0.05, 0.32);
            vec3 cTeal  = vec3(0.05, 0.55, 0.65);
            vec3 cGold  = vec3(0.98, 0.74, 0.18);
            vec3 cWhite = vec3(1.0, 0.97, 0.90);

            vec3 col;
            if (f > 0.0) {
                col = mix(cInd, cTeal, smoothstep(0.0, 0.45, f));
                col = mix(col, cGold, smoothstep(0.35, 0.7, f));
                col = mix(col, cWhite, smoothstep(0.65, 0.95, f));
            } else {
                col = mix(cVoid, cInd, smoothstep(0.0, 0.35, -f));
                col = mix(col, vec3(0.12, 0.06, 0.34), smoothstep(0.25, 0.7, -f));
            }

            // Intensity envelope with a visible floor so the field reads clearly
            col *= (0.30 + 0.70 * smoothstep(0.0, 0.3, mag));

            // Nodal surface glow (pressure near zero = chamber walls)
            float nodal = smoothstep(0.10, 0.0, mag);
            col += nodal * vec3(0.30, 0.65, 0.90) * 0.95;

            // Secondary nodal (slightly wider soft band)
            float nodal2 = smoothstep(0.28, 0.0, mag);
            col += nodal2 * vec3(0.10, 0.22, 0.40) * 0.5;

            // Breathing modulation
            float breathe = 0.92 + 0.08 * sin(t * 0.4);
            col *= breathe;

            // Depth fog (gentle darkening toward edges simulates distance)
            float depth = 1.0 - 0.15 * dot(ruv, ruv);
            col *= depth;

            // Vignette
            col *= 1.0 - 0.40 * smoothstep(0.4, 1.5, length(ruv));

            // Subtle ambient floor
            col += vec3(0.006, 0.005, 0.012);

            gl_FragColor = vec4(col, 1.0);
        }
    `
});

const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
scene.add(quad);

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
});

function animate(time) {
    requestAnimationFrame(animate);
    material.uniforms.u_time.value = time * 0.001;
    renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
