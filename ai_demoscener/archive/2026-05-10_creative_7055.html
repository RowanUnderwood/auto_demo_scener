<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL_DRIFT // DEMO</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        #overlay { position: absolute; top: 20px; left: 20px; color: #0f0; pointer-events: none; text-shadow: 0 0 5px #0f0; letter-spacing: 2px; font-size: 12px; }
    </style>
</head>
<body>
    <div id="overlay">SYSTEM_STATUS: NEURAL_DRIFT_ACTIVE<br>SYNC_MODE: HYPER_RECURSION</div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        /**
         * IDEA: "NEURAL DRIFT"
         * A hybrid of a 4D Tesseract Projection, Reaction-Diffusion patterns, and Vector Field Streamlines.
         * We project a rotating hypercube into 3D space, but instead of solid edges, we use 
         * particles that follow the velocity field of an invisible fluid, colored by their 
         * distance to the projected 4D vertices.
         */

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 4D Hypercube Logic ---
        const vertices4D = [];
        for (let i = 0; i < 16; i++) {
            vertices4D.push(new THREE.Vector4(
                i & 1 ? 1 : -1,
                i & 2 ? 1 : -1,
                i & 4 ? 1 : -1,
                i & 8 ? 1 : -1
            ));
        }

        const edges4D = [];
        for (let i = 0; i < 16; i++) {
            for (let j = i + 1; j < 16; j++) {
                let diff = i ^ j;
                if (diff === 1 || diff === 2 || diff === 4 || diff === 8) {
                    edges4D.push([i, j]);
                }
            }
        }

        // --- Particle System ---
        const particleCount = 15000;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const velocities = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 10;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 10;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 10;

            velocities[i * 3] = (Math.random() - 0.5) * 0.02;
            velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.02;
            velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.02;

            colors[i * 3] = 0;
            colors[i * 3 + 1] = 1;
            colors[i * 3 + 2] = 0.5;
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const mat = new THREE.PointsMaterial({
            size: 0.04,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const points = new THREE.Points(geo, mat);
        scene.add(points);

        camera.position.z = 5;

        // --- Animation Loop Helpers ---
        function rotate4D(v, t) {
            const out = v.clone();
            // Rotate in XY plane
            const s1 = Math.sin(t), c1 = Math.cos(t);
            let x = out.x * c1 - out.y * s1;
            let y = out.x * s1 + out.y * c1;
            out.x = x; out.y = y;

            // Rotate in ZW plane
            const s2 = Math.sin(t * 0.7), c2 = Math.cos(t * 0.7);
            let z = out.z * c2 - out.w * s2;
            let w = out.z * s2 + out.w * c2;
            out.z = z; out.w = w;

            // Rotate in XW plane
            const s3 = Math.sin(t * 0.5), c3 = Math.cos(t * 0.5);
            let x2 = out.x * c3 - out.w * s3;
            let w2 = out.x * s3 + out.w * c3;
            out.x = x2; out.w = w2;

            return out;
        }

        function project4D(v4) {
            const factor = 1 / (3 - v4.w);
            return new THREE.Vector3(v4.x * factor, v4.y * factor, v4.z * factor).multiplyScalar(3);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;

            // Calculate projected vertices
            const projectedVertices = vertices4D.map(v => project4D(rotate4D(v, time)));

            const posAttr = geo.attributes.position;
            const colAttr = geo.attributes.color;

            for (let i = 0; i < particleCount; i++) {
                let px = posAttr.array[i * 3];
                let py = posAttr.array[i * 3 + 1];
                let pz = posAttr.array[i * 3 + 2];

                // Vector field: Attract particles towards projected hypercube vertices
                let minDist = Infinity;
                let targetIdx = 0;

                for (let j = 0; j < projectedVertices.length; j++) {
                    const v = projectedVertices[j];
                    const dx = v.x - px;
                    const dy = v.y - py;
                    const dz = v.z - pz;
                    const d2 = dx*dx + dy*dy + dz*dz;
                    if (d2 < minDist) {
                        minDist = d2;
                        targetIdx = j;
                    }
                }

                // Move towards nearest vertex with a "fluid" drift
                const target = projectedVertices[targetIdx];
                velocities[i * 3] += (target.x - px) * 0.0001 + (Math.sin(time + i) * 0.001);
                velocities[i * 3 + 1] += (target.y - py) * 0.0001 + (Math.cos(time + i) * 0.001);
                velocities[i * 3 + 2] += (target.z - pz) * 0.0001;

                // Apply damping/friction
                velocities[i * 3] *= 0.98;
                velocities[i * 3 + 1] *= 0.98;
                velocities[i * 3 + 2] *= 0.98;

                posAttr.array[i * 3] += velocities[i * 3];
                posAttr.array[i * 3 + 1] += velocities[i * 3 + 1];
                posAttr.array[i * 3 + 2] += velocities[i * 3 + 2];

                // Color by distance to the hypercube structure (simulating reaction-diffusion feel)
                const dist = Math.sqrt(minDist);
                colAttr.array[i * 3] = Math.sin(dist * 5 - time * 2) * 0.5 + 0.5; // R
                colAttr.array[i * 3 + 1] = 1.0 - dist * 2;                         // G
                colAttr.array[i * 3 + 2] = Math.cos(dist * 3 + time) * 0.5 + 0.5;// B

                // Respawn particles that drift too far
                if (Math.abs(px) > 8 || Math.abs(py) > 8 || Math.abs(pz) > 8) {
                    posAttr.array[i * 3] = (Math.random() - 0.5) * 2;
                    posAttr.array[i * 3 + 1] = (Math.random() - 0.5) * 2;
                    posAttr.array[i * 3 + 2] = (Math.random() - 0.5) * 2;
                }
            }

            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;

            // Subtle camera movement
            camera.position.x = Math.sin(time * 0.5) * 2;
            camera.position.y = Math.cos(time * 0.3) * 2;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
