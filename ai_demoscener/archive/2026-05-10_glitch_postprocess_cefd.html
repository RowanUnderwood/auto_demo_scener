<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch Torus Knot</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    const GlitchShader = {
        uniforms: {
            'tDiffuse': { value: null },
            'uTime': { value: 0.0 }
        },
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            precision highp float;
            uniform sampler2D tDiffuse;
            uniform float uTime;
            varying vec2 vUv;

            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }

            void main() {
                vec2 uv = vUv;
                
                float glitchFreq = 10.0;
                float glitchStrength = step(0.85, random(vec2(floor(uTime * glitchFreq), 0.0)));
                
                vec2 sampleUv = uv;
                if (glitchStrength > 0.5) {
                    float numSlices = 15.0;
                    float sliceIdx = floor(uv.y * numSlices);
                    float sliceSeed = random(vec2(sliceIdx, floor(uTime * 5.0)));
                    if (sliceSeed > 0.6) {
                        sampleUv.y += sin(uTime * 20.0 + sliceIdx) * 0.05;
                    }
                }

                float shift = sin(uTime * 2.5) * 0.015 + cos(uTime * 0.7) * 0.01;
                
                float r = texture2D(tDiffuse, vec2(sampleUv.x + shift, sampleUv.y)).r;
                float g = texture2D(tDiffuse, sampleUv).g;
                float b = texture2D(tDiffuse, vec2(sampleUv.x - shift, sampleUv.y)).b;

                gl_FragColor = vec4(r, g, b, 1.0);
            }
        `
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 4;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.TorusKnotGeometry(1, 0.35, 256, 64);
    const material = new THREE.MeshNormalMaterial({ wireframe: false });
    const torusKnot = new THREE.Mesh(geometry, material);
    scene.add(torusKnot);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const glitchPass = new ShaderPass(GlitchShader);
    composer.addPass(glitchPass);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        const elapsed = clock.getElapsedTime();

        torusKnot.rotation.x += delta * 0.5;
        torusKnot.rotation.y += delta * 0.3;

        glitchPass.uniforms.uTime.value = elapsed;

        controls.update();
        composer.render();
    }

    animate();
</script>
</body>
</html>
