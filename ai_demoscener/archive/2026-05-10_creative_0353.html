<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON FRACTAL NEBULA</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/**
 * CONCEPT: "FRACTAL SINGULARITY"
 * A hybrid demoscene effect combining Raymarched SDFs, Fractal Brownian Motion (fbm), 
 * and a kaleidoscope-inspired coordinate folding. It creates an infinite descent 
 * into a kaleidoscopic cosmic nebula made of geometric structures.
 */

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const geometry = new THREE.PlaneGeometry(2, 2);
const uniforms = {
    u_time: { value: 0 },
    u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
};

const fragmentShader = `
    uniform float u_time;
    uniform vec2 u_resolution;

    #define MAX_STEPS 100
    #define SURF_DIST .001
    #define MAX_DIST 20.

    // Palette function
    vec3 palette(float t) {
        vec3 a = vec3(0.5, 0.5, 0.5);
        vec3 b = vec3(0.5, 0.5, 0.5);
        vec3 c = vec3(1.0, 1.0, 1.0);
        vec3 d = vec3(0.263, 0.416, 0.557);
        return a + b * cos(6.28318 * (c * t + d));
    }

    // Rotation matrix
    mat2 rot(float a) {
        float s = sin(a), c = cos(a);
        return mat2(c, -s, s, c);
    }

    // Smooth minimum for organic blending
    float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
    }

    // SDF for the scene
    float getDist(vec3 p) {
        // Fractal folding: kaleidoscope effect in 3D space
        for(int i = 0; i < 4; i++) {
            p = abs(p) - vec3(0.5, 1.2, 0.8);
            p.xy *= rot(u_time * 0.1 + float(i));
            p.xz *= rot(u_time * 0.05);
        }

        // Base shape: A morphing sphere/torus hybrid
        float sphere = length(p) - 0.6;
        float torus = length(vec2(length(p.xz) - 0.7, p.y)) - 0.1;
        
        // Add noise-like movement via sine waves
        float wave = sin(p.x * 5.0 + u_time) * sin(p.y * 5.0 + u_time) * sin(p.z * 5.0 + u_time) * 0.1;
        
        return smin(sphere, torus, 0.4) + wave;
    }

    // Raymarching engine
    float rayMarch(vec3 ro, vec3 rd) {
        float dO = 0.0;
        for(int i = 0; i < MAX_STEPS; i++) {
            vec3 p = ro + rd * dO;
            float dS = getDist(p);
            dO += dS;
            if(dO > MAX_DIST || abs(dS) < SURF_DIST) break;
        }
        return dO;
    }

    // Normal estimation
    vec3 getNormal(vec3 p) {
        float d = getDist(p);
        vec2 e = vec2(.01, 0);
        vec3 n = d - vec3(
            getDist(p - e.xyy),
            getDist(p - e.yxy),
            getDist(p - e.yyx)
        );
        return normalize(n);
    }

    void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.y, u_resolution.x);
        
        // Camera setup: slow zoom and rotation
        float zoom = 1.5 + sin(u_time * 0.2) * 0.5;
        vec3 ro = vec3(0, 0, -zoom); // Ray Origin
        vec3 rd = normalize(vec3(uv, 1.2)); // Ray Direction

        // Rotate camera over time
        ro.xz *= rot(u_time * 0.1);
        rd.xz *= rot(u_time * 0.1);

        float d = rayMarch(ro, rd);
        vec3 col = vec3(0.0);

        if(d < MAX_DIST) {
            vec3 p = ro + rd * d;
            vec3 n = getNormal(p);
            
            // Lighting: simple diffuse + rim light
            float diff = dot(n, normalize(vec3(1, 2, -3))) * 0.5 + 0.5;
            float rim = pow(1.0 - max(dot(n, -rd), 0.0), 4.0);
            
            // Color based on position and normals (Cosmic Palette)
            vec3 baseCol = palette(length(p) * 0.2 + u_time * 0.1);
            col = baseCol * diff;
            col += rim * vec3(0.5, 0.8, 1.0); // Blueish rim glow
        }

        // Atmospheric fog/glow effect
        col = mix(col, palette(u_time * 0.05), 1.0 - exp(-0.15 * d));
        
        // Post-process: Vignette and Grain
        float vignette = smoothstep(1.2, 0.4, length(uv));
        col *= vignette;

        gl_FragColor = vec4(col, 1.0);
    }
`;

const material = new THREE.ShaderMaterial({
    uniforms: uniforms,
    fragmentShader: fragmentShader
});

const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

function animate(time) {
    uniforms.u_time.value = time * 0.001;
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
});

requestAnimationFrame(animate);
</script>
</body>
</html>
