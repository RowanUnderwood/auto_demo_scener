<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereal Plasma Core</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const vertexShader = `
        varying vec2 vUv;
        varying vec3 vPosition;
        void main() {
            vUv = uv;
            vPosition = position;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;

    const fragmentShader = `
        uniform float uTime;
        uniform vec2 uResolution;
        varying vec2 vUv;

        // Simplex-style noise approximation for fluid motion
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
            const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
            vec2 i  = floor(v + dot(v, C.yy) );
            vec2 x0 = v -   i + dot(i, C.xx);
            vec2 i1;
            i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
            vec4 x12 = x0.xyxy + C.xxzz;
            x12.xy -= i1;
            i = mod289(i);
            vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
            vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
            m = m*m ;
            m = m*m ;
            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
            vec3 g;
            g.x  = a0.x  * x0.x  + h.x  * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
        }

        void main() {
            vec2 uv = vUv - 0.5;
            uv.x *= uResolution.x / uResolution.y;

            // Distort UVs for a swirling liquid effect
            float swirl = snoise(uv * 1.5 + uTime * 0.2);
            vec2 distortedUv = uv + vec2(swirl * 0.3, snoise(uv - uTime * 0.1) * 0.3);

            // Layered noise for "energy" density
            float n1 = snoise(distortedUv * 2.5 + uTime * 0.4);
            float n2 = snoise(distortedUv * 5.0 - uTime * 0.6);
            float combinedNoise = (n1 + n2) * 0.5;

            // Create a central glow/core mask
            float dist = length(uv);
            float coreMask = smoothstep(0.7, 0.0, dist);
            float ringMask = smoothstep(0.3, 0.4, dist) * smoothstep(0.6, 0.5, dist);

            // Color Palette: Deep Indigo -> Electric Cyan -> Pure White core
            vec3 colorDeep = vec3(0.02, 0.01, 0.08);
            vec3 colorMid = vec3(0.1, 0.4, 0.9);
            vec3 colorBright = vec3(0.4, 0.9, 1.0);
            vec3 colorCore = vec3(1.0, 1.0, 1.0);

            // Mix based on noise and distance
            float intensity = combinedNoise * coreMask;
            
            vec3 baseColor = mix(colorDeep, colorMid, intensity + 0.2);
            baseColor = mix(baseColor, colorBright, smoothstep(0.2, 0.6, intensity));
            baseColor = mix(baseColor, colorCore, ringMask * (intensity + 0.5));

            // Add a "pulse" effect
            float pulse = sin(uTime * 1.5) * 0.1 + 0.9;
            baseColor *= pulse;

            // Vignette and edge fade
            float vignette = smoothstep(1.2, 0.3, dist);
            
            gl_FragColor = vec4(baseColor * vignette, 1.0);
        }
    `;

    let scene, camera, renderer, material;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader,
            fragmentShader
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
    }

    function animate(time) {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value = time * 0.001;
        renderer.render(scene, camera);
    }

    init();
    animate(0);
</script>
</body>
</html>
