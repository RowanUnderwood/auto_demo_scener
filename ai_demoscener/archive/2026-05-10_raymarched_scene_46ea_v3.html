<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bioluminal Drift</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020810; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.150.0';

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.PlaneGeometry(2, 2);
    const uniforms = {
        u_time: { value: 0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float u_time;
            uniform vec2 u_resolution;
            varying vec2 vUv;

            mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }

            float sdOctahedron(vec3 p, float s){
                p = abs(p);
                return (p.x + p.y + p.z - s) * 0.57735;
            }

            float sdRoundBox(vec3 p, vec3 b, float r){
                vec3 q = abs(p) - b;
                return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0) - r;
            }

            float smin(float a, float b, float k){
                float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);
                return mix(b, a, h) - k*h*(1.0-h);
            }

            float hash31(vec3 p){
                p = fract(p * vec3(443.897, 441.423, 437.195));
                p += dot(p, p.yzx + 19.19);
                return fract((p.x + p.y) * p.z);
            }

            vec3 drift(vec3 p){
                p.x += sin(u_time * 0.10) * 0.45;
                p.y += sin(u_time * 0.09 + 1.0) * 0.35;
                p.z += cos(u_time * 0.12 + 2.0) * 0.40;
                return p;
            }

            float map(vec3 p){
                p = drift(p);

                // infinite lattice with alternating offsets
                vec3 cell = floor(p / 4.5);
                vec3 local = mod(p, 4.5) - 2.25;

                // offset alternating layers
                float layer = mod(cell.x + cell.y + cell.z, 2.0);
                local += layer * vec3(0.0, 0.55, 0.3);

                // per-cell rotation
                float angle = u_time * 0.22 + hash31(cell) * 6.2831;
                local.xz = rot(angle * 0.30) * local.xz;
                local.xy = rot(angle * 0.17) * local.xy;

                // breathing
                float pulse = sin(u_time * 0.55 + dot(cell, vec3(1.3, 2.1, 0.7))) * 0.5 + 0.5;
                float scale = 0.62 + pulse * 0.26;

                // octahedron core
                float octa = sdOctahedron(local, 0.95 * scale);

                // rounded box frame
                vec3 boxP = local;
                boxP.xy = rot(0.785) * boxP.xy;
                float box = sdRoundBox(boxP, vec3(0.72 * scale), 0.16);

                // blend
                float d = smin(octa, box, 0.42);

                // small satellite spheres at vertices
                float sat = length(local - vec3(1.25*scale, 0.0, 0.0)) - 0.13;
                sat = min(sat, length(local - vec3(0.0, 1.25*scale, 0.0)) - 0.13);
                sat = min(sat, length(local - vec3(0.0, 0.0, 1.25*scale)) - 0.13);
                d = smin(d, sat, 0.10);

                return d;
            }

            vec3 getNormal(vec3 p){
                const float h = 0.0015;
                const vec2 k = vec2(1,-1);
                return normalize(
                    k.xyy*map(p+k.xyy*h) + k.yyx*map(p+k.yyx*h) +
                    k.yxy*map(p+k.yxy*h) + k.xxx*map(p+k.xxx*h));
            }

            // caustic pattern for background
            float caustic(vec2 uv, float t){
                vec2 p = uv * 3.0;
                float v = 0.0;
                v += sin(p.x * 2.1 + t * 0.4) * sin(p.y * 1.7 - t * 0.3);
                v += sin((p.x + p.y) * 1.3 + t * 0.2) * 0.5;
                v += sin(length(p - vec2(sin(t*0.1), cos(t*0.13))) * 2.0 - t * 0.5) * 0.3;
                return v * 0.5 + 0.5;
            }

            void main(){
                vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.y, u_resolution.x);

                // cinematic camera: forward flight + gentle sway + bank
                float T = u_time;
                vec3 ro = vec3(
                    sin(T * 0.18) * 0.6,
                    sin(T * 0.13 + 1.0) * 0.45,
                    -T * 0.75
                );
                float bank = sin(T * 0.11) * 0.12 + sin(T * 0.23) * 0.05;
                vec3 fwd = normalize(vec3(0.0, 0.0, 1.0));
                vec3 right = normalize(vec3(1.0, 0.0, 0.0));
                vec3 up = normalize(cross(fwd, right));
                right = normalize(cross(up, fwd));
                vec3 rd = normalize(fwd * 1.5 + uv.x * 1.1 * right + uv.y * 1.1 * up);

                float t = 0.0;
                bool hit = false;
                for(int i = 0; i < 160; i++){
                    vec3 p = ro + rd * t;
                    float d = map(p);
                    if(d < 0.001){ hit = true; break; }
                    t += d * 0.9;
                    if(t > 34.0) break;
                }

                // deep ocean background with radial core glow
                float grad = clamp(uv.y * 0.4 + 0.5, 0.0, 1.0);
                vec3 bg = mix(vec3(0.010, 0.030, 0.070), vec3(0.025, 0.080, 0.120), grad);
                float core = smoothstep(1.4, 0.0, length(uv));
                bg += vec3(0.02, 0.10, 0.14) * core * 0.5;
                float c = caustic(uv * 0.8, T);
                bg += vec3(0.0, 0.10, 0.14) * c * c * 0.35;

                // floating particles
                vec3 col = bg;
                for(int j = 0; j < 3; j++){
                    float fj = float(j);
                    vec2 puv = uv * (2.0 + fj * 1.5) + T * 0.02 * (1.0 + fj * 0.3);
                    float particle = smoothstep(0.98, 1.0, hash31(vec3(mod(puv, 1.0), fj)));
                    col += vec3(0.12, 0.45, 0.55) * particle * (0.18 - fj * 0.04);
                }

                if(hit){
                    vec3 p = ro + rd * t;
                    vec3 n = getNormal(p);
                    vec3 v = -rd;

                    // bioluminescent emissive
                    float fres = pow(1.0 - max(dot(n, v), 0.0), 2.5);
                    float glow = 0.65 + 0.35 * sin(T * 0.8 + p.x * 0.5 + p.y * 0.3);

                    // vivid cool emissive palette with occasional magenta accent
                    vec3 cyan  = vec3(0.05, 0.95, 0.85);
                    vec3 blue  = vec3(0.20, 0.50, 1.00);
                    vec3 magenta = vec3(0.85, 0.35, 0.95);
                    float hueMix = 0.5 + 0.5 * sin(p.x * 0.4 + p.z * 0.3 + T * 0.3);
                    vec3 emissive = mix(cyan, blue, hueMix);
                    float accent = smoothstep(0.78, 1.0, sin(p.y * 0.45 + p.z * 0.3 + T * 0.4));
                    emissive = mix(emissive, magenta, accent * 0.55);

                    // depth cue: nearer objects burn brighter cyan
                    float depthBoost = smoothstep(9.0, 0.0, t);
                    emissive += vec3(0.15, 0.45, 0.55) * depthBoost * 0.6;

                    // subtle warm rim accent
                    vec3 warm = vec3(1.0, 0.65, 0.35);
                    float warmMix = smoothstep(0.78, 1.0, fres) * 0.18;
                    emissive = mix(emissive, warm, warmMix);

                    // soft top light for form
                    vec3 l1 = normalize(vec3(0.0, 1.0, -0.3));
                    float diff = max(dot(n, l1), 0.0) * 0.35;

                    // specular
                    vec3 h = normalize(l1 + v);
                    float spec = pow(max(dot(n, h), 0.0), 70.0) * 0.6;

                    vec3 surf = emissive * (glow * 0.85 + fres * 0.9);
                    surf += emissive * diff;
                    surf += vec3(0.85, 0.97, 1.0) * spec;
                    surf += vec3(0.0, 0.35, 0.45) * (1.0 - fres) * 0.18;

                    // dense fog
                    float fog = exp(-t * 0.11);
                    col = mix(bg, surf, fog);

                    // glow halo around objects
                    float halo = exp(-max(map(p + n * 0.06), 0.0) * 3.5) * 0.5;
                    col += emissive * halo * fog;
                }

                // depth fog tint
                col = mix(col, vec3(0.012, 0.035, 0.070), smoothstep(6.0, 32.0, t) * 0.55);

                // color grade: lift shadows blue, push highlights cyan
                col = mix(col, col * vec3(0.85, 1.0, 1.15) + vec3(0.0, 0.01, 0.02), 0.5);

                // vignette
                float vig = smoothstep(1.7, 0.35, length(uv));
                col *= vig * 0.4 + 0.72;

                // tone map
                col = col / (1.0 + col * 0.45);
                col = pow(col, vec3(0.92));

                // subtle grain
                float g = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
                col += (g - 0.5) * 0.012;

                gl_FragColor = vec4(col, 1.0);
            }
        `
    });

    scene.add(new THREE.Mesh(geometry, material));

    function animate(time){
        uniforms.u_time.value = time * 0.001;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        uniforms.u_resolution.value.set(w, h);
    });

    requestAnimationFrame(animate);
</script>
</body>
</html>
