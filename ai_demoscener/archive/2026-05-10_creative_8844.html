<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON ENTROPY: KINETIC VOID</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #0ff;
            text-shadow: 0 0 5px #0ff; pointer-events: none; font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="ui">
        [ SYSTEM: KINETIC_VOID_v1.0 ]<br>
        [ STATUS: ENTROPY_STABLE ]<br>
        [ MODE: HYPER-RECURSIVE_RAYMARCHING ]
    </div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        /**
         * CONCEPT: "NEON ENTROPY"
         * A hybrid of Raymarched SDFs, Fractal Folding (Kaleidoscope), and 
         * Particle-driven light trails. It renders a central "Hyper-Torus" 
         * that warps through 4D space using sin/cos coefficients, surrounded 
         * by a field of "Data Dust" particles that react to the SDF's distance.
         */

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- SHADER MATERIAL (The Core Engine) ---
        const fragmentShader = `
            uniform float uTime;
            uniform vec2 uRes;

            mat2 rot(float a) { return mat2(cos(a), -sin(a), sin(a), cos(a)); }

            // Smooth minimum for organic merging
            float smin(float a, float b, float k) {
                float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
                return mix(b, a, h) - k * h * (1.0 - h);
            }

            // Distance Function: A morphing Hyper-Torus/Blob hybrid
            float map(vec3 p) {
                p.xz *= rot(uTime * 0.3);
                p.xy *= rot(uTime * 0.2);
                
                // Fractal folding (Kaleidoscope logic in 3D)
                for(int i = 0; i < 3; i++) {
                    p = abs(p) - 0.5;
                    p.xy *= rot(uTime * 0.1 + float(i));
                    p.yz *= rot(uTime * 0.05);
                }

                // The core shape: A torus that breathes and warps
                float torus = length(vec2(length(p.xz) - 1.2, p.y)) - (0.3 + 0.2 * sin(uTime * 2.0));
                
                // Add a "heartbeat" sphere inside
                float sphere = length(p) - 0.5;
                
                return smin(torus, sphere, 0.6);
            }

            vec3 getNormal(vec3 p) {
                vec2 e = vec2(0.001, 0.0);
                return normalize(vec3(
                    map(p + e.xyy) - map(p - e.xyy),
                    map(p + e.yxy) - map(p - e.yxy),
                    map(p + e.yyx) - map(p - e.yyx)
                ));
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy - 0.5 * uRes.xy) / min(uRes.y, uRes.x);
                vec3 ro = vec3(0.0, 0.0, -4.0); // Ray Origin
                vec3 rd = normalize(vec3(uv, 1.5)); // Ray Direction
                
                // Rotate camera slightly
                ro.xz *= rot(uTime * 0.1);
                rd.xz *= rot(uTime * 0.1);

                float t = 0.0;
                float d;
                vec3 p;
                bool hit = false;

                // Raymarching loop
                for(int i = 0; i < 80; i++) {
                    p = ro + rd * t;
                    d = map(p);
                    if(d < 0.001) {
                        hit = true;
                        break;
                    }
                    t += d;
                    if(t > 20.0) break;
                }

                vec3 color = vec3(0.02, 0.0, 0.05); // Deep space background

                if(hit) {
                    vec3 n = getNormal(p);
                    vec3 lightDir = normalize(vec3(sin(uTime), cos(uTime), -1.0));
                    float diff = max(dot(n, lightDir), 0.0);
                    float spec = pow(max(dot(reflect(-lightDir, n), -rd), 0.0), 32.0);
                    
                    // Neon coloring based on position and normal
                    vec3 neon = 0.5 + 0.5 * cos(uTime + p.xyx + vec3(0, 2, 4));
                    color = neon * diff + spec;
                    
                    // Fog effect
                    color = mix(color, vec3(0.0), 1.0 - exp(-0.1 * t));
                }

                // Post-process: Vignette and subtle scanlines
                float vignette = smoothstep(1.5, 0.5, length(uv));
                color *= vignette;
                color -= sin(gl_FragCoord.y * 1.2 + uTime * 10.0) * 0.005;

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const vertexShader = `
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `;

        // --- SCENE SETUP ---
        const quadGeom = new THREE.PlaneGeometry(2, 2);
        const shaderMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader,
            fragmentShader
        });
        const quad = new THREE.Mesh(quadGeom, shaderMat);
        scene.add(quad);

        // --- DATA DUST (Particle System) ---
        const particleCount = 3000;
        const pGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            // Circular distribution
            const r = 2 + Math.random() * 5;
            const theta = Math.random() * Math.PI * 2;
            positions[i*3] = Math.cos(theta) * r;
            positions[i*3+1] = (Math.random() - 0.5) * 5;
            positions[i*3+2] = Math.sin(theta) * r;

            colors[i*3] = 0.0; // R
            colors[i*3+1] = 1.0; // G (Cyan-ish)
            colors[i*3+2] = 1.0; // B
            sizes[i] = Math.random() * 2;
        }

        pGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        pGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        pGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const pMaterial = new THREE.PointsMaterial({
            size: 0.02,
            vertexColors: true,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(pGeometry, pMaterial);
        scene.add(particleSystem);

        camera.position.z = 5;

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            shaderMat.uniforms.uTime.value = elapsed;

            // Animate particles to mimic a "data storm"
            const posAttr = pGeometry.attributes.position;
            for (let i = 0; i < particleCount; i++) {
                posAttr.array[i*3 + 1] -= delta * 0.5; // Drift down
                if (posAttr.array[i*3 + 1] < -3) posAttr.array[i*3 + 1] = 3;

                // Swirl effect
                const x = posAttr.array[i*3];
                const z = posAttr.array[i*3+2];
                posAttr.array[i*3] += Math.sin(elapsed * 0.5 + i) * 0.005;
                posAttr.array[i*3+2] += Math.cos(elapsed * 0.5 + i) * 0.005;
            }
            posAttr.needsUpdate = true;

            // Rotate particles slightly for parallax
            particleSystem.rotation.y = elapsed * 0.05;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            shaderMat.uniforms.uRes.value.set(w, h);
        });

        animate();
    </script>
</body>
</html>
