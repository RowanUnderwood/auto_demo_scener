<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Sphere Physics</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // Configuration
        const COUNT = 30;
        const BOX_SIZE = 10;
        const BOUND = BOX_SIZE / 2;
        const GRAVITY = -9.8;
        const DAMPING = 0.95;
        const RADIUS = 0.3;

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 12, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 50);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // Bounding Box Wireframe
        const boxGeo = new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE);
        const edges = new THREE.EdgesGeometry(boxGeo);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
        scene.add(line);

        // Spheres Data Structure
        const spheres = [];
        const sphereGeo = new THREE.SphereGeometry(RADIUS, 32, 32);

        for (let i = 0; i < COUNT; i++) {
            const material = new THREE.MeshPhongMaterial({ 
                color: new THREE.Color(Math.random(), Math.random(), Math.random()) 
            });
            const mesh = new THREE.Mesh(sphereGeo, material);
            
            // Random position within bounds (accounting for radius)
            mesh.position.set(
                (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2),
                (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2),
                (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2)
            );

            // Random velocity
            const velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 10
            );

            scene.add(mesh);
            spheres.push({ mesh, velocity });
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.032); // Cap delta to prevent tunneling on lag

            spheres.forEach(s => {
                // Apply gravity
                s.velocity.y += GRAVITY * dt;

                // Integrate position
                s.mesh.position.addScaledVector(s.velocity, dt);

                // Collision Detection with 6 walls
                const pos = s.mesh.position;

                // X Axis
                if (pos.x + RADIUS > BOUND) {
                    pos.x = BOUND - RADIUS;
                    s.velocity.x *= -DAMPING;
                } else if (pos.x - RADIUS < -BOUND) {
                    pos.x = -BOUND + RADIUS;
                    s.velocity.x *= -DAMPING;
                }

                // Y Axis
                if (pos.y + RADIUS > BOUND) {
                    pos.y = BOUND - RADIUS;
                    s.velocity.y *= -DAMPING;
                } else if (pos.y - RADIUS < -BOUND) {
                    pos.y = -BOUND + RADIUS;
                    s.velocity.y *= -DAMPING;
                }

                // Z Axis
                if (pos.z + RADIUS > BOUND) {
                    pos.z = BOUND - RADIUS;
                    s.velocity.z *= -DAMPING;
                } else if (pos.z - RADIUS < -BOUND) {
                    pos.z = -BOUND + RADIUS;
                    s.velocity.z *= -DAMPING;
                }
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
