<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polar Checker Shader</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const uniforms = {
            uTime: { value: 0.0 }
        };

        const material = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec2 vUv;

                void main() {
                    // Centered UVs from -1 to 1 (roughly, adjusted for aspect ratio if needed)
                    // For a simple quad, we use the range directly.
                    vec2 uv = vUv * 2.0 - 1.0;
                    
                    // Calculate polar coordinates
                    float r = length(uv);
                    float a = atan(uv.y, uv.x);

                    // Compute u and v as requested
                    // Adding small epsilon to r to prevent division by zero
                    float u = 1.0 / max(r, 0.0001) + uTime;
                    float v = a / 3.14159265359;

                    // Procedural checker logic: step(0.5, fract(u*4)) XOR step(0.5, fract(v*8))
                    float s1 = step(0.5, fract(u * 4.0));
                    float s2 = step(0.5, fract(v * 8.0));
                    float checker = abs(s1 - s2);

                    // Darken by r so the center stays bright
                    // We use (1.0 - r) to fade edges toward black
                    float brightness = clamp(1.0 - r, 0.0, 1.0);
                    
                    gl_FragColor = vec4(vec3(checker * brightness), 1.0);
                }
            `
        });

        const quad = new THREE.Mesh(geometry, material);
        scene.add(quad);

        function animate(time) {
            uniforms.uTime.value = time * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
