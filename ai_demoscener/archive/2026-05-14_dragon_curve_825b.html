<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heighway Dragon L-System</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
    }
}
</script>
<script type="module">
import * as THREE from 'three';

// --- L-System Generation ---
const axiom = 'FX';
const rules = { X: 'X+YF+', Y: '-FX-Y' };
let current = axiom;
for (let i = 0; i < 14; i++) {
    let next = '';
    for (const ch of current) {
        next += rules[ch] !== undefined ? rules[ch] : ch;
    }
    current = next;
}

// --- Turtle Graphics Interpretation ---
const points = [];
let x = 0, y = 0;
const angleStep = Math.PI / 2; // 90 degrees
let heading = 0; // start facing +x axis (in 3D: along X axis)
const stepLen = 1.0;

for (const ch of current) {
    if (ch === 'F') {
        x += Math.cos(heading) * stepLen;
        y += Math.sin(heading) * stepLen;
        points.push(new THREE.Vector3(x, y, 0));
    } else if (ch === '+') {
        heading -= angleStep; // turn right in standard turtle coords
    } else if (ch === '-') {
        heading += angleStep; // turn left
    }
}

// Center points around origin
const box = new THREE.Box3().setFromPoints(points);
const center = new THREE.Vector3();
box.getCenter(center);
for (let i = 0; i < points.length; i++) {
    points[i].sub(center);
}

const totalVertices = points.length;
const scaledStepLen = stepLen / Math.pow(2, 14 * 0.5) * 8; // scale to fit view

// --- Geometry Setup ---
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(totalVertices * 3);
const colors = new Float32Array(totalVertices * 3);
for (let i = 0; i < totalVertices; i++) {
    const p = points[i];
    positions[i * 3] = p.x * scaledStepLen;
    positions[i * 3 + 1] = p.y * scaledStepLen;
    positions[i * 3 + 2] = 0;
}

// Pre-compute colors along the path
for (let i = 0; i < totalVertices; i++) {
    const t = i / (totalVertices - 1);
    const h = t; // full hue range across the path
    const rgb = hsvToRgb(h, 1.0, 1.0);
    colors[i * 3] = rgb.r;
    colors[i * 3 + 1] = rgb.g;
    colors[i * 3 + 2] = rgb.b;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geometry.setDrawRange(0, 0);

// --- Shader Material ---
const vertexShader = `
    attribute vec3 color;
    varying vec3 vColor;
    void main() {
        vColor = color;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
`;

const fragmentShader = `
    varying vec3 vColor;
    uniform float uAlpha;
    void main() {
        if (vColor.r == 0.0 && vColor.g == 0.0 && vColor.b == 0.0) discard; // skip uncomputed
        gl_FragColor = vec4(vColor, uAlpha);
    }
`;

const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms: { uAlpha: { value: 1.0 } },
    transparent: true,
    depthWrite: false,
});

// --- Scene Setup (moved before usage) ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// --- Line Creation (after scene is defined) ---
const line = new THREE.Line(geometry, material);
scene.add(line);

// Create a group to hold the line for rotation
const dragonGroup = new THREE.Group();
scene.add(dragonGroup);
dragonGroup.add(line);

// --- Helper Functions ---
function hsvToRgb(h, s, v) {
    let r, g, b;
    const i = Math.floor(h * 6);
    const f = h * 6 - i;
    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);
    switch (i % 6) {
        case 0: r = v; g = t; b = p; break;
        case 1: r = q; g = v; b = p; break;
        case 2: r = p; g = v; b = t; break;
        case 3: r = p; g = q; b = v; break;
        case 4: r = t; g = p; b = v; break;
        case 5: r = v; g = p; b = q; break;
    }
    return { r, g, b };
}

// --- Animation State ---
const DURATION = 10.0; // seconds for full draw
let startTime = null;
let state = 'drawing'; // 'drawing', 'fading', 'rotating'
let fadeStart = null;
const FADE_DURATION = 2.5;
let rotationAngle = 0;
let targetRotation = Math.random() * Math.PI * 2;

// --- Resize Handler ---
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Animation Loop ---
function animate(timestamp) {
    requestAnimationFrame(animate);

    if (!startTime) startTime = timestamp;
    const elapsed = (timestamp - startTime) / 1000.0; // seconds

    if (state === 'drawing') {
        const progress = Math.min(elapsed / DURATION, 1.0);
        const numSegments = Math.floor(progress * totalVertices);
        geometry.setDrawRange(0, numSegments);
        material.uniforms.uAlpha.value = 1.0;

        if (progress >= 1.0) {
            state = 'fading';
            fadeStart = timestamp;
        }
    } else if (state === 'fading') {
        const elapsed2 = (timestamp - fadeStart) / 1000.0;
        const progress = Math.min(elapsed2 / FADE_DURATION, 1.0);

        // Fade out then back in smoothly
        material.uniforms.uAlpha.value = 0.3 + 0.7 * progress;

        if (progress >= 1.0) {
            state = 'rotating';
            rotationAngle = dragonGroup.rotation.z;
            targetRotation = Math.random() * Math.PI * 2;
        }
    } else if (state === 'rotating') {
        const elapsed3 = (timestamp - fadeStart) / 1000.0;
        // Smooth rotation using lerp
        const rotProgress = Math.min(elapsed3 / 5.0, 1.0);
        dragonGroup.rotation.z = rotationAngle + (targetRotation - rotationAngle) * smoothstep(rotProgress);

        if (rotProgress >= 1.0) {
            // Reset for next cycle
            state = 'drawing';
            startTime = timestamp;
            dragonGroup.rotation.z = 0;
            geometry.setDrawRange(0, 0);
            material.uniforms.uAlpha.value = 1.0;
        }
    }

    renderer.render(scene, camera);
}

function smoothstep(t) {
    return t * t * (3 - 2 * t);
}

// Start animation loop
requestAnimationFrame(animate);

</script>
</body>
</html>
