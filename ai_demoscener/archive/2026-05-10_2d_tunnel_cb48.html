<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polar Shader</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.PlaneGeometry(2, 2);
    const uniforms = {
        uTime: { value: 0 }
    };

    const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime;
            varying vec2 vUv;

            void main() {
                // Centered UVs from -1 to 1
                vec2 uv = vUv * 2.0 - 1.0;
                
                float r = length(uv);
                float a = atan(uv.y, uv.x);

                // u = 1/r + time, v = angle / PI
                float u = (1.0 / max(r, 0.001)) + uTime;
                float v = a / 3.14159265359;

                // Procedural Checker using XOR logic
                float checkU = step(0.5, fract(u * 4.0));
                float checkV = step(0.5, fract(v * 8.0));
                float checker = abs(checkU - checkV);

                // Darken by r so center stays bright (1-r)
                // Using smoothstep for a nicer falloff
                float brightness = smoothstep(1.2, 0.0, r);
                vec3 color = vec3(checker) * brightness;

                gl_FragColor = vec4(color, 1.0);
            }
        `
    });

    const quad = new THREE.Mesh(geometry, material);
    scene.add(quad);

    function animate(time) {
        uniforms.uTime.value = time * 0.001;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(animate);
</script>
</body>
</html>
