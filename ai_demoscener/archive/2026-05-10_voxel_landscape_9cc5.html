<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instanced Noise Grid</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    // Simple Perlin-like Simplex Noise implementation for the effect
    const noise2D = (function() {
        const p = new Uint8Array(512);
        const permutation = new Uint8Array([151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190, 6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168, 68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54, 65,25,63,161, 1,216,80,73,209,76,132,187,208, 89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186, 3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152, 2,44,154,163, 70,221,153,101,155,167, 43,172,9,129,22,39,253, 19,98,108,110,79,113,224,232,178,185, 112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241, 81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184, 84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
        for (let i = 0; i < 256; i++) p[i] = p[i + 256] = permutation[i];

        function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
        function lerp(t, a, b) { return a + t * (b - a); }
        function grad(hash, x, y, z) {
            const h = hash & 15;
            const u = h < 8 ? x : y;
            const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
            return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
        }

        return function(x, y) {
            const X = Math.floor(x) & 255;
            const Y = Math.floor(y) & 255;
            x -= Math.floor(x);
            y -= Math.floor(y);
            const u = fade(x);
            const v = fade(y);
            const a = p[X] + Y, aa = p[a], ab = p[a + 1];
            const b = p[X + 1] + Y, ba = p[b], bb = p[b + 1];

            return lerp(v, lerp(u, grad(p[aa], x, y, 0), grad(p[ba], x - 1, y, 0)),
                           lerp(u, grad(p[ab], x, y - 1, 0), grad(p[bb], x - 1, y - 1, 0)));
        };
    })();

    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const gridSize = 64;
    const geometry = new THREE.BoxGeometry(0.9, 1, 0.9);
    // Dummy material for InstancedMesh to allow coloring via attribute
    const material = new THREE.MeshStandardMaterial();
    const instancedMesh = new THREE.InstancedMesh(geometry, material, gridSize * gridSize);
    scene.add(instancedMesh);

    const dummy = new THREE.Object3D();
    const color = new THREE.Color();

    for (let i = 0; i < gridSize; i++) {
        for (let j = 0; j < gridSize; j++) {
            const idx = i * gridSize + j;
            const x = i - gridSize / 2;
            const z = j - gridSize / 2;

            // Noise calculation
            const n = noise2D(x * 0.1, z * 0.1);
            const height = Math.floor((n + 1) * 4); // Map -1..1 to 0..8 roughly
            
            // Position: set Y such that base is at floor(noise*8), but box center is half-height.
            // To make the bottom of the block sit on the "floor", we adjust Y.
            const posY = height; 
            dummy.position.set(x, posY, z);
            dummy.scale.set(1, Math.max(0.1, height + 1), 1); // Scale height for visual effect
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(idx, dummy.matrix);

            // Color: Blue (low) -> Green (mid) -> White (high)
            const t = THREE.MathUtils.clamp((height + 1) / 9, 0, 1);
            if (t < 0.5) {
                // Blue to Green
                color.setHSL(0.6, 0.8, 0.2 + t * 1.6); // Simplistic approach: blue -> green
                color.lerp(new THREE.Color(0x00ff00), t * 2);
                color.lerp(new THREE.Color(0x0044ff), 1 - t * 2);
            } else {
                // Green to White
                const t2 = (t - 0.5) * 2;
                color.set(0x00ff00).lerp(new THREE.Color(0xffffff), t2);
            }
            instancedMesh.setColorAt(idx, color);
        }
    }

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(20, 50, 30);
    scene.add(dirLight);

    camera.position.set(40, 40, 40);
    camera.lookAt(0, 0, 0);

    function animate() {
        requestAnimationFrame(animate);

        const time = Date.now() * 0.0005;
        const radius = 60;
        camera.position.x = Math.cos(time) * radius;
        camera.position.z = Math.sin(time) * radius;
        camera.position.y = 30 + Math.sin(time * 0.5) * 10;
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
