<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.150.1/build/three.module.js';

const vertexShader = `
    varying vec2 vUv;
    varying vec2 vPos;
    void main() {
        vUv = uv;
        vPos = position.xy;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
`;

const fragmentShader = `
    precision highp float;

    uniform float u_time;
    uniform vec2 u_resolution;
    uniform vec2 u_mouse;
    varying vec2 vUv;
    varying vec2 vPos;

    // Simple pseudo-random
    float rand(vec2 n) { 
        return fract(sin(dot(n, vec2(12.9898, 4.1414))) * 43758.5453); 
    }

    // 2D Noise
    float noise(vec2 x) {
        vec2 p = floor(x);
        vec2 f = fract(x);
        f = f * f * (3.0 - 2.0 * f);
        float n = p.x + p.y * 57.0;
        return mix(mix(rand(p + vec2(0.0, 0.0)), rand(p + vec2(1.0, 0.0)), f.x),
                   mix(rand(p + vec2(0.0, 1.0)), rand(p + vec2(1.0, 1.0)), f.x), f.y);
    }

    // Fractal Brownian Motion
    float fbm(vec2 p) {
        float f = 0.0;
        f += 0.50000 * noise(p); p *= 2.02;
        f += 0.25000 * noise(p); p *= 2.03;
        f += 0.12500 * noise(p); p *= 2.01;
        f += 0.06250 * noise(p);
        return f;
    }

    // Color palette function (Cosine based)
    vec3 palette( in float t, in vec3 a, in vec3 b, in vec3 c, in vec3 d ) {
        return a + b*cos( 6.28318*(c*t+d) );
    }

    void main() {
        // Aspect ratio correction
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
        vec2 uv0 = uv; // Keep original
        
        // Mouse influence
        vec2 mouseNorm = u_mouse / u_resolution;
        vec2 dist = abs(uv - mouseNorm * 2.0 - 0.5); // Normalize mouse roughly to space
        
        // Flow animation
        float time = u_time * 0.2;
        uv += vec2(time * 0.15, time * 0.05);
        
        // Distort uv based on mouse proximity for organic interaction
        float mouseDist = dot(dist - 0.2, dist - 0.2);
        if (mouseDist < 0.05) {
            uv += 0.15 * normalize(uv - (mouseNorm * 2.0 - 0.5)) * (1.0 - mouseDist * 20.0);
        }

        // Layer 1: Deep background noise
        float n1 = fbm(uv);
        
        // Layer 2: Detail
        vec2 uv1 = uv * 2.0 + time * 0.1;
        float n2 = fbm(uv1);
        
        // Layer 3: Sharp details
        vec2 uv2 = uv * 5.0 - time * 0.2;
        float n3 = fbm(uv2);
        
        // Combine noise with color palettes
        // Palette 1: Deep space blues/purples
        vec3 col1 = palette(n1 + time * 0.1, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.33, 0.67));
        
        // Palette 2: Bioluminescent cyans/magentas
        vec3 col2 = palette(n2 + time * 0.2, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.00, 0.20, 0.47));
        
        // Palette 3: Sparks of gold/white
        vec3 col3 = palette(n3 * 2.0, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.26, 0.80, 0.34));

        vec3 color = col1 * (1.0 - n2*0.5) + col2 * n2 * (0.5 + n1 * 0.5) + col3 * n3;
        
        // Add a vignette and subtle glow
        color += 0.2 * n3 * 2.0; 
        
        // Add a vignette effect
        vec2 v = gl_FragCoord.xy / u_resolution.xy;
        float vignette = 1.0 - smoothstep(0.5, 1.5, length(v - 0.5) * 2.0);
        
        // Final composite
        color = mix(vec3(0.02, 0.01, 0.05), color, vignette * 1.2);
        
        gl_FragColor = vec4(color, 1.0);
    }
`;

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const geometry = new THREE.PlaneGeometry(2, 2);
const uniforms = {
    u_time: { value: 0.0 },
    u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    u_mouse: { value: new THREE.Vector2(0.0, 0.0) }
};

const material = new THREE.ShaderMaterial({
    uniforms,
    vertexShader,
    fragmentShader
});

const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

// Mouse tracking
document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

function animate(time) {
    requestAnimationFrame(animate);
    uniforms.u_time.value = time * 0.001;
    // Normalize mouse for shader
    uniforms.u_mouse.value.set(mouseX, mouseY);
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const width = window.innerWidth;
    const height = window.innerHeight;
    renderer.setSize(width, height);
    uniforms.u_resolution.value.set(width, height);
});

requestAnimationFrame(animate);
</script>
</body>
</html>
