<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const uniforms = {
            u_time: { value: 0.0 }
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float u_time;
                varying vec2 vUv;

                void main() {
                    // Center UVs from [-0.5, 0.5]
                    vec2 uv = vUv - 0.5;
                    
                    // Polar coordinates
                    float r = length(uv);
                    float a = atan(uv.y, uv.x);
                    const float PI = 3.14159265359;

                    // Transformation logic
                    float u = 1.0 / max(r, 0.0001) + u_time;
                    float v = a / PI;

                    // Procedural checker using XOR logic for floats
                    // step returns 0 or 1, so abs(a-b) acts as XOR
                    float checkU = step(0.5, fract(u * 4.0));
                    float checkV = step(0.5, fract(v * 8.0));
                    float pattern = abs(checkU - checkV);

                    // Darken by r to ensure the center (r=0) remains bright/visible
                    // We use a smooth falloff to avoid harsh edges at quad boundaries
                    float brightness = clamp(1.0 - r, 0.0, 1.0);
                    
                    gl_FragColor = vec4(vec3(pattern * brightness), 1.0);
                }
            `
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        function animate(time) {
            uniforms.u_time.value = time * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
