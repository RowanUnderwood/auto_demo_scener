<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;overflow:hidden}
body{background:#000}
canvas{display:block}
#info{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font:11px monospace;pointer-events:none}
</style>
</head>
<body>
<div id="info">TEMPORAL BLOOM</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000508, 0.018);
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
document.body.appendChild(renderer.domElement);

// --- Utility ---
function hsl(h,s,l){
  h=((h%1)+1)%1;
  const q=l<.5?l*(1+s):l+s-l*s, p=2*l-q;
  const f=t=>{t=((t%1)+1)%1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p};
  return [f(h+1/3),f(h),f(h-1/3)];
}

// --- Particle Ocean (40000 pts) ---
const N=200, oceanN=N*N;
const oGeo=new THREE.BufferGeometry();
const oPos=new Float32Array(oceanN*3);
const oCol=new Float32Array(oceanN*3);
const oOrig=new Float32Array(oceanN*2);
for(let i=0;i<oceanN;i++){
  const x=(i%N-N/2)*.45, z=(Math.floor(i/N)-N/2)*.45;
  oPos[i*3]=x; oPos[i*3+1]=0; oPos[i*3+2]=z;
  oOrig[i*2]=x; oOrig[i*2+1]=z;
}
oGeo.setAttribute('position',new THREE.BufferAttribute(oPos,3));
oGeo.setAttribute('color',new THREE.BufferAttribute(oCol,3));
const ocean=new THREE.Points(oGeo,new THREE.PointsMaterial({
  size:.12,vertexColors:true,transparent:true,opacity:.85,
  blending:THREE.AdditiveBlending,depthWrite:false
}));
scene.add(ocean);

// --- Central Morphing Crystal ---
const cGeo=new THREE.IcosahedronGeometry(3.2,4);
const cOrig=new Float32Array(cGeo.attributes.position.array);
const cMat=new THREE.MeshBasicMaterial({
  wireframe:true,transparent:true,opacity:.45,
  blending:THREE.AdditiveBlending,depthWrite:false
});
const crystal=new THREE.Mesh(cGeo,cMat);
crystal.position.y=5;
scene.add(crystal);

// Inner solid core
const coreGeo=new THREE.IcosahedronGeometry(1.2,2);
const coreMat=new THREE.MeshBasicMaterial({
  color:0xffffff,transparent:true,opacity:.15,
  blending:THREE.AdditiveBlending,depthWrite:false
});
const core=new THREE.Mesh(coreGeo,coreMat);
core.position.copy(crystal.position);
scene.add(core);

// --- Orbiting Particle Swarms (3 rings) ---
const swarms=[];
const ringConfigs=[
  {count:1500,r:5.5,yOff:0,speed:1.2,tilt:.3,size:.06},
  {count:1200,r:7.5,yOff:1,speed:-.8,tilt:-.5,size:.05},
  {count:800,r:10,yOff:-1,speed:.5,tilt:.7,size:.07},
];
for(const rc of ringConfigs){
  const g=new THREE.BufferGeometry();
  const p=new Float32Array(rc.count*3);
  const c=new Float32Array(rc.count*3);
  const data=[];
  for(let i=0;i<rc.count;i++){
    data.push({
      a:Math.random()*Math.PI*2,
      r:rc.r+(Math.random()-.5)*1.5,
      s:rc.speed*(0.7+Math.random()*.6),
      y:(Math.random()-.5)*2,
      ph:Math.random()*Math.PI*2
    });
  }
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  g.setAttribute('color',new THREE.BufferAttribute(c,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({
    size:rc.size,vertexColors:true,transparent:true,opacity:.9,
    blending:THREE.AdditiveBlending,depthWrite:false
  }));
  pts.position.y=5;
  pts.rotation.x=rc.tilt;
  scene.add(pts);
  swarms.push({pts,data,geo:g});
}

// --- Rising Spark Particles ---
const SP=600;
const sGeo=new THREE.BufferGeometry();
const sPos=new Float32Array(SP*3);
const sCol=new Float32Array(SP*3);
const sData=[];
for(let i=0;i<SP;i++){
  sData.push({
    x:(Math.random()-.5)*30,
    z:(Math.random()-.5)*30,
    speed:.5+Math.random()*1.5,
    offset:Math.random()*20,
    drift:(Math.random()-.5)*.3
  });
}
sGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
sGeo.setAttribute('color',new THREE.BufferAttribute(sCol,3));
const sparks=new THREE.Points(sGeo,new THREE.PointsMaterial({
  size:.09,vertexColors:true,transparent:true,opacity:.7,
  blending:THREE.AdditiveBlending,depthWrite:false
}));
scene.add(sparks);

// --- Shooting Fragment Bursts ---
const FB=300;
const fbGeo=new THREE.BufferGeometry();
const fbPos=new Float32Array(FB*3);
const fbCol=new Float32Array(FB*3);
const fbData=[];
for(let i=0;i<FB;i++){
  const theta=Math.random()*Math.PI*2;
  const phi=Math.acos(2*Math.random()-1);
  fbData.push({
    dx:Math.sin(phi)*Math.cos(theta),
    dy:Math.sin(phi)*Math.sin(theta),
    dz:Math.cos(phi),
    delay:Math.random()*4,
    speed:3+Math.random()*5
  });
}
fbGeo.setAttribute('position',new THREE.BufferAttribute(fbPos,3));
fbGeo.setAttribute('color',new THREE.BufferAttribute(fbCol,3));
const fragments=new THREE.Points(fbGeo,new THREE.PointsMaterial({
  size:.1,vertexColors:true,transparent:true,opacity:.8,
  blending:THREE.AdditiveBlending,depthWrite:false
}));
fragments.position.copy(crystal.position);
scene.add(fragments);

// --- Main Loop ---
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  const st=t*.25;

  // Ocean
  for(let i=0;i<oceanN;i++){
    const x=oOrig[i*2], z=oOrig[i*2+1];
    const d=Math.sqrt(x*x+z*z);
    const w1=Math.sin(x*.25+t*1.1)*Math.cos(z*.25+t*.8)*1.2;
    const w2=Math.sin(d*.4-t*2.5)*Math.exp(-d*.04)*1.5;
    const w3=Math.cos(x*.08+z*.12+t*.4)*.6;
    const w4=Math.sin(Math.atan2(z,x)*3+t)*.3*Math.exp(-d*.03);
    oPos[i*3+1]=w1+w2+w3+w4;
    const h=(t*.06+d*.015+oPos[i*3+1]*.08)%1;
    const [r,g,b]=hsl(h,.75,.2+oPos[i*3+1]*.08);
    oCol[i*3]=r; oCol[i*3+1]=g; oCol[i*3+2]=b;
  }
  oGeo.attributes.position.needsUpdate=true;
  oGeo.attributes.color.needsUpdate=true;

  // Crystal
  const cp=cGeo.attributes.position.array;
  const pulse=Math.sin(t*1.8)*.25+1;
  const breathe=Math.sin(st*1.2)*.3+1;
  const sq=(Math.sin(st)*.5+.5);
  for(let i=0;i<cOrig.length;i+=3){
    const ox=cOrig[i],oy=cOrig[i+1],oz=cOrig[i+2];
    const n=Math.sin(ox*.8+t*2)*Math.cos(oy*.8+t*1.5)*.25;
    cp[i]=(ox+n)*breathe*pulse;
    cp[i+1]=(oy+n*.5)*breathe*pulse;
    cp[i+2]=(oz+n*.7)*breathe*pulse;
  }
  cGeo.attributes.position.needsUpdate=true;
  crystal.rotation.x=t*.4;
  crystal.rotation.y=t*.6;
  crystal.rotation.z=Math.sin(st)*.3;
  const [cr,cg,cb]=hsl(t*.04,1,.55);
  cMat.color.setRGB(cr,cg,cb);
  cMat.opacity=.35+Math.sin(t*1.8)*.15;

  // Core
  const cs=1+Math.sin(t*3)*.3;
  core.scale.setScalar(cs);
  core.rotation.x=-t*.7;
  core.rotation.y=t*.5;
  const [c2r,c2g,c2b]=hsl(t*.04+.33,1,.7);
  coreMat.color.setRGB(c2r,c2g,c2b);
  coreMat.opacity=.1+Math.abs(Math.sin(t*3))*.15;

  // Swarms
  for(const sw of swarms){
    const p=sw.geo.attributes.position.array;
    const c=sw.geo.attributes.color.array;
    for(let i=0;i<sw.data.length;i++){
      const d=sw.data[i];
      const a=d.a+t*d.s;
      const w=Math.sin(t*1.5+d.ph)*.8;
      const r=d.r+w;
      p[i*3]=Math.cos(a)*r;
      p[i*3+1]=d.y+Math.sin(t+d.ph)*1.2;
      p[i*3+2]=Math.sin(a)*r;
      const h=(a/(Math.PI*2)+t*.03+i*.001)%1;
      const [rr,gg,bb]=hsl(h,.85,.45+Math.sin(t+d.ph)*.15);
      c[i*3]=rr; c[i*3+1]=gg; c[i*3+2]=bb;
    }
    sw.geo.attributes.position.needsUpdate=true;
    sw.geo.attributes.color.needsUpdate=true;
  }

  // Sparks
  for(let i=0;i<SP;i++){
    const d=sData[i];
    const y=((t*d.speed+d.offset)%20)-5;
    sPos[i*3]=d.x+Math.sin(t*.5+d.offset)*d.drift*10;
    sPos[i*3+1]=y;
    sPos[i*3+2]=d.z+Math.cos(t*.4+d.offset)*d.drift*10;
    const fade=Math.max(0,1-Math.abs(y-5)/10);
    const [sr,sg,sb]=hsl(.55+Math.sin(t*.1)*.1,.8,.4*fade);
    sCol[i*3]=sr; sCol[i*3+1]=sg; sCol[i*3+2]=sb;
  }
  sGeo.attributes.position.needsUpdate=true;
  sGeo.attributes.color.needsUpdate=true;

  // Fragment bursts (periodic explosion)
  const burstCycle=t%4;
  const burstR=burstCycle<1?burstCycle*8:0;
  const burstFade=burstCycle<1?1-burstCycle:0;
  for(let i=0;i<FB;i++){
    const d=fbData[i];
    const local=burstCycle-d.delay;
    if(local>0&&local<1){
      const r=local*d.speed;
      fbPos[i*3]=d.dx*r;
      fbPos[i*3+1]=d.dy*r;
      fbPos[i*3+2]=d.dz*r;
      const [fr,fg,fb2]=hsl(t*.04+local*.3,1,.6*(1-local));
      fbCol[i*3]=fr; fbCol[i*3+1]=fg; fbCol[i*3+2]=fb2;
    } else {
      fbPos[i*3]=0; fbPos[i*3+1]=0; fbPos[i*3+2]=0;
      fbCol[i*3]=0; fbCol[i*3+1]=0; fbCol[i*3+2]=0;
    }
  }
  fbGeo.attributes.position.needsUpdate=true;
  fbGeo.attributes.color.needsUpdate=true;

  // Camera
  const ca=t*.12;
  const cr2=18+Math.sin(t*.08)*4;
  camera.position.x=Math.sin(ca)*cr2;
  camera.position.z=Math.cos(ca)*cr2;
  camera.position.y=5+Math.sin(t*.15)*3;
  camera.lookAt(0,4,0);

  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
