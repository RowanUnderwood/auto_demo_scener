<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEURAL CRYSTAL LATTICE</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0ff;
            text-shadow: 0 0 5px #0ff;
            pointer-events: none;
            letter-spacing: 2px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="ui">SYS_STATUS: CRYSTALLIZING... // CORE_FREQ: <span id="freq">0</span>Hz</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, clock;
        let points, lineSegments, bloomPass;
        const PARTICLE_COUNT = 1500;
        const GRID_SIZE = 40;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 60;
            camera.position.y = 20;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Geometry for the "Neural Lattice"
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                positions[i * 3] = (Math.random() - 0.5) * GRID_SIZE * 2;
                positions[i * 3 + 1] = (Math.random() - 0.5) * GRID_SIZE * 2;
                positions[i * 3 + 2] = (Math.random() - 0.5) * GRID_SIZE * 2;

                colors[i * 3] = 0;
                colors[i * 3 + 1] = Math.random();
                colors[i * 3 + 2] = 1;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const pMaterial = new THREE.PointsMaterial({
                size: 0.4,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            points = new THREE.Points(geometry, pMaterial);
            scene.add(points);

            // Dynamic connection lines
            const lineGeo = new THREE.BufferGeometry();
            lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(PARTICLE_COUNT * 6), 3));
            const lineMat = new THREE.LineBasicMaterial({ 
                color: 0x00ffff, 
                transparent: true, 
                opacity: 0.2, 
                blending: THREE.AdditiveBlending 
            });
            lineSegments = new THREE.LineSegments(lineGeo, lineMat);
            scene.add(lineSegments);

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            
            // Rotate camera orbitally
            camera.position.x = Math.sin(t * 0.2) * 70;
            camera.position.z = Math.cos(t * 0.2) * 70;
            camera.lookAt(0, 0, 0);

            const posAttr = points.geometry.attributes.position;
            const linePosAttr = lineSegments.geometry.attributes.position;
            
            let connectionCount = 0;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // Wave motion logic
                const x = posAttr.array[i * 3];
                const y = posAttr.array[i * 3 + 1];
                const z = posAttr.array[i * 3 + 2];

                // Distort position based on sine waves (Organic Crystalline movement)
                posAttr.array[i * 3] += Math.sin(t + y * 0.1) * 0.05;
                posAttr.array[i * 3 + 1] += Math.cos(t + x * 0.1) * 0.05;
                posAttr.array[i * 3 + 2] += Math.sin(t + y * 0.1) * 0.05;

                // Periodic Reset to keep it contained
                if (Math.abs(posAttr.array[i*3]) > GRID_SIZE) posAttr.array[i*3] *= -0.9;
                if (Math.abs(posAttr.array[i*3+1]) > GRID_SIZE) posAttr.array[i*3+1] *= -0.9;
                if (Math.abs(posAttr.array[i*3+2]) > GRID_SIZE) posAttr.array[i*3+2] *= -0.9;

                // Connection Logic: Connect nearest neighbors within a threshold
                if (i % 10 === 0 && connectionCount < PARTICLE_COUNT) {
                    const target = (i + 50) % PARTICLE_COUNT;
                    linePosAttr.array[connectionCount * 3] = posAttr.array[i * 3];
                    linePosAttr.array[connectionCount * 3 + 1] = posAttr.array[i * 3 + 1];
                    linePosAttr.array[connectionCount * 3 + 2] = posAttr.array[i * 3 + 2];
                    
                    linePosAttr.array[connectionCount * 3 + 3] = posAttr.array[target * 3];
                    linePosAttr.array[connectionCount * 3 + 4] = posAttr.array[target * 3 + 1];
                    linePosAttr.array[connectionCount * 3 + 5] = posAttr.array[target * 3 + 2];
                    connectionCount++;
                }
            }

            posAttr.needsUpdate = true;
            linePosAttr.needsUpdate = true;

            // UI update
            document.getElementById('freq').innerText = Math.floor(Math.sin(t) * 100 + 500);

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
