<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Kinetic Void</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050508; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // Configuration - A more ethereal, floating feel
        const COUNT = 50;
        const BOX_SIZE = 14;
        const BOUND = BOX_SIZE / 2;
        const GRAVITY = -4.0; // Lower gravity for "floaty" feeling
        const DAMPING = 0.85; // Higher energy loss on impact
        const RADIUS = 0.4;
        const COLORS = [0x00ffff, 0xff00ff, 0xffff00, 0x00ffaa];

        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050508, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(18, 12, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Lighting - Neon atmosphere
        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);

        const pointLights = [];
        for(let i=0; i<3; i++) {
            const pl = new THREE.PointLight(COLORS[i], 20, 20);
            pl.position.set(Math.random()*10-5, Math.random()*10-5, Math.random()*10-5);
            scene.add(pl);
            pointLights.push(pl);
        }

        // The Containment Field (Glassy/Wireframe)
        const boxGeo = new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE);
        const boxMat = new THREE.MeshPhongMaterial({ 
            color: 0x222244, 
            transparent: true, 
            opacity: 0.1, 
            side: THREE.BackSide 
        });
        const cube = new THREE.Mesh(boxGeo, boxMat);
        scene.add(cube);

        const edges = new THREE.EdgesGeometry(boxGeo);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x4444ff, transparent: true, opacity: 0.5 });
        const wireframe = new THREE.LineSegments(edges, lineMat);
        scene.add(wireframe);

        // Spheres with Glow effect (using Emissive)
        const spheres = [];
        const sphereGeo = new THREE.SphereGeometry(RADIUS, 32, 32);

        for (let i = 0; i < COUNT; i++) {
            const color = COLORS[Math.floor(Math.random() * COLORS.length)];
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x000000,
                emissive: new THREE.Color(color),
                emissiveIntensity: 2,
                roughness: 0,
                metalness: 1
            });
            const mesh = new THREE.Mesh(sphereGeo, material);
            
            mesh.position.set(
                (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2),
                (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2),
                (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2)
            );

            const velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 15
            );

            scene.add(mesh);
            spheres.push({ mesh, velocity });
        }

        const clock = new THREE.Clock();
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.032);
            time += dt;

            // Slow orbital camera movement
            camera.position.x = 20 * Math.cos(time * 0.1);
            camera.position.z = 20 * Math.sin(time * 0.1);
            camera.lookAt(0, 0, 0);

            spheres.forEach((s, i) => {
                // Apply gravity + a slight noise force to prevent stagnation
                s.velocity.y += GRAVITY * dt;
                s.velocity.x += Math.sin(time + i) * 0.5 * dt;

                s.mesh.position.addScaledVector(s.velocity, dt);

                const pos = s.mesh.position;

                // Wall collisions with "bounce" effect
                ['x', 'y', 'z'].forEach(axis => {
                    if (pos[axis] + RADIUS > BOUND) {
                        pos[axis] = BOUND - RADIUS;
                        s.velocity[axis] *= -DAMPING;
                    } else if (pos[axis] - RADIUS < -BOUND) {
                        pos[axis] = -BOUND + RADIUS;
                        s.velocity[axis] *= -DAMPING;
                    }
                });

                // Pulse the emission based on velocity
                const speed = s.velocity.length();
                s.mesh.material.emissiveIntensity = 1 + speed * 0.2;
            });

            // Move lights slightly for dynamic shadows/highlights
            pointLights.forEach((pl, i) => {
                pl.position.x = Math.sin(time * 0.5 + i) * 7;
                pl.position.y = Math.cos(time * 0.3 + i) * 7;
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
