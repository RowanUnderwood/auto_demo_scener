<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Synaptic Bloom</title>
<style>
* { margin: 0; padding: 0; }
html, body { overflow: hidden; background: #02030a; height: 100%; }
canvas { display: block; }
#vignette {
position: fixed; inset: 0; pointer-events: none; z-index: 2;
background: radial-gradient(ellipse at center, rgba(0,0,0,0) 38%, rgba(1,2,8,0.55) 78%, rgba(0,0,4,0.92) 100%);
}
#info {
position: fixed; top: 18px; left: 20px; z-index: 3;
font-family: 'Courier New', monospace;
color: rgba(120, 255, 230, 0.85);
font-size: 11px;
letter-spacing: 3px;
text-transform: uppercase;
pointer-events: none;
text-shadow: 0 0 12px rgba(0, 255, 200, 0.55);
}
#info span { color: rgba(180, 120, 255, 0.7); }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="info">SYNAPTIC BLOOM <span>v1.0</span></div>
<script type="importmap">
{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x02030a);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02030a, 0.010);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 0, 46);
camera.lookAt(0, 0, 0);

// --- Generate neural network structure ---
const nodes = [];
const connections = [];
const MAX_NODES = 620;
const MAX_DEPTH = 9;

function randDir() {
const theta = Math.random() * Math.PI * 2;
const phi = Math.acos(2 * Math.random() - 1);
return new THREE.Vector3(
Math.sin(phi) * Math.cos(theta),
Math.sin(phi) * Math.sin(theta),
Math.cos(phi)
).normalize();
}

function addNode(pos, depth, parentIdx) {
const idx = nodes.length;
nodes.push({ pos: pos.clone(), depth, parent: parentIdx, phase: Math.random() * Math.PI * 2 });
if (parentIdx !== -1) connections.push([parentIdx, idx]);
if (depth < MAX_DEPTH && nodes.length < MAX_NODES) {
const r = Math.random();
const branchCount = r < 0.32 ? 3 : (r < 0.62 ? 2 : 1);
for (let i = 0; i < branchCount && nodes.length < MAX_NODES; i++) {
const dir = randDir();
if (parentIdx >= 0) {
const parentPos = nodes[parentIdx].pos;
const toNew = pos.clone().sub(parentPos).normalize();
dir.lerp(toNew, 0.22).normalize();
}
const dist = 1.4 + Math.random() * 2.6 * (1 - depth / (MAX_DEPTH + 1));
const newPos = pos.clone().add(dir.multiplyScalar(dist));
addNode(newPos, depth + 1, idx);
}
}
}

addNode(new THREE.Vector3(0, 0, 0), 0, -1);
for (let i = 0; i < 5; i++) {
const dir = randDir();
addNode(dir.multiplyScalar(2.6), 0, -1);
}

// Precompute tip indices for spores
const tipIndices = [];
for (let i = 0; i < nodes.length; i++) if (nodes[i].depth >= MAX_DEPTH - 1) tipIndices.push(i);
if (tipIndices.length === 0) tipIndices.push(0);

// --- Central glow sprite ---
function makeGlowTexture() {
const c = document.createElement('canvas');
c.width = c.height = 256;
const ctx = c.getContext('2d');
const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
g.addColorStop(0, 'rgba(120,255,235,0.9)');
g.addColorStop(0.25, 'rgba(40,180,220,0.45)');
g.addColorStop(0.6, 'rgba(40,80,200,0.12)');
g.addColorStop(1, 'rgba(0,0,0,0)');
ctx.fillStyle = g;
ctx.fillRect(0, 0, 256, 256);
return new THREE.CanvasTexture(c);
}
const glowMat = new THREE.SpriteMaterial({
map: makeGlowTexture(),
transparent: true,
blending: THREE.AdditiveBlending,
depthWrite: false,
opacity: 0.55
});
const glow = new THREE.Sprite(glowMat);
glow.scale.setScalar(34);
scene.add(glow);

// --- Build InstancedMesh for nodes ---
const nodeGeo = new THREE.SphereGeometry(0.26, 10, 8);
const nodeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const nodeMesh = new THREE.InstancedMesh(nodeGeo, nodeMat, nodes.length);
const dummy = new THREE.Object3D();
const nodeColorArr = new Float32Array(nodes.length * 3);

for (let i = 0; i < nodes.length; i++) {
dummy.position.copy(nodes[i].pos);
const scale = 1.15 - nodes[i].depth * 0.07;
dummy.scale.setScalar(Math.max(scale, 0.35));
dummy.updateMatrix();
nodeMesh.setMatrixAt(i, dummy.matrix);
}
nodeMesh.instanceMatrix.needsUpdate = true;
nodeMesh.instanceColor = new THREE.InstancedBufferAttribute(nodeColorArr, 3);
scene.add(nodeMesh);

// --- Build connections as LineSegments with vertex colors ---
const connPositions = new Float32Array(connections.length * 6);
const connColors = new Float32Array(connections.length * 6);
const _c = new THREE.Color();
for (let i = 0; i < connections.length; i++) {
const [a, b] = connections[i];
connPositions.set([
nodes[a].pos.x, nodes[a].pos.y, nodes[a].pos.z,
nodes[b].pos.x, nodes[b].pos.y, nodes[b].pos.z
], i * 6);
const da = nodes[a].depth, db = nodes[b].depth;
_c.setHSL(0.60 - da * 0.02, 0.85, 0.18 + 0.30 * (1 - da / MAX_DEPTH));
connColors.set([_c.r, _c.g, _c.b], i * 6);
_c.setHSL(0.52 - db * 0.02, 0.9, 0.22 + 0.34 * (1 - db / MAX_DEPTH));
connColors.set([_c.r, _c.g, _c.b], i * 6 + 3);
}
const connGeo = new THREE.BufferGeometry();
connGeo.setAttribute('position', new THREE.BufferAttribute(connPositions, 3));
connGeo.setAttribute('color', new THREE.BufferAttribute(connColors, 3));
const connMat = new THREE.LineBasicMaterial({
vertexColors: true,
transparent: true,
opacity: 0.5,
blending: THREE.AdditiveBlending
});
const connLines = new THREE.LineSegments(connGeo, connMat);
scene.add(connLines);

// --- Signal particles traveling along connections ---
const NUM_SIGNALS = 130;
const signals = [];
for (let i = 0; i < NUM_SIGNALS; i++) {
signals.push({
connIdx: Math.floor(Math.random() * connections.length),
t: Math.random(),
speed: 0.35 + Math.random() * 0.85,
size: 0.5 + Math.random() * 0.7
});
}

const sigGeo = new THREE.BufferGeometry();
const sigPositions = new Float32Array(NUM_SIGNALS * 3);
const sigSizes = new Float32Array(NUM_SIGNALS);
const sigAlphas = new Float32Array(NUM_SIGNALS);
sigGeo.setAttribute('position', new THREE.BufferAttribute(sigPositions, 3));
sigGeo.setAttribute('aSize', new THREE.BufferAttribute(sigSizes, 1));
sigGeo.setAttribute('aAlpha', new THREE.BufferAttribute(sigAlphas, 1));

const sigVert = `
attribute float aSize;
attribute float aAlpha;
varying float vAlpha;
void main() {
vAlpha = aAlpha;
vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
gl_PointSize = aSize * (240.0 / -mvPosition.z);
gl_Position = projectionMatrix * mvPosition;
}
`;
const sigFrag = `
varying float vAlpha;
void main() {
vec2 uv = gl_PointCoord - 0.5;
float d = length(uv);
float glow = smoothstep(0.5, 0.0, d);
float core = smoothstep(0.12, 0.0, d);
vec3 color = mix(vec3(0.0, 1.0, 0.85), vec3(1.0, 1.0, 1.0), core);
gl_FragColor = vec4(color, (glow * 0.9 + core) * vAlpha);
}
`;
const sigMat = new THREE.ShaderMaterial({
vertexShader: sigVert,
fragmentShader: sigFrag,
transparent: true,
blending: THREE.AdditiveBlending,
depthWrite: false
});
const sigPoints = new THREE.Points(sigGeo, sigMat);
scene.add(sigPoints);

// --- Background stars ---
const starCount = 1800;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(starCount * 3);
const starCol = new Float32Array(starCount * 3);
const sc = new THREE.Color();
for (let i = 0; i < starCount; i++) {
starPos[i * 3] = (Math.random() - 0.5) * 220;
starPos[i * 3 + 1] = (Math.random() - 0.5) * 220;
starPos[i * 3 + 2] = (Math.random() - 0.5) * 220;
const pick = Math.random();
if (pick < 0.7) sc.setHSL(0.58, 0.5, 0.35 + Math.random() * 0.3);
else if (pick < 0.9) sc.setHSL(0.45, 0.6, 0.4 + Math.random() * 0.3);
else sc.setHSL(0.78, 0.5, 0.4 + Math.random() * 0.3);
starCol[i * 3] = sc.r; starCol[i * 3 + 1] = sc.g; starCol[i * 3 + 2] = sc.b;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
const starMat = new THREE.PointsMaterial({
vertexColors: true,
size: 0.22,
sizeAttenuation: true,
transparent: true,
opacity: 0.7,
blending: THREE.AdditiveBlending,
depthWrite: false
});
scene.add(new THREE.Points(starGeo, starMat));

// --- Spore particles drifting outward from tips ---
const SPORE_COUNT = 520;
const spores = [];
for (let i = 0; i < SPORE_COUNT; i++) {
const tip = nodes[tipIndices[Math.floor(Math.random() * tipIndices.length)]];
spores.push({
pos: tip.pos.clone(),
vel: randDir().multiplyScalar(0.25 + Math.random() * 0.6),
life: Math.random(),
maxLife: 3 + Math.random() * 4,
hue: Math.random() < 0.5 ? 0.48 : 0.78
});
}
const sporeGeo = new THREE.BufferGeometry();
const sporePos = new Float32Array(SPORE_COUNT * 3);
const sporeAlphas = new Float32Array(SPORE_COUNT);
const sporeSizes = new Float32Array(SPORE_COUNT);
const sporeHues = new Float32Array(SPORE_COUNT);
for (let i = 0; i < SPORE_COUNT; i++) sporeHues[i] = spores[i].hue;
sporeGeo.setAttribute('position', new THREE.BufferAttribute(sporePos, 3));
sporeGeo.setAttribute('aAlpha', new THREE.BufferAttribute(sporeAlphas, 1));
sporeGeo.setAttribute('aSize', new THREE.BufferAttribute(sporeSizes, 1));
sporeGeo.setAttribute('aHue', new THREE.BufferAttribute(sporeHues, 1));

const sporeVert = `
attribute float aSize;
attribute float aAlpha;
attribute float aHue;
varying float vAlpha;
varying float vHue;
void main() {
vAlpha = aAlpha;
vHue = aHue;
vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
gl_PointSize = aSize * (170.0 / -mvPosition.z);
gl_Position = projectionMatrix * mvPosition;
}
`;
const sporeFrag = `
varying float vAlpha;
varying float vHue;
void main() {
vec2 uv = gl_PointCoord - 0.5;
float d = length(uv);
float glow = smoothstep(0.5, 0.0, d);
vec3 c1 = vec3(0.0, 1.0, 0.85);
vec3 c2 = vec3(0.85, 0.35, 1.0);
vec3 color = mix(c1, c2, vHue);
gl_FragColor = vec4(color, glow * 0.6 * vAlpha);
}
`;
const sporeMat = new THREE.ShaderMaterial({
vertexShader: sporeVert,
fragmentShader: sporeFrag,
transparent: true,
blending: THREE.AdditiveBlending,
depthWrite: false
});
const sporePoints = new THREE.Points(sporeGeo, sporeMat);
scene.add(sporePoints);

// --- Bloom ---
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
new THREE.Vector2(window.innerWidth, window.innerHeight),
1.5, 0.55, 0.12
);
composer.addPass(bloomPass);

// --- Pointer parallax ---
const mouse = { x: 0, y: 0 };
const mouseTarget = { x: 0, y: 0 };
window.addEventListener('pointermove', (e) => {
mouseTarget.x = (e.clientX / window.innerWidth) * 2 - 1;
mouseTarget.y = (e.clientY / window.innerHeight) * 2 - 1;
});

// --- Animation ---
const clock = new THREE.Clock();
const nodeColorAttr = new THREE.Color();

function animate() {
requestAnimationFrame(animate);
const t = clock.getElapsedTime();

mouse.x += (mouseTarget.x - mouse.x) * 0.04;
mouse.y += (mouseTarget.y - mouse.y) * 0.04;

const rotAngle = t * 0.09;
const radius = 46;
camera.position.x = Math.sin(rotAngle) * radius + mouse.x * 4;
camera.position.z = Math.cos(rotAngle) * radius;
camera.position.y = Math.sin(t * 0.06) * 8 + mouse.y * -4;
camera.lookAt(0, 0, 0);

// Animate node colors: depth-graded hue + outward traveling wave
for (let i = 0; i < nodes.length; i++) {
const n = nodes[i];
const wave = 0.5 + 0.5 * Math.sin(t * 1.6 - n.depth * 0.7 + n.phase * 0.25);
const pulse = 0.25 + 0.75 * wave;
const hue = 0.60 - n.depth * 0.022 + 0.03 * Math.sin(t * 0.2);
nodeColorAttr.setHSL(hue, 0.85, 0.22 + pulse * 0.55);
nodeColorAttr.multiplyScalar(0.6 + 0.4 * (1 - n.depth / (MAX_DEPTH + 1)));
nodeColorAttr.r = Math.min(nodeColorAttr.r, 1.0);
nodeColorAttr.g = Math.min(nodeColorAttr.g, 1.0);
nodeColorAttr.b = Math.min(nodeColorAttr.b, 1.0);
nodeColorArr[i * 3] = nodeColorAttr.r;
nodeColorArr[i * 3 + 1] = nodeColorAttr.g;
nodeColorArr[i * 3 + 2] = nodeColorAttr.b;
}
nodeMesh.instanceColor.needsUpdate = true;

// Animate connection brightness (slow breathing)
connMat.opacity = 0.42 + 0.16 * Math.sin(t * 0.8);

// Update signals
for (let i = 0; i < NUM_SIGNALS; i++) {
const s = signals[i];
s.t += s.speed * 0.016;
if (s.t >= 1.0) {
s.t = 0;
s.connIdx = Math.floor(Math.random() * connections.length);
s.speed = 0.35 + Math.random() * 0.85;
}
const [a, b] = connections[s.connIdx];
const na = nodes[a], nb = nodes[b];
sigPositions[i * 3] = na.pos.x + (nb.pos.x - na.pos.x) * s.t;
sigPositions[i * 3 + 1] = na.pos.y + (nb.pos.y - na.pos.y) * s.t;
sigPositions[i * 3 + 2] = na.pos.z + (nb.pos.z - na.pos.z) * s.t;
const edge = Math.min(s.t, 1.0 - s.t);
sigAlphas[i] = Math.min(edge * 5.0, 1.0);
sigSizes[i] = s.size * (0.85 + 0.4 * Math.sin(t * 3 + i));
}
sigGeo.attributes.position.needsUpdate = true;
sigGeo.attributes.aAlpha.needsUpdate = true;
sigGeo.attributes.aSize.needsUpdate = true;

// Update spores
for (let i = 0; i < SPORE_COUNT; i++) {
const sp = spores[i];
sp.pos.add(sp.vel);
sp.life -= 0.016 / sp.maxLife;
if (sp.life <= 0) {
const tip = nodes[tipIndices[Math.floor(Math.random() * tipIndices.length)]];
sp.pos.copy(tip.pos);
sp.vel = randDir().multiplyScalar(0.25 + Math.random() * 0.6);
sp.life = 1.0;
sp.maxLife = 3 + Math.random() * 4;
}
sporePos[i * 3] = sp.pos.x;
sporePos[i * 3 + 1] = sp.pos.y;
sporePos[i * 3 + 2] = sp.pos.z;
sporeAlphas[i] = sp.life * sp.life;
sporeSizes[i] = 0.4 + 0.6 * sp.life;
}
sporeGeo.attributes.position.needsUpdate = true;
sporeGeo.attributes.aAlpha.needsUpdate = true;
sporeGeo.attributes.aSize.needsUpdate = true;

// Gentle breathing + glow pulse
const breathe = 1.0 + 0.04 * Math.sin(t * 0.5);
nodeMesh.scale.setScalar(breathe);
connLines.scale.setScalar(breathe);
glow.scale.setScalar(34 * (1.0 + 0.08 * Math.sin(t * 0.5)));
glowMat.opacity = 0.45 + 0.18 * (0.5 + 0.5 * Math.sin(t * 0.5));

composer.render();
}

animate();

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
