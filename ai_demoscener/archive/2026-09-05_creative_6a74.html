<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Hyperspace Organism</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
  #title {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-family: 'Courier New', monospace; font-size: 11px;
    color: rgba(100, 220, 255, 0.5); letter-spacing: 4px;
    text-transform: uppercase; pointer-events: none;
  }
</style>
</head>
<body>
<div id="title">hyperspace organism // v1.0</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 1.5, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

// === POST-PROCESSING ===
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.5, 0.2);
composer.addPass(bloomPass);

// === NUCLEUS ===
const nucleusGeo = new THREE.IcosahedronGeometry(1.1, 5);
const nucleusMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying float vDisp;

    void main() {
      vec3 pos = position;
      vec3 n = normalize(position);
      float t = uTime;

      float d = 0.0;
      d += 0.18 * sin(n.x * 3.0 + t * 1.2) * sin(n.y * 2.5 + t * 0.8);
      d += 0.14 * sin(n.y * 4.0 + t * 1.5) * sin(n.z * 3.5 + t * 1.1);
      d += 0.11 * sin(n.z * 5.0 + t * 0.9) * sin(n.x * 4.5 + t * 1.3);
      d += 0.07 * sin(n.x * 7.0 + t * 2.1) * sin(n.y * 6.0 + t * 1.7);
      d += 0.05 * sin(n.y * 9.0 + t * 3.0) * sin(n.z * 8.0 + t * 2.5);

      float beat = pow(max(0.0, sin(t * 2.5)), 8.0) * 0.25;
      d += beat;
      d += 0.12 * sin(t * 0.6);

      pos += n * d;
      vDisp = d;
      vNormal = normalMatrix * n;
      vec4 wp = modelMatrix * vec4(pos, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying float vDisp;

    void main() {
      vec3 viewDir = normalize(cameraPosition - vWorldPos);
      vec3 n = normalize(vNormal);
      float fresnel = pow(1.0 - abs(dot(viewDir, n)), 3.0);

      float hue = vDisp * 4.0 + fresnel * 1.5 + uTime * 0.08;
      vec3 col = 0.5 + 0.5 * cos(6.28318 * (hue + vec3(0.0, 0.33, 0.67)));

      float core = smoothstep(0.2, -0.1, vDisp);
      col = mix(col, vec3(0.05, 0.6, 0.7), core * 0.6);

      col += fresnel * vec3(1.0, 0.2, 0.7) * 0.9;

      float pulse = 0.85 + 0.15 * sin(uTime * 2.5);
      col *= pulse;

      col += vec3(0.1, 0.4, 0.5) * (1.0 - fresnel) * 0.3;

      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const nucleus = new THREE.Mesh(nucleusGeo, nucleusMat);
scene.add(nucleus);

// === MEMBRANE PARTICLES ===
const PCOUNT = 3000;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PCOUNT * 3);
const pCol = new Float32Array(PCOUNT * 3);
const pSeed = new Float32Array(PCOUNT);

for (let i = 0; i < PCOUNT; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 2.0 + Math.random() * 0.6;
  pPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  pPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  pPos[i * 3 + 2] = r * Math.cos(phi);
  pSeed[i] = Math.random() * 100;

  const hue = 0.45 + Math.random() * 0.25;
  const c = new THREE.Color().setHSL(hue, 0.85, 0.4 + Math.random() * 0.35);
  pCol[i * 3] = c.r;
  pCol[i * 3 + 1] = c.g;
  pCol[i * 3 + 2] = c.b;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));

const spCanvas = document.createElement('canvas');
spCanvas.width = 32; spCanvas.height = 32;
const sctx = spCanvas.getContext('2d');
const grd = sctx.createRadialGradient(16, 16, 0, 16, 16, 16);
grd.addColorStop(0, 'rgba(255,255,255,1)');
grd.addColorStop(0.4, 'rgba(255,255,255,0.4)');
grd.addColorStop(1, 'rgba(255,255,255,0)');
sctx.fillStyle = grd;
sctx.fillRect(0, 0, 32, 32);
const spTex = new THREE.CanvasTexture(spCanvas);

const pMat = new THREE.PointsMaterial({
  size: 0.05,
  map: spTex,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  vertexColors: true,
  sizeAttenuation: true
});
const membrane = new THREE.Points(pGeo, pMat);
scene.add(membrane);

// === ORGANELLES ===
const orgColors = [0x00ffcc, 0xff44aa, 0xffcc22, 0x44aaff, 0xff7733, 0xbb44ff];
const organelles = [];
for (let i = 0; i < 6; i++) {
  const geo = new THREE.SphereGeometry(0.1, 12, 12);
  const mat = new THREE.MeshBasicMaterial({ color: orgColors[i] });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);

  const params = {
    a: 2 + (i % 3),
    b: 3 + ((i + 1) % 3),
    c: 1 + (i % 4),
    phase: (i / 6) * Math.PI * 2,
    speed: 0.25 + Math.random() * 0.3,
    radius: 2.8 + i * 0.4
  };

  const lineGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 0)
  ]);
  const lineMat = new THREE.LineBasicMaterial({
    color: orgColors[i],
    transparent: true,
    opacity: 0.3
  });
  const line = new THREE.Line(lineGeo, lineMat);
  scene.add(line);

  organelles.push({ mesh, line, params });
}

// === AMBIENT DUST ===
const DUST_COUNT = 800;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_COUNT * 3);
for (let i = 0; i < DUST_COUNT; i++) {
  dustPos[i * 3] = (Math.random() - 0.5) * 40;
  dustPos[i * 3 + 1] = (Math.random() - 0.5) * 40;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 40;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  size: 0.03,
  color: 0x4488aa,
  transparent: true,
  opacity: 0.4,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

// === ANIMATION LOOP ===
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Update nucleus
  nucleusMat.uniforms.uTime.value = t;

  // Rotate membrane
  membrane.rotation.y = t * 0.15;
  membrane.rotation.x = Math.sin(t * 0.3) * 0.1;

  // Update organelles
  for (let i = 0; i < organelles.length; i++) {
    const { mesh, line, params } = organelles[i];
    const { a, b, c, phase, speed, radius } = params;
    const st = t * speed + phase;
    const x = radius * Math.sin(a * st) * Math.cos(b * st * 0.7);
    const y = radius * Math.sin(b * st * 0.5) * Math.sin(c * st * 0.8);
    const z = radius * Math.cos(a * st * 0.6) * Math.sin(c * st * 0.9);
    mesh.position.set(x, y, z);

    const positions = line.geometry.attributes.position.array;
    positions[0] = 0; positions[1] = 0; positions[2] = 0;
    positions[3] = x; positions[4] = y; positions[5] = z;
    line.geometry.attributes.position.needsUpdate = true;
  }

  // Rotate dust
  dust.rotation.y = t * 0.02;

  // Camera orbit
  const camAngle = t * 0.1;
  camera.position.x = Math.sin(camAngle) * 8;
  camera.position.z = Math.cos(camAngle) * 8;
  camera.position.y = 1.5 + Math.sin(t * 0.2) * 0.5;
  camera.lookAt(0, 0, 0);

  composer.render();
}

animate();

// === RESIZE ===
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
