<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDF Raymarcher</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const uniforms = {
            u_time: { value: 0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                precision highp float;
                uniform float u_time;
                uniform vec2 u_resolution;
                varying vec2 vUv;

                float sdSphere(vec3 p, float s) {
                    return length(p) - s;
                }

                float sdBox(vec3 p, vec3 b) {
                    vec3 q = abs(p) - b;
                    return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
                }

                float smin(float a, float b, float k) {
                    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
                    return mix(b, a, h) - k * h * (1.0 - h);
                }

                float map(vec3 p) {
                    // Repetition: mod(p, 4.0) - 2.0
                    vec3 q = mod(p, 4.0) - 2.0;
                    
                    // Animate position slightly
                    q.y += sin(u_time * 0.5) * 0.5;

                    float sphere = sdSphere(q, 1.2);
                    float box = sdBox(q, vec3(1.0));
                    
                    return smin(sphere, box, 0.5);
                }

                vec3 getNormal(vec3 p) {
                    const float e = 0.001;
                    const vec2 k = vec2(1, -1);
                    // Tetrahedron offset trick
                    return normalize(
                        k.xyy * map(p + k.xyy * e) +
                        k.yyx * map(p + k.yyx * e) +
                        k.yxy * map(p + k.yxy * e) +
                        k.xxx * map(p + k.xxx * e)
                    );
                }

                void main() {
                    vec2 uv = (vUv - 0.5) * vec2(u_resolution.x / u_resolution.y, 1.0);
                    
                    // Camera Setup
                    vec3 ro = vec3(0.0, 0.0, 8.0);
                    vec3 rd = normalize(vec3(uv, -1.5));

                    // Raymarching
                    float t = 0.0;
                    bool hit = false;
                    for (int i = 0; i < 80; i++) {
                        float d = map(ro + rd * t);
                        if (d < 0.001) {
                            hit = true;
                            break;
                        }
                        t += d;
                        if (t > 50.0) break;
                    }

                    vec3 color = vec3(0.05, 0.05, 0.1); // Background/Fog Color

                    if (hit) {
                        vec3 p = ro + rd * t;
                        vec3 n = getNormal(p);
                        vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                        
                        // Diffuse shading
                        float diff = max(dot(n, lightDir), 0.0);
                        vec3 baseColor = vec3(0.7, 0.8, 0.9);
                        color = baseColor * (diff + 0.15); // diffuse + ambient

                        // Simple depth-based fog
                        float fogFactor = smoothstep(5.0, 25.0, t);
                        color = mix(color, vec3(0.05, 0.05, 0.1), fogFactor);
                    } else {
                        // Background Fog for far distance
                        color = mix(color, vec3(0.02, 0.02, 0.05), 1.0);
                    }

                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });

        scene.add(new THREE.Mesh(geometry, material));

        function animate(time) {
            uniforms.u_time.value = time * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
