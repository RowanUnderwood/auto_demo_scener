<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AETHER_DRIFT // VOID_ENGINE</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #overlay {
            position: absolute;
            top: 40px;
            left: 40px;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 4px;
            font-size: 12px;
            text-transform: uppercase;
            pointer-events: none;
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            padding-left: 15px;
        }
        #status { font-weight: bold; color: #ff3e00; }
    </style>
</head>
<body>
    <div id="overlay">
        Sector: <span id="sector">NULL</span><br>
        Flux_Density: <span id="flux">0.00</span><br>
        Status: <span id="status">CALIBRATING</span>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        /**
         * CONCEPT: AETHER DRIFT
         * Shifted from "Neon Lattice" to "Liquid Monoliths".
         * Instead of a fractal box, we use a soft-signed distance field (SDF) 
         * of rotating, melting tori and spheres that create a visceral, organic movement.
         * Aesthetic: Darker, high-contrast gold/amber/obsidian palette with heavy bloom simulation via shader logic.
         */

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false }); // Performance optimization for raymarching
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const fragmentShader = `
            uniform float time;
            uniform vec2 resolution;
            uniform vec3 colorA;
            uniform vec3 colorB;

            mat2 rot(float a) { return mat2(cos(a), -sin(a), sin(a), cos(a)); }

            // Smooth minimum for organic blending
            float smin(float a, float b, float k) {
                float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
                return mix(b, a, h) - k * h * (1.0 - h);
            }

            // Distance function: Liquid-like primitives
            float map(vec3 p) {
                // Global rotation of the field
                p.xz *= rot(time * 0.15);
                p.xy *= rot(time * 0.1);
                
                // Create a repeating space of "blobs"
                vec3 q = mod(p + 2.0, 4.0) - 2.0;
                
                float d = length(q) - 1.2; // Large central sphere influence
                
                // Add several rotating tori/rings within the space
                for(float i=0.0; i<3.0; i++) {
                    vec3 tp = q;
                    tp.xz *= rot(time * (i + 1.0) * 0.5);
                    tp.xy *= rot(time * (i + 2.0) * 0.3);
                    float torus = length(vec2(length(tp.xz) - 0.8, tp.y)) - 0.1;
                    d = smin(d, torus, 0.5);
                }
                
                // Add some noise-like displacement via sine waves to make it "liquid"
                d += sin(p.x * 2.0 + time) * 0.1;
                d += cos(p.y * 2.0 + time) * 0.1;
                d += sin(p.z * 2.0 + time) * 0.1;

                return d;
            }

            vec3 getNormal(vec3 p) {
                vec2 e = vec2(0.005, 0.0);
                return normalize(vec3(
                    map(p + e.xyy) - map(p - e.xyy),
                    map(p + e.yxy) - map(p - e.yxy),
                    map(p + e.yyx) - map(p - e.yyx)
                ));
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy - 0.5 * resolution.xy) / min(resolution.y, resolution.x);
                
                // Camera Setup
                vec3 ro = vec3(0.0, 0.0, -5.0);
                vec3 rd = normalize(vec3(uv, 1.5));

                // Raymarching
                float t = 0.0;
                float d;
                for(int i=0; i<90; i++) {
                    d = map(ro + rd * t);
                    if(d < 0.001 || t > 25.0) break;
                    t += d;
                }

                vec3 col = vec3(0.02, 0.01, 0.05); // Deep void background

                if(t < 25.0) {
                    vec3 p = ro + rd * t;
                    vec3 n = getNormal(p);
                    vec3 lightDir = normalize(vec3(1.0, 1.0, -2.0));
                    
                    // Diffuse and Specular
                    float diff = max(dot(n, lightDir), 0.0);
                    float spec = pow(max(dot(reflect(-lightDir, n), -rd), 0.0), 64.0);
                    
                    // Material coloring: Gold/Amber gradient based on surface position and normals
                    vec3 matColor = mix(colorA, colorB, n.y * 0.5 + 0.5);
                    matColor += 0.1 * sin(p.z * 2.0 + time); // Subtle ripple effect

                    col = matColor * diff;
                    col += spec * 0.8; // High shine
                    
                    // Ambient occlusion approximation (depth-based)
                    float ao = exp(-t * 0.15);
                    col *= ao;

                    // Fresnel edge glow
                    float fresnel = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);
                    col += colorA * fresnel * 0.4;
                }

                // Post-processing: Vignette and Grain
                float vignette = smoothstep(1.5, 0.5, length(uv));
                col *= vignette;
                
                // Film grain
                float grain = fract(sin(dot(uv, vec2(12.9898, 78.233))) * 43758.5453);
                col += (grain - 0.5) * 0.04;

                gl_FragColor = vec4(col, 1.0);
            }
        `;

        const vertexShader = `
            void main() { gl_Position = vec4(position, 1.0); }
        `;

        // --- SETUP RENDERER & QUAD ---
        const quadGeo = new THREE.PlaneGeometry(2, 2);
        const quadMat = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                colorA: { value: new THREE.Color(0xffaa33) }, // Gold
                colorB: { value: new THREE.Color(0x331100) }  // Deep Amber/Brown
            },
            vertexShader,
            fragmentShader
        });
        const quad = new THREE.Mesh(quadGeo, quadMat);
        scene.add(quad);

        // --- ADDING FLOATING DUST (Particles) ---
        const partCount = 300;
        const partGeo = new THREE.BufferGeometry();
        const posArray = new Float32Array(partCount * 3);
        for(let i=0; i<partCount*3; i++) {
            posArray[i] = (Math.random() - 0.5) * 15;
        }
        partGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const partMat = new THREE.PointsMaterial({
            size: 0.04,
            color: 0xffccaa,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(partGeo, partMat);
        scene.add(particles);

        // --- UI ELEMENTS ---
        const sectorEl = document.getElementById('sector');
        const fluxEl = document.getElementById('flux');
        const statusEl = document.getElementById('status');
        const sectors = ["X-99", "VOID_01", "AETHER_NULL", "ORION_B", "ZENITH"];

        // --- MAIN LOOP ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            quadMat.uniforms.time.value = elapsed;

            // Animate particles for depth feeling
            particles.rotation.y = elapsed * 0.05;
            particles.rotation.x = elapsed * 0.02;
            const positions = particles.geometry.attributes.position.array;
            for(let i=0; i<partCount*3; i++) {
                positions[i] += Math.sin(elapsed + i) * 0.001;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // UI Logic
            if (Math.floor(elapsed * 2) % 100 === 0) {
                sectorEl.innerText = sectors[Math.floor(Math.random() * sectors.length)];
                statusEl.style.color = "#ff3e00";
                statusEl.innerText = "RECALIBRATING...";
            } else if (Math.floor(elapsed * 2) % 100 === 50) {
                statusEl.style.color = "#00ffcc";
                statusEl.innerText = "STABLE";
            }

            fluxEl.innerText = (Math.abs(Math.sin(elapsed)) * 100).toFixed(2);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            quadMat.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
