<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>L-System Tree</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const axiom = 'F';
const rules = {
    F: 'FF+[+F-F-F]-[-F+F+F]'
};

function generateLSystem(axiom, rules, iterations) {
    let currentString = axiom;
    for (let i = 0; i < iterations; i++) {
        currentString = currentString.split('').map(c => rules[c] || c).join('');
    }
    return currentString;
}

function drawTree(string) {
    const stack = [];
    let turtle = { x: 0, y: 0, z: 0, yaw: 0, pitch: 90, roll: 0 };
    const geometry = new THREE.BufferGeometry();
    const positions = [];
    const colors = [];

    for (const command of string) {
        if (command === 'F') {
            const nextX = turtle.x + Math.sin(turtle.yaw * Math.PI / 180) * 0.2;
            const nextZ = turtle.z - Math.cos(turtle.yaw * Math.PI / 180) * 0.2;
            positions.push(turtle.x, turtle.y, turtle.z, nextX, nextZ, turtle.y + 0.5);
            colors.push(0.5, 0.3, 0.1, 0.5, 0.3, 0.1);
            turtle.x = nextX;
            turtle.z = nextZ;
        } else if (command === '+') {
            turtle.yaw += 25;
        } else if (command === '-') {
            turtle.yaw -= 25;
        } else if (command === '[') {
            stack.push({ ...turtle });
            const twist = Math.random() * 10 - 5;
            turtle.roll += twist;
        } else if (command === ']') {
            turtle = stack.pop();
        }
    }

    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.computeVertexNormals();

    const material = new THREE.LineBasicMaterial({ color: 0x8B4513 });
    const line = new THREE.Line(geometry, material);
    scene.add(line);

    for (let i = 0; i < positions.length / 6; i++) {
        if ((i * 6 + 3) % 9 === 0) {
            const leafGeometry = new THREE.PlaneGeometry(0.1, 0.1);
            const leafMaterial = new THREE.MeshBasicMaterial({ color: 0x00FF00, side: THREE.DoubleSide });
            const leaf = new THREE.Mesh(leafGeometry, leafMaterial);
            leaf.position.set(positions[i * 6], positions[i * 6 + 1], positions[i * 6 + 2]);
            scene.add(leaf);
        }
    }
}

function animate() {
    requestAnimationFrame(animate);

    scene.traverse(child => {
        if (child instanceof THREE.Line) {
            child.geometry.attributes.position.needsUpdate = true;
            const positions = child.geometry.attributes.position.array;
            for (let i = 0; i < positions.length / 6; i++) {
                const sway = Math.sin(Date.now() * 0.001 + i) * 0.1;
                positions[i * 3] += sway;
            }
        }
    });

    renderer.render(scene, camera);
}

const lSystemString = generateLSystem(axiom, rules, 5);
drawTree(lSystemString);

animate();
</script>
</body>
</html>
