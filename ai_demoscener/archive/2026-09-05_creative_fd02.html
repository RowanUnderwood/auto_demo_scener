<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Neural Bloom</title>
<style>
*{margin:0;padding:0;overflow:hidden}
body{background:#000}
canvas{display:block}
#info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font:12px monospace;pointer-events:none}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.015);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

// --- Central Morphing Crystal ---
const crystalGeo = new THREE.IcosahedronGeometry(2, 4);
const crystalMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: {value: 0},
    uColor1: {value: new THREE.Color(0x00ffcc)},
    uColor2: {value: new THREE.Color(0xff00aa)}
  },
  vertexShader: `
    uniform float uTime;
    varying vec3 vNormal;
    varying float vDisp;
    void main(){
      vec3 pos = position;
      float d = sin(pos.x*2.0+uTime*1.5)*0.3 + cos(pos.y*3.0+uTime*0.8)*0.25 + sin(pos.z*4.0-uTime*1.2)*0.2;
      d += sin(length(pos)*5.0-uTime*2.0)*0.15;
      pos += normal * d;
      vDisp = d;
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    varying vec3 vNormal;
    varying float vDisp;
    void main(){
      float fresnel = pow(1.0-abs(dot(vNormal, vec3(0.0,0.0,1.0))), 2.0);
      vec3 col = mix(uColor1, uColor2, vDisp*2.0+0.5);
      float wire = smoothstep(0.4, 0.45, fract(vDisp*10.0));
      float intensity = fresnel * 1.5 + wire * 0.3 + 0.1;
      gl_FragColor = vec4(col * intensity, 0.85);
    }
  `,
  wireframe: true,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const crystal = new THREE.Mesh(crystalGeo, crystalMat);
scene.add(crystal);

// Inner solid glow
const innerGeo = new THREE.IcosahedronGeometry(1.2, 3);
const innerMat = new THREE.ShaderMaterial({
  uniforms: { uTime: {value:0} },
  vertexShader: `
    uniform float uTime;
    varying vec3 vPos;
    void main(){
      vec3 p = position;
      p += normal * sin(p.x*3.0+uTime)*0.1;
      vPos = p;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vPos;
    void main(){
      float pulse = 0.5+0.5*sin(uTime*2.0);
      vec3 col = mix(vec3(0.1,0.8,0.7), vec3(0.9,0.1,0.6), pulse);
      gl_FragColor = vec4(col*0.4, 0.6);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const inner = new THREE.Mesh(innerGeo, innerMat);
scene.add(inner);

// --- Particle Field ---
const P_COUNT = 4000;
const pPositions = new Float32Array(P_COUNT*3);
const pVelocities = new Float32Array(P_COUNT*3);
const pPhases = new Float32Array(P_COUNT);
const pSizes = new Float32Array(P_COUNT);

for(let i=0;i<P_COUNT;i++){
  const r = 4 + Math.random()*18;
  const theta = Math.random()*Math.PI*2;
  const phi = Math.acos(2*Math.random()-1);
  pPositions[i*3] = r*Math.sin(phi)*Math.cos(theta);
  pPositions[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
  pPositions[i*3+2] = r*Math.cos(phi);
  pVelocities[i*3] = (Math.random()-0.5)*0.02;
  pVelocities[i*3+1] = (Math.random()-0.5)*0.02;
  pVelocities[i*3+2] = (Math.random()-0.5)*0.02;
  pPhases[i] = Math.random()*Math.PI*2;
  pSizes[i] = 1.0+Math.random()*3.0;
}

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions,3));
pGeo.setAttribute('aPhase', new THREE.BufferAttribute(pPhases,1));
pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSizes,1));

const pMat = new THREE.ShaderMaterial({
  uniforms: { uTime:{value:0} },
  vertexShader: `
    attribute float aPhase;
    attribute float aSize;
    uniform float uTime;
    varying float vAlpha;
    varying vec3 vColor;
    void main(){
      vec3 pos = position;
      float wave = sin(uTime*0.8 + aPhase + length(pos)*0.3)*0.5+0.5;
      float bloom = sin(uTime*1.2 + aPhase*2.0)*0.5+0.5;
      pos += normalize(pos) * bloom * 2.0;
      vAlpha = wave * 0.7 + 0.1;
      vColor = mix(vec3(0.0,0.9,0.8), vec3(1.0,0.2,0.7), bloom);
      vColor = mix(vColor, vec3(0.3,0.4,1.0), sin(aPhase+uTime*0.5)*0.3+0.3);
      vec4 mvPos = modelViewMatrix * vec4(pos,1.0);
      gl_PointSize = aSize * (1.0+bloom*1.5) * (80.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying vec3 vColor;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if(d>0.5) discard;
      float glow = 1.0 - d*2.0;
      glow = pow(glow, 2.0);
      gl_FragColor = vec4(vColor * glow, vAlpha * glow);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// --- Connection Lines ---
const L_COUNT = 600;
const lPositions = new Float32Array(L_COUNT*6);
const lGeo = new THREE.BufferGeometry();
lGeo.setAttribute('position', new THREE.BufferAttribute(lPositions, 3));
const lMat = new THREE.ShaderMaterial({
  uniforms: { uTime:{value:0} },
  vertexShader: `
    varying float vY;
    void main(){
      vY = position.y;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying float vY;
    void main(){
      float pulse = 0.3+0.3*sin(uTime*2.0+vY*0.5);
      vec3 col = mix(vec3(0.0,0.7,0.6), vec3(0.8,0.1,0.5), 0.5+0.5*sin(uTime));
      gl_FragColor = vec4(col*pulse, 0.25);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const lines = new THREE.LineSegments(lGeo, lMat);
scene.add(lines);

// --- Outer Ring ---
const ringGeo = new THREE.TorusGeometry(22, 0.1, 8, 128);
const ringMat = new THREE.MeshBasicMaterial({color:0x114455, transparent:true, opacity:0.4, blending:THREE.AdditiveBlending});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI/2.5;
scene.add(ring);

const ring2Geo = new THREE.TorusGeometry(26, 0.05, 8, 128);
const ring2Mat = new THREE.MeshBasicMaterial({color:0x551133, transparent:true, opacity:0.3, blending:THREE.AdditiveBlending});
const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
ring2.rotation.x = Math.PI/1.8;
ring2.rotation.y = 0.5;
scene.add(ring2);

// --- Camera ---
camera.position.set(0, 3, 18);

// --- Animate ---
const clock = new THREE.Clock();
let lineTimer = 0;

function updateLines(time){
  for(let i=0;i<L_COUNT;i++){
    const a = (i*7+Math.floor(time*2)*3)%P_COUNT;
    const b = (i*13+Math.floor(time*2)*5+47)%P_COUNT;
    const ai = a*3, bi = b*3;
    const dx = pPositions[ai]-pPositions[bi];
    const dy = pPositions[ai+1]-pPositions[bi+1];
    const dz = pPositions[ai+2]-pPositions[bi+2];
    const dist = Math.sqrt(dx*dx+dy*dy+dz*dz);
    const li = i*6;
    if(dist < 8){
      lPositions[li]=pPositions[ai]; lPositions[li+1]=pPositions[ai+1]; lPositions[li+2]=pPositions[ai+2];
      lPositions[li+3]=pPositions[bi]; lPositions[li+4]=pPositions[bi+1]; lPositions[li+5]=pPositions[bi+2];
    } else {
      lPositions[li]=0; lPositions[li+1]=-100; lPositions[li+2]=0;
      lPositions[li+3]=0; lPositions[li+4]=-100; lPositions[li+5]=0;
    }
  }
  lGeo.attributes.position.needsUpdate = true;
}

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  crystalMat.uniforms.uTime.value = t;
  innerMat.uniforms.uTime.value = t;
  pMat.uniforms.uTime.value = t;
  lMat.uniforms.uTime.value = t;

  crystal.rotation.y = t*0.2;
  crystal.rotation.x = Math.sin(t*0.3)*0.2;
  inner.rotation.y = -t*0.3;

  ring.rotation.z = t*0.1;
  ring2.rotation.z = -t*0.07;

  // Slight particle drift
  for(let i=0;i<P_COUNT;i++){
    pPositions[i*3] += pVelocities[i*3]*Math.sin(t*0.5+pPhases[i]);
    pPositions[i*3+1] += pVelocities[i*3+1]*Math.cos(t*0.4+pPhases[i]);
    pPositions[i*3+2] += pVelocities[i*3+2]*Math.sin(t*0.6+pPhases[i]);
  }
  pGeo.attributes.position.needsUpdate = true;

  lineTimer += 1/60;
  if(lineTimer > 0.1){ updateLines(t); lineTimer = 0; }

  // Camera orbit
  const angle = t * 0.15;
  const radius = 16 + Math.sin(t*0.2)*3;
  camera.position.x = Math.cos(angle)*radius;
  camera.position.z = Math.sin(angle)*radius;
  camera.position.y = 3 + Math.sin(t*0.3)*2;
  camera.lookAt(0,0,0);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
<div id="info">NEURAL BLOOM — demoscene</div>
</body>
</html>
