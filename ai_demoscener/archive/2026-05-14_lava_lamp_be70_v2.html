<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SDF Bioluminescent Helix</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js"
    }
}
</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const vertexShader = `
    varying vec2 vUv;
    void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
    }
`;

const fragmentShader = `
    precision highp float;
    varying vec2 vUv;
    
    uniform float uTime;
    uniform vec2 uResolution;
    
    #define PI 3.14159265359
    
    float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
    }
    
    float sdSphere(vec3 p, vec3 c, float r) {
        return length(p - c) - r;
    }
    
    float sdCapsule(vec3 p, vec3 a, vec3 b, float r) {
        vec3 pa = p - a, ba = b - a;
        float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
        return length(pa - ba * h) - r;
    }
    
    vec3 helixPoint(int i, float t) {
        float n = 10.0;
        float f = float(i) / n;
        float angle = f * PI * 2.0 * 1.5 + t * 0.3;
        float y = (f - 0.5) * 3.0 + sin(t * 0.5 + f * 6.28) * 0.25;
        float radius = 1.8 + sin(t * 0.7 + f * 4.0) * 0.4;
        return vec3(cos(angle) * radius, y, sin(angle) * radius);
    }
    
    vec2 map(vec3 p) {
        float t = uTime * 0.5;
        
        // Breathing pulse
        float pulse = 0.85 + 0.15 * sin(t * 1.2);
        
        vec3 prev = helixPoint(0, t);
        float d = sdSphere(p, prev, 0.55 * pulse);
        
        for (int i = 1; i < 10; i++) {
            vec3 cur = helixPoint(i, t);
            float radius = 0.4 + 0.35 * pulse;
            float dist = sdCapsule(p, prev, cur, radius);
            d = smin(d, dist, 0.8);
            prev = cur;
        }
        
        // End caps as spheres
        vec3 start = helixPoint(0, t);
        vec3 end = helixPoint(9, t);
        d = smin(d, sdSphere(p, start, 0.6 * pulse), 0.6);
        d = smin(d, sdSphere(p, end, 0.6 * pulse), 0.6);
        
        return vec2(d, 0.0);
    }
    
    vec3 calcNormal(vec3 p) {
        const float e = 0.001;
        vec2 h = vec2(e, 0.0);
        return normalize(vec3(
            map(p + h.xyy).x - map(p - h.xyy).x,
            map(p + h.yxy).x - map(p - h.yxy).x,
            map(p + h.yyx).x - map(p - h.yyx).x
        ));
    }
    
    float softShadow(vec3 ro, vec3 rd, float mint, float maxt, float k) {
        float res = 1.0;
        float t = mint;
        for (int i = 0; i < 48; i++) {
            float h = map(ro + rd * t).x;
            if (h < 0.001) return 0.0;
            res = min(res, k * h / t);
            t += clamp(h, 0.03, 0.3);
            if (t > maxt || res < 0.005) break;
        }
        return clamp(res, 0.0, 1.0);
    }
    
    float calcAO(vec3 p, vec3 n) {
        float ao = 0.0;
        float scale = 1.0;
        for (int i = 1; i <= 5; i++) {
            float dist = 0.06 * float(i);
            float sampledDist = map(p + n * dist).x;
            ao -= (dist - sampledDist) * scale;
            scale *= 0.5;
        }
        return clamp(1.0 - 2.5 * ao, 0.0, 1.0);
    }
    
    // Iridescent color based on view angle
    vec3 iridescent(float cosTheta, float time) {
        float hue = cosTheta * 1.2 + time * 0.2;
        return 0.5 + 0.5 * cos(6.28318 * (hue + vec3(0.0, 0.33, 0.67)));
    }
    
    void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;
        
        // Camera orbits slowly
        float camAngle = uTime * 0.15;
        float camDist = 13.0;
        float camY = 1.0 + sin(uTime * 0.1) * 0.5;
        vec3 ro = vec3(sin(camAngle) * camDist, camY, cos(camAngle) * camDist);
        vec3 target = vec3(0.0, 0.0, 0.0);
        
        vec3 fwd = normalize(target - ro);
        vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), fwd));
        vec3 up = cross(fwd, right);
        
        vec3 rd = normalize(fwd * 2.8 + right * uv.x + up * uv.y);
        
        // Deep ocean background gradient
        float bgT = clamp(rd.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 bgColor = mix(
            vec3(0.01, 0.02, 0.05),   // near black navy
            vec3(0.02, 0.08, 0.12),   // deep teal
            bgT * bgT
        );
        
        // Subtle noise in background
        float bgNoise = sin(rd.x * 20.0 + uTime * 0.2) * sin(rd.y * 15.0 + uTime * 0.15) * 0.008;
        bgColor += bgNoise;
        
        // Raymarching
        float t = 0.0;
        bool hit = false;
        
        for (int i = 0; i < 128; i++) {
            vec3 p = ro + rd * t;
            float dist = map(p).x;
            if (dist < 0.0004) {
                hit = true;
                break;
            }
            if (t > 25.0) break;
            t += dist;
        }
        
        vec3 finalColor = bgColor;
        
        if (hit) {
            vec3 pHit = ro + rd * t;
            vec3 normal = calcNormal(pHit);
            
            vec3 viewDir = normalize(ro - pHit);
            
            // Primary light: cold blue-white from above
            vec3 light1Pos = vec3(2.0, 6.0, -3.0);
            vec3 light1Dir = normalize(light1Pos - pHit);
            float light1Dist = length(light1Pos - pHit);
            float shadow1 = softShadow(pHit + normal * 0.01, light1Dir, 0.05, light1Dist, 12.0);
            
            // Secondary light: deep cyan from below-left
            vec3 light2Pos = vec3(-4.0, -3.0, 3.0);
            vec3 light2Dir = normalize(light2Pos - pHit);
            
            // Tertiary: warm accent from right (very subtle)
            vec3 light3Pos = vec3(5.0, 0.5, 5.0);
            vec3 light3Dir = normalize(light3Pos - pHit);
            
            float diff1 = max(dot(normal, light1Dir), 0.0);
            float diff2 = max(dot(normal, light2Dir), 0.0);
            float diff3 = max(dot(normal, light3Dir), 0.0);
            
            // Specular
            vec3 half1 = normalize(light1Dir + viewDir);
            float spec1 = pow(max(dot(normal, half1), 0.0), 32.0);
            
            vec3 half2 = normalize(light2Dir + viewDir);
            float spec2 = pow(max(dot(normal, half2), 0.0), 24.0);
            
            // Fresnel
            float fresnel = pow(1.0 - max(dot(normal, -viewDir), 0.0), 3.5);
            
            // AO
            float ao = calcAO(pHit, normal);
            
            // Iridescent tint based on viewing angle
            float cosTheta = dot(normal, viewDir);
            vec3 iridColor = iridescent(cosTheta, uTime);
            
            // Material
            vec3 matBase = vec3(0.03, 0.06, 0.08); // dark bioluminescent base
            
            // Combine lighting
            vec3 light1Color = vec3(0.4, 0.6, 0.9) * shadow1;
            vec3 light2Color = vec3(0.1, 0.5, 0.7) * 0.7;
            vec3 light3Color = vec3(0.3, 0.2, 0.5) * 0.3;
            
            vec3 ambient = vec3(0.06, 0.08, 0.12) * ao;
            vec3 diffuse = (light1Color * diff1 + light2Color * diff2 + light3Color * diff3) * matBase * 3.0 * ao;
            vec3 specular = light1Color * spec1 * 0.8 + light2Color * spec2 * 0.4;
            
            // Bioluminescent glow - pulsing inner light
            float bioPulse = 0.7 + 0.3 * sin(uTime * 0.8 + pHit.y * 2.0);
            vec3 bioGlow = vec3(0.1, 0.8, 0.9) * bioPulse * 0.15 * (1.0 - ao);
            
            // Iridescent rim
            vec3 iridRim = iridColor * fresnel * 0.4 * ao;
            
            // Subsurface scattering approximation
            float sss = pow(max(dot(viewDir, -light2Dir), 0.0), 3.0);
            vec3 sssColor = vec3(0.05, 0.4, 0.5) * sss * ao;
            
            finalColor = ambient + diffuse + specular + bioGlow + iridRim + sssColor;
            
            // Distance fog into deep water
            float fogFactor = 1.0 - exp(-t * t * 0.003);
            finalColor = mix(finalColor, vec3(0.01, 0.04, 0.07), fogFactor);
        }
        
        // Post-processing: subtle vignette
        float vig = 1.0 - length(uv * 0.7) * 0.4;
        finalColor *= vig;
        
        // Tone mapping (ACES-like)
        finalColor = (finalColor * (2.51 * finalColor + 0.03)) / (finalColor * (2.43 * finalColor + 0.59) + 0.14);
        
        // Gamma
        finalColor = pow(clamp(finalColor, 0.0, 1.0), vec3(0.9));
        
        gl_FragColor = vec4(finalColor, 1.0);
    }
`;

const uniforms = {
    uTime: { value: 0 },
    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
};

const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms,
});

const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
scene.add(quad);

function animate(time) {
    requestAnimationFrame(animate);
    uniforms.uTime.value = time * 0.001;
    renderer.render(scene, camera);
}

requestAnimationFrame((t) => {
    uniforms.uTime.value = t * 0.001;
    requestAnimationFrame(animate);
});

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
