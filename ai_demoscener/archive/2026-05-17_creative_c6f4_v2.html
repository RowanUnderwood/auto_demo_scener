<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Abyssal Bloom</title>
<style>
*{margin:0;padding:0;overflow:hidden}
body{background:#04141a}
canvas{display:block}
#label{position:fixed;bottom:22px;left:0;right:0;text-align:center;
  font-family:ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:0.35em;
  font-size:11px;color:#2f7d86;opacity:0.55;pointer-events:none;text-transform:uppercase}
</style>
</head>
<body>
<div id="label">Abyssal Bloom</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const BG = 0x04141a;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.FogExp2(BG, 0.011);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, -2, 55);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.9, 0.15);
bloomPass.strength = 1.35;
bloomPass.radius = 0.95;
bloomPass.threshold = 0.15;
composer.addPass(bloomPass);

// ---- Plankton field ----
const N = 300;
const positions = new Float32Array(N * 3);
const colors = new Float32Array(N * 3);
const sizes = new Float32Array(N);
const phase = new Float32Array(N);
const seed = new Float32Array(N);

for (let i = 0; i < N; i++) {
  positions[i*3]   = (Math.random() - 0.5) * 90;
  positions[i*3+1] = (Math.random() - 0.5) * 70;
  positions[i*3+2] = (Math.random() - 0.5) * 55;
  sizes[i] = 1.2 + Math.random() * 2.6;
  phase[i] = Math.random() * Math.PI * 2;
  seed[i]  = Math.random() * 100;
  colors[i*3] = 0.1; colors[i*3+1] = 0.5; colors[i*3+2] = 0.55;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

const mat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: `
    attribute float size;
    attribute vec3 color;
    varying vec3 vColor;
    uniform float time;
    void main(){
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      float tw = 0.75 + 0.25 * sin(time*1.5 + position.y*0.4 + position.x*0.2);
      gl_PointSize = size * tw * (180.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vColor;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if(d > 0.5) discard;
      float core = exp(-d*10.0);
      float halo = exp(-d*4.0)*0.5;
      gl_FragColor = vec4(vColor*(core+halo)*1.6, (core+halo));
    }`,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
scene.add(new THREE.Points(geo, mat));

// ---- Filaments ----
const maxDist = 13;
const maxLines = N * 5;
const linePos = new Float32Array(maxLines * 2 * 3);
const lineCol = new Float32Array(maxLines * 2 * 3);
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
lineGeo.setAttribute('color', new THREE.BufferAttribute(lineCol, 3));
const lineMat = new THREE.LineBasicMaterial({
  vertexColors: true, transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
});
scene.add(new THREE.LineSegments(lineGeo, lineMat));

function updateLines(){
  const p = geo.attributes.position.array;
  const c = geo.attributes.color.array;
  let idx = 0;
  for (let i = 0; i < N && idx < maxLines; i++){
    for (let j = i+1; j < N && idx < maxLines; j++){
      const dx=p[i*3]-p[j*3], dy=p[i*3+1]-p[j*3+1], dz=p[i*3+2]-p[j*3+2];
      const d2 = dx*dx+dy*dy+dz*dz;
      if (d2 < maxDist*maxDist){
        const fade = 1.0 - Math.sqrt(d2)/maxDist;
        const f = fade*fade*0.6;
        linePos[idx*6]=p[i*3]; linePos[idx*6+1]=p[i*3+1]; linePos[idx*6+2]=p[i*3+2];
        linePos[idx*6+3]=p[j*3]; linePos[idx*6+4]=p[j*3+1]; linePos[idx*6+5]=p[j*3+2];
        lineCol[idx*6]=c[i*3]*f; lineCol[idx*6+1]=c[i*3+1]*f; lineCol[idx*6+2]=c[i*3+2]*f;
        lineCol[idx*6+3]=c[j*3]*f; lineCol[idx*6+4]=c[j*3+1]*f; lineCol[idx*6+5]=c[j*3+2]*f;
        idx++;
      }
    }
  }
  lineGeo.setDrawRange(0, idx*2);
  lineGeo.attributes.position.needsUpdate = true;
  lineGeo.attributes.color.needsUpdate = true;
}

// ---- Bioluminescent ripples ----
const ringGeo = new THREE.RingGeometry(0.85, 1.0, 40);
const ripples = [];
function spawnRipple(){
  const i = (Math.random()*N)|0;
  const p = geo.attributes.position.array;
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
    color: 0xffe08a, side: THREE.DoubleSide, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  m.position.set(p[i*3], p[i*3+1], p[i*3+2]);
  const dir = new THREE.Vector3(Math.random()-0.5,Math.random()-0.5,Math.random()-0.5)
    .normalize().multiplyScalar(0.05 + Math.random()*0.08);
  scene.add(m);
  ripples.push({ m, dir, life: 1.0, decay: 0.006 + Math.random()*0.012 });
}
function updateRipples(){
  for (let i = ripples.length-1; i >= 0; i--){
    const r = ripples[i];
    r.m.position.add(r.dir);
    r.m.position.y += 0.02;            // gentle upward drift
    r.life -= r.decay;
    r.m.scale.setScalar(0.5 + (1.0 - r.life) * 7.0);
    r.m.material.opacity = Math.max(0, r.life) * 0.7;
    r.m.lookAt(camera.position);       // billboard
    if (r.life <= 0){
      scene.remove(r.m); r.m.material.dispose(); ripples.splice(i,1);
    }
  }
}

// ---- Flow field ----
const S = 0.04;
const col = new THREE.Color();
function flow(x,y,z,t, out){
  out.x = Math.sin(y*S + t*0.15)*0.5 + Math.cos(z*S*1.3 - t*0.10)*0.35;
  out.y = Math.sin(z*S + t*0.12)*0.5 + Math.cos(x*S*1.2 + t*0.08)*0.35;
  out.z = Math.sin(x*S - t*0.10)*0.4 + Math.cos(y*S*0.9 + t*0.13)*0.3;
}

const clock = new THREE.Clock();
const v = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const p = geo.attributes.position.array;
  const c = geo.attributes.color.array;

  for (let i = 0; i < N; i++){
    const x=p[i*3], y=p[i*3+1], z=p[i*3+2];
    flow(x,y,z,t,v);
    p[i*3]   += v.x*0.16 - x*0.0006;
    p[i*3+1] += v.y*0.16 - y*0.0006;
    p[i*3+2] += v.z*0.14 - z*0.0006;

    const shimmer = 0.5 + 0.5*Math.sin(t*0.8 + phase[i]);
    const hue = 0.48 + 0.06*Math.sin(t*0.2 + seed[i]*0.1);
    col.setHSL(hue, 0.85, 0.35 + shimmer*0.28);
    c[i*3]=col.r; c[i*3+1]=col.g; c[i*3+2]=col.b;
  }

  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate = true;
  mat.uniforms.time.value = t;
  updateLines();

  if (Math.random() < 0.06) spawnRipple();
  updateRipples();

  camera.position.x = Math.sin(t*0.05)*18;
  camera.position.y = Math.cos(t*0.04)*10 - 3;
  camera.position.z = 52 + Math.sin(t*0.03)*8;
  camera.lookAt(0,0,0);

  composer.render();
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
