<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Chromatic Vortex</title>
<style>
*{margin:0;padding:0;overflow:hidden;background:#000}
canvas{display:block}
#info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-family:monospace;font-size:12px;opacity:0.6;pointer-events:none;text-align:center}
</style>
</head>
<body>
<div id="info">CHROMATIC VORTEX — click to detonate</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const COUNT = 60000;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
camera.position.z = 0;
camera.position.y = 0;
const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// Particle system
const geo = new THREE.BufferGeometry();
const positions = new Float32Array(COUNT * 3);
const colors = new Float32Array(COUNT * 4);
const sizes = new Float32Array(COUNT);
const seeds = new Float32Array(COUNT * 4);

for (let i = 0; i < COUNT; i++) {
  const s0 = Math.random() * Math.PI * 2;
  const s1 = Math.random() * 40 + 2;
  const s2 = Math.random();
  const s3 = Math.random() * Math.PI * 2;
  seeds[i*4] = s0;
  seeds[i*4+1] = s1;
  seeds[i*4+2] = s2;
  seeds[i*4+3] = s3;
  sizes[i] = Math.random() * 2 + 0.5;

  const hue = (s0 * 0.1 + s2 * 0.3) % 1.0;
  const c = new THREE.Color().setHSL(hue, 0.9, 0.5);
  colors[i*4] = c.r;
  colors[i*4+1] = s1;
  colors[i*4+2] = s2;
  colors[i*4+3] = s3;
}
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colors, 4));
geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

// Custom shader material
const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uExplode: { value: 0 },
    uPixelRatio: { value: Math.min(devicePixelRatio, 2) }
  },
  vertexShader: `
    attribute float size;
    attribute vec4 color;
    uniform float uTime;
    uniform float uExplode;
    uniform float uPixelRatio;
    varying vec3 vColor;
    varying float vFade;
    
    void main() {
      vColor = vec3(color.r, color.g, color.b);
      float t = uTime;
      float seed = color.r * 6.28318;
      float radius = color.g;
      float speed = color.b;
      float phase = color.a;
      
      // Lissajous tunnel
      float angle = seed + t * (0.3 + speed * 0.5);
      float z = mod(seed * 10.0 + t * 5.0 * (0.5 + speed), 100.0) - 50.0;
      
      float r = radius * (0.5 + 0.5 * sin(t * 0.7 + phase + z * 0.1));
      float x = r * cos(angle) + sin(t * 1.3 + phase) * 2.0;
      float y = r * sin(angle) + cos(t * 1.1 + phase * 1.3) * 2.0;
      
      // Vortex twist
      float twist = z * 0.08 + t * 0.2;
      float cx = x * cos(twist) - y * sin(twist);
      float cy = x * sin(twist) + y * cos(twist);
      
      // Explode
      float ex = uExplode * 8.0;
      cx += cx * ex * (0.5 + speed);
      cy += cy * ex * (0.5 + speed);
      z += ex * sin(seed * 3.0) * 5.0;
      
      vec3 pos = vec3(cx, cy, z);
      
      // Camera follows z
      pos.z += 50.0;
      
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      
      float dist = length(mvPosition.xyz);
      vFade = smoothstep(80.0, 20.0, dist);
      gl_PointSize = size * uPixelRatio * (100.0 / dist) * (1.0 + uExplode * 0.5);
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vFade;
    
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float glow = 1.0 - d * 2.0;
      glow = pow(glow, 1.5);
      gl_FragColor = vec4(vColor * glow * 1.5, glow * vFade * 0.8);
    }
  `,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true
});

const points = new THREE.Points(geo, mat);
scene.add(points);

// Star background
const starGeo = new THREE.BufferGeometry();
const starCount = 3000;
const starPos = new Float32Array(starCount * 3);
const starCol = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i*3] = (Math.random() - 0.5) * 200;
  starPos[i*3+1] = (Math.random() - 0.5) * 200;
  starPos[i*3+2] = (Math.random() - 0.5) * 200;
  const b = Math.random() * 0.3 + 0.1;
  starCol[i*3] = b;
  starCol[i*3+1] = b;
  starCol[i*3+2] = b * 1.2;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
const starMat = new THREE.PointsMaterial({size:0.3,vertexColors:true,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false});
scene.add(new THREE.Points(starGeo, starMat));

// Ring structures
const rings = [];
for (let r = 0; r < 5; r++) {
  const ringGeo = new THREE.TorusGeometry(5 + r * 4, 0.05, 8, 128);
  const ringMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color().setHSL(r * 0.15, 1, 0.5),
    transparent: true,
    opacity: 0.15,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.z = -20 - r * 15;
  ring.rotation.x = Math.random() * 0.3;
  ring.rotation.y = Math.random() * 0.3;
  scene.add(ring);
  rings.push(ring);
}

// Explosion state
let explodeTarget = 0;
let explodeCurrent = 0;

document.addEventListener('click', () => {
  explodeTarget = 1;
});

document.addEventListener('keydown', (e) => {
  if (e.key === ' ') explodeTarget = 1;
});

// Color update
function updateColors(time) {
  const colAttr = geo.attributes.color;
  for (let i = 0; i < COUNT; i++) {
    const s0 = seeds[i*4];
    const s1 = seeds[i*4+1];
    const s2 = seeds[i*4+2];
    const s3 = seeds[i*4+3];
    
    const hue = (s0 * 0.1 + time * 0.05 + s2 * 0.3) % 1.0;
    const c = new THREE.Color().setHSL(hue, 0.9, 0.5 + 0.2 * Math.sin(time + s3));
    
    colAttr.array[i*4] = c.r;
    colAttr.array[i*4+1] = s1;
    colAttr.array[i*4+2] = s2;
    colAttr.array[i*4+3] = s3;
  }
  colAttr.needsUpdate = true;
}

let lastColorUpdate = 0;
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  
  mat.uniforms.uTime.value = t;
  
  // Explosion decay
  explodeCurrent += (explodeTarget - explodeCurrent) * 0.05;
  if (explodeTarget === 1 && explodeCurrent > 0.95) {
    explodeTarget = 0;
  }
  mat.uniforms.uExplode.value = explodeCurrent;
  
  // Update colors every few frames
  lastColorUpdate += 1;
  if (lastColorUpdate > 3) {
    updateColors(t);
    lastColorUpdate = 0;
  }
  
  // Animate rings
  for (let i = 0; i < rings.length; i++) {
    rings[i].rotation.z = t * (0.1 + i * 0.05) * (i % 2 === 0 ? 1 : -1);
    rings[i].rotation.x = Math.sin(t * 0.3 + i) * 0.2;
    rings[i].material.opacity = 0.1 + 0.08 * Math.sin(t * 0.5 + i * 1.2) + explodeCurrent * 0.3;
    rings[i].scale.setScalar(1.0 + explodeCurrent * 0.5 * (i + 1) * 0.3);
  }
  
  // Camera sway
  camera.position.x = Math.sin(t * 0.2) * 1.5;
  camera.position.y = Math.cos(t * 0.15) * 1.0;
  camera.lookAt(0, 0, 5);
  
  // Star rotation
  starGeo.rotateZ(0.0003);
  
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
