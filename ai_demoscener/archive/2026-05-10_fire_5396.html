<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Fire Shader</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const vertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;

    const fragmentShader = `
        uniform float uTime;
        uniform vec2 uResolution;
        varying vec2 vUv;

        float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }

        float valueNoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            
            float a = hash(i);
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));

            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        float fbm(vec2 p) {
            float v = 0.0;
            float amp = 0.5;
            for (int i = 0; i < 3; i++) {
                v += amp * valueNoise(p);
                p *= 2.0;
                amp *= 0.5;
            }
            return v;
        }

        vec3 getPalette(float t) {
            vec3 black = vec3(0.0, 0.0, 0.0);
            vec3 red = vec3(1.0, 0.1, 0.0);
            vec3 orange = vec3(1.0, 0.5, 0.0);
            vec3 yellow = vec3(1.0, 1.0, 0.2);
            vec3 white = vec3(1.0, 1.0, 1.0);

            if (t < 0.2) return mix(black, red, t / 0.2);
            if (t < 0.5) return mix(red, orange, (t - 0.2) / 0.3);
            if (t < 0.8) return mix(orange, yellow, (t - 0.5) / 0.3);
            return mix(yellow, white, clamp((t - 0.8) / 0.2, 0.0, 1.0));
        }

        void main() {
            vec2 uv = vUv;
            
            // Transform UVs: sample at uv*vec2(3,1) and offset y by -time * 0.5
            vec2 noiseUv = uv * vec2(3.0, 1.0);
            noiseUv.y += (-uTime * 0.5);

            // Calculate Noise intensity
            float n = fbm(noiseUv);

            // Masking: inverted smoothstep(0.0, 0.4, uv.y) + horizontal falloff
            float vMask = 1.0 - smoothstep(0.0, 0.4, uv.y);
            float hMask = smoothstep(0.0, 0.2, uv.x) * smoothstep(1.0, 0.8, uv.x);
            float mask = vMask * hMask;

            float intensity = n * mask;

            // Color mapping
            vec3 color = getPalette(intensity);

            gl_FragColor = vec4(color, 1.0);
        }
    `;

    let scene, camera, renderer, material;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader,
            fragmentShader
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
    }

    function animate(time) {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value = time * 0.001;
        renderer.render(scene, camera);
    }

    init();
    animate(0);
</script>
</body>
</html>
