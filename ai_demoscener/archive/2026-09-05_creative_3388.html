<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Synaptic Storm</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #04060f; height: 100%; }
  canvas { display: block; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 50%,
      rgba(8,10,30,0.0) 35%,
      rgba(4,5,18,0.35) 70%,
      rgba(2,2,10,0.9) 100%);
    mix-blend-mode: multiply;
  }
  #grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(ellipse at 50% 42%,
      rgba(60,70,160,0.10) 0%,
      rgba(20,20,60,0.0) 45%);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="grain"></div>
<div id="vignette"></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x05070f);
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.55, 0.32);
composer.addPass(bloomPass);

// --- Central soft glow sprite ---
function makeGlowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0.0, 'rgba(120,130,255,0.9)');
  g.addColorStop(0.25, 'rgba(70,80,200,0.35)');
  g.addColorStop(0.6, 'rgba(30,35,110,0.08)');
  g.addColorStop(1.0, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,256,256);
  const t = new THREE.CanvasTexture(c); return t;
}
const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture(), color: 0x6a72ff,
  blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.35
}));
glowSprite.scale.setScalar(34);
scene.add(glowSprite);

// --- Neurons ---
const NUM = 240;
const basePos = [];
const wPos = [];          // wobbled live positions
const excite = new Float32Array(NUM);
const refractory = new Float32Array(NUM);
const phase = new Float32Array(NUM);
const wobAmp = new Float32Array(NUM);
const baseCol = new Float32Array(NUM * 3);

// palette: indigo, violet, cyan
const palette = [
  [0.18, 0.22, 0.70],
  [0.45, 0.22, 0.72],
  [0.20, 0.55, 0.80],
  [0.30, 0.30, 0.85]
];

for (let i = 0; i < NUM; i++) {
  const phi = Math.acos(1 - 2 * (i + 0.5) / NUM);
  const theta = Math.PI * (1 + Math.sqrt(5)) * i;
  const r = 7 + Math.random() * 5;
  const v = new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.sin(phi) * Math.sin(theta),
    r * Math.cos(phi)
  );
  basePos.push(v);
  wPos.push(v.clone());
  phase[i] = Math.random() * Math.PI * 2;
  wobAmp[i] = 0.10 + Math.random() * 0.12;
  const p = palette[Math.floor(Math.random() * palette.length)];
  const m = 0.55 + Math.random() * 0.35;
  baseCol[i*3]   = p[0] * m;
  baseCol[i*3+1] = p[1] * m;
  baseCol[i*3+2] = p[2] * m;
}

const nGeo = new THREE.SphereGeometry(0.2, 12, 12);
const nMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const nMesh = new THREE.InstancedMesh(nGeo, nMat, NUM);
const nColors = new Float32Array(NUM * 3);
const dummy = new THREE.Object3D();

for (let i = 0; i < NUM; i++) {
  dummy.position.copy(basePos[i]);
  dummy.scale.setScalar(1);
  dummy.updateMatrix();
  nMesh.setMatrixAt(i, dummy.matrix);
  nColors[i*3] = baseCol[i*3];
  nColors[i*3+1] = baseCol[i*3+1];
  nColors[i*3+2] = baseCol[i*3+2];
}
nMesh.instanceColor = new THREE.InstancedBufferAttribute(nColors, 3);
scene.add(nMesh);

// --- Connections ---
const connSet = new Set();
const pairs = [];
for (let i = 0; i < NUM; i++) {
  const ds = [];
  for (let j = 0; j < NUM; j++) {
    if (i === j) continue;
    ds.push({ j, d: basePos[i].distanceToSquared(basePos[j]) });
  }
  ds.sort((a, b) => a.d - b.d);
  for (let k = 0; k < 4; k++) {
    const j = ds[k].j;
    const key = Math.min(i, j) * 1000 + Math.max(i, j);
    if (!connSet.has(key)) {
      connSet.add(key);
      pairs.push([i, j]);
    }
  }
}

const cCount = pairs.length;
const cGeo = new THREE.BufferGeometry();
const cPos = new Float32Array(cCount * 6);
const cCol = new Float32Array(cCount * 6);
for (let i = 0; i < cCount; i++) {
  const [a, b] = pairs[i];
  cPos[i*6] = basePos[a].x; cPos[i*6+1] = basePos[a].y; cPos[i*6+2] = basePos[a].z;
  cPos[i*6+3] = basePos[b].x; cPos[i*6+4] = basePos[b].y; cPos[i*6+5] = basePos[b].z;
  cCol[i*6] = 0.05; cCol[i*6+1] = 0.07; cCol[i*6+2] = 0.18;
  cCol[i*6+3] = 0.05; cCol[i*6+4] = 0.07; cCol[i*6+5] = 0.18;
}
cGeo.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
cGeo.setAttribute('color', new THREE.BufferAttribute(cCol, 3));
const cMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.85 });
scene.add(new THREE.LineSegments(cGeo, cMat));

// --- Pulses ---
const MAX_P = 500;
const pulses = [];
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(MAX_P * 3);
const pCol = new Float32Array(MAX_P * 3);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pMat = new THREE.PointsMaterial({
  size: 0.4, vertexColors: true,
  blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
});
scene.add(new THREE.Points(pGeo, pMat));

const connBright = new Float32Array(cCount);

function fireNeuron(idx) {
  if (refractory[idx] > 0) return;
  excite[idx] = 1.0;
  refractory[idx] = 0.45;
  for (let ci = 0; ci < cCount; ci++) {
    const [a, b] = pairs[ci];
    let target = -1;
    if (a === idx) target = b;
    else if (b === idx) target = a;
    if (target >= 0 && pulses.length < MAX_P && Math.random() < 0.7) {
      pulses.push({ ci, from: idx, to: target, t: 0, spd: 2.5 + Math.random() * 2.5 });
    }
  }
}

// --- Burst particles ---
const BURST_MAX = 700;
const bursts = [];
const bGeo = new THREE.BufferGeometry();
const bPos = new Float32Array(BURST_MAX * 3);
const bCol = new Float32Array(BURST_MAX * 3);
bGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
bGeo.setAttribute('color', new THREE.BufferAttribute(bCol, 3));
const bMat = new THREE.PointsMaterial({
  size: 0.22, vertexColors: true,
  blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
});
scene.add(new THREE.Points(bGeo, bMat));

function spawnBurst(idx) {
  const p = wPos[idx];
  const tint = Math.random();
  for (let i = 0; i < 6 && bursts.length < BURST_MAX; i++) {
    const dir = new THREE.Vector3(
      Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5
    ).normalize().multiplyScalar(1.5 + Math.random() * 2);
    bursts.push({ pos: p.clone(), vel: dir, life: 1.0, tint });
  }
}

// --- Stars ---
const sCount = 2500;
const sGeo = new THREE.BufferGeometry();
const sPos = new Float32Array(sCount * 3);
for (let i = 0; i < sCount; i++) {
  const r = 70 + Math.random() * 140;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  sPos[i*3] = r * Math.sin(ph) * Math.cos(th);
  sPos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
  sPos[i*3+2] = r * Math.cos(ph);
}
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0x33447a, size: 0.22, sizeAttenuation: true, transparent: true, opacity: 0.8 });
const stars = new THREE.Points(sGeo, starMat);
scene.add(stars);

// --- Animate ---
let time = 0;
let lastFire = 0;
let lastWave = 0;
const tmpV = new THREE.Vector3();

function fireWave() {
  const c = Math.floor(Math.random() * NUM);
  const targets = new Set();
  for (let ci = 0; ci < cCount; ci++) {
    const [a, b] = pairs[ci];
    if (a === c) targets.add(b);
    else if (b === c) targets.add(a);
  }
  const arr = [...targets];
  const n = Math.min(arr.length, 3 + Math.floor(Math.random() * 3));
  for (let i = 0; i < n; i++) {
    fireNeuron(arr[Math.floor(Math.random() * arr.length)]);
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = 0.016;
  time += dt;

  // Random firing
  if (time - lastFire > 0.1 + Math.random() * 0.22) {
    fireNeuron(Math.floor(Math.random() * NUM));
    lastFire = time;
  }
  if (Math.random() < 0.02) fireNeuron(Math.floor(Math.random() * NUM));
  // Periodic cascade waves
  if (time - lastWave > 2.5 + Math.random() * 2.5) {
    fireWave();
    lastWave = time;
  }

  // Update refractory
  for (let i = 0; i < NUM; i++) refractory[i] = Math.max(0, refractory[i] - dt);

  // Wobble live positions
  const breathe = 1 + Math.sin(time * 0.3) * 0.03;
  for (let i = 0; i < NUM; i++) {
    const a = wobAmp[i];
    const ph = phase[i];
    tmpV.copy(basePos[i]);
    tmpV.x += Math.sin(time * 0.6 + ph) * a;
    tmpV.y += Math.sin(time * 0.5 + ph * 1.3) * a;
    tmpV.z += Math.cos(time * 0.55 + ph * 0.7) * a;
    wPos[i].copy(tmpV);
  }

  // Update pulses
  connBright.fill(0);
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.t += p.spd * dt;
    if (p.t >= 1) {
      fireNeuron(p.to);
      spawnBurst(p.to);
      pulses.splice(i, 1);
    } else {
      connBright[p.ci] = Math.max(connBright[p.ci], 1.0 - Math.abs(p.t - 0.5) * 2.6);
    }
  }

  // Update neurons
  for (let i = 0; i < NUM; i++) {
    excite[i] *= 0.94;
    const e = excite[i];
    const s = breathe * (1 + e * 2.6);
    dummy.position.copy(wPos[i]);
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    nMesh.setMatrixAt(i, dummy.matrix);
    // base colored -> white-hot when excited
    nColors[i*3]   = baseCol[i*3]   + e * (1.0 - baseCol[i*3]);
    nColors[i*3+1] = baseCol[i*3+1] + e * (1.0 - baseCol[i*3+1]);
    nColors[i*3+2] = baseCol[i*3+2] + e * (1.0 - baseCol[i*3+2]);
  }
  nMesh.instanceMatrix.needsUpdate = true;
  nMesh.instanceColor.needsUpdate = true;

  // Update connection geometry + colors
  for (let i = 0; i < cCount; i++) {
    const [a, b] = pairs[i];
    cPos[i*6] = wPos[a].x; cPos[i*6+1] = wPos[a].y; cPos[i*6+2] = wPos[a].z;
    cPos[i*6+3] = wPos[b].x; cPos[i*6+4] = wPos[b].y; cPos[i*6+5] = wPos[b].z;
    const br = connBright[i];
    cCol[i*6] = 0.05 + br * 0.55;
    cCol[i*6+1] = 0.07 + br * 0.7;
    cCol[i*6+2] = 0.18 + br * 0.8;
    cCol[i*6+3] = 0.05 + br * 0.55;
    cCol[i*6+4] = 0.07 + br * 0.7;
    cCol[i*6+5] = 0.18 + br * 0.8;
  }
  cGeo.attributes.position.needsUpdate = true;
  cGeo.attributes.color.needsUpdate = true;

  // Update pulse positions
  for (let i = 0; i < MAX_P; i++) {
    if (i < pulses.length) {
      const p = pulses[i];
      const a = wPos[p.from], b = wPos[p.to];
      pPos[i*3] = a.x + (b.x - a.x) * p.t;
      pPos[i*3+1] = a.y + (b.y - a.y) * p.t;
      pPos[i*3+2] = a.z + (b.z - a.z) * p.t;
      const gl = 0.6 + 0.4 * Math.sin(time * 12 + i * 0.7);
      pCol[i*3] = 0.45 + gl * 0.45;
      pCol[i*3+1] = 0.92;
      pCol[i*3+2] = 1.0;
    } else {
      pPos[i*3+1] = -200;
      pCol[i*3] = pCol[i*3+1] = pCol[i*3+2] = 0;
    }
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;

  // Update burst particles
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    b.pos.addScaledVector(b.vel, dt);
    b.life -= dt * 2.5;
    if (b.life <= 0) { bursts.splice(i, 1); continue; }
  }
  for (let i = 0; i < BURST_MAX; i++) {
    if (i < bursts.length) {
      const b = bursts[i];
      bPos[i*3] = b.pos.x; bPos[i*3+1] = b.pos.y; bPos[i*3+2] = b.pos.z;
      const l = b.life;
      // violet->cyan mix by tint
      bCol[i*3] = l * (0.7 + b.tint * 0.3);
      bCol[i*3+1] = l * (0.45 + b.tint * 0.4);
      bCol[i*3+2] = l * 0.95;
    } else {
      bPos[i*3+1] = -200;
      bCol[i*3] = bCol[i*3+1] = bCol[i*3+2] = 0;
    }
  }
  bGeo.attributes.position.needsUpdate = true;
  bGeo.attributes.color.needsUpdate = true;

  // Subtle star drift + glow pulse
  stars.rotation.y = time * 0.005;
  stars.rotation.x = Math.sin(time * 0.02) * 0.05;
  glowSprite.material.opacity = 0.28 + Math.sin(time * 0.4) * 0.06;
  glowSprite.scale.setScalar(34 + Math.sin(time * 0.5) * 3);

  // Camera orbit with gentle radial + vertical motion
  const ca = time * 0.08;
  const rad = 22 + Math.sin(time * 0.12) * 2.5;
  camera.position.set(
    Math.sin(ca) * rad,
    3 + Math.sin(time * 0.05) * 3.5,
    Math.cos(ca) * rad
  );
  camera.lookAt(0, 0, 0);

  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
