<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neural Constellation Bloom</title>
<style>
*{margin:0;padding:0;overflow:hidden}
body{background:#000}
canvas{display:block}
#info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(140,200,255,0.5);font-family:monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>
<div id="info">neural constellation bloom</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const W=innerWidth,H=innerHeight;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(60,W/H,0.1,200);
cam.position.set(0,0,18);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(W,H);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

// --- Node system ---
const NODE_COUNT=600;
const nodes=[];
for(let i=0;i<NODE_COUNT;i++){
const theta=Math.random()*Math.PI*2;
const phi=Math.acos(2*Math.random()-1);
const r=4+Math.random()*8;
nodes.push({
pos:new THREE.Vector3(r*Math.sin(phi)*Math.cos(theta),r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi)),
basePos:new THREE.Vector3(r*Math.sin(phi)*Math.cos(theta),r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi)),
freq:0.3+Math.random()*0.7,
phase:Math.random()*Math.PI*2,
activation:0,
maxActivation:0,
color:new THREE.Color().setHSL(0.55+Math.random()*0.25,0.9,0.5+Math.random()*0.3)
});
}

// --- Connections ---
const connections=[];
const connPairs=[];
for(let i=0;i<NODE_COUNT;i++){
let linked=0;
for(let j=0;j<NODE_COUNT&&linked<3;j++){
if(i===j)continue;
const d=nodes[i].pos.distanceTo(nodes[j].pos);
if(d<4&&Math.random()<0.3){
connections.push(i,j);
connPairs.push([i,j]);
linked++;
}
}
}
const connCount=connections.length/2;

// --- Node geometry with shader ---
const nodeGeo=new THREE.BufferGeometry();
const nPos=new Float32Array(NODE_COUNT*3);
const nSize=new Float32Array(NODE_COUNT);
const nAct=new Float32Array(NODE_COUNT);
const nCol=new Float32Array(NODE_COUNT*3);
for(let i=0;i<NODE_COUNT;i++){
nPos[i*3]=nodes[i].pos.x;
nPos[i*3+1]=nodes[i].pos.y;
nPos[i*3+2]=nodes[i].pos.z;
nSize[i]=2.0;
nAct[i]=0;
nCol[i*3]=nodes[i].color.r;
nCol[i*3+1]=nodes[i].color.g;
nCol[i*3+2]=nodes[i].color.b;
}
nodeGeo.setAttribute('position',new THREE.BufferAttribute(nPos,3));
nodeGeo.setAttribute('aSize',new THREE.BufferAttribute(nSize,1));
nodeGeo.setAttribute('aActivation',new THREE.BufferAttribute(nAct,1));
nodeGeo.setAttribute('aColor',new THREE.BufferAttribute(nCol,3));

const nodeMat=new THREE.ShaderMaterial({
uniforms:{uTime:{value:0}},
vertexShader:`
attribute float aSize;
attribute float aActivation;
attribute vec3 aColor;
varying float vAct;
varying vec3 vColor;
void main(){
vAct=aActivation;
vColor=aColor;
vec4 mv=modelViewMatrix*vec4(position,1.0);
gl_PointSize=aSize*(1.0+aActivation*3.0)*(200.0/(-mv.z));
gl_Position=projectionMatrix*mv;
}`,
fragmentShader:`
varying float vAct;
varying vec3 vColor;
void main(){
vec2 uv=gl_PointCoord-0.5;
float d=length(uv);
if(d>0.5)discard;
float core=smoothstep(0.5,0.0,d);
float glow=smoothstep(0.5,0.0,d)*smoothstep(0.1,0.5,d);
vec3 col=vColor*glow*0.6+vec3(1.0)*core*(0.5+vAct*1.5);
float alpha=core*(0.8+vAct*0.5)+glow*0.3;
gl_FragColor=vec4(col,alpha);
}`,
transparent:true,
blending:THREE.AdditiveBlending,
depthWrite:false
});
const nodeMesh=new THREE.Points(nodeGeo,nodeMat);
scene.add(nodeMesh);

// --- Connection lines ---
const lineGeo=new THREE.BufferGeometry();
const lPos=new Float32Array(connCount*6);
const lAct=new Float32Array(connCount*2);
const lCol=new Float32Array(connCount*6);
lineGeo.setAttribute('position',new THREE.BufferAttribute(lPos,3));
lineGeo.setAttribute('aActivation',new THREE.BufferAttribute(lAct,2));
lineGeo.setAttribute('aColor',new THREE.BufferAttribute(lCol,3));

const lineMat=new THREE.ShaderMaterial({
uniforms:{},
vertexShader:`
attribute float aActivation;
attribute vec3 aColor;
varying float vAct;
varying vec3 vColor;
void main(){
vAct=aActivation;
vColor=aColor;
gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`,
fragmentShader:`
varying float vAct;
varying vec3 vColor;
void main(){
float brightness=0.05+vAct*0.95;
vec3 col=vColor*brightness+vec3(1.0)*vAct*0.5;
gl_FragColor=vec4(col,0.1+vAct*0.7);
}`,
transparent:true,
blending:THREE.AdditiveBlending,
depthWrite:false
});
const lineMesh=new THREE.LineSegments(lineGeo,lineMat);
scene.add(lineMesh);

// --- Particle bursts ---
const PART_COUNT=2000;
const partGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(PART_COUNT*3);
const pVel=new Float32Array(PART_COUNT*3);
const pLife=new Float32Array(PART_COUNT);
const pSize=new Float32Array(PART_COUNT);
const pCol=new Float32Array(PART_COUNT*3);
for(let i=0;i<PART_COUNT;i++){pLife[i]=0;pSize[i]=1;}
partGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
partGeo.setAttribute('aLife',new THREE.BufferAttribute(pLife,1));
partGeo.setAttribute('aSize',new THREE.BufferAttribute(pSize,1));
partGeo.setAttribute('aColor',new THREE.BufferAttribute(pCol,3));

const partMat=new THREE.ShaderMaterial({
vertexShader:`
attribute float aLife;
attribute float aSize;
attribute vec3 aColor;
varying float vLife;
varying vec3 vColor;
void main(){
vLife=aLife;
vColor=aColor;
vec4 mv=modelViewMatrix*vec4(position,1.0);
gl_PointSize=aSize*(1.0+aLife*2.0)*(150.0/(-mv.z));
gl_Position=projectionMatrix*mv;
}`,
fragmentShader:`
varying float vLife;
varying vec3 vColor;
void main(){
vec2 uv=gl_PointCoord-0.5;
float d=length(uv);
if(d>0.5)discard;
float glow=smoothstep(0.5,0.0,d);
vec3 col=vColor*glow+vColor*glow*glow*2.0;
float alpha=glow*vLife;
gl_FragColor=vec4(col,alpha);
}`,
transparent:true,
blending:THREE.AdditiveBlending,
depthWrite:false
});
const partMesh=new THREE.Points(partGeo,partMat);
scene.add(partMesh);

// --- Background stars ---
const STAR_COUNT=2000;
const starGeo=new THREE.BufferGeometry();
const sPos=new Float32Array(STAR_COUNT*3);
for(let i=0;i<STAR_COUNT;i++){
const r=50+Math.random()*100;
const t=Math.random()*Math.PI*2;
const p=Math.acos(2*Math.random()-1);
sPos[i*3]=r*Math.sin(p)*Math.cos(t);
sPos[i*3+1]=r*Math.sin(p)*Math.sin(t);
sPos[i*3+2]=r*Math.cos(p);
}
starGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
const starMat=new THREE.PointsMaterial({size:0.3,color:0x334466,transparent:true,opacity:0.6});
scene.add(new THREE.Points(starGeo,starMat));

// --- Activation cascade system ---
let cascadeQueue=[];
let cascadeTimer=0;
let nextCascade=2+Math.random()*3;

function triggerCascade(){
const startNode=Math.floor(Math.random()*NODE_COUNT);
cascadeQueue.push({node:startNode,gen:0,time:0});
nodes[startNode].activation=1;
nodes[startNode].maxActivation=1;
// spawn particles
spawnParticles(nodes[startNode].pos,nodes[startNode].color,20);
}

function spawnParticles(pos,color,count){
for(let i=0;i<count;i++){
let idx=-1;
for(let j=0;j<PART_COUNT;j++){if(pLife[j]<0.05){idx=j;break;}}
if(idx===-1)continue;
pPos[idx*3]=pos.x+(Math.random()-0.5)*0.3;
pPos[idx*3+1]=pos.y+(Math.random()-0.5)*0.3;
pPos[idx*3+2]=pos.z+(Math.random()-0.5)*0.3;
const speed=0.5+Math.random()*2;
const t=Math.random()*Math.PI*2;
const p=Math.acos(2*Math.random()-1);
pVel[idx*3]=speed*Math.sin(p)*Math.cos(t);
pVel[idx*3+1]=speed*Math.sin(p)*Math.sin(t);
pVel[idx*3+2]=speed*Math.cos(p);
pLife[idx]=1;
pSize[idx]=1+Math.random()*2;
pCol[idx*3]=color.r;
pCol[idx*3+1]=color.g;
pCol[idx*3+2]=color.b;
}
}

// --- Animation ---
const clock=new THREE.Clock();
let elapsed=0;

function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),0.05);
elapsed+=dt;

// Camera orbit
cam.position.x=Math.sin(elapsed*0.1)*18;
cam.position.z=Math.cos(elapsed*0.1)*18;
cam.position.y=Math.sin(elapsed*0.05)*5;
cam.lookAt(0,0,0);

// Breathing
const breathe=Math.sin(elapsed*0.4)*0.3+Math.sin(elapsed*0.7)*0.15;

// Update node positions (organic motion)
for(let i=0;i<NODE_COUNT;i++){
const n=nodes[i];
const t=elapsed*n.freq+n.phase;
n.pos.x=n.basePos.x*(1+breathe*0.2)+Math.sin(t)*0.5;
n.pos.y=n.basePos.y*(1+breathe*0.2)+Math.cos(t*0.7)*0.5;
n.pos.z=n.basePos.z*(1+breathe*0.2)+Math.sin(t*0.5+1.0)*0.5;
// decay activation
n.activation*=0.96;
if(n.activation<0.01)n.activation=0;
}

// Cascade logic
cascadeTimer+=dt;
if(cascadeTimer>nextCascade){
triggerCascade();
cascadeTimer=0;
nextCascade=1+Math.random()*3;
}
if(cascadeQueue.length>0){
const newQueue=[];
for(const c of cascadeQueue){
c.time+=dt;
if(c.time>0.08&&c.gen<8){
const n=nodes[c.node];
for(const[a,b]of connPairs){
let neighbor=-1;
if(a===c.node)neighbor=b;
else if(b===c.node)neighbor=a;
if(neighbor>=0&&nodes[neighbor].activation<0.3){
nodes[neighbor].activation=Math.min(1,0.5+Math.random()*0.5);
nodes[neighbor].maxActivation=nodes[neighbor].activation;
newQueue.push({node:neighbor,gen:c.gen+1,time:0});
spawnParticles(nodes[neighbor].pos,nodes[neighbor].color,5);
}
}
}
}
cascadeQueue=newQueue;
}

// Update GPU buffers
const posAttr=nodeGeo.attributes.position;
const actAttr=nodeGeo.attributes.aActivation;
const sizeAttr=nodeGeo.attributes.aSize;
for(let i=0;i<NODE_COUNT;i++){
posAttr.array[i*3]=nodes[i].pos.x;
posAttr.array[i*3+1]=nodes[i].pos.y;
posAttr.array[i*3+2]=nodes[i].pos.z;
actAttr.array[i]=nodes[i].activation;
sizeAttr.array[i]=2.0+nodes[i].maxActivation*1.0;
}
posAttr.needsUpdate=true;
actAttr.needsUpdate=true;
sizeAttr.needsUpdate=true;

// Update lines
const lp=lineGeo.attributes.position;
const la=lineGeo.attributes.aActivation;
const lc=lineGeo.attributes.aColor;
for(let i=0;i<connCount;i++){
const a=connections[i*2],b=connections[i*2+1];
lp.array[i*6]=nodes[a].pos.x;
lp.array[i*6+1]=nodes[a].pos.y;
lp.array[i*6+2]=nodes[a].pos.z;
lp.array[i*6+3]=nodes[b].pos.x;
lp.array[i*6+4]=nodes[b].pos.y;
lp.array[i*6+5]=nodes[b].pos.z;
const act=Math.max(nodes[a].activation,nodes[b].activation);
la.array[i*2]=act;
la.array[i*2+1]=act;
lc.array[i*6]=nodes[a].color.r;
lc.array[i*6+1]=nodes[a].color.g;
lc.array[i*6+2]=nodes[a].color.b;
lc.array[i*6+3]=nodes[b].color.r;
lc.array[i*6+4]=nodes[b].color.g;
lc.array[i*6+5]=nodes[b].color.b;
}
lp.needsUpdate=true;
la.needsUpdate=true;
lc.needsUpdate=true;

// Update particles
const pp=partGeo.attributes.position;
const pl=partGeo.attributes.aLife;
const ps=partGeo.attributes.aSize;
const pc=partGeo.attributes.aColor;
for(let i=0;i<PART_COUNT;i++){
if(pLife[i]>0){
pLife[i]-=dt*1.5;
if(pLife[i]<0)pLife[i]=0;
pPos[i*3]+=pVel[i*3]*dt;
pPos[i*3+1]+=pVel[i*3+1]*dt;
pPos[i*3+2]+=pVel[i*3+2]*dt;
pVel[i*3]*=0.98;
pVel[i*3+1]*=0.98;
pVel[i*3+2]*=0.98;
}
pl.array[i]=pLife[i];
ps.array[i]=pSize[i];
pc.array[i*3]=pCol[i*3];
pc.array[i*3+1]=pCol[i*3+1];
pc.array[i*3+2]=pCol[i*3+2];
pp.array[i*3]=pPos[i*3];
pp.array[i*3+1]=pPos[i*3+1];
pp.array[i*3+2]=pPos[i*3+2];
}
pp.needsUpdate=true;
pl.needsUpdate=true;
ps.needsUpdate=true;
pc.needsUpdate=true;

nodeMat.uniforms.uTime.value=elapsed;
renderer.render(scene,cam);
}
animate();

window.addEventListener('resize',()=>{
const w=innerWidth,h=innerHeight;
cam.aspect=w/h;
cam.updateProjectionMatrix();
renderer.setSize(w,h);
});
})();
</script>
</body>
</html>
