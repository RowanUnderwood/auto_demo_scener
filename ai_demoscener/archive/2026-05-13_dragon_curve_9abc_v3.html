<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koch — Copper Trace</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #080c0a; }
        canvas { display: block; }
        #label {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(255, 160, 60, 0.5);
            text-transform: uppercase;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="label">koch · 4th order · copper trace</div>
<script src="https://unpkg.com/three@0.136.0/build/three.min.js"></script>
<script>
// --- Koch Snowflake L-System ---
let s = "F++F++F";
const iterations = 4;
for (let i = 0; i < iterations; i++) {
    let next = "";
    for (let j = 0; j < s.length; j++) {
        const c = s[j];
        if (c === 'F') next += "F-F++F-F";
        else next += c;
    }
    s = next;
}

// --- Turtle Interpretation ---
const pts = [];
let px = 0, py = 0, angle = 0;
const stepAngle = Math.PI / 3;
pts.push(px, py);
for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === 'F') {
        px += Math.cos(angle);
        py += Math.sin(angle);
        pts.push(px, py);
    } else if (ch === '+') angle += stepAngle;
    else if (ch === '-') angle -= stepAngle;
}

const numPts = pts.length / 2;
let cx = 0, cy = 0;
for (let i = 0; i < numPts; i++) { cx += pts[i*2]; cy += pts[i*2+1]; }
cx /= numPts; cy /= numPts;

let maxR = 0;
for (let i = 0; i < numPts; i++) {
    const dx = pts[i*2] - cx, dy = pts[i*2+1] - cy;
    const r = Math.sqrt(dx*dx + dy*dy);
    if (r > maxR) maxR = r;
}
const scale = 16 / maxR;

const positions = new Float32Array(numPts * 3);
const progressArr = new Float32Array(numPts);
const vertexFlag = new Float32Array(numPts);

for (let i = 0; i < numPts; i++) {
    positions[i*3]   = (pts[i*2]   - cx) * scale;
    positions[i*3+1] = (pts[i*2+1] - cy) * scale;
    positions[i*3+2] = 0;
    progressArr[i] = i / (numPts - 1);
}

const padInterval = 8;
for (let i = 0; i < numPts; i++) {
    if (i % padInterval === 0) vertexFlag[i] = 1;
}

// --- Scene ---
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080c0a, 0.005);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 0, 42);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x080c0a);
document.body.appendChild(renderer.domElement);

const uniforms = {
    uTime: { value: 0 },
    uReveal: { value: 0 },
    uColorA: { value: new THREE.Color(0xd45500) },
    uColorB: { value: new THREE.Color(0xff9933) },
    uColorC: { value: new THREE.Color(0xfff8e0) },
    uPixelRatio: { value: Math.min(devicePixelRatio, 2) },
};

// --- Background Radial Glow ---
const bgGeo = new THREE.PlaneGeometry(120, 120);
const bgMat = new THREE.ShaderMaterial({
    uniforms: { uTime: uniforms.uTime, uReveal: uniforms.uReveal },
    vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform float uTime;
        uniform float uReveal;
        varying vec2 vUv;
        void main() {
            vec2 c = vUv - 0.5;
            float d = length(c) * 2.0;
            float glow = smoothstep(1.0, 0.0, d);
            glow = pow(glow, 2.5);
            float breathe = 0.8 + 0.2 * sin(uTime * 0.4);
            vec3 col = vec3(0.15, 0.05, 0.01) * glow * breathe * (0.3 + 0.7 * uReveal);
            gl_FragColor = vec4(col, 1.0);
        }
    `,
    depthWrite: false,
});
const bgPlane = new THREE.Mesh(bgGeo, bgMat);
bgPlane.position.z = -12;
scene.add(bgPlane);

// --- Main Trace Line ---
const lineVert = `
    attribute float aProgress;
    attribute float aVertex;
    uniform float uTime;
    uniform float uReveal;
    varying float vProgress;
    varying float vVertex;
    varying float vVisible;
    void main() {
        vProgress = aProgress;
        vVertex = aVertex;
        vVisible = step(aProgress, uReveal);
        float z = sin(aProgress * 37.0 + uTime * 0.3) * 0.7
                + cos(aProgress * 19.0 - uTime * 0.4) * 0.4;
        vec3 p = position;
        p.z += z;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
`;

const lineFrag = `
    uniform float uTime;
    uniform float uReveal;
    uniform vec3 uColorA;
    uniform vec3 uColorB;
    uniform vec3 uColorC;
    varying float vProgress;
    varying float vVertex;
    varying float vVisible;
    void main() {
        if (vVisible < 0.5) discard;
        float t = vProgress;
        vec3 col = mix(uColorA, uColorB, smoothstep(0.0, 0.5, t));
        col = mix(col, uColorC, smoothstep(0.7, 1.0, t) * 0.5);
        
        float p1 = fract(vProgress * 2.5 - uTime * 0.35);
        float p2 = fract(vProgress * 4.0 + uTime * 0.25 + 0.4);
        float p3 = fract(vProgress * 6.0 - uTime * 0.55 + 0.7);
        float pulse = max(
            smoothstep(0.0, 0.04, p1) * smoothstep(0.16, 0.04, p1),
            smoothstep(0.0, 0.03, p2) * smoothstep(0.12, 0.03, p2),
            smoothstep(0.0, 0.02, p3) * smoothstep(0.09, 0.02, p3)
        );
        col += uColorC * pulse * 1.8;
        
        float edgeDist = uReveal - vProgress;
        float edgeGlow = smoothstep(0.0, 0.06, edgeDist) * smoothstep(0.15, 0.0, edgeDist);
        col += uColorC * edgeGlow * 3.0;
        
        float vertexBoost = vVertex * 0.4;
        col += uColorC * vertexBoost;
        
        float flicker = 0.9 + 0.1 * sin(uTime * 4.0 + vProgress * 25.0);
        col *= flicker;
        
        gl_FragColor = vec4(col, 1.0);
    }
`;

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
lineGeo.setAttribute('aProgress', new THREE.BufferAttribute(progressArr, 1));
lineGeo.setAttribute('aVertex', new THREE.BufferAttribute(vertexFlag, 1));
const lineMat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: lineVert,
    fragmentShader: lineFrag,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
});
const mainLine = new THREE.Line(lineGeo, lineMat);
scene.add(mainLine);

// --- Halo Layer (wider, dimmer) ---
const haloVert = `
    attribute float aProgress;
    uniform float uTime;
    uniform float uReveal;
    varying float vProgress;
    varying float vVisible;
    void main() {
        vProgress = aProgress;
        vVisible = step(aProgress, uReveal);
        float z = sin(aProgress * 37.0 + uTime * 0.3) * 0.7
                + cos(aProgress * 19.0 - uTime * 0.4) * 0.4;
        vec3 p = position;
        p.z += z + 0.4;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
`;
const haloFrag = `
    uniform float uTime;
    uniform vec3 uColorA;
    uniform vec3 uColorB;
    uniform vec3 uColorC;
    varying float vProgress;
    varying float vVisible;
    void main() {
        if (vVisible < 0.5) discard;
        vec3 col = mix(uColorA, uColorB, vProgress);
        col = mix(col, uColorC, smoothstep(0.8, 1.0, vProgress) * 0.3);
        float breathe = 0.5 + 0.5 * sin(uTime * 0.8 + vProgress * 8.0);
        gl_FragColor = vec4(col * 0.5, 0.35 * breathe);
    }
`;
const haloMat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: haloVert,
    fragmentShader: haloFrag,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
});
const haloLine = new THREE.Line(lineGeo, haloMat);
scene.add(haloLine);

// --- Outer Glow Layer ---
const outerVert = `
    attribute float aProgress;
    uniform float uTime;
    uniform float uReveal;
    varying float vProgress;
    varying float vVisible;
    void main() {
        vProgress = aProgress;
        vVisible = step(aProgress, uReveal);
        float z = sin(aProgress * 37.0 + uTime * 0.3) * 0.7
                + cos(aProgress * 19.0 - uTime * 0.4) * 0.4;
        vec3 p = position;
        p.z += z + 0.8;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
`;
const outerFrag = `
    uniform float uTime;
    uniform vec3 uColorA;
    uniform vec3 uColorB;
    varying float vProgress;
    varying float vVisible;
    void main() {
        if (vVisible < 0.5) discard;
        vec3 col = mix(uColorA * 0.6, uColorB * 0.5, vProgress);
        float breathe = 0.4 + 0.6 * sin(uTime * 0.5 + vProgress * 5.0 + 1.5);
        gl_FragColor = vec4(col, 0.15 * breathe);
    }
`;
const outerMat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: outerVert,
    fragmentShader: outerFrag,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
});
const outerLine = new THREE.Line(lineGeo, outerMat);
scene.add(outerLine);

// --- Solder Pad Points ---
const ptVert = `
    attribute float aProgress;
    attribute float aVertex;
    uniform float uTime;
    uniform float uReveal;
    uniform float uPixelRatio;
    varying float vAlpha;
    varying float vIsVertex;
    void main() {
        vIsVertex = aVertex;
        vAlpha = step(aProgress, uReveal) * mix(0.25, 1.0, aVertex);
        float z = sin(aProgress * 37.0 + uTime * 0.3) * 0.7
                + cos(aProgress * 19.0 - uTime * 0.4) * 0.4;
        vec3 p = position;
        p.z += z;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float size = mix(1.2, 4.0, aVertex) * (0.85 + 0.15 * sin(uTime * 2.5 + aProgress * 40.0));
        gl_PointSize = size * uPixelRatio * (1.0 / -mv.z) * 42.0;
        gl_Position = projectionMatrix * mv;
    }
`;
const ptFrag = `
    uniform float uTime;
    uniform vec3 uColorB;
    uniform vec3 uColorC;
    varying float vAlpha;
    varying float vIsVertex;
    void main() {
        if (vAlpha < 0.05) discard;
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        float glow = smoothstep(0.5, 0.0, d);
        glow = pow(glow, 2.2);
        vec3 col = mix(uColorB, uColorC, vIsVertex * 0.9);
        float twinkle = 0.7 + 0.3 * sin(uTime * 3.0 + d * 10.0);
        gl_FragColor = vec4(col * twinkle, glow * vAlpha * 0.8);
    }
`;
const ptMat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: ptVert,
    fragmentShader: ptFrag,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
});
const pads = new THREE.Points(lineGeo, ptMat);
scene.add(pads);

// --- Background Embers ---
const emberCount = 250;
const emberPos = new Float32Array(emberCount * 3);
const emberSize = new Float32Array(emberCount);
const emberSpeed = new Float32Array(emberCount);
for (let i = 0; i < emberCount; i++) {
    emberPos[i*3]   = (Math.random() - 0.5) * 100;
    emberPos[i*3+1] = (Math.random() - 0.5) * 100;
    emberPos[i*3+2] = -6 - Math.random() * 30;
    emberSize[i] = Math.random() * 2.5 + 0.8;
    emberSpeed[i] = Math.random() * 0.5 + 0.2;
}
const emberGeo = new THREE.BufferGeometry();
emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos, 3));
emberGeo.setAttribute('aSize', new THREE.BufferAttribute(emberSize, 1));
emberGeo.setAttribute('aSpeed', new THREE.BufferAttribute(emberSpeed, 1));
const emberMat = new THREE.ShaderMaterial({
    uniforms: { uTime: uniforms.uTime, uPixelRatio: uniforms.uPixelRatio },
    vertexShader: `
        attribute float aSize;
        attribute float aSpeed;
        uniform float uTime;
        uniform float uPixelRatio;
        varying float vA;
        void main() {
            vec3 p = position;
            p.y += mod(uTime * aSpeed * 2.0, 100.0) - 50.0;
            p.x += sin(uTime * 0.4 + position.x * 0.2) * 1.0;
            vA = 0.3 + 0.7 * abs(sin(uTime * 0.7 + position.x * 3.0 + position.z));
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = aSize * uPixelRatio * (1.0 / -mv.z) * 20.0;
            gl_Position = projectionMatrix * mv;
        }
    `,
    fragmentShader: `
        varying float vA;
        void main() {
            vec2 uv = gl_PointCoord - 0.5;
            float d = length(uv);
            float glow = smoothstep(0.5, 0.0, d);
            glow = pow(glow, 3.0);
            vec3 col = mix(vec3(0.7, 0.2, 0.03), vec3(1.0, 0.6, 0.2), glow);
            gl_FragColor = vec4(col, glow * vA * 0.35);
        }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
});
const embers = new THREE.Points(emberGeo, emberMat);
scene.add(embers);

// --- Inner Particles (orbiting the snowflake) ---
const innerCount = 80;
const innerPos = new Float32Array(innerCount * 3);
const innerAngle = new Float32Array(innerCount);
const innerRadius = new Float32Array(innerCount);
const innerSpeed = new Float32Array(innerCount);
for (let i = 0; i < innerCount; i++) {
    innerAngle[i] = Math.random() * Math.PI * 2;
    innerRadius[i] = 4 + Math.random() * 14;
    innerSpeed[i] = (Math.random() - 0.5) * 0.3;
    innerPos[i*3] = 0;
    innerPos[i*3+1] = 0;
    innerPos[i*3+2] = (Math.random() - 0.5) * 3;
}
const innerGeo = new THREE.BufferGeometry();
innerGeo.setAttribute('position', new THREE.BufferAttribute(innerPos, 3));
innerGeo.setAttribute('aAngle', new THREE.BufferAttribute(innerAngle, 1));
innerGeo.setAttribute('aRadius', new THREE.BufferAttribute(innerRadius, 1));
innerGeo.setAttribute('aSpeed', new THREE.BufferAttribute(innerSpeed, 1));
const innerMat = new THREE.ShaderMaterial({
    uniforms: { uTime: uniforms.uTime, uPixelRatio: uniforms.uPixelRatio, uReveal: uniforms.uReveal },
    vertexShader: `
        attribute float aAngle;
        attribute float aRadius;
        attribute float aSpeed;
        uniform float uTime;
        uniform float uPixelRatio;
        uniform float uReveal;
        varying float vA;
        void main() {
            float ang = aAngle + uTime * aSpeed;
            vec3 p;
            p.x = cos(ang) * aRadius;
            p.y = sin(ang) * aRadius;
            p.z = sin(uTime * 0.5 + aAngle * 3.0) * 1.5;
            vA = uReveal * (0.3 + 0.7 * sin(uTime * 1.2 + aAngle * 5.0) * 0.5 + 0.5);
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = (1.5 + aRadius * 0.1) * uPixelRatio * (1.0 / -mv.z) * 30.0;
            gl_Position = projectionMatrix * mv;
        }
    `,
    fragmentShader: `
        varying float vA;
        void main() {
            vec2 uv = gl_PointCoord - 0.5;
            float d = length(uv);
            float glow = smoothstep(0.5, 0.0, d);
            glow = pow(glow, 2.5);
            vec3 col = vec3(1.0, 0.5, 0.15);
            gl_FragColor = vec4(col, glow * vA * 0.3);
        }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
});
const innerParticles = new THREE.Points(innerGeo, innerMat);
scene.add(innerParticles);

// --- Animation ---
const startTime = performance.now();
const drawDuration = 6000;
const holdDuration = 8000;
const totalCycle = drawDuration + holdDuration;

function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const elapsed = (now - startTime) % totalCycle;
    uniforms.uTime.value = (now - startTime) * 0.001;

    if (elapsed < drawDuration) {
        const t = elapsed / drawDuration;
        uniforms.uReveal.value = t * t * (3 - 2 * t);
    } else if (elapsed < totalCycle - 1500) {
        uniforms.uReveal.value = 1.0;
    } else {
        const fadeT = (elapsed - (totalCycle - 1500)) / 1500;
        uniforms.uReveal.value = 1.0 - fadeT * fadeT * (3 - 2 * fadeT);
    }

    const t = uniforms.uTime.value;
    mainLine.rotation.z = Math.sin(t * 0.08) * 0.05;
    mainLine.rotation.x = Math.cos(t * 0.06) * 0.03;
    haloLine.rotation.copy(mainLine.rotation);
    outerLine.rotation.copy(mainLine.rotation);
    pads.rotation.copy(mainLine.rotation);
    innerParticles.rotation.copy(mainLine.rotation);

    const breathe = 1.0 + 0.008 * Math.sin(t * 0.6);
    mainLine.scale.setScalar(breathe);
    haloLine.scale.setScalar(breathe);
    outerLine.scale.setScalar(breathe);
    pads.scale.setScalar(breathe);
    innerParticles.scale.setScalar(breathe);

    camera.position.z = 42 + Math.sin(t * 0.12) * 2.0;
    camera.position.x = Math.sin(t * 0.09) * 1.5;
    camera.position.y = Math.cos(t * 0.11) * 1.0;
    camera.lookAt(0, 0, 0);

    embers.rotation.y += 0.0002;

    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
