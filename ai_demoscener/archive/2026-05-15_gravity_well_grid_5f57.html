<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaussian Gravity Well Grid</title>
    <style>
        body { margin: 0; background-color: #020205; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const N_MASSES = 8;
    const SEGMENTS = 200;
    const SIZE = 40;

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020205);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(30, 25, 30);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Mass data setup
    const masses = [];
    for (let i = 0; i < N_MASSES; i++) {
        masses.push({
            radius: 5 + Math.random() * 15,
            speed: 0.2 + Math.random() * 0.5,
            offset: Math.random() * Math.PI * 2,
            strength: 4 + Math.random() * 6,
            sigma: 1.5 + Math.random() * 2.5
        });
    }

    // Shader Material
    const shaderMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMasses: { value: new Array(N_MASSES).fill(new THREE.Vector4()) }
        },
        vertexShader: `
            varying float vDepth;
            uniform float uTime;
            uniform vec4 uMasses[${N_MASSES}];

            void main() {
                vec3 pos = position;
                float totalDisp = 0.0;

                for(int i = 0; i < ${N_MASSES}; i++) {
                    vec2 mPos = uMasses[i].xy;
                    float strength = uMasses[i].z;
                    float sigma = uMasses[i].w;
                    
                    float d2 = pow(pos.x - mPos.x, 2.0) + pow(pos.y - mPos.y, 2.0);
                    totalDisp += strength * exp(-d2 / (sigma * sigma));
                }

                pos.z -= totalDisp;
                vDepth = totalDisp;
                
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `,
        fragmentShader: `
            varying float vDepth;
            void main() {
                vec3 cyan = vec3(0.0, 1.0, 1.0);
                vec3 magenta = vec3(1.0, 0.0, 1.0);
                // Scale depth for color interpolation (max expected is around 15)
                float t = clamp(vDepth / 8.0, 0.0, 1.0);
                vec3 color = mix(cyan, magenta, t);
                gl_FragColor = vec4(color, 1.0);
            }
        `,
        wireframe: true,
        transparent: true
    });

    // Geometry
    const geometry = new THREE.PlaneGeometry(SIZE, SIZE, SEGMENTS, SEGMENTS);
    const mesh = new THREE.Mesh(geometry, shaderMaterial);
    mesh.rotation.x = -Math.PI / 2;
    scene.add(mesh);

    // Animation Loop
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();

        // Update mass uniforms
        const updatedMasses = [];
        for (let i = 0; i < N_MASSES; i++) {
            const m = masses[i];
            const x = Math.cos(elapsed * m.speed + m.offset) * m.radius;
            const y = Math.sin(elapsed * m.speed + m.offset) * m.radius;
            // vec4: x, y, strength, sigma
            updatedMasses.push(new THREE.Vector4(x, y, m.strength, m.sigma));
        }
        shaderMaterial.uniforms.uTime.value = elapsed;
        shaderMaterial.uniforms.uMasses.value = updatedMasses;

        // Camera orbit
        const camRadius = 50;
        camera.position.x = Math.cos(elapsed * 0.1) * camRadius;
        camera.position.z = Math.sin(elapsed * 0.1) * camRadius;
        camera.position.y = 25 + Math.sin(elapsed * 0.2) * 5;
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
