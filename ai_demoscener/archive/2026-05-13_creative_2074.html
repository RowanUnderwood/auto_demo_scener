<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS_ENTROPY // DEMO</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        canvas { display: block; }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0ff;
            text-shadow: 0 0 5px #0ff;
            pointer-events: none;
            letter-spacing: 2px;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div id="ui">SYSTEM_STATUS: ENTROPY_FLUX // CORE_STABILITY: <span id="stability">98.2%</span></div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // --- SHADER SOURCE ---
        const vertexShader = `
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying float vNoise;
            uniform float uTime;
            uniform float uDistortion;

            // Simplex 3D Noise
            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            float snoise(vec3 v){ 
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 =   v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod(i, 289.0 ); 
                vec4 p = permute( permute( permute( 
                           i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                         + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                         + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 1.0/7.0;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vUv = uv;
                vNormal = normal;
                
                float noise = snoise(vec3(position * 0.5 + uTime * 0.2));
                vNoise = noise;
                
                vec3 newPos = position + normal * noise * uDistortion;
                vec4 mvPosition = modelViewMatrix * vec4(newPos, 1.0);
                vViewPosition = -mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            varying float vNoise;
            uniform float uTime;

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 viewDir = normalize(vViewPosition);
                
                // Fresnel effect
                float fresnel = pow(1.0 - dot(normal, viewDir), 3.0);
                
                // Color palette: Cyan to Magenta to Gold
                vec3 colorA = vec3(0.0, 1.0, 0.9); // Cyan
                vec3 colorB = vec3(0.8, 0.0, 1.0); // Purple/Magenta
                vec3 colorC = vec3(1.0, 0.7, 0.0); // Gold
                
                vec3 baseColor = mix(colorA, colorB, sin(uTime * 0.5) * 0.5 + 0.5);
                baseColor = mix(baseColor, colorC, vNoise * 0.5 + 0.5);

                float edgeGlow = fresnel * 2.0;
                vec3 finalColor = baseColor + (edgeGlow * vec3(1.0));
                
                // Add noise detail to surface
                finalColor *= (vNoise * 0.2 + 0.8);

                gl_FragColor = vec4(finalColor, 0.9);
            }
        `;

        // --- ENGINE ---
        let scene, camera, renderer, mesh, particles, clock;
        const particleCount = 15000;
        const stabilityEl = document.getElementById('stability');

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 4;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Core Geometry (The Monolith)
            const geometry = new THREE.IcosahedronGeometry(1.5, 64);
            const material = new THREE.ShaderMaterial({
                vertexShader,
                fragmentShader,
                uniforms: {
                    uTime: { value: 0 },
                    uDistortion: { value: 0.3 }
                },
                transparent: true,
                side: THREE.DoubleSide
            });
            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // Particle System (The Entropy)
            const pGeo = new THREE.BufferGeometry();
            const posArr = new Float32Array(particleCount * 3);
            const velArr = new Float32Array(particleCount * 3);
            
            for(let i=0; i<particleCount * 3; i++) {
                posArr[i] = (Math.random() - 0.5) * 10;
                velArr[i] = (Math.random() - 0.5) * 0.02;
            }
            
            pGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
            pGeo.setAttribute('velocity', new THREE.BufferAttribute(velArr, 3));

            const pMat = new THREE.PointsMaterial({
                size: 0.015,
                color: 0x00ffff,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(pGeo, pMat);
            scene.add(particles);

            // Background Grid
            const grid = new THREE.GridHelper(20, 40, 0x111111, 0x050505);
            grid.rotation.x = Math.PI / 2;
            grid.position.z = -2;
            scene.add(grid);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            
            // Update Mesh
            mesh.material.uniforms.uTime.value = elapsed;
            const pulse = Math.sin(elapsed * 0.5) * 0.2 + 0.3;
            mesh.material.uniforms.uDistortion.value = pulse;
            mesh.rotation.y += 0.005;
            mesh.rotation.z += 0.002;

            // Update Particles
            const positions = particles.geometry.attributes.position.array;
            const velocities = particles.geometry.attributes.velocity.array;
            
            for(let i=0; i<particleCount; i++) {
                const idx = i * 3;
                
                // Move towards center or away based on sine wave
                const dist = Math.sqrt(positions[idx]**2 + positions[idx+1]**2 + positions[idx+2]**2);
                const force = Math.sin(elapsed * 0.5) > 0 ? -0.001 : 0.001;

                // Turbulence
                velocities[idx] += (Math.random() - 0.5) * 0.001;
                velocities[idx+1] += (Math.random() - 0.5) * 0.001;
                velocities[idx+2] += (Math.random() - 0.5) * 0.001;

                positions[idx] += velocities[idx] + force * (dist * 0.1);
                positions[idx+1] += velocities[idx+1] + force * (dist * 0.1);
                positions[idx+2] += velocities[idx+2] + force * (dist * 0.1);

                // Boundary reset
                if(dist > 6 || dist < 0.1) {
                    positions[idx] = (Math.random() - 0.5) * 10;
                    positions[idx+1] = (Math.random() - 0.5) * 10;
                    positions[idx+2] = (Math.random() - 0.5) * 10;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // UI update simulation
            if(Math.random() > 0.98) {
                const stab = (95 + Math.random() * 5).toFixed(1);
                stabilityEl.innerText = `${stab}%`;
            }

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
