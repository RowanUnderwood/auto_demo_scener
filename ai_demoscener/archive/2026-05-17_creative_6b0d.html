<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Holographic Glitch</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0ff;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none;
            text-align: center;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            opacity: 0.8;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="overlay">SYSTEM REBOOT...</div>
    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        camera.position.y = 2;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- POST PROCESSING ---
        const renderScene = new RenderPass(scene, camera);

        // Bloom for that glowing synthwave look
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2;
        bloomPass.strength = 2.0; // Very strong bloom
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- PROCEDURAL TEXTURE GENERATOR ---
        // We need a texture for the shader to sample. Instead of loading an image,
        // we generate a "Grid/Scanline" texture programmatically.
        function createProceduralGridTexture() {
            const size = 1024;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, size, size);

            // Grid Lines
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            
            // Random noise overlay for "grain"
            const imageData = ctx.getImageData(0, 0, size, size);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 50;
                data[i] = Math.min(255, Math.max(0, data[i] + noise));
                data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
                data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
            }
            ctx.putImageData(imageData, 0, 0);

            // Draw Grid
            for (let i = 0; i < size; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, size);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(size, i);
                ctx.stroke();
            }

            // Add some random "glitch" blocks
            ctx.fillStyle = '#ffffff';
            for(let i=0; i<50; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const w = Math.random() * 100;
                const h = Math.random() * 50;
                ctx.fillRect(x, y, w, h);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter; // Pixelated look
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        const dataTexture = createProceduralGridTexture();

        // --- SHADERS ---
        
        // Vertex Shader: Handles the 3D shape and UVs
        const vertexShader = `
            varying vec2 vUv;
            varying float vDisplacement;
            uniform float uTime;
            uniform float uMouseX;
            uniform float uMouseY;
            uniform float uSpeed;

            void main() {
                vUv = uv;
                
                // Basic distortion based on position and time
                float offset = sin(position.x * 3.0 + uTime * uSpeed) * 0.5;
                offset += cos(position.y * 2.0 + uTime * uSpeed) * 0.5;
                
                // Mouse interaction pushes geometry
                float mousePush = sin(position.x * 5.0) * uMouseX;
                
                vec3 pos = position + normal * (offset + mousePush);
                
                vDisplacement = offset + mousePush;
                
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        // Fragment Shader: The CORE of the effect.
        // It samples the texture 3 times (RGB channels) with offsets to create the RGB Shift/Glitch look.
        const fragmentShader = `
            uniform sampler2D uTexture;
            uniform float uTime;
            uniform float uMouseX;
            varying vec2 vUv;
            varying float vDisplacement;

            // Simple sine wave pattern function (used if we didn't have the texture, adds extra detail)
            float pattern(vec2 uv) {
                return sin(uv.x * 10.0 + uTime) * 0.5 + 0.5;
            }

            void main() {
                // Base UVs
                vec2 uv = vUv;

                // Animate the texture coordinates
                float texOffset = sin(uTime * 0.5) * 0.1;
                uv.y += texOffset;
                
                // RGB Shift Logic: 
                // We sample the texture at slightly different UVs for R, G, and B
                // This creates the chromatic aberration effect
                
                // Red Channel: Shifted +X
                vec4 colorR = texture2D(uTexture, uv + vec2(0.02 + vDisplacement * 0.5, 0.0));
                
                // Green Channel: Normal
                vec4 colorG = texture2D(uTexture, uv);
                
                // Blue Channel: Shifted -X
                vec4 colorB = texture2D(uTexture, uv + vec2(-(0.02 + vDisplacement * 0.5), 0.0));

                // Mix in some color noise based on displacement
                // High displacement = more glitchy / colorful
                float noise = abs(vDisplacement) * 10.0;
                float rNoise = sin(uTime * 5.0 + vUv.y * 20.0) * 0.2;
                float bNoise = cos(uTime * 8.0 + vUv.x * 20.0) * 0.2;

                // Construct final color
                vec3 finalColor = vec3(colorR.r + rNoise, colorG.g, colorB.b + bNoise);

                // Apply tone mapping (simulate glowing)
                finalColor = pow(finalColor, vec3(1.0/1.2)); // Gamma correction

                // Mask edges for vignette
                float dist = distance(vUv, vec2(0.5));
                float alpha = 1.0 - smoothstep(0.3, 0.6, dist);
                
                gl_FragColor = vec4(finalColor, alpha);
            }
        `;

        // --- OBJECT CREATION ---

        const geometry = new THREE.TorusKnotGeometry(1.2, 0.4, 200, 32);
        
        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTexture: { value: dataTexture },
                uTime: { value: 0 },
                uMouseX: { value: 0 },
                uMouseY: { value: 0 },
                uSpeed: { value: 0.5 }
            },
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            wireframe: false,
            wireframeLinewidth: 1
        });

        const torusKnot = new THREE.Mesh(geometry, material);
        scene.add(torusKnot);

        // --- BACKGROUND STARS ---
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 2000;
        const posArray = new Float32Array(starsCount * 3);

        for(let i = 0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 100;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMaterial = new THREE.PointsMaterial({
            size: 0.05,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8
        });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // --- INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let targetRotationX = 0;
        let targetRotationY = 0;

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Smooth out mouse influence
            targetRotationX = mouse.x * 0.5;
            targetRotationY = mouse.y * 0.5;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            
            // Update uniform time
            material.uniforms.uTime.value = elapsedTime;

            // Interact with shader
            // Smoothly interpolate the uniform values to create a "lag" feel
            material.uniforms.uMouseX.value += (targetRotationX - material.uniforms.uMouseX.value) * 0.05;
            material.uniforms.uMouseY.value += (targetRotationY - material.uniforms.uMouseY.value) * 0.05;

            // Rotate entire object slowly
            torusKnot.rotation.y += 0.01;
            torusKnot.rotation.z += 0.005;

            // Rotate stars
            stars.rotation.y -= 0.002;

            // Add subtle floating effect to camera
            camera.position.y = 2 + Math.sin(elapsedTime * 0.5) * 0.5;
            camera.lookAt(0, 0, 0);

            composer.render();
        }

        // Text effect fade out
        setTimeout(() => {
            const overlay = document.getElementById('overlay');
            overlay.style.transition = 'opacity 1s';
            overlay.style.opacity = '0';
            setTimeout(() => overlay.remove(), 1000);
        }, 2000);

        animate();
    </script>
</body>
</html>
