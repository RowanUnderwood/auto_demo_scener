<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS ENTROPY</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        canvas { display: block; }
        #overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0ff;
            letter-spacing: 2px;
            font-size: 10px;
            pointer-events: none;
            text-transform: uppercase;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div id="overlay">System Status: Temporal Decay Active // Entropy Level: High</div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // --- SHADER SOURCE: NOISE & DISTORTION ---
        const vertexShader = `
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying float vNoise;
            uniform float uTime;

            // Simplex 3D Noise
            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            float snoise(vec3 v){ 
              const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
              const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
              vec3 i  = floor(v + dot(v, C.yyy) );
              vec3 x0 =   v - i + dot(i, C.xxx) ;
              vec3 g = step(x0.yzx, x0.xyz);
              vec3 l = 1.0 - g;
              vec3 i1 = min( g.xyz, l.zxy );
              vec3 i2 = max( g.xyz, l.zxy );
              vec3 x1 = x0 - i1 + C.xxx;
              vec3 x2 = x0 - i2 + C.yyy;
              vec3 x3 = x0 - D.yyy;
              i = mod(i, 289.0 ); 
              vec4 p = permute( permute( permute( 
                         i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                       + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                       + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
              float n_ = 1.0/7.0;
              vec3  ns = n_ * D.wyz - D.xzx;
              vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
              vec4 x_ = floor(j * ns.z);
              vec4 y_ = floor(j - 7.0 * x_ );
              vec4 x = x_ *ns.x + ns.yyyy;
              vec4 y = y_ *ns.x + ns.yyyy;
              vec4 h = 1.0 - abs(x) - abs(y);
              vec4 b0 = vec4( x.xy, y.xy );
              vec4 b1 = vec4( x.zw, y.zw );
              vec4 s0 = floor(b0)*2.0 + 1.0;
              vec4 s1 = floor(b1)*2.0 + 1.0;
              vec4 sh = -step(h, vec4(0.0));
              vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
              vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
              vec3 p0 = vec3(a0.xy,h.x);
              vec3 p1 = vec3(a0.zw,h.y);
              vec3 p2 = vec3(a1.xy,h.z);
              vec3 p3 = vec3(a1.zw,h.w);
              vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
              p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
              vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
              m = m * m;
              return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vUv = uv;
                vNormal = normal;
                
                // Create complex displacement using layered noise
                float noise = snoise(vec3(position * 0.5 + uTime * 0.2));
                noise += 0.5 * snoise(vec3(position * 1.2 - uTime * 0.4));
                vNoise = noise;

                // Displace vertex position
                vec3 newPosition = position + normal * noise * 0.6;
                vPosition = newPosition;
                
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
            }
        `;

        const fragmentShader = `
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying float vNoise;
            uniform float uTime;

            void main() {
                // Fresnel effect
                vec3 viewDir = normalize(cameraPosition - vPosition);
                float fresnel = pow(1.0 - dot(viewDir, vNormal), 3.0);

                // Color mapping based on noise and position
                vec3 colorA = vec3(0.0, 0.8, 1.0); // Cyan
                vec3 colorB = vec3(0.5, 0.0, 1.0); // Purple
                vec3 colorC = vec3(1.0, 0.0, 0.5); // Pink

                vec3 baseColor = mix(colorA, colorB, vNoise * 0.5 + 0.5);
                baseColor = mix(baseColor, colorC, sin(uTime * 0.5) * 0.5 + 0.5);

                // Add glow to edges and noise peaks
                vec3 finalColor = baseColor + (fresnel * 0.8);
                finalColor += (vNoise > 0.4) ? vec3(0.2, 1.0, 1.0) * vNoise : vec3(0.0);

                // Darken internal parts
                float intensity = dot(vNormal, vec3(0.0, 0.0, 1.0));
                finalColor *= (intensity * 0.5 + 0.5);

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // --- APP SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- MONOLITH (The Centerpiece) ---
        const geometry = new THREE.IcosahedronGeometry(2, 128); // High poly for smooth noise
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 }
            },
            wireframe: false
        });

        const monolith = new THREE.Mesh(geometry, material);
        scene.add(monolith);

        // Wireframe overlay for tech look
        const wireMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.1 
        });
        const wireframe = new THREE.Mesh(geometry, wireMaterial);
        wireframe.scale.setScalar(1.01);
        monolith.add(wireframe);

        // --- PARTICLES (The Entropy Field) ---
        const partCount = 5000;
        const partGeo = new THREE.BufferGeometry();
        const posArray = new Float32Array(partCount * 3);
        const velArray = new Float32Array(partCount * 3);

        for(let i=0; i<partCount*3; i++) {
            posArray[i] = (Math.random() - 0.5) * 20;
            velArray[i] = (Math.random() - 0.5) * 0.02;
        }

        partGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const partMat = new THREE.PointsMaterial({
            size: 0.015,
            color: 0x00ffff,
            transparent: true,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(partGeo, partMat);
        scene.add(particles);

        // --- FLOATING GEOMETRY (Debris) ---
        const debrisGroup = new THREE.Group();
        for(let i=0; i<20; i++) {
            const dGeo = new THREE.OctahedronGeometry(Math.random() * 0.3, 0);
            const dMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.3 });
            const dMesh = new THREE.Mesh(dGeo, dMat);
            dMesh.position.set((Math.random()-0.5)*15, (Math.random()-0.5)*15, (Math.random()-0.5)*15);
            debrisGroup.add(dMesh);
        }
        scene.add(debrisGroup);

        camera.position.z = 7;

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            // Update Uniforms
            material.uniforms.uTime.value = elapsed;

            // Monolith Rotation
            monolith.rotation.y = elapsed * 0.1;
            monolith.rotation.z = elapsed * 0.05;

            // Particles movement (Swirl)
            const positions = partGeo.attributes.position.array;
            for(let i=0; i<partCount; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                // Spiral math
                const angle = elapsed * 0.2 + (positions[ix] * 0.5);
                const dist = Math.sqrt(positions[ix]**2 + positions[iz]**2);
                
                positions[ix] += Math.sin(angle) * 0.01;
                positions[iz] += Math.cos(angle) * 0.01;

                // Drifting away from center
                if (dist > 15) {
                    positions[ix] *= 0.9;
                    positions[iy] *= 0.9;
                    positions[iz] *= 0.9;
                } else {
                    positions[ix] += (Math.random() - 0.5) * 0.01;
                    positions[iy] += (Math.random() - 0.5) * 0.01;
                    positions[iz] += (Math.random() - 0.5) * 0.01;
                }
            }
            partGeo.attributes.position.needsUpdate = true;

            // Debris rotation
            debrisGroup.children.forEach((d, idx) => {
                d.rotation.x += 0.01;
                d.rotation.y += 0.02;
                d.position.y += Math.sin(elapsed + idx) * 0.005;
            });

            // Camera movement (Subtle drift)
            camera.position.x = Math.sin(elapsed * 0.3) * 0.5;
            camera.position.y = Math.cos(elapsed * 0.2) * 0.5;
            camera.lookAt(0,0,0);

            renderer.render(scene, camera);
        }

        // --- HANDLE RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
