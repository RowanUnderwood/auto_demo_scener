<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNES Mode 7 Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.PlaneGeometry(2, 2);
    const uniforms = {
        u_time: { value: 0.0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    const material = new THREE.ShaderMaterial({
        uniforms: uniforms,
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float u_time;
            uniform vec2 u_resolution;
            varying vec2 vUv;

            void main() {
                // Normalize UVs such that (0,0) is bottom-left and (1,1) is top-right
                vec2 uv = gl_FragCoord.xy / u_resolution.xy;
                float x = uv.x;
                float y = uv.y;

                float horizon = 0.55;
                vec3 color;

                if (y < horizon) {
                    // --- Mode 7 Floor Logic ---
                    // The "perspective divide" effect: distance increases as Y approaches the horizon from below
                    float depth = 1.0 / max(horizon - y, 0.001);
                    
                    // Scale factors for view distance and field of view
                    float zoom = 0.2;
                    float fovScale = 0.5;

                    // Calculate world-space coordinates (X and Z)
                    // We use X for horizontal position and depth as the Z plane
                    float world_x = (x - 0.5) * depth * fovScale + (u_time * 1.5);
                    float world_z = depth * zoom - (u_time * 2.0);

                    // Procedural Checkerboard
                    // Use large enough scale for the pattern to be visible
                    float checkSize = 4.0;
                    vec2 grid = floor(vec2(world_x, world_z) * checkSize);
                    float checker = mod(grid.x + grid.y, 2.0);

                    vec3 red = vec3(1.0, 0.1, 0.1);
                    vec3 white = vec3(1.0, 1.0, 1.0);
                    color = mix(red, white, checker);

                    // Simple distance shading to give a sense of depth towards the horizon
                    float vignette = smoothstep(0.0, 0.5, (horizon - y) / horizon);
                    // We don't want to darken it too much, just enough to simulate atmosphere/distance
                    color *= mix(0.6, 1.0, clamp(depth * 0.02, 0.0, 1.0));

                } else {
                    // --- Sky Gradient Logic ---
                    // Normalized height from horizon (0.0) to zenith (1.0)
                    float sky_y = (y - horizon) / (1.0 - horizon);
                    
                    vec3 peachOrange = vec3(1.0, 0.55, 0.35);
                    vec3 deepViolet = vec3(0.15, 0.02, 0.3);
                    
                    color = mix(peachOrange, deepViolet, sky_y);
                }

                gl_FragColor = vec4(color, 1.0);
            }
        `
    });

    const quad = new THREE.Mesh(geometry, material);
    scene.add(quad);

    function animate(time) {
        uniforms.u_time.value = time * 0.001;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        uniforms.u_resolution.value.set(w, h);
    });

    requestAnimationFrame(animate);
</script>
</body>
</html>
