<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; overflow: hidden; background: #02040a; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x02040a, 1);
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.1, 0.55, 0.12);
composer.addPass(bloomPass);

// Soft central halo for atmosphere
function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0.0, 'rgba(255,255,255,0.9)');
  g.addColorStop(0.25, 'rgba(255,255,255,0.35)');
  g.addColorStop(0.6, 'rgba(255,255,255,0.08)');
  g.addColorStop(1.0, 'rgba(255,255,255,0.0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  return t;
}
const glowMat = new THREE.SpriteMaterial({
  map: makeGlowTexture(), color: 0x16386b, transparent: true, opacity: 0.55,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const glow = new THREE.Sprite(glowMat);
glow.scale.set(46, 46, 1);
scene.add(glow);

// Background stars
const starGeo = new THREE.BufferGeometry();
const starCount = 1200;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const r = 60 + Math.random() * 120;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  starPos[i * 3 + 2] = r * Math.cos(phi);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x3a5577, size: 0.22, sizeAttenuation: true })));

// Neurons
const N = 180;
const neurons = [];
for (let i = 0; i < N; i++) {
  neurons.push({
    pos: new THREE.Vector3((Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16),
    vel: new THREE.Vector3((Math.random() - 0.5) * 0.25, (Math.random() - 0.5) * 0.25, (Math.random() - 0.5) * 0.25),
    phase: Math.random() * Math.PI * 2,
    fireTime: 0,
    energy: Math.random(),
    tint: Math.random()
  });
}

const neuronGeo = new THREE.BufferGeometry();
const nPos = new Float32Array(N * 3);
const nColor = new Float32Array(N * 3);
const nSize = new Float32Array(N);
neuronGeo.setAttribute('position', new THREE.BufferAttribute(nPos, 3));
neuronGeo.setAttribute('aColor', new THREE.BufferAttribute(nColor, 3));
neuronGeo.setAttribute('aSize', new THREE.BufferAttribute(nSize, 1));

const neuronMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute vec3 aColor;
    attribute float aSize;
    varying vec3 vColor;
    void main() {
      vColor = aColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (180.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.0, d);
      a *= a;
      gl_FragColor = vec4(vColor, a);
    }
  `
});
scene.add(new THREE.Points(neuronGeo, neuronMat));

// Connections
const MAX_CONN = 900;
const connGeo = new THREE.BufferGeometry();
const connPos = new Float32Array(MAX_CONN * 6);
const connCol = new Float32Array(MAX_CONN * 6);
connGeo.setAttribute('position', new THREE.BufferAttribute(connPos, 3));
connGeo.setAttribute('color', new THREE.BufferAttribute(connCol, 3));
connGeo.setDrawRange(0, 0);
scene.add(new THREE.LineSegments(connGeo, new THREE.LineBasicMaterial({
  transparent: true, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false
})));

// Signals
const MAX_SIG = 120;
const signals = [];
const sigGeo = new THREE.BufferGeometry();
const sigPos = new Float32Array(MAX_SIG * 3);
const sigCol = new Float32Array(MAX_SIG * 3);
sigGeo.setAttribute('position', new THREE.BufferAttribute(sigPos, 3));
sigGeo.setAttribute('color', new THREE.BufferAttribute(sigCol, 3));
sigGeo.setDrawRange(0, 0);
scene.add(new THREE.Points(sigGeo, new THREE.PointsMaterial({
  size: 0.45, sizeAttenuation: true, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
})));

// Fire rings
const MAX_RINGS = 32;
const RING_SEGS = 48;
const rings = [];
const ringGeo = new THREE.BufferGeometry();
const ringPos = new Float32Array(MAX_RINGS * RING_SEGS * 6);
const ringCol = new Float32Array(MAX_RINGS * RING_SEGS * 6);
ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
ringGeo.setAttribute('color', new THREE.BufferAttribute(ringCol, 3));
ringGeo.setDrawRange(0, 0);
scene.add(new THREE.LineSegments(ringGeo, new THREE.LineBasicMaterial({
  transparent: true, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false
})));

const CONNECT_DIST = 3.8;
const BOUND = 8.5;

function fireNeuron(idx) {
  const n = neurons[idx];
  n.fireTime = 1.0;
  if (rings.length < MAX_RINGS) {
    rings.push({ center: n.pos.clone(), age: 0, life: 0.75 + Math.random() * 0.4 });
  }
  const neighbors = [];
  for (let j = 0; j < N; j++) {
    if (j === idx) continue;
    const d = n.pos.distanceTo(neurons[j].pos);
    if (d < CONNECT_DIST) neighbors.push(j);
  }
  const count = Math.min(neighbors.length, 1 + Math.floor(Math.random() * 3));
  for (let k = 0; k < count; k++) {
    const target = neighbors[Math.floor(Math.random() * neighbors.length)];
    if (signals.length < MAX_SIG) {
      signals.push({ from: idx, to: target, t: 0, speed: 1.2 + Math.random() * 1.2 });
    }
  }
}

for (let i = 0; i < 6; i++) fireNeuron(Math.floor(Math.random() * N));

const clock = new THREE.Clock();
let time = 0;
const _t1 = new THREE.Vector3();
const _t2 = new THREE.Vector3();
const _t3 = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.033);
  time += dt;

  // Update neurons
  for (let i = 0; i < N; i++) {
    const n = neurons[i];
    n.pos.addScaledVector(n.vel, dt);
    if (Math.abs(n.pos.x) > BOUND) n.vel.x *= -1;
    if (Math.abs(n.pos.y) > BOUND) n.vel.y *= -1;
    if (Math.abs(n.pos.z) > BOUND) n.vel.z *= -1;
    n.fireTime = Math.max(0, n.fireTime - dt * 1.8);

    const ux = Math.sin(time * 0.5 + n.phase) * 0.12;
    const uy = Math.cos(time * 0.4 + n.phase * 1.3) * 0.12;
    const uz = Math.sin(time * 0.3 + n.phase * 0.7) * 0.12;
    nPos[i * 3] = n.pos.x + ux;
    nPos[i * 3 + 1] = n.pos.y + uy;
    nPos[i * 3 + 2] = n.pos.z + uz;

    const f = n.fireTime;
    const t = n.tint;
    // subtle per-neuron hue variety: cyan -> teal/violet, plus warm flash on fire
    nColor[i * 3]     = 0.10 + t * 0.22 + f * 0.95;
    nColor[i * 3 + 1] = 0.40 + t * 0.45 + f * 0.55;
    nColor[i * 3 + 2] = 0.85 - t * 0.15 + f * 0.20;
    nSize[i] = 1.4 + f * 5.5 + Math.sin(time * 2.5 + n.phase) * 0.35;
  }
  neuronGeo.attributes.position.needsUpdate = true;
  neuronGeo.attributes.aColor.needsUpdate = true;
  neuronGeo.attributes.aSize.needsUpdate = true;

  // Connections
  let cc = 0;
  for (let i = 0; i < N && cc < MAX_CONN; i++) {
    for (let j = i + 1; j < N && cc < MAX_CONN; j++) {
      const dx = nPos[i * 3] - nPos[j * 3];
      const dy = nPos[i * 3 + 1] - nPos[j * 3 + 1];
      const dz = nPos[i * 3 + 2] - nPos[j * 3 + 2];
      const d2 = dx * dx + dy * dy + dz * dz;
      if (d2 < CONNECT_DIST * CONNECT_DIST) {
        const s = 1.0 - Math.sqrt(d2) / CONNECT_DIST;
        const s2 = s * s;
        const bright = 0.07 + s2 * 0.4 + Math.max(neurons[i].fireTime, neurons[j].fireTime) * 0.7;
        const o = cc * 6;
        connPos[o] = nPos[i * 3]; connPos[o + 1] = nPos[i * 3 + 1]; connPos[o + 2] = nPos[i * 3 + 2];
        connPos[o + 3] = nPos[j * 3]; connPos[o + 4] = nPos[j * 3 + 1]; connPos[o + 5] = nPos[j * 3 + 2];
        connCol[o] = bright * 0.25; connCol[o + 1] = bright * 0.65; connCol[o + 2] = bright;
        connCol[o + 3] = bright * 0.25; connCol[o + 4] = bright * 0.65; connCol[o + 5] = bright;
        cc++;
      }
    }
  }
  connGeo.setDrawRange(0, cc * 2);
  connGeo.attributes.position.needsUpdate = true;
  connGeo.attributes.color.needsUpdate = true;

  // Signals
  for (let i = signals.length - 1; i >= 0; i--) {
    signals[i].t += signals[i].speed * dt;
    if (signals[i].t >= 1.0) {
      fireNeuron(signals[i].to);
      signals.splice(i, 1);
    }
  }
  const sc = signals.length;
  for (let i = 0; i < sc; i++) {
    const s = signals[i];
    sigPos[i * 3] = nPos[s.from * 3] + (nPos[s.to * 3] - nPos[s.from * 3]) * s.t;
    sigPos[i * 3 + 1] = nPos[s.from * 3 + 1] + (nPos[s.to * 3 + 1] - nPos[s.from * 3 + 1]) * s.t;
    sigPos[i * 3 + 2] = nPos[s.from * 3 + 2] + (nPos[s.to * 3 + 2] - nPos[s.from * 3 + 2]) * s.t;
    sigCol[i * 3] = 1.0; sigCol[i * 3 + 1] = 0.92; sigCol[i * 3 + 2] = 0.5;
  }
  sigGeo.setDrawRange(0, sc);
  sigGeo.attributes.position.needsUpdate = true;
  sigGeo.attributes.color.needsUpdate = true;

  // Rings
  for (let i = rings.length - 1; i >= 0; i--) {
    rings[i].age += dt;
    if (rings[i].age > rings[i].life) rings.splice(i, 1);
  }
  const rc = rings.length;
  for (let i = 0; i < rc; i++) {
    const r = rings[i];
    const prog = r.age / r.life;
    const radius = 0.3 + prog * 3.0;
    const alpha = (1.0 - prog) * (1.0 - prog) * 0.8;
    const c = r.center;
    _t1.copy(camera.position).sub(c).normalize();
    if (Math.abs(_t1.dot(_up)) > 0.9) _up.set(1, 0, 0);
    _t2.crossVectors(_t1, _up).normalize();
    _t3.crossVectors(_t1, _t2).normalize();

    for (let s = 0; s < RING_SEGS; s++) {
      const a1 = (s / RING_SEGS) * Math.PI * 2;
      const a2 = ((s + 1) / RING_SEGS) * Math.PI * 2;
      const o = (i * RING_SEGS + s) * 6;
      ringPos[o] = c.x + _t2.x * Math.cos(a1) * radius + _t3.x * Math.sin(a1) * radius;
      ringPos[o + 1] = c.y + _t2.y * Math.cos(a1) * radius + _t3.y * Math.sin(a1) * radius;
      ringPos[o + 2] = c.z + _t2.z * Math.cos(a1) * radius + _t3.z * Math.sin(a1) * radius;
      ringPos[o + 3] = c.x + _t2.x * Math.cos(a2) * radius + _t3.x * Math.sin(a2) * radius;
      ringPos[o + 4] = c.y + _t2.y * Math.cos(a2) * radius + _t3.y * Math.sin(a2) * radius;
      ringPos[o + 5] = c.z + _t2.z * Math.cos(a2) * radius + _t3.z * Math.sin(a2) * radius;
      ringCol[o] = 0.25 * alpha; ringCol[o + 1] = 0.85 * alpha; ringCol[o + 2] = 1.0 * alpha;
      ringCol[o + 3] = 0.25 * alpha; ringCol[o + 4] = 0.85 * alpha; ringCol[o + 5] = 1.0 * alpha;
    }
  }
  ringGeo.setDrawRange(0, rc * RING_SEGS * 2);
  ringGeo.attributes.position.needsUpdate = true;
  ringGeo.attributes.color.needsUpdate = true;

  if (Math.random() < 0.035) fireNeuron(Math.floor(Math.random() * N));

  // Halo gently breathes
  glowMat.opacity = 0.45 + Math.sin(time * 0.4) * 0.08;

  // Camera
  const ca = time * 0.12;
  camera.position.set(Math.cos(ca) * 20, Math.sin(time * 0.08) * 5, Math.sin(ca) * 20);
  camera.lookAt(0, 0, 0);

  composer.render();
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
