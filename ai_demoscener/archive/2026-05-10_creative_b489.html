<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON CHRONOS - Demoscene</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: #0ff; pointer-events: none; text-shadow: 0 0 5px #0ff; }
    </style>
</head>
<body>
    <div id="ui">SYSTEM.CORE_STABILITY: <span id="stability">100%</span><br>CHRONOS_SYNC: ACTIVE</div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // Concept: "Chronos Fractal Lattice"
        // A hybrid of Raymarching, Rotozoomer, and Particle Systems.
        // An infinite recursive structure that pulses with time, 
        // using a custom SDF for "fractalized" geometry and particle trails.

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- SHADER DEFINITIONS ---
        const fragmentShader = `
            uniform float time;
            uniform vec2 resolution;
            uniform sampler2D tParticles;

            mat2 rot(float a) { return mat2(cos(a), -sin(a), sin(a), cos(a)); }

            // Smooth minimum for fractal blending
            float smin(float a, float b, float k) {
                float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
                return mix(b, a, h) - k * h * (1.0 - h);
            }

            // Distance Function: A recursive "Sierpinski-style" box lattice
            float map(vec3 p) {
                float d = length(p) - 1.5; // Base sphere
                
                // Fractal repetition logic
                float scale = 1.0;
                for(int i = 0; i < 4; i++) {
                    p = abs(p) - 0.5 * scale;
                    p.xy *= rot(time * 0.2 + float(i));
                    p.xz *= rot(time * 0.3);
                    scale *= 1.8;
                }
                
                // Create the lattice holes via a periodic box SDF
                vec3 q = mod(p, 1.5) - 0.75;
                float box = length(max(abs(q) - 0.3, 0.0));
                d = smin(d, box, 0.4);
                
                return d * 0.6; // Distance multiplier for smoother look
            }

            vec3 getNormal(vec3 p) {
                vec2 e = vec2(0.01, 0.0);
                return normalize(vec3(
                    map(p + e.xyy) - map(p - e.xyy),
                    map(p + e.yxy) - map(p - e.yxy),
                    map(p + e.yyx) - map(p - e.yyx)
                ));
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy - 0.5 * resolution.xy) / min(resolution.y, resolution.x);
                vec3 ro = vec3(0.0, 0.0, -4.0); // Ray origin
                vec3 rd = normalize(vec3(uv, 1.2)); // Ray direction

                // Camera rotation pulse
                ro.xz *= rot(time * 0.1);
                rd.xz *= rot(time * 0.1);

                float t = 0.0;
                float d;
                vec3 p;

                // Raymarching Loop
                for(int i = 0; i < 80; i++) {
                    p = ro + rd * t;
                    d = map(p);
                    if(d < 0.001 || t > 20.0) break;
                    t += d;
                }

                vec3 col = vec3(0.0);

                if(t < 20.0) {
                    vec3 normal = getNormal(p);
                    float diff = max(dot(normal, normalize(vec3(1, 2, -3))), 0.0);
                    float spec = pow(max(dot(reflect(rd, normal), normalize(vec3(1, 2, -3))), 0.0), 32.0);
                    
                    // Neon palette based on depth and normals
                    vec3 baseCol = 0.5 + 0.5 * cos(time + p.xyx + vec3(0, 2, 4));
                    col = baseCol * diff;
                    col += spec * 0.8; // Specular highlight
                    col *= exp(-0.1 * t); // Fog
                }

                // Add a "glitch" scanline overlay
                col *= 0.9 + 0.1 * sin(gl_FragCoord.y * 2.0 + time * 10.0);
                
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        const vertexShader = `
            void main() {
                gl_Position = vec4(position, 1.0);
            }
        `;

        // --- SETUP FULLSCREEN QUAD ---
        const quadGeo = new THREE.PlaneGeometry(2, 2);
        const quadMat = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader,
            fragmentShader
        });
        const quad = new THREE.Mesh(quadGeo, quadMat);
        scene.add(quad);

        // --- ADDING PARTICLE ACCENTS (Foreground) ---
        const partCount = 1500;
        const partGeo = new THREE.BufferGeometry();
        const posArray = new Float32Array(partCount * 3);
        const velArray = new Float32Array(partCount * 3);
        
        for(let i=0; i<partCount*3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
            velArray[i] = (Math.random() - 0.5) * 0.02;
        }

        partGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const partMat = new THREE.PointsMaterial({
            size: 0.02,
            color: 0x00ffff,
            transparent: true,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(partGeo, partMat);
        scene.add(particles);

        // --- ANIMATION LOOP ---
        let clock = new THREE.Clock();
        const stabilityEl = document.getElementById('stability');

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            quadMat.uniforms.time.value = elapsed;

            // Animate Particles
            const positions = particles.geometry.attributes.position.array;
            for(let i=0; i<partCount * 3; i+=3) {
                positions[i] += velArray[i];
                positions[i+1] += velArray[i+1];
                positions[i+2] += velArray[i+2];

                // Boundary wrap
                if(Math.abs(positions[i]) > 5) positions[i] *= -0.9;
                if(Math.abs(positions[i+1]) > 5) positions[i+1] *= -0.9;
                if(Math.abs(positions[i+2]) > 5) positions[i+2] *= -0.9;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // UI Glitch Effect
            if(Math.random() > 0.98) {
                stabilityEl.innerText = (Math.random() * 10 + 90).toFixed(2) + "%";
                stabilityEl.style.color = "#f0f";
            } else if (Math.random() > 0.95) {
                stabilityEl.innerText = "STABLE";
                stabilityEl.style.color = "#0ff";
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            quadMat.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
