<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quantum Crystal</title>
  <style>
    body { margin: 0; overflow: hidden; background: #080810; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 14px;
      left: 14px;
      color: rgba(255,180,80,0.55);
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 1px;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(255,150,50,0.3);
    }
  </style>
</head>
<body>
  <div id="info">QUANTUM CRYSTAL &mdash; drag to orbit &bull; scroll to zoom &bull; R to restructure</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x080810, 0.008);
    const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x080810);
    document.body.appendChild(renderer.domElement);

    let latticePoints = [];
    let lines = null;
    let points = null;
    let gridSize = 12;
    let spacing = 3.2;
    let jitter = 0.4;
    let seed = 1;

    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
    }

    function buildLattice() {
      const rng = mulberry32(seed);
      latticePoints = [];
      const half = gridSize;
      for (let x = -half; x <= half; x++) {
        for (let y = -half; y <= half; y++) {
          for (let z = -half; z <= half; z++) {
            const px = x * spacing + (rng() - 0.5) * jitter * spacing;
            const py = y * spacing + (rng() - 0.5) * jitter * spacing;
            const pz = z * spacing + (rng() - 0.5) * jitter * spacing;
            latticePoints.push({ x: px, y: py, z: pz, phase: rng() * Math.PI * 2 });
          }
        }
      }

      // Remove old objects
      if (points) { scene.remove(points); points.geometry.dispose(); points.material.dispose(); }
      if (lines) { scene.remove(lines); lines.geometry.dispose(); lines.material.dispose(); }

      // Points
      const count = latticePoints.length;
      const positions = new Float32Array(count * 3);
      const phases = new Float32Array(count);
      const dists = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const p = latticePoints[i];
        positions[i*3] = p.x;
        positions[i*3+1] = p.y;
        positions[i*3+2] = p.z;
        phases[i] = p.phase;
        dists[i] = Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
      geo.setAttribute('aDist', new THREE.BufferAttribute(dists, 1));

      const vertShader = `
        attribute float aPhase;
        attribute float aDist;
        uniform float uTime;
        uniform float uPulse;
        varying float vGlow;
        varying float vDist;
        void main() {
          vec3 pos = position;
          float wave = sin(uTime * 1.2 - aDist * 0.15 + aPhase * 0.3) * 0.5 + 0.5;
          float pulse = exp(-abs(uTime - uPulse - aDist * 0.04) * 2.0) * 0.8;
          vGlow = wave * 0.6 + pulse + 0.1;
          vDist = aDist;
          pos.x += sin(uTime * 0.3 + aPhase) * 0.15;
          pos.y += cos(uTime * 0.25 + aPhase * 1.3) * 0.15;
          pos.z += sin(uTime * 0.35 + aPhase * 0.7) * 0.15;
          vec4 mv = modelViewMatrix * vec4(pos, 1.0);
          gl_PointSize = (4.0 + vGlow * 10.0) * (200.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `;
      const fragShader = `
        varying float vGlow;
        varying float vDist;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5) discard;
          float core = 1.0 - smoothstep(0.0, 0.15, d);
          float halo = 1.0 - smoothstep(0.1, 0.5, d);
          vec3 warm = vec3(1.0, 0.55, 0.15);
          vec3 hot = vec3(1.0, 0.85, 0.4);
          vec3 cool = vec3(0.3, 0.7, 0.9);
          vec3 col = mix(cool, warm, vGlow) * (core * 1.5 + halo * 0.6);
          float alpha = (core + halo * 0.4) * (0.4 + vGlow * 0.6);
          gl_FragColor = vec4(col, alpha);
        }
      `;
      const mat = new THREE.ShaderMaterial({
        vertexShader: vertShader,
        fragmentShader: fragShader,
        uniforms: { uTime: { value: 0 }, uPulse: { value: 0 } },
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      points = new THREE.Points(geo, mat);
      scene.add(points);

      // Lines
      const linePairs = [];
      const maxDist = spacing * 1.4;
      for (let i = 0; i < count; i++) {
        for (let j = i + 1; j < count; j++) {
          const dx = latticePoints[i].x - latticePoints[j].x;
          const dy = latticePoints[i].y - latticePoints[j].y;
          const dz = latticePoints[i].z - latticePoints[j].z;
          const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
          if (dist < maxDist) {
            linePairs.push(i, j);
          }
        }
      }
      const lineCount = linePairs.length / 2;
      const lPos = new Float32Array(lineCount * 6);
      const lDist = new Float32Array(lineCount * 2);
      for (let i = 0; i < lineCount; i++) {
        const a = latticePoints[linePairs[i*2]];
        const b = latticePoints[linePairs[i*2+1]];
        lPos[i*6] = a.x; lPos[i*6+1] = a.y; lPos[i*6+2] = a.z;
        lPos[i*6+3] = b.x; lPos[i*6+4] = b.y; lPos[i*6+5] = b.z;
        lDist[i*2] = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
        lDist[i*2+1] = Math.sqrt(b.x*b.x + b.y*b.y + b.z*b.z);
      }
      const lGeo = new THREE.BufferGeometry();
      lGeo.setAttribute('position', new THREE.BufferAttribute(lPos, 3));
      lGeo.setAttribute('aDist', new THREE.BufferAttribute(lDist, 1));
      const lVert = `
        attribute float aDist;
        uniform float uTime;
        uniform float uPulse;
        varying float vAlpha;
        void main() {
          float wave = sin(uTime * 0.8 - aDist * 0.12) * 0.5 + 0.5;
          float pulse = exp(-abs(uTime - uPulse - aDist * 0.04) * 2.5) * 0.5;
          vAlpha = wave * 0.15 + pulse * 0.4 + 0.02;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `;
      const lFrag = `
        varying float vAlpha;
        void main() {
          vec3 col = vec3(0.2, 0.6, 0.85);
          gl_FragColor = vec4(col, vAlpha);
        }
      `;
      const lMat = new THREE.ShaderMaterial({
        vertexShader: lVert,
        fragmentShader: lFrag,
        uniforms: { uTime: { value: 0 }, uPulse: { value: 0 } },
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      lines = new THREE.LineSegments(lGeo, lMat);
      scene.add(lines);
    }

    buildLattice();

    // Camera control
    let camTheta = 0.4;
    let camPhi = 0.6;
    let camRadius = 90;
    let targetTheta = 0.4;
    let targetPhi = 0.6;
    let targetRadius = 90;
    let dragging = false;
    let prevX = 0, prevY = 0;

    addEventListener('mousedown', e => { dragging = true; prevX = e.clientX; prevY = e.clientY; });
    addEventListener('mouseup', () => dragging = false);
    addEventListener('mousemove', e => {
      if (!dragging) return;
      targetTheta += (e.clientX - prevX) * 0.005;
      targetPhi += (e.clientY - prevY) * 0.005;
      targetPhi = Math.max(0.1, Math.min(Math.PI - 0.1, targetPhi));
      prevX = e.clientX; prevY = e.clientY;
    });
    addEventListener('wheel', e => {
      targetRadius += e.deltaY * 0.05;
      targetRadius = Math.max(30, Math.min(200, targetRadius));
    });
    addEventListener('keydown', e => {
      if (e.key.toLowerCase() === 'r') {
        seed = Math.floor(Math.random() * 99999);
        gridSize = 8 + Math.floor(Math.random() * 8);
        spacing = 2.5 + Math.random() * 2;
        jitter = 0.2 + Math.random() * 0.6;
        buildLattice();
      }
    });

    // Touch support
    let touchPrevX = 0, touchPrevY = 0;
    addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        touchPrevX = e.touches[0].clientX;
        touchPrevY = e.touches[0].clientY;
      }
    });
    addEventListener('touchmove', e => {
      if (e.touches.length === 1) {
        targetTheta += (e.touches[0].clientX - touchPrevX) * 0.005;
        targetPhi += (e.touches[0].clientY - touchPrevY) * 0.005;
        targetPhi = Math.max(0.1, Math.min(Math.PI - 0.1, targetPhi));
        touchPrevX = e.touches[0].clientX;
        touchPrevY = e.touches[0].clientY;
      }
      e.preventDefault();
    }, { passive: false });

    const clock = new THREE.Clock();
    let pulseTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      pulseTime = t % 4.0;

      // Auto-rotate slowly
      if (!dragging) targetTheta += 0.001;

      // Smooth camera
      camTheta += (targetTheta - camTheta) * 0.06;
      camPhi += (targetPhi - camPhi) * 0.06;
      camRadius += (targetRadius - camRadius) * 0.06;

      camera.position.x = camRadius * Math.sin(camPhi) * Math.cos(camTheta);
      camera.position.y = camRadius * Math.cos(camPhi);
      camera.position.z = camRadius * Math.sin(camPhi) * Math.sin(camTheta);
      camera.lookAt(0, 0, 0);

      // Update shaders
      if (points) {
        points.material.uniforms.uTime.value = t;
        points.material.uniforms.uPulse.value = pulseTime;
      }
      if (lines) {
        lines.material.uniforms.uTime.value = t;
        lines.material.uniforms.uPulse.value = pulseTime;
      }

      renderer.render(scene, camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
