<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Kinetic Prism</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0ff;
            letter-spacing: 2px;
            font-size: 10px;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div id="ui">Kinetic State // Low Gravity // Neon Diffusion</div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // --- Parameters ---
        const COUNT = 60;
        const BOX_SIZE = 14;
        const BOUND = BOX_SIZE / 2;
        const GRAVITY = -2.5; // Lighter, floatier gravity
        const DAMPING = 0.98;  // High bounce retention
        const RADIUS = 0.25;
        const COLORS = [0x00ffff, 0xff00ff, 0xffff00, 0x00ff00];

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.03);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(18, 12, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Lighting (Cinematic Neon) ---
        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x000000, 0.5);
        scene.add(hemiLight);

        // Moving point light to create dynamic shadows/speculars
        const movingLight = new THREE.PointLight(0x00ffff, 20, 30);
        scene.add(movingLight);

        // --- The Prism (Glassy Box) ---
        const boxGeo = new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE);
        const boxMat = new THREE.MeshPhongMaterial({ 
            color: 0x222222, 
            transparent: true, 
            opacity: 0.1, 
            side: THREE.BackSide 
        });
        const cube = new THREE.Mesh(boxGeo, boxMat);
        scene.add(cube);

        const edgesGeo = new THREE.EdgesGeometry(boxGeo);
        const edgeMat = new THREE.LineBasicMaterial({ color: 0x444444 });
        const wireframe = new THREE.LineSegments(edgesGeo, edgeMat);
        scene.add(wireframe);

        // --- Spheres (Neon Orbs) ---
        const spheres = [];
        const sphereGeo = new THREE.SphereGeometry(RADIUS, 24, 24);

        for (let i = 0; i < COUNT; i++) {
            const color = COLORS[Math.floor(Math.random() * COLORS.length)];
            const material = new THREE.MeshStandardMaterial({ 
                color: color, 
                emissive: color, 
                emissiveIntensity: 2,
                roughness: 0.1,
                metalness: 0.8
            });
            
            const mesh = new THREE.Mesh(sphereGeo, material);
            mesh.position.set(
                (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2),
                (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2),
                (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2)
            );

            const velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 15
            );

            scene.add(mesh);
            spheres.push({ mesh, velocity });
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.032);
            const time = clock.getElapsedTime();

            // Rotate camera slowly around the box
            camera.position.x = 20 * Math.cos(time * 0.1);
            camera.position.z = 20 * Math.sin(time * 0.1);
            camera.lookAt(0, 0, 0);

            // Move the accent light
            movingLight.position.x = Math.sin(time) * 10;
            movingLight.position.y = Math.cos(time * 0.5) * 10;
            movingLight.position.z = Math.sin(time * 0.7) * 10;

            spheres.forEach(s => {
                // Physics
                s.velocity.y += GRAVITY * dt;
                s.mesh.position.addScaledVector(s.velocity, dt);

                const pos = s.mesh.position;

                // Boundary Collision with a "glow" bounce effect
                ['x', 'y', 'z'].forEach(axis => {
                    if (pos[axis] + RADIUS > BOUND) {
                        pos[axis] = BOUND - RADIUS;
                        s.velocity[axis] *= -DAMPING;
                    } else if (pos[axis] - RADIUS < -BOUND) {
                        pos[axis] = -BOUND + RADIUS;
                        s.velocity[axis] *= -DAMPING;
                    }
                });

                // Subtle oscillation for a "floating" feel
                s.mesh.scale.setScalar(1 + Math.sin(time * 2 + s.mesh.position.x) * 0.1);
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
