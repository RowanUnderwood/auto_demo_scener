<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotating Checker Shader</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const uniforms = {
  uTime: { value: 0.0 }
};

const shaderMaterial = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;

    void main() {
      // Center UV to [-1, 1]
      vec2 uv = vUv * 2.0 - 1.0;

      // Correct aspect ratio
      uv.x *= 1.0;

      // Rotation matrix with angle = time * 0.3
      float angle = uTime * 0.3;
      float c = cos(angle);
      float s = sin(angle);
      mat2 rot = mat2(c, -s, s, c);

      // Scale pulsing: 1.5 + sin(time) * 0.7
      float scale = 1.5 + sin(uTime) * 0.7;

      // Apply rotation then scale
      vec2 p = rot * uv * scale;

      // Use fract() to tile infinitely across all quadrants
      vec2 tile = fract(p + 0.5);

      // Checker pattern: (floor(p.x) + floor(p.y)) mod 2
      float checker = mod(floor(p.x) + floor(p.y), 2.0);

      // Handle negative modulo
      checker = abs(checker);

      // Two contrasting colors
      vec3 colorA = vec3(0.02, 0.02, 0.08); // Deep navy
      vec3 colorB = vec3(0.0, 0.85, 0.75);  // Bright cyan-teal

      // Add subtle glow to the bright color
      colorB += vec3(0.1, 0.05, 0.02);

      vec3 color = mix(colorA, colorB, checker);

      // Subtle edge glow where tiles meet
      vec2 edge = abs(tile - 0.5);
      float edgeDist = max(edge.x, edge.y);
      float edgeGlow = smoothstep(0.48, 0.5, edgeDist) * 0.15;
      color += vec3(0.0, 0.3, 0.4) * edgeGlow;

      // Vignette
      vec2 vigUv = vUv * (1.0 - vUv);
      float vignette = vigUv.x * vigUv.y * 15.0;
      vignette = clamp(vignette, 0.0, 1.0);
      color *= vignette;

      gl_FragColor = vec4(color, 1.0);
    }
  `
});

const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), shaderMaterial);
scene.add(quad);

function animate(time) {
  requestAnimationFrame(animate);
  uniforms.uTime.value = time * 0.001;
  renderer.render(scene, camera);
}

animate(0);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
