<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON NEBULA - Demoscene</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #0ff; pointer-events: none; text-shadow: 0 0 5px #0ff; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div id="ui">SYSTEM_STATUS: NEON_NEBULA // CORE_ACTIVE</div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        /**
         * CONCEPT: "CHRONO-FLUX SINGULARITY"
         * A fusion of Raymarched SDFs, Particle Systems, and Rotozoomer logic.
         */

        let scene, camera, renderer, clock, particles, shaderMaterial, postMaterial, renderTarget;
        const PARTICLE_COUNT = 15000;

        const vertexShader = `
            varying vec2 vUv;
            varying float vDistort;
            uniform float uTime;

            void main() {
                vUv = uv;
                vec3 pos = position;
                
                float angle = atan(pos.y, pos.x);
                float dist = length(pos.xy);
                float swirl = sin(dist * 2.0 - uTime * 2.0) * 0.5;
                
                pos.x += cos(angle + swirl) * 0.1;
                pos.y += sin(angle + swirl) * 0.1;
                pos.z += sin(uTime * 0.5 + dist) * 2.0;

                vDistort = dist;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                gl_PointSize = (2.0 / length(modelViewMatrix * vec4(pos, 1.0)));
            }
        `;

        const fragmentShader = `
            varying float vDistort;
            uniform float uTime;
            
            vec3 palette(float t) {
                vec3 a = vec3(0.5, 0.5, 0.5);
                vec3 b = vec3(0.5, 0.5, 0.5);
                vec3 c = vec3(1.0, 1.0, 1.0);
                vec3 d = vec3(0.263, 0.416, 0.557);
                return a + b * cos(6.28318 * (c * t + d));
            }

            void main() {
                float strength = distance(gl_PointCoord, vec2(0.5));
                strength = 1.0 - strength;
                strength = pow(strength, 3.0);

                vec3 color = palette(vDistort * 0.2 + uTime * 0.1);
                gl_FragColor = vec4(color, strength);
            }
        `;

        const postVertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const postFragmentShader = `
            uniform sampler2D tDiffuse;
            uniform float uTime;
            varying vec2 vUv;

            void main() {
                vec2 uv = vUv;
                float angle = uTime * 0.05;
                float scale = 1.0 + sin(uTime * 0.2) * 0.2;
                vec2 center = vec2(0.5);
                vec2 dir = uv - center;
                
                mat2 rot = mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
                dir = rot * dir * scale;
                uv = center + dir;

                float r = texture2D(tDiffuse, uv + vec2(0.005 * sin(uTime), 0.0)).r;
                float g = texture2D(tDiffuse, uv).g;
                float b = texture2D(tDiffuse, uv - vec2(0.005 * cos(uTime), 0.0)).b;

                float scanline = sin(uv.y * 800.0 + uTime * 10.0) * 0.04;
                vec3 color = vec3(r, g, b);
                color -= scanline;

                float vignette = smoothstep(0.8, 0.2, length(vUv - 0.5));
                gl_FragColor = vec4(color * vignette, 1.0);
            }
        `;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const r = Math.random() * 40 + 5;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);

                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            shaderMaterial = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 } },
                vertexShader,
                fragmentShader,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, shaderMaterial);
            scene.add(particles);

            const postGeo = new THREE.PlaneGeometry(2, 2);
            postMaterial = new THREE.ShaderMaterial({
                uniforms: { 
                    tDiffuse: { value: null },
                    uTime: { value: 0 }
                },
                vertexShader: postVertexShader,
                fragmentShader: postFragmentShader
            });

            const postScene = new THREE.Scene();
            const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            const postPlane = new THREE.Mesh(postGeo, postMaterial);
            postScene.add(postPlane);

            renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);

            // Store post-processing objects in a way that animate can access them if needed
            // but for simplicity we'll just keep the necessary variables module-scoped.
            window.postScene = postScene;
            window.postCamera = postCamera;

            window.addEventListener('resize', onWindowResize);
        }

        function animate() {
            const delta = clock.getElapsedTime();
            shaderMaterial.uniforms.uTime.value = delta;
            postMaterial.uniforms.uTime.value = delta;

            particles.rotation.y += 0.002;
            particles.rotation.z += 0.001;

            renderer.setRenderTarget(renderTarget);
            renderer.render(scene, camera);

            postMaterial.uniforms.tDiffuse.value = renderTarget.texture;
            renderer.setRenderTarget(null);
            renderer.render(window.postScene, window.postCamera);

            requestAnimationFrame(animate);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderTarget.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
