<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js Julia Set Shader</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
    </style>
</head>
<body>
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>
<script type="module">
    import * as THREE from 'three';

    // Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Uniforms
    const uniforms = {
        uTime: { value: 0.0 },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    // Vertex Shader
    const vertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.0);
        }
    `;

    // Fragment Shader
    const fragmentShader = `
        uniform float uTime;
        uniform vec2 uResolution;
        varying vec2 vUv;

        void main() {
            // Normalize coordinates to [-1, 1], correcting for aspect ratio
            vec2 uv = (gl_FragCoord.xy * 2.0 - uResolution.xy) / uResolution.y;

            // Zoom logic: exp(-time*0.3) gets smaller as time increases (zooms in)
            float zoom = exp(-uTime * 0.3);

            // Center point
            vec2 center = vec2(-0.745, 0.1);

            // Map c from UV centered on chosen point
            vec2 c = uv * zoom + center;

            // Iteration
            vec2 z = vec2(0.0);
            int maxIter = 200;
            float smoothVal = 0.0;
            bool escaped = false;

            for(int i = 0; i < 200; i++) {
                if(i >= maxIter) break;
                
                z = z * z + c;

                // Escape radius squared is 4.0
                if(dot(z, z) > 4.0) {
                    escaped = true;
                    // Smooth coloring
                    float log_zn = log(dot(z, z)) / 2.0;
                    float nu = log(log_zn / log(2.0)) / log(2.0);
                    smoothVal = float(i) + 1.0 - nu;
                    break;
                }
            }

            // Color by smooth iteration count
            vec3 col = vec3(0.0);

            if(escaped) {
                // Sin-based palette
                vec3 a = vec3(0.5, 0.5, 0.5);
                vec3 b = vec3(0.5, 0.5, 0.5);
                vec3 cPalette = vec3(1.0, 1.0, 1.0);
                vec3 d = vec3(0.263, 0.416, 0.557);
                
                float t = smoothVal * 0.05;
                col = a + b * cos(6.28318 * (cPalette * t + d + uTime * 0.2));
            } else {
                col = vec3(0.0); // Interior
            }

            gl_FragColor = vec4(col, 1.0);
        }
    `;

    // Material and Mesh
    const material = new THREE.ShaderMaterial({
        uniforms: uniforms,
        vertexShader: vertexShader,
        fragmentShader: fragmentShader
    });

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(plane);

    // Resize Handler
    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    const clock = new THREE.Clock();
    function animate() {
        uniforms.uTime.value = clock.getElapsedTime();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
