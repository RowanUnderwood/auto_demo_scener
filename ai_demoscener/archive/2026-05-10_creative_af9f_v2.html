<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE FLUX</title>
    <style>
        body { margin: 0; overflow: hidden; background: #02050a; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(100, 255, 218, 0.4);
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            pointer-events: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="ui">
        SYSTEM: ORGANIC RECONSTRUCTION<br>
        STATE: NEURAL SYNC<br>
        FREQ: 432HZ
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- CONFIGURATION ---
        const config = {
            bloomStrength: 2.5,
            bloomRadius: 0.4,
            bloomThreshold: 0.1,
            speed: 0.15,
            noiseStrength: 0.4
        };

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x02050a, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- POST PROCESSING (BLOOM) ---
        const renderScene = new RenderPass(scene, camera);
        
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = config.bloomThreshold;
        bloomPass.strength = config.bloomStrength;
        bloomPass.radius = config.bloomRadius;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- SHADERS ---
        
        // Vertex Shader: Organic Displacement
        const vertexShader = `
            uniform float uTime;
            uniform float uAmplitude;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying float vNoiseVal;
            
            // 3D Noise function
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            
            float snoise(vec3 v) { 
                const vec2  C = vec2(1.0/6.0, 1.0/3.0);
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod(i, 289.0);
                vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                float n_ = 1.0/7.0;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);
                vec4 x = x_ * ns.x + ns.yyyy;
                vec4 y = y_ * ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }

            void main() {
                vUv = uv;
                vNormal = normal;
                
                // Multi-layered noise for organic feel
                float n1 = snoise(vec3(position * 0.8, uTime * 0.5));
                float n2 = snoise(vec3(position * 2.0 + uTime * 0.2, uTime * 0.1));
                float combined = n1 * 0.6 + n2 * 0.4;
                vNoiseVal = combined;
                
                // Displace normals and position simultaneously
                vec3 newNormal = normal + (normalized(position) * combined * 0.3);
                newNormal = normalize(newNormal);
                
                vec3 newPosition = position + normal * (combined * uAmplitude);
                
                vPosition = newPosition;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
            }
        `;

        // Fragment Shader: Bioluminescent
        const fragmentShader = `
            uniform float uTime;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying float vNoiseVal;

            void main() {
                vec3 viewDir = normalize(cameraPosition - vPosition);
                float fresnel = dot(viewDir, vNormal);
                fresnel = clamp(1.0 - fresnel, 0.0, 1.0);
                fresnel = pow(fresnel, 3.0);

                // Bioluminescent Palette
                vec3 colorBase = vec3(0.02, 0.05, 0.1); // Deep Ocean Blue
                vec3 colorGlow = vec3(0.0, 0.8, 0.6);   // Teal
                vec3 colorHot = vec3(0.2, 1.0, 0.4);    // Lime Green
                
                // Noise based coloring
                float noiseIntensity = (vNoiseVal + 1.0) * 0.5;
                
                vec3 color = colorBase;
                
                // Gradient mixing based on noise height
                color = mix(color, colorGlow, noiseIntensity * 0.8);
                color = mix(color, colorHot, pow(noiseIntensity, 2.0) * 0.5);
                
                // Rim lighting (Fresnel) adds the glow
                color += vec3(fresnel * 0.5);
                
                // Pulse effect
                float pulse = sin(uTime * 2.0) * 0.05;
                color += vec3(pulse);

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // --- OBJECTS ---

        // 1. The Central Entity (Organic Sphere)
        const geometry = new THREE.SphereGeometry(2.5, 128, 128);
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                uTime: { value: 0 },
                uAmplitude: { value: config.noiseStrength }
            },
            wireframe: false,
            side: THREE.DoubleSide,
            transparent: true
        });

        const organism = new THREE.Mesh(geometry, material);
        scene.add(organism);

        // 2. Internal Glow (Hard to do with single shader cleanly, so we add a secondary sphere inside)
        const innerGeo = new THREE.SphereGeometry(1.8, 64, 64);
        const innerMat = new THREE.MeshBasicMaterial({
            color: 0x00ffcc,
            transparent: true,
            opacity: 0.1,
            blending: THREE.AdditiveBlending
        });
        const innerGlow = new THREE.Mesh(innerGeo, innerMat);
        scene.add(innerGlow);

        // 3. Floating Bacteria Particles
        const particleCount = 8000;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3);
        const pSpeed = new Float32Array(particleCount * 3); // Custom attribute for random movement speed

        for(let i=0; i<particleCount*3; i+=3) {
            // Create a cloud
            const r = 4 + Math.random() * 8;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);

            pPos[i] = x;
            pPos[i+1] = y;
            pPos[i+2] = z;

            pSpeed[i] = (Math.random() - 0.5) * 0.005;
            pSpeed[i+1] = (Math.random() - 0.5) * 0.005;
            pSpeed[i+2] = (Math.random() - 0.5) * 0.005;
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('aSpeed', new THREE.BufferAttribute(pSpeed, 3));

        const pMat = new THREE.PointsMaterial({
            color: 0x00ffcc,
            size: 0.02,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // 4. Ring Geometry (Data Stream)
        const ringGeo = new THREE.TorusGeometry(4.5, 0.02, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.1 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2.5;
        ring.rotation.y = Math.PI / 4;
        scene.add(ring);


        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();
        const mouse = new THREE.Vector2();
        let targetRotationX = 0;
        let targetRotationY = 0;

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            const delta = clock.getDelta();

            // Update Uniforms
            material.uniforms.uTime.value = elapsed;
            material.uniforms.uAmplitude.value = config.noiseStrength * (1.0 + Math.sin(elapsed) * 0.2);

            // --- ORGANISM ANIMATION ---
            organism.rotation.y += 0.002;
            organism.rotation.z = Math.sin(elapsed * 0.5) * 0.1;

            // --- PARTICLES ANIMATION ---
            const positions = particles.geometry.attributes.position.array;
            for(let i=0; i<particleCount*3; i+=3) {
                positions[i] += pSpeed[i];
                positions[i+1] += pSpeed[i+1];
                positions[i+2] += pSpeed[i+2];
                
                // Simple orbit logic
                const x = positions[i];
                const y = positions[i+1];
                const z = positions[i+2];
                const dist = Math.sqrt(x*x + z*z);
                
                // Spiral movement
                positions[i] += Math.sin(elapsed * 0.5 + z * 0.1) * 0.01;
                positions[i+2] += Math.cos(elapsed * 0.5 + x * 0.1) * 0.01;
            }
            particles.geometry.attributes.position.needsUpdate = true;
            particles.rotation.y = -elapsed * 0.05;
            particles.rotation.z = Math.sin(elapsed * 0.2) * 0.05;

            // --- INNER GLOW PULSE ---
            innerGlow.scale.setScalar(1.0 + Math.sin(elapsed * 2) * 0.05);

            // --- RING ROTATION ---
            ring.rotation.z = elapsed * 0.1;
            ring.material.opacity = 0.1 + Math.sin(elapsed * 0.5) * 0.1;

            // --- CAMERA INTERACTION (Smoother) ---
            targetRotationX = mouse.y * 0.5;
            targetRotationY = mouse.x * 0.5;
            
            organism.rotation.y += (targetRotationY - organism.rotation.y) * 0.05;
            organism.rotation.x += (targetRotationX - organism.rotation.x) * 0.05;

            camera.position.x += (mouse.x * 0.5 - camera.position.x) * 0.05;
            camera.position.y += (-mouse.y * 0.5 - camera.position.y) * 0.05;
            camera.lookAt(0,0,0);

            composer.render();
        }

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
