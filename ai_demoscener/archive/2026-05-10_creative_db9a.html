<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEURAL_DRIFT // DEMO</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #ui { position: absolute; top: 20px; left: 20px; color: #0f0; pointer-events: none; text-shadow: 0 0 5px #0f0; z-index: 10; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui">
        [ STATUS: DREAMING ]<br>
        [ BUFFER: STABLE ]<br>
        [ SYNC: ACTIVE ]
    </div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        /**
         * CONCEPT: "NEURAL DRIFT"
         * A hybrid of a 4D Tesseract projection, N-body gravity wells, and reaction-diffusion textures.
         * We simulate a hyper-dimensional structure collapsing into a gravitational singularity,
         * represented by an evolving particle field that follows the geometry of a projected tesseract.
         */

        let scene, camera, renderer, clock, particles, tesseractLines;
        const PARTICLE_COUNT = 15000;
        const vertices = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const velocities = new Float32Array(PARTICLE_COUNT * 3);

        const tesseractVertices4D = [];
        for (let i = 0; i < 16; i++) {
            tesseractVertices4D.push([
                (i & 1) ? 1 : -1,
                (i & 2) ? 1 : -1,
                (i & 4) ? 1 : -1,
                (i & 8) ? 1 : -1
            ]);
        }

        const tesseractEdges = [];
        for (let i = 0; i < 16; i++) {
            for (let j = i + 1; j < 16; j++) {
                let diff = 0;
                for (let k = 0; k < 4; k++) {
                    if (((i >> k) & 1) !== ((j >> k) & 1)) diff++;
                }
                if (diff === 1) tesseractEdges.push(i, j);
            }
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // 1. Tesseract Wireframe (The Skeleton)
            const lineGeometry = new THREE.BufferGeometry();
            const edgePositions = [];
            tesseractEdges.forEach(idx => {
                edgePositions.push(...tesseractVertices4D[idx]);
            });
            // We will update this geometry every frame in the loop via a custom shader or CPU
            // For simplicity and "glitch" effect, we'll use a ShaderMaterial on a plane that draws lines 
            // OR just update the buffer. Let's go with updating BufferGeometry for precision.
            lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(tesseractEdges.length * 4), 3));
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5 });
            tesseractLines = new THREE.LineSegments(lineGeometry, lineMaterial);
            scene.add(tesseractLines);

            // 2. Particle System (The Neural Fluid)
            const geo = new THREE.BufferGeometry();
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                vertices[i * 3] = (Math.random() - 0.5) * 10;
                vertices[i * 3 + 1] = (Math.random() - 0.5) * 10;
                vertices[i * 3 + 2] = (Math.random() - 0.5) * 10;

                velocities[i * 3] = (Math.random() - 0.5) * 0.02;
                velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.02;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.02;

                colors[i * 3] = 0;
                colors[i * 3 + 1] = Math.random();
                colors[i * 3 + 2] = 1.0;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const pMat = new THREE.PointsMaterial({
                size: 0.02,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            particles = new THREE.Points(geo, pMat);
            scene.add(particles);

            window.addEventListener('resize', onWindowResize, false);
        }

        function rotate4D(v, angleXW, angleYW) {
            let [x, y, z, w] = v;

            // Rotate XW
            let x1 = x * Math.cos(angleXW) - w * Math.sin(angleXW);
            let w1 = x * Math.sin(angleXW) + w * Math.cos(angleXW);
            x = x1; w = w1;

            // Rotate YW
            let y2 = y * Math.cos(angleYW) - w * Math.sin(angleYW);
            let w2 = y * Math.sin(angleYW) + w * Math.cos(angleYW);
            y = y2; w = w2;

            // Project to 3D
            const perspective = 3 / (3 - w);
            return new THREE.Vector3(x * perspective, y * perspective, z * perspective);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // Update Tesseract
            const linePosAttr = tesseractLines.geometry.attributes.position;
            const angleXW = t * 0.3;
            const angleYW = t * 0.5;

            for (let i = 0; i < tesseractEdges.length; i += 2) {
                const p1 = rotate4D(tesseractVertices4D[tesseractEdges[i]], angleXW, angleYW);
                const p2 = rotate4D(tesseractVertices4D[tesseractEdges[i+1]], angleXW, angleYW);
                
                linePosAttr.setXYZ(i * 3, p1.x, p1.y, p1.z);
                linePosAttr.setXYZ(i * 3 + 1, p2.x, p2.y, p2.z);
            }
            linePosAttr.needsUpdate = true;

            // Update Particles (Neural Drift)
            const posAttr = particles.geometry.attributes.position;
            const colAttr = particles.geometry.attributes.color;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const idx = i * 3;
                
                // Gravity towards the hyper-structure center or vertices
                // We pick a random vertex of the tesseract to attract particles
                const targetIdx = Math.floor(Math.random() * 16);
                const targetRaw = tesseractVertices4D[targetIdx];
                const target3D = rotate4D(targetRaw, angleXW, angleYW);

                // Acceleration toward attractor
                velocities[idx] += (target3D.x - vertices[idx]) * 0.001;
                velocities[idx+1] += (target3D.y - vertices[idx+1]) * 0.001;
                velocities[idx+2] += (target3D.z - vertices[idx+2]) * 0.001;

                // Apply velocity
                vertices[idx] += velocities[idx];
                vertices[idx+1] += velocities[idx+1];
                vertices[idx+2] += velocities[idx+2];

                // Friction
                velocities[idx] *= 0.96;
                velocities[idx+1] *= 0.96;
                velocities[idx+2] *= 0.96;

                // Color shifting based on speed and distance to center
                const dist = Math.sqrt(vertices[idx]**2 + vertices[idx+1]**2 + vertices[idx+2]**2);
                colAttr.setXYZ(i, 
                    Math.sin(dist * 0.5 - t) * 0.5 + 0.5, 
                    Math.cos(t * 0.2) * 0.5 + 0.5, 
                    1.0 - (dist / 5.0)
                );

                // Respawn if too far or stuck
                if (dist > 10) {
                    vertices[idx] = (Math.random() - 0.5) * 2;
                    vertices[idx+1] = (Math.random() - 0.5) * 2;
                    vertices[idx+2] = (Math.random() - 0.5) * 2;
                }
            }
            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;

            // Camera drift
            camera.position.x = Math.sin(t * 0.2) * 2;
            camera.position.y = Math.cos(t * 0.3) * 1;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
