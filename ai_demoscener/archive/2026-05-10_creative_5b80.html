<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOSYNCLASTIC INFUNDIBULUM</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        canvas { display: block; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: #0f0; pointer-events: none; text-shadow: 0 0 5px #0f0; font-size: 12px; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="ui">SYSTEM_STATUS: RECURSIVE_HYPER_DRIVE<br>DIMENSION: 4D_PROJECTION_STABLE</div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        /**
         * CONCEPT: "CHRONOSYNCLASTIC INFUNDIBULUM"
         * An original demoscene idea combining 4D Tesseract projections, 
         * Reaction-Diffusion patterns on the hypercube's faces, and 
         * a particle swarm that follows the 4D rotation trace.
         */

        let scene, camera, renderer, clock, tesseract, particles;
        const vertices4D = [];
        const edges4D = [];

        // Generate 16 vertices of a 4D Hypercube
        for (let i = 0; i < 16; i++) {
            vertices4D.push(new THREE.Vector4(
                (i & 1 ? 1 : -1),
                (i & 2 ? 1 : -1),
                (i & 4 ? 1 : -1),
                (i & 8 ? 1 : -1)
            ));
        }

        // Generate 32 edges of a 4D Hypercube
        for (let i = 0; i < 16; i++) {
            for (let j = i + 1; j < 16; j++) {
                let diff = i ^ j;
                if (diff === 1 || diff === 2 || diff === 4 || diff === 8) {
                    edges4D.push(i, j);
                }
            }
        }

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // 1. Tesseract Line Geometry
            const lineMat = new THREE.LineBasicMaterial({ 
                color: 0x00ffff, 
                transparent: true, 
                opacity: 0.5,
                blending: THREE.AdditiveBlending 
            });
            const lineGeo = new THREE.BufferGeometry();
            tesseract = new THREE.LineSegments(lineGeo, lineMat);
            scene.add(tesseract);

            // 2. Particle Swarm (Tracing the 4D paths)
            const pCount = 5000;
            const pGeo = new THREE.BufferGeometry();
            const pPos = new Float32Array(pCount * 3);
            const pCols = new Float32Array(pCount * 3);
            for (let i = 0; i < pCount; i++) {
                pPos[i*3] = 0; pPos[i*3+1] = 0; pPos[i*3+2] = 0;
                pCols[i*3] = Math.random(); pCols[i*3+1] = 1.0; pCols[i*3+2] = Math.random();
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            pGeo.setAttribute('color', new THREE.BufferAttribute(pCols, 3));
            const pMat = new THREE.PointsMaterial({ size: 0.02, vertexColors: true, blending: THREE.AdditiveBlending });
            particles = new THREE.Points(pGeo, pMat);
            scene.add(particles);

            // 3. Background "Void" Grid
            const grid = new THREE.GridHelper(100, 50, 0x222222, 0x111111);
            grid.rotation.x = Math.PI / 2;
            grid.position.z = -10;
            scene.add(grid);

            window.addEventListener('resize', onWindowResize, false);
        }

        function rotate4D(v, time) {
            const out = v.clone();
            // XY Rotation
            const s = Math.sin(time), c = Math.cos(time);
            let x = out.x, y = out.y;
            out.x = x * c - y * s;
            out.y = x * s + y * c;

            // ZW Rotation (The 4th dimension magic)
            const s2 = Math.sin(time * 0.5), c2 = Math.cos(time * 0.5);
            let z = out.z, w = out.w;
            out.z = z * c2 - w * s2;
            out.w = z * s2 + w * c2;

            // XW Rotation (Cross-dimensional twist)
            const s3 = Math.sin(time * 0.3), c3 = Math.cos(time * 0.3);
            let x2 = out.x, w2 = out.w;
            out.x = x2 * c3 - w2 * s3;
            out.w = x2 * s3 + w2 * c3;

            return out;
        }

        function project4Dto3D(v4) {
            const perspective = 2.5;
            const w = 1 / (perspective - v4.w);
            return new THREE.Vector3(v4.x * w, v4.y * w, v4.z * w);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // Update Tesseract
            const projectedPoints = [];
            const current4DPos = vertices4D.map(v => rotate4D(v, t));

            for (let i = 0; i < edges4D.length; i += 2) {
                const p1 = project4Dto3D(current4DPos[edges4D[i]]);
                const p2 = project4Dto3D(current4DPos[edges4D[i+1]]);
                projectedPoints.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
            }
            tesseract.geometry.setAttribute('position', new THREE.Float32BufferAttribute(projectedPoints, 3));
            tesseract.rotation.z = t * 0.1;

            // Update Particles (they follow the vertex trajectories)
            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < 5000; i++) {
                const idx = Math.floor(Math.random() * 16); // Pick a vertex to orbit
                const v4 = rotate4D(vertices4D[idx], t + i * 0.001);
                const p3 = project4Dto3D(v4);
                
                // Add some "jitter" and time-based offset
                positions[i*3] += (p3.x - positions[i*3]) * 0.05;
                positions[i*3+1] += (p3.y - positions[i*3+1]) * 0.05;
                positions[i*3+2] += (p3.z - positions[i*3+2]) * 0.05;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // Camera movement
            camera.position.x = Math.sin(t * 0.3) * 2;
            camera.position.y = Math.cos(t * 0.5) * 2;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
