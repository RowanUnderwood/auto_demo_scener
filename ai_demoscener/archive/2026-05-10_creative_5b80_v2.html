<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHERIC HYPER-FLUX</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #overlay { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: #fff; 
            letter-spacing: 4px; 
            font-size: 10px; 
            text-transform: uppercase;
            opacity: 0.5;
            pointer-events: none;
        }
        #glitch {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ff0055;
            font-size: 9px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div id="overlay">Singularity Protocol // Hyper-Flux State</div>
    <div id="glitch">ERROR_4D_PROJECTION_DRIFT</div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        /**
         * CONCEPT: "AETHERIC HYPER-FLUX"
         * A reimagining of the 4D Tesseract concept.
         * Instead of wires and green code, this uses a high-contrast "Gold & Obsidian" aesthetic.
         * The vertices are represented by glowing volumetric light spheres, 
         * and edges are flowing ribbons (instanced meshes) rather than simple lines.
         */

        let scene, camera, renderer, clock;
        const vertices4D = [];
        const edges4D = [];
        const vertexMeshes = [];
        let ribbonSystem;
        const dummy = new THREE.Object3D();

        // 16 Vertices of a 4D Hypercube
        for (let i = 0; i < 16; i++) {
            vertices4D.push(new THREE.Vector4(
                (i & 1 ? 1 : -1),
                (i & 2 ? 1 : -1),
                (i & 4 ? 1 : -1),
                (i & 8 ? 1 : -1)
            ));
        }

        // 32 Edges
        for (let i = 0; i < 16; i++) {
            for (let j = i + 1; j < 16; j++) {
                let diff = i ^ j;
                if (diff === 1 || diff === 2 || diff === 4 || diff === 8) {
                    edges4D.push(i, j);
                }
            }
        }

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 6;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // --- Lighting & Environment ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffaa00, 20, 50);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            // --- Vertex Spheres (Glowing nodes) ---
            const sphereGeo = new THREE.SphereGeometry(0.08, 16, 16);
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
            for (let i = 0; i < 16; i++) {
                const mesh = new THREE.Mesh(sphereGeo, sphereMat);
                vertexMeshes.push(mesh);
                scene.add(mesh);
            }

            // --- Edge Ribbons (Instanced for performance) ---
            const edgeGeo = new THREE.CylinderGeometry(0.015, 0.015, 1, 6);
            edgeGeo.rotateX(Math.PI / 2); 
            const edgeMat = new THREE.MeshStandardMaterial({ 
                color: 0xffaa44, 
                emissive: 0xff5500, 
                emissiveIntensity: 2,
                transparent: true,
                opacity: 0.6
            });

            const edgeCount = edges4D.length / 2;
            ribbonSystem = new THREE.InstancedMesh(edgeGeo, edgeMat, edgeCount);
            scene.add(ribbonSystem);

            // --- Background Star Dust ---
            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(3000 * 3);
            for(let i=0; i<9000; i++) starPos[i] = (Math.random() - 0.5) * 40;
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({ color: 0x444466, size: 0.02 });
            scene.add(new THREE.Points(starGeo, starMat));

            window.addEventListener('resize', onWindowResize);
        }

        function rotate4D(v, t) {
            const out = v.clone();
            const s1 = Math.sin(t), c1 = Math.cos(t);
            const s2 = Math.sin(t * 0.7), c2 = Math.cos(t * 0.7);
            const s3 = Math.sin(t * 0.5), c3 = Math.cos(t * 0.5);

            let x = out.x, y = out.y;
            out.x = x * c1 - y * s1;
            out.y = x * s1 + y * c1;

            let z = out.z, w = out.w;
            out.z = z * c2 - w * s2;
            out.w = z * s2 + w * c2;

            let x_new = out.x, w_new = out.w;
            out.x = x_new * c3 - w_new * s3;
            out.w = x_new * s3 + w_new * c3;

            return out;
        }

        function project(v4) {
            const perspective = 2.5;
            const scale = perspective / (perspective - v4.w);
            return new THREE.Vector3(v4.x * scale, v4.y * scale, v4.z * scale);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime() * 0.4;

            const projectedVertices = vertices4D.map(v => project(rotate4D(v, t)));

            for (let i = 0; i < 16; i++) {
                vertexMeshes[i].position.copy(projectedVertices[i]);
                const s = 1 + Math.sin(t * 3 + i) * 0.2;
                vertexMeshes[i].scale.set(s, s, s);
            }

            for (let i = 0; i < edges4D.length / 2; i++) {
                const idx1 = edges4D[i * 2];
                const idx2 = edges4D[i * 2 + 1];
                const p1 = projectedVertices[idx1];
                const p2 = projectedVertices[idx2];

                const direction = new THREE.Vector3().subVectors(p2, p1);
                const length = direction.length();
                const midPoint = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);

                dummy.position.copy(midPoint);
                dummy.scale.set(1, length, 1);
                dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());

                dummy.updateMatrix();
                ribbonSystem.setMatrixAt(i, dummy.matrix);
            }
            ribbonSystem.instanceMatrix.needsUpdate = true;

            camera.position.x = Math.sin(t * 0.2) * 7;
            camera.position.z = Math.cos(t * 0.2) * 7;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
