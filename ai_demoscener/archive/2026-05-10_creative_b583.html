<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON_SYNAPSE // DEMO</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        canvas { display: block; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: #0ff; pointer-events: none; text-shadow: 0 0 5px #0ff; letter-spacing: 2px; font-size: 12px; }
    </style>
</head>
<body>
    <div id="ui">SYSTEM_STATUS: ACTIVE // NEON_SYNAPSE v1.0</div>
    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';

        // --- SHADER SOURCE ---
        const vertexShader = `
            varying vec2 vUv;
            varying float vDepth;
            void main() {
                vUv = uv;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vDepth = -mvPosition.z;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            uniform float time;
            uniform vec2 resolution;
            varying vec2 vUv;
            varying float vDepth;

            // Simplex Noise 2D
            vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
            float snoise(vec2 v){
                const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                         -0.577350269189626, 0.024390243902439);
                vec2 i  = floor(v + dot(v, C.yy) );
                vec2 x0 = v -   i + dot(i, C.xx);
                vec2 i1;
                i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                vec4 x12 = x0.xyxy + C.xxzz;
                x12.xy -= C.yyyy;
                i = mod(i, 289.0);
                vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
                    + i.x + vec3(0.0, i1.x, 1.0 ));
                vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
                    dot(x12.zw,x12.zw)), 0.0);
                m = m*m ;
                m = m*m ;
                vec3 x = 2.0 * fract(p * C.www) - 1.0;
                vec3 h = abs(x) - 0.5;
                vec3 ox = floor(x + 0.5);
                vec3 a0 = x - ox;
                m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                vec3 g;
                g.x  = a0.x  * x0.x  + h.x  * x0.y;
                g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                return 130.0 * dot(m, g);
            }

            vec3 palette(float t) {
                vec3 a = vec3(0.5, 0.5, 0.5);
                vec3 b = vec3(0.5, 0.5, 0.5);
                vec3 c = vec3(1.0, 1.0, 1.0);
                vec3 d = vec3(0.263, 0.416, 0.557);
                return a + b * cos(6.28318 * (c * t + d));
            }

            void main() {
                vec2 uv = vUv - 0.5;
                uv.x *= resolution.x / resolution.y;

                // Fractal Brownian Motion inspired movement
                float n = snoise(uv * 2.0 + time * 0.2);
                n += 0.5 * snoise(uv * 4.0 - time * 0.3);
                n += 0.25 * snoise(uv * 8.0 + time * 0.5);

                // Distort UVs for "neural" flow
                float angle = n * 3.14159;
                mat2 rot = mat2(cos(angle), -sin(angle), sin(angle), cos(angle));
                vec2 distortedUv = rot * uv;

                // Geometric structure: Grid of pulsing rings
                float d = length(distortedUv);
                float ring = sin(d * 30.0 - time * 4.0 + n * 10.0);
                ring = smoothstep(0.9, 1.0, ring);

                // Glitch/Scanline effect
                float scanline = sin(vUv.y * 800.0) * 0.04;
                
                // Color synthesis
                vec3 color = palette(n + d - time * 0.1);
                color *= ring;
                color += (0.1 / abs(sin(d * 20.0 - time))) * vec3(0.1, 0.8, 1.0); // Accents

                // Depth/Fog simulation
                color *= exp(-vDepth * 0.015);
                color -= scanline;

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Create a complex geometry of interconnected "synapses" (tubes and spheres)
        const group = new THREE.Group();
        scene.add(group);

        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00ffff, 
            emissive: 0x004444, 
            wireframe: true 
        });

        // Generate procedural architecture
        for(let i=0; i<15; i++) {
            const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(Math.random()*20-10, Math.random()*20-10, Math.random()*40-40),
                new THREE.Vector3(Math.random()*20-10, Math.random()*20-10, Math.random()*20-20),
                new THREE.Vector3(Math.random()*20-10, Math.random()*20-10, 0)
            ]);
            const geometry = new THREE.TubeGeometry(curve, 64, 0.05, 8, false);
            const mesh = new THREE.Mesh(geometry, material);
            group.add(mesh);

            // Add glowing nodes at curve points
            const nodeGeo = new THREE.SphereGeometry(0.2, 16, 16);
            const nodeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const node = new THREE.Mesh(nodeGeo, nodeMat);
            node.position.copy(curve.getPoint(Math.random()));
            group.add(node);
        }

        // Post-process effect using a fullscreen quad with the custom shader
        const postScene = new THREE.Scene();
        const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const postMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader,
            fragmentShader
        });
        const postPlane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial);
        postScene.add(postPlane);

        // Lighting
        const light1 = new THREE.PointLight(0x00ffff, 1, 100);
        light1.position.set(5, 5, 5);
        scene.add(light1);
        const light2 = new THREE.PointLight(0xff00ff, 1, 100);
        light2.position.set(-5, -5, 5);
        scene.add(light2);
        scene.add(new THREE.AmbientLight(0x111111));

        camera.position.z = 30;

        // Animation loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            
            // Rotate main group
            group.rotation.y = t * 0.1;
            group.rotation.x = Math.sin(t * 0.2) * 0.2;

            // Animate camera movement (flying through the synapses)
            camera.position.z = 30 + Math.sin(t * 0.5) * 10;
            camera.lookAt(0, 0, 0);

            // Update Shader
            postMaterial.uniforms.time.value = t;

            // Render the scene to a texture and use it for the shader? 
            // Actually, we'll blend the geometry into the shader logic via depth or simply render them together.
            // For this demo: We render the main scene, then overlay the complex fragment effect.
            renderer.autoClear = false;
            renderer.clear();
            renderer.render(scene, camera);
            
            // To make it look "integrated", we use a more clever approach: 
            // Render geometry first, but the shader is fullscreen and uses depth-like effects.
            // We'll just render the postPlane in the same scene after the main objects.
            postCamera.updateProjectionMatrix();
            renderer.render(postScene, postCamera);
        }

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            postMaterial.uniforms.resolution.value.set(w, h);
        });

        animate();
    </script>
</body>
</html>
