<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Particle Fountain</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    // Configuration
    const PARTICLE_COUNT = 5000;
    const GRAVITY = 9.8;
    const SPAWN_Y = 0;
    const RESET_Y = -10;
    const INITIAL_VELOCITY_RANGE = 15;
    const UPWARD_BIAS = 5;

    // Setup Scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Create soft circular sprite texture via Canvas
    const createCircleTexture = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.5)');
        gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)');
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        const texture = new THREE.CanvasTexture(canvas);
        return texture;
    };

    // Particle Data Structures (Typed Arrays for performance)
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const velocities = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    // To handle "remaining lifetime" color, we track life in a separate array
    const lives = new Float32Array(PARTICLE_COUNT); 
    const maxLives = new Float32Array(PARTICLE_COUNT);

    function resetParticle(i) {
        positions[i * 3] = 0;
        positions[i * 3 + 1] = SPAWN_Y;
        positions[i * 3 + 2] = 0;

        // Random outward velocities
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(Math.random() * 2 - 1); // slight upward bias via range manipulation or simple addition
        const speed = Math.random() * INITIAL_VELOCITY_RANGE + 5;

        // Velocity components: random direction with y bias
        velocities[i * 3] = Math.sin(phi) * Math.cos(theta) * speed;
        velocities[i * 3 + 1] = (Math.random() * UPWARD_BIAS) + (speed * 0.5); // Bias upwards
        velocities[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * speed;

        // Life properties
        lives[i] = 1.0;
        maxLives[i] = 2.0 + Math.random() * 3.0; // Total seconds to live
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        resetParticle(i);
    }

    // Geometry & Material
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: 0.4,
        map: createCircleTexture(),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexColors: true
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    // Animation Loop
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        const posAttr = geometry.attributes.position;
        const colAttr = geometry.attributes.color;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            // Physics: pos += vel * dt
            positions[i * 3] += velocities[i * 3] * dt;
            positions[i * 3 + 1] += velocities[i * 3 + 1] * dt;
            positions[i * 3 + 2] += velocities[i * 3 + 2] * dt;

            // Physics: vel.y -= gravity * dt
            velocities[i * 3 + 1] -= GRAVITY * dt;

            // Lifetime calculation
            lives[i] -= dt;

            // Respawn conditions: y < -10 OR lifetime ended
            if (positions[i * 3 + 1] < RESET_Y || lives[i] <= 0) {
                resetParticle(i);
            }

            // Color by remaining lifetime (Red -> Blue/Cyan gradient)
            const lifeRatio = lives[i] / maxLives[i]; // 1.0 down to 0.0
            colors[i * 3] = 1.0 - lifeRatio;          // Red component increases as it dies
            colors[i * 3 + 1] = lifeRatio;           // Green decreases
            colors[i * 3 + 2] = lifeRatio * 0.5 + (1.0 - lifeRatio) * 0.5; // Blue logic
        }

        posAttr.needsUpdate = true;
        colAttr.needsUpdate = true;

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
