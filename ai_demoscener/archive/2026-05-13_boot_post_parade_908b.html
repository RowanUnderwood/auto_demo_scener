<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOT SEQUENCE</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { position: absolute; top: 0; left: 0; }
        #ui { pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <canvas id="ui"></canvas>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SHADER SETUP ---
        const bgCanvas = document.getElementById('bg');
        const uiCanvas = document.getElementById('ui');
        const uiCtx = uiCanvas.getContext('2d');

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ canvas: bgCanvas });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const plasmaShader = {
            uniforms: {
                u_time: { value: 0 },
                u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float u_time;
                uniform vec2 u_resolution;
                varying vec2 vUv;

                void main() {
                    vec2 p = vUv * 2.0 - 1.0;
                    p.x *= u_resolution.x / u_resolution.y;
                    
                    float t = u_time * 0.5;
                    vec3 color = vec3(0.0);

                    for(float i = 1.0; i < 4.0; i++) {
                        p.x += 0.3 / i * sin(i * 3.0 * p.y + t) + 0.2;
                        p.y += 0.3 / i * cos(i * 3.0 * p.x + t) + 0.2;
                    }

                    color = vec3(0.5 + 0.5 * sin(p.x + t), 
                                 0.5 + 0.5 * sin(p.y + t + 2.0), 
                                 0.5 + 0.5 * sin(p.x + p.y + t + 4.0));

                    color *= 0.3; // Dim the plasma
                    gl_FragColor = vec4(color, 1.0);
                }
            `
        };

        const geometry = new THREE.PlaneGeometry(2, 2);
        const material = new THREE.ShaderMaterial(plasmaShader);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // --- TYPEWRITER LOGIC ---
        const messages = [
            "BIOS v4.2.0-RETRO LOADING...",
            "CPU: NEURAL-CORE X86_64 @ 3.4GHz",
            "MEMORY TEST: 65536 KB OK",
            "CHECKING L1/L2 CACHE... PASS",
            "INITIALIZING IRQ HANDLERS...",
            "MOUNTING DREAM BUFFER... [OK]",
            "CALIBRATING VIBE SENSORS... 98%",
            "INJECTING SUBSTANCE: NOSTALGIA... DONE",
            "DETECTING PHANTOM DISK DRIVE... NONE",
            "SCANNING TEMPORAL PARADOXES... CLEAR",
            "LOADING LIMINAL SPACE ASSETS...",
            "SYNCING EXISTENTIAL PARAMETERS...",
            "ERROR: UNEXPECTED EUPHORIA DETECTED",
            "ATTEMPTING RECOVERY...",
            "RECOVERY SUCCESSFUL.",
            "BOOTING KERNEL: VOID_OS v0.9b",
            "LOADING VIRTUAL REALITY OVERLAY...",
            "CHECKING SYNAPTIC CONNECTIVITY... OK",
            "INITIALIZING AESTHETIC ENGINE...",
            "BUFFERING LO-FI BEATS... [STABLE]",
            "CALIBRATING DREAM BUFFER... [OK]",
            "INJECTING VIBES... [COMPLETE]",
            "LOADING PIXEL SHADERS...",
            "MOUNTING PSYCHEDELIC DRIVES...",
            "CHECKING MEMORY LEAKS IN REALITY...",
            "ERROR: TIME LOOP DETECTED (IGNORE?) -> YES",
            "INITIALIZING NEON LIGHTING...",
            "LOADING CRT SCANLINE EMULATION...",
            "VERIFYING CHEAT CODES... OK",
            "UPDATING COSMIC FIRMWARE...",
            "SYNCING MULTIVERSE COORDINATES...",
            "ATTEMPTING TO FIND THE SOURCE...",
            "SCANNING FOR GHOSTS IN THE MACHINE...",
            "LOADING CHILLWAVE MODULE...",
            "INITIALIZING AESTHETIC PROTOCOLS...",
            "MOUNTING NON-EUCLIDEAN GEOMETRY...",
            "SYSTEM STABILITY: NOMINAL",
            "ALL SYSTEMS GO.",
            "READY."
        ];

        let currentLineIdx = 0;
        let currentCharIdx = 0;
        let displayedLines = [];
        let lastCharTime = 0;
        const charDelay = 30;
        let cursorVisible = true;
        let cursorTimer = 0;

        function resize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            uiCanvas.width = w;
            uiCanvas.height = h;
            material.uniforms.u_resolution.value.set(w, h);
        }

        window.addEventListener('resize', resize);
        resize();

        function updateTypewriter(now) {
            if (currentLineIdx < messages.length) {
                const targetLine = messages[currentLineIdx];
                
                if (now - lastCharTime > charDelay) {
                    if (currentCharIdx <= targetLine.length) {
                        // We need to handle the line being fully typed
                        if (currentCharIdx < targetLine.length) {
                            if (!displayedLines[currentLineIdx]) displayedLines[currentLineIdx] = "";
                            displayedLines[currentLineIdx] += targetLine[currentCharIdx];
                            currentCharIdx++;
                        } else {
                            // Move to next line
                            currentLineIdx++;
                            currentCharIdx = 0;
                        }
                    }
                    lastCharTime = now;
                }
            }

            // Cursor blink logic (500ms)
            cursorTimer += 16.6; // approx ms per frame
            if (cursorTimer > 500) {
                cursorVisible = !cursorVisible;
                cursorTimer = 0;
            }
        }

        function drawUI() {
            uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
            uiCtx.font = '16px "Courier New", Courier, monospace';
            uiCtx.fillStyle = '#00FF41'; // Matrix/Retro green
            uiCtx.textBaseline = 'top';

            const padding = 20;
            const lineHeight = 22;

            displayedLines.forEach((line, i) => {
                uiCtx.fillText(line, padding, padding + (i * lineHeight));
            });

            // If we finished the last line or are currently on it
            if (currentLineIdx < messages.length || displayedLines.length > 0) {
                const finalY = padding + (displayedLines.length * lineHeight);
                const currentText = currentLineIdx < messages.length ? 
                    messages[currentLineIdx].substring(0, currentCharIdx) : "";
                
                // Only draw cursor if we aren't finished with the whole sequence or just reached READY.
                if (currentLineIdx < messages.length || cursorVisible) {
                     uiCtx.fillText(currentText + (cursorVisible ? "_" : ""), padding, finalY);
                }
            }
        }

        function animate(now) {
            requestAnimationFrame(animate);
            
            // Plasma update
            material.uniforms.u_time.value = now * 0.001;
            renderer.render(scene, camera);

            // Text update
            updateTypewriter(now);
            drawUI();
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
