<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Synthwave Grid</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();

// ---------- Camera: classic synthwave low perspective ----------
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 1.4, 7);
camera.lookAt(0, 4, -60);

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ---------- Sky gradient dome ----------
const skyGeo = new THREE.SphereGeometry(500, 32, 32);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  vertexShader: `
    varying vec3 vPos;
    void main() {
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vPos;
    void main() {
      float h = normalize(vPos).y;
      vec3 indigo = vec3(0.05, 0.01, 0.22);   // deep indigo top
      vec3 pink   = vec3(0.95, 0.16, 0.52);   // hot pink
      vec3 orange = vec3(1.00, 0.52, 0.10);   // bright orange horizon
      vec3 deep   = vec3(0.35, 0.05, 0.10);   // below horizon
      vec3 col = mix(orange, pink, smoothstep(0.02, 0.22, h));
      col = mix(col, indigo, smoothstep(0.20, 0.85, h));
      col = mix(col, deep, smoothstep(0.0, -0.12, h));
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// ---------- Glowing magenta wireframe grid (LineSegments) ----------
const gridGroup = new THREE.Group();
const gridGeo = new THREE.BufferGeometry();
const gpos = [];
const X = 80, ZNEAR = 8, ZFAR = 160, STEP = 2.5;

for (let z = -ZFAR; z <= ZNEAR; z += STEP) {
  gpos.push(-X, 0, z, X, 0, z);
}
for (let x = -X; x <= X; x += STEP) {
  gpos.push(x, 0, -ZFAR, x, 0, ZNEAR);
}
gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(gpos, 3));
const gridMat = new THREE.LineBasicMaterial({ color: 0xff2bff });
const grid = new THREE.LineSegments(gridGeo, gridMat);
gridGroup.add(grid);
scene.add(gridGroup);

let offset = 0;

// ---------- Huge low sun: horizontal magenta->yellow bars ----------
const sunGeo = new THREE.PlaneGeometry(90, 90);
const sunMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    void main() {
      vec2 p = vUv - 0.5;
      float d = length(p) * 2.0;
      if (d > 1.0) discard;
      float y = p.y;
      // stripe gaps widen toward the bottom
      float gapAmount = smoothstep(0.05, -0.5, y) * 0.55;
      float f = fract(y * 22.0 + 0.5);
      if (f < gapAmount) discard;
      vec3 magenta = vec3(1.0, 0.0, 0.55);
      vec3 yellow  = vec3(1.0, 0.95, 0.30);
      vec3 col = mix(magenta, yellow, smoothstep(-0.5, 0.5, y));
      col *= 1.8; // boost for bloom glow
      float edge = smoothstep(1.0, 0.97, d);
      gl_FragColor = vec4(col, edge);
    }
  `
});
const sun = new THREE.Mesh(sunGeo, sunMat);
sun.position.set(0, 20, -140);
scene.add(sun);

// ---------- Tiny white stars, fading in higher up ----------
const STAR_COUNT = 900;
const starPos = new Float32Array(STAR_COUNT * 3);
const starH = new Float32Array(STAR_COUNT);
for (let i = 0; i < STAR_COUNT; i++) {
  const theta = Math.random() * Math.PI * 2;
  const hFrac = 0.25 + Math.random() * 0.7;           // only upper sky
  const y = hFrac * 400;
  const r = Math.sqrt(Math.max(400 * 400 - y * y, 0)) * (0.5 + Math.random() * 0.5);
  starPos[i * 3] = Math.cos(theta) * r;
  starPos[i * 3 + 1] = y;
  starPos[i * 3 + 2] = Math.sin(theta) * r;
  starH[i] = y / 400;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('aH', new THREE.BufferAttribute(starH, 1));
const starMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  vertexShader: `
    attribute float aH;
    varying float vH;
    void main() {
      vH = aH;
      gl_PointSize = 1.6 + aH * 2.0;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying float vH;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float fade = smoothstep(0.25, 0.75, vH);   // fade in higher up
      float a = fade * (1.0 - d * 2.0) * 0.9;
      gl_FragColor = vec4(1.0, 1.0, 1.0, a);
    }
  `
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ---------- Bloom (VHS glow) ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.85,  // strength
  0.55,  // radius
  0.15   // threshold
);
composer.addPass(bloom);

// ---------- Resize ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ---------- Animate ----------
function animate() {
  requestAnimationFrame(animate);
  offset += 0.35;
  if (offset >= STEP) offset -= STEP;   // seamless loop
  gridGroup.position.z = offset;
  composer.render();
}
animate();
</script>
</body>
</html>
