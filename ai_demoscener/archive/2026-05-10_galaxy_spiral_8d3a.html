<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Shader</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const uniforms = {
            u_time: { value: 0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const fragmentShader = `
            uniform float u_time;
            uniform vec2 u_resolution;

            // Hash function for noise
            vec2 hash(vec2 p) {
                p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
                return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
            }

            // Gradient Noise
            float noise(vec2 p) {
                const float K1 = 0.366025404; // (sqrt(3)-1)/2;
                const float K2 = 0.211324865; // (3-sqrt(3))/6;
                vec2 i = floor(p + (p.x + p.y) * K1);
                vec2 a = p - i + (i.x + i.y) * K2;
                vec2 o = (a.x > a.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                vec2 b = a - o + K2;
                vec2 c = a - 1.0 + 2.0 * K2;
                vec3 h = max(0.5 - vec3(dot(a, a), dot(b, b), dot(c, c)), 0.0);
                vec3 n = mix(vec3(dot(a, hash(i + 0.0))), vec3(dot(b, hash(i + o))), h);
                return dot(n, vec3(0.7, 0.7, 0.7)); // simplified
            }

            // Fast Simplex-like Noise for FBM
            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }

            float smoothNoise(vec2 st) {
                vec2 i = floor(st);
                vec2 f = fract(st);
                f = f*f*(3.0-2.0*f);
                float a = random(i);
                float b = random(i + vec2(1.0, 0.0));
                float c = random(i + vec2(0.0, 1.0));
                float d = random(i + vec2(1.0, 1.0));
                return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
            }

            float fbm(vec2 st) {
                float value = 0.0;
                float amplitude = 0.5;
                for (int i = 0; i < 5; i++) {
                    value += amplitude * smoothNoise(st);
                    st *= 2.0;
                    amplitude *= 0.5;
                }
                return value;
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.y, u_resolution.x);
                
                float r = length(uv);
                float a = atan(uv.y, uv.x);

                // Spiral Arms Intensity: pow(0.5+0.5*cos(2*a + log(r)*6 + time*0.2), 8) * exp(-r*1.5)
                // We use max(r, 0.01) to prevent log(0) singularity
                float spiral = pow(0.5 + 0.5 * cos(2.0 * a + log(max(r, 0.01)) * 6.0 + u_time * 0.2), 8.0) * exp(-r * 1.5);
                
                // Bright Core: exp(-r*8)
                float core = exp(-r * 8.0);

                // Dust Lanes via FBM noise
                // We warp the noise coordinate with the spiral angle to make lanes follow arms roughly
                vec2 dustUV = uv * 4.0;
                dustUV += vec2(cos(a), sin(a)) * (r * 2.0); // slight swirl in noise
                float dust = fbm(dustUV + u_time * 0.05);
                float dustLane = smoothstep(0.3, 0.7, dust) * 0.6;

                // Total light calculation
                float lightIntensity = core + spiral;
                lightIntensity *= (1.0 - dustLane); // Darken areas with dust lanes

                // Color Palette: Hot-core (white/yellow) -> Pink -> Blue
                vec3 colorCore = vec3(1.0, 0.9, 0.6);   // Warm center
                vec3 colorMid  = vec3(1.0, 0.2, 0.5);   // Pink arms
                vec3 colorOuter = vec3(0.1, 0.2, 0.7); // Blue background/outer

                // Blend colors based on radius and intensity
                vec3 baseColor = mix(colorOuter, colorMid, smoothstep(0.1, 0.8, r));
                vec3 finalColor = baseColor * lightIntensity;
                
                // Additive glow for the core
                finalColor += colorCore * core * 1.2;

                // Final tone mapping/gamma correction
                finalColor = pow(finalColor, vec3(0.8));

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const material = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: `
                void main() {
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: fragmentShader
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        function animate(time) {
            uniforms.u_time.value = time * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            uniforms.u_resolution.value.set(w, h);
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
