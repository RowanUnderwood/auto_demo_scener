<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thin Film FBM</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const geometry = new THREE.BufferGeometry();
const vertices = new Float32Array([-1,-1,0,  1,-1,0,  1,1,0,  -1,1,0]);
const indices = [0,1,2, 0,2,3];
geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
geometry.setIndex(indices);

const uniforms = {
  uTime: { value: 0.0 },
  uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
};

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec2 uResolution;
    varying vec2 vUv;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }

    float fbm(vec2 p) {
      float sum = 0.0;
      float amp = 1.0;
      float freq = 1.0;
      for (int i = 0; i < 3; i++) {
        sum += amp * vnoise(p * freq);
        freq *= 2.0;
        amp *= 0.5;
      }
      return sum;
    }

    void main() {
      vec2 uv = vUv;
      vec2 aspect = vec2(uResolution.x / uResolution.y, 1.0);
      vec2 p = uv * aspect * 3.0;
      p += vec2(0.0, uTime * 0.15);

      float h = fbm(p);

      float eps = 0.01;
      float hx1 = fbm(p + vec2(eps, 0.0));
      float hx0 = fbm(p - vec2(eps, 0.0));
      float hy1 = fbm(p + vec2(0.0, eps));
      float hy0 = fbm(p - vec2(0.0, eps));

      float dhdx = (hx1 - hx0) / (2.0 * eps);
      float dhdy = (hy1 - hy0) / (2.0 * eps);

      vec3 normal = normalize(vec3(-dhdx, -dhdy, 1.0));
      vec3 viewDir = vec3(0.0, 0.0, 1.0);

      float ndotv = dot(normal, viewDir);
      float key = ndotv + h * 5.0;

      vec3 a = vec3(0.5);
      vec3 b = vec3(0.5);
      vec3 c = vec3(1.0);
      vec3 d = vec3(0.0, 0.33, 0.67);

      vec3 col = a + b * cos(6.28318 * (c * key + d));

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const mesh = new THREE.Mesh(geometry, material);
scene = new THREE.Scene();
scene.add(mesh);

function animate(t) {
  requestAnimationFrame(animate);
  uniforms.uTime.value = t * 0.001;
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
