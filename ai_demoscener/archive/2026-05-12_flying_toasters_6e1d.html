<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toaster Drift</title>
    <style>
        body { margin: 0; overflow: hidden; background: linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 100%); }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const objects = [];
    const count = 25;
    const bounds = { x: 25, y: 20 };

    function createToaster() {
        const group = new THREE.Group();

        // Body
        const bodyGeom = new THREE.BoxGeometry(1, 0.8, 1);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.7, roughness: 0.2 });
        const body = new THREE.Mesh(bodyGeom, bodyMat);
        group.add(body);

        // Slot
        const slotGeom = new THREE.BoxGeometry(0.6, 0.1, 1.1);
        const slotMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const slot = new THREE.Mesh(slotGeom, slotMat);
        slot.position.y = 0.45;
        group.add(slot);

        // Wings (using pivots for rotation)
        const wingGeom = new THREE.PlaneGeometry(0.1, 1);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, side: THREE.DoubleSide });

        const leftPivot = new THREE.Group();
        leftPivot.position.set(-0.5, 0, 0);
        const leftWing = new THREE.Mesh(wingGeom, wingMat);
        leftWing.position.x = -0.45; // Offset so rotation is at edge
        leftPivot.add(leftWing);
        group.add(leftPivot);

        const rightPivot = new THREE.Group();
        rightPivot.position.set(0.5, 0, 0);
        const rightWing = new THREE.Mesh(wingGeom, wingMat);
        rightWing.position.x = 0.45; // Offset so rotation is at edge
        rightPivot.add(rightWing);
        group.add(rightPivot);

        return { group, type: 'toaster', leftPivot, rightPivot, phase: Math.random() * Math.PI * 2 };
    }

    function createToast() {
        const geom = new THREE.BoxGeometry(0.5, 0.5, 0.15);
        const mat = new THREE.MeshStandardMaterial({ color: 0x8B4513 }); // Brown
        const mesh = new THREE.Mesh(geom, mat);
        return { group: mesh, type: 'toast', phase: Math.random() * Math.PI * 2 };
    }

    function resetObject(obj) {
        obj.group.position.x = (Math.random() * 10 + bounds.x/2);
        obj.group.position.y = (Math.random() * 10 + bounds.y/2);
        obj.group.position.z = (Math.random() - 0.5) * 10;
        obj.group.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    }

    for (let i = 0; i < count; i++) {
        const isToast = Math.random() > 0.8;
        const item = isToast ? createToast() : createToaster();
        item.group.position.set(
            (Math.random() - 0.5) * bounds.x,
            (Math.random() - 0.5) * bounds.y,
            (Math.random() - 0.5) * 10
        );
        scene.add(item.group);
        objects.push(item);
    }

    camera.position.z = 15;

    function animate(time) {
        requestAnimationFrame(animate);
        const t = time * 0.001;

        objects.forEach(obj => {
            // Drift diagonally: Upper-right to lower-left
            obj.group.position.x -= 0.05;
            obj.group.position.y -= 0.04;

            // Wings flap if toaster
            if (obj.type === 'toaster') {
                const flap = Math.sin(t * 8 + obj.phase) * 0.8;
                obj.leftPivot.rotation.z = flap;
                obj.rightPivot.rotation.z = -flap;
            }

            // Respawn logic
            if (obj.group.position.x < -bounds.x/2 || obj.group.position.y < -bounds.y/2) {
                resetObject(obj);
            }
        });

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate(0);
</script>
</body>
</html>
