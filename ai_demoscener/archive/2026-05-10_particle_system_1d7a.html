<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Particle Fountain</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const PARTICLE_COUNT = 5000;
    const GRAVITY = 9.8;
    const SPAWN_Y = 0;
    const RESET_Y = -10;
    const MAX_LIFETIME = 4.0;

    // Create soft circular sprite texture via canvas
    function createParticleTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.5)');
        gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)');
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        const texture = new THREE.CanvasTexture(canvas);
        return texture;
    }

    // Setup Scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Particle Data Arrays
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const velocities = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const lifetimes = new Float32Array(PARTICLE_COUNT);

    // Initialize Particles
    function resetParticle(i) {
        positions[i * 3] = 0;
        positions[i * 3 + 1] = SPAWN_Y;
        positions[i * 3 + 2] = 0;

        // Random outward velocity
        const angle = Math.random() * Math.PI * 2;
        const speed = 5 + Math.random() * 10;
        const spread = 0.6; // bias factor
        
        velocities[i * 3] = Math.cos(angle) * speed * spread;
        velocities[i * 3 + 1] = (Math.random() * 15) + 5; // Upward bias
        velocities[i * 3 + 2] = Math.sin(angle) * speed * spread;

        lifetimes[i] = MAX_LIFETIME;
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        resetParticle(i);
    }

    // Geometry & Material
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: 0.25,
        map: createParticleTexture(),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexColors: true
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);

    // Animation Loop
    const clock = new THREE.Clock();
    const colorObj = new THREE.Color();

    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.1); // cap dt to prevent huge jumps

        const posAttr = geometry.attributes.position;
        const colAttr = geometry.attributes.color;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            // Update Physics
            velocities[i * 3 + 1] -= GRAVITY * dt; // apply gravity to y velocity

            positions[i * 3] += velocities[i * 3] * dt;
            positions[i * 3 + 1] += velocities[i * 3 + 1] * dt;
            positions[i * 3 + 2] += velocities[i * 3 + 2] * dt;

            // Update Life
            lifetimes[i] -= dt;

            // Respawn condition: below threshold OR life expired
            if (positions[i * 3 + 1] < RESET_Y || lifetimes[i] <= 0) {
                resetParticle(i);
            }

            // Update Color based on remaining lifetime
            const lifeRatio = lifetimes[i] / MAX_LIFETIME;
            // Color gradient: Cyan -> Blue -> Purple/Red (warm to cool or vice versa)
            // Let's go Gold/Orange to Red for a fire effect, or Cyan to White for energy
            colorObj.setHSL(0.5 + lifeRatio * 0.2, 1.0, 0.5); 
            colors[i * 3] = colorObj.r;
            colors[i * 3 + 1] = colorObj.g;
            colors[i * 3 + 2] = colorObj.b;
        }

        posAttr.needsUpdate = true;
        colAttr.needsUpdate = true;

        // Subtle camera movement
        camera.lookAt(0, 2, 0);
        
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
