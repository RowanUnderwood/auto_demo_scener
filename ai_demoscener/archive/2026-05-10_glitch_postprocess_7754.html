<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 3;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// Torus Knot
const geometry = new THREE.TorusKnotGeometry(1, 0.3, 256, 32);
const material = new THREE.MeshNormalMaterial();
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

// Post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const GlitchShader = {
  uniforms: {
    'tDiffuse': { value: null },
    'uTime': { value: 0.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    varying vec2 vUv;

    float rand(vec2 co) {
      return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453);
    }

    void main() {
      // (a) Chromatic aberration: shift R and B channels horizontally
      float rShift = sin(uTime * 2.5) * 0.015;
      float bShift = cos(uTime * 1.8) * 0.015;

      vec2 uv = vUv;

      // (b) Glitch slices: every few frames, replace horizontal slices with different y offset
      // Use floor to create discrete time steps for "every few frames" effect
      float glitchStep = floor(uTime * 10.0);
      float glitchSeed = rand(vec2(glitchStep, 0.5));
      
      if (glitchSeed > 0.7) { // Probability threshold to trigger the glitch state
        float sliceCount = 16.0;
        float currentSlice = floor(uv.y * sliceCount);
        // Unique randomness per horizontal slice strip
        float sliceRand = rand(vec2(currentSlice, glitchStep));
        
        if (sliceRand > 0.5) {
          // Shift the y coordinate to sample from a different vertical part of the texture
          uv.y += (sliceRand - 0.5) * 0.15;
        }
      }

      float r = texture2D(tDiffuse, vec2(uv.x + rShift, uv.y)).r;
      float g = texture2D(tDiffuse, vec2(uv.x, uv.y)).g;
      float b = texture2D(tDiffuse, vec2(uv.x + bShift, uv.y)).b;

      gl_FragColor = vec4(r, g, b, 1.0);
    }
  `
};

const glitchPass = new ShaderPass(GlitchShader);
composer.addPass(glitchPass);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

function animate(time) {
  requestAnimationFrame(animate);
  const t = time * 0.001;

  mesh.rotation.x += 0.01;
  mesh.rotation.y += 0.015;

  glitchPass.uniforms.uTime.value = t;

  composer.render();
}

animate(0);
</script>
