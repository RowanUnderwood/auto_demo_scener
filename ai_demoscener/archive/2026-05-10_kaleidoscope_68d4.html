<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry Shader</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="vertexShader" type="x-shader/x-vertex">
    varying vec2 vUv;
    void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
</script>
<script id="fragmentShader" type="x-shader/x-fragment">
    uniform float u_time;
    uniform vec2 u_resolution;
    varying vec2 vUv;

    #define PI 3.14159265359

    void main() {
        // Normalize coordinates to [-1, 1] and handle aspect ratio
        vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.y, u_resolution.x);
        
        // Convert UV to Polar
        float r = length(uv);
        float a = atan(uv.y, uv.x);

        // Fold the angle into a wedge for N-fold symmetry
        float N = 8.0;
        float sector = (2.0 * PI) / N;
        a = abs(mod(a, sector) - sector * 0.5);

        // Convert back to Cartesian using folded angle
        vec2 p = vec2(cos(a), sin(a)) * r;

        // Procedural pattern: sum of sines
        float pattern = 0.0;
        pattern += sin(p.x * 10.0 + u_time * 1.5);
        pattern += sin(p.y * 12.0 - u_time * 1.2);
        pattern += sin((p.x + p.y) * 8.0 + u_time);
        pattern += sin(length(p) * 15.0 - u_time * 2.0);

        // Coloring
        vec3 color = vec3(0.0);
        color.r = 0.5 + 0.5 * sin(pattern + u_time * 0.5);
        color.g = 0.5 + 0.5 * sin(pattern + u_time * 0.7 + 2.0);
        color.b = 0.5 + 0.5 * sin(pattern + u_time * 0.9 + 4.0);

        // Add some brightness/contrast based on pattern
        color *= (pattern * 0.5 + 0.5);
        
        gl_FragColor = vec4(color, 1.0);
    }
</script>
<script>
    let scene, camera, renderer, material;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        material = new THREE.ShaderMaterial({
            uniforms: {
                u_time: { value: 0.0 },
                u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        window.addEventListener('resize', onWindowResize, false);
        animate();
    }

    function onWindowResize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.u_time.value += 0.01;
        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
