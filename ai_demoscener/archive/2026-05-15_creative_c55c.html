<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quantum Foam</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.126.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.126.1/examples/js/controls/OrbitControls.js"></script>
<script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e17);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    
    // Create particle system
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 10000;
    
    const positions = new Float32Array(particlesCount * 3);
    const colors = new Float32Array(particlesCount * 3);
    
    for (let i = 0; i < particlesCount; i++) {
        // Random positions within sphere
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.pow(Math.random(), 1.5) * 20;
        const z = Math.random() * 40 - 20;
        
        positions[i * 3] = Math.cos(angle) * radius;
        positions[i * 3 + 1] = Math.sin(angle) * radius;
        positions[i * 3 + 2] = z;
        
        // Color gradient from cyan to purple
        const colorFactor = (z + 20) / 40;
        colors[i * 3] = 0.2 + colorFactor * 0.8;
        colors[i * 3 + 1] = 1 - colorFactor * 0.6;
        colors[i * 3 + 2] = 0.9 + colorFactor * 0.1;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    
    const particleMaterial = new THREE.PointsMaterial({
        size: 0.25,
        transparent: true,
        opacity: 1.0,
        color: 0xffffff,
        vertexColors: true,
        depthWrite: false
    });
    
    const particles = new THREE.Points(particlesGeometry, particleMaterial);
    scene.add(particles);
    
    // Add subtle ambient light
    scene.add(new THREE.AmbientLight(0x2a3e5f, 0.8));
    
    // Create dynamic element that generates "quantum fluctuations"
    const fluctuationGroup = new THREE.Group();
    scene.add(fluctuationGroup);
    
    function createFluctuation() {
        const geometry = new THREE.SphereGeometry(1, 16, 16);
        const material = new THREE.MeshPhongMaterial({
            color: new THREE.Color(Math.random(), Math.random(), 0.8),
            transparent: true,
            opacity: 0.9
        });
        
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(
            (Math.random() - 0.5) * 40,
            (Math.random() - 0.5) * 40,
            (Math.random() - 0.5) * 30
        );
        
        fluctuationGroup.add(mesh);
        
        // Animation parameters
        const targetScale = Math.random() + 1.2;
        let scaleProgress = 0;
        let rotationSpeed = (Math.random() - 0.5) * 0.05;
        
        function animateFluctuation() {
            if (!mesh.parent) return;
            
            scaleProgress += 0.03;
            const currentScale = targetScale * Math.sin(scaleProgress);
            mesh.scale.set(currentScale, currentScale, currentScale);
            
            rotationSpeed *= 1.002; // Slight acceleration
            mesh.rotation.x += rotationSpeed;
            mesh.rotation.y += rotationSpeed * 0.7;
            
            if (scaleProgress > Math.PI) {
                fluctuationGroup.remove(mesh);
                mesh.geometry.dispose();
                mesh.material.dispose();
            }
        }
        
        return animateFluctuation;
    }
    
    // Create initial fluctuations
    const fluctuationAnimations = [];
    for (let i = 0; i < 5; i++) {
        fluctuationAnimations.push(createFluctuation());
    }
    
    // Add new fluctuations periodically
    setInterval(() => {
        if (fluctuationAnimations.length < 10) {
            fluctuationAnimations.push(createFluctuation());
        }
    }, 800);
    
    // Handle window resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    function animate() {
        requestAnimationFrame(animate);
        
        controls.update();
        
        // Rotate main particle field
        particles.rotation.y += 0.001;
        
        // Update fluctuation animations
        for (let i = fluctuationAnimations.length - 1; i >= 0; i--) {
            fluctuationAnimations[i]();
            
            // Remove if animation completed
            if (!fluctuationGroup.children.includes(fluctuationAnimations[i].mesh)) {
                fluctuationAnimations.splice(i, 1);
            }
        }
        
        renderer.render(scene, camera);
    }
    
    animate();
</script>
</body>
</html>
