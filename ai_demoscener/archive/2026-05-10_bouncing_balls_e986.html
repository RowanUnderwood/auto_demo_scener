<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Physics Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    // Scene Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xffffff, 100);
    pointLight.position.set(10, 10, 10);
    scene.add(pointLight);

    // Constants
    const BOX_SIZE = 10;
    const HALF_BOX = BOX_SIZE / 2;
    const SPHERE_COUNT = 30;
    const SPHERE_RADIUS = 0.3;
    const GRAVITY = -9.8;
    const DAMPING = 0.95;

    // Bounding Box Wireframe
    const boxGeo = new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE);
    const wireframe = new THREE.WireframeGeometry(boxGeo);
    const line = new THREE.LineSegments(wireframe);
    line.material.color.setHex(0xffffff);
    line.material.transparent = true;
    line.material.opacity = 0.3;
    scene.add(line);

    // Spheres Data
    const spheres = [];
    const sphereGeo = new THREE.SphereGeometry(SPHERE_RADIUS, 32, 32);

    for (let i = 0; i < SPHERE_COUNT; i++) {
        const material = new THREE.MeshPhongMaterial({ 
            color: new THREE.Color(`hsl(${Math.random() * 360}, 70%, 50%)`),
            shininess: 100 
        });
        const mesh = new THREE.Mesh(sphereGeo, material);

        // Random position within bounds (accounting for radius)
        mesh.position.set(
            (Math.random() - 0.5) * (BOX_SIZE - SPHERE_RADIUS * 2) + (Math.random() > 0.5 ? HALF_BOX - SPHERE_RADIUS : -HALF_BOX + SPHERE_RADIUS),
            (Math.random() - 0.5) * (BOX_SIZE - SPHERE_RADIUS * 2) + (Math.random() > 0.5 ? HALF_BOX - SPHERE_RADIUS : -HALF_BOX + SPHERE_RADIUS),
            (Math.random() - 0.5) * (BOX_SIZE - SPHERE_RADIUS * 2) + (Math.random() > 0.5 ? HALF_BOX - SPHERE_RADIUS : -HALF_BOX + SPHERE_RADIUS)
        );

        // Random velocity
        const velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 10,
            (Math.random() - 0.5) * 10,
            (Math.random() - 0.5) * 10
        );

        scene.add(mesh);
        spheres.push({ mesh, velocity });
    }

    camera.position.set(12, 12, 12);
    camera.lookAt(0, 0, 0);

    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.032); // Cap delta to prevent tunneling on lag

        spheres.forEach(s => {
            // Apply gravity
            s.velocity.y += GRAVITY * dt;

            // Update position
            s.mesh.position.addScaledVector(s.velocity, dt);

            // Collision Detection (X)
            if (s.mesh.position.x + SPHERE_RADIUS > HALF_BOX) {
                s.mesh.position.x = HALF_BOX - SPHERE_RADIUS;
                s.velocity.x *= -DAMPING;
            } else if (s.mesh.position.x - SPHERE_RADIUS < -HALF_BOX) {
                s.mesh.position.x = -HALF_BOX + SPHERE_RADIUS;
                s.velocity.x *= -DAMPING;
            }

            // Collision Detection (Y)
            if (s.mesh.position.y + SPHERE_RADIUS > HALF_BOX) {
                s.mesh.position.y = HALF_BOX - SPHERE_RADIUS;
                s.velocity.y *= -DAMPING;
            } else if (s.mesh.position.y - SPHERE_RADIUS < -HALF_BOX) {
                s.mesh.position.y = -HALF_BOX + SPHERE_RADIUS;
                s.velocity.y *= -DAMPING;
            }

            // Collision Detection (Z)
            if (s.mesh.position.z + SPHERE_RADIUS > HALF_BOX) {
                s.mesh.position.z = HALF_BOX - SPHERE_RADIUS;
                s.velocity.z *= -DAMPING;
            } else if (s.mesh.position.z - SPHERE_RADIUS < -HALF_BOX) {
                s.mesh.position.z = -HALF_BOX + SPHERE_RADIUS;
                s.velocity.z *= -DAMPING;
            }
        });

        // Slowly rotate camera for visual effect
        const time = Date.now() * 0.0005;
        camera.position.x = Math.sin(time) * 15;
        camera.position.z = Math.cos(time) * 15;
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
