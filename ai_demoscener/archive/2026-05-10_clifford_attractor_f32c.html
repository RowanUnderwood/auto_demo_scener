<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const SIZE = 1024;
const COUNT = 200000;
const FADE_SPEED = 0.992;
const MORPH_INTERVAL = 20000;

let params = { a: -1.4, b: 1.6, c: 1.0, d: 0.7 };
let targetParams = { ...params };
let lastMorphTime = performance.now();

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-2.5, 2.5, 2.5, -2.5, 0.1, 10);
camera.position.z = 1;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Accumulation buffer (Floating point for density)
const accumTarget = new THREE.WebGLRenderTarget(SIZE, SIZE, {
    format: THREE.RGBAFormat,
    type: THREE.FloatType,
    minFilter: THREE.NearestFilter,
    magFilter: THREE.NearestFilter
});

// Viridis Palette Generation
function createViridisTexture() {
    const data = new Uint8Array(256 * 4);
    const colors = [
        [68, 1, 84], [59, 82, 139], [33, 145, 140], [94, 201, 98], [253, 231, 37]
    ];
    for (let i = 0; i < 256; i++) {
        const t = i / 255;
        const segment = t * (colors.length - 1);
        const idx = Math.floor(segment);
        const frac = segment - idx;
        const c1 = colors[idx];
        const c2 = colors[Math.min(idx + 1, colors.length - 1)];
        data[i * 4] = c1[0] + (c2[0] - c1[0]) * frac;
        data[i * 4 + 1] = c1[1] + (c2[1] - c1[1]) * frac;
        data[i * 4 + 2] = c1[2] + (c2[2] - c1[2]) * frac;
        data[i * 4 + 3] = 255;
    }
    const tex = new THREE.DataTexture(data, 256, 1, THREE.RGBAFormat);
    tex.needsUpdate = true;
    return tex;
}
const viridisTex = createViridisTexture();

// Points Geometry
const posArray = new Float32Array(COUNT * 2);
const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

const pointsMat = new THREE.ShaderMaterial({
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    vertexShader: `
        void main() {
            gl_PointSize = 1.0;
            gl_Position = vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        void main() {
            gl_FragColor = vec4(1.0, 1.0, 1.0, 1.0);
        }
    `
});

const points = new THREE.Points(geometry, pointsMat);
scene.add(points);

// Fullscreen Quad for Display & Fade
const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const fadeMat = new THREE.ShaderMaterial({
    uniforms: { tAccum: { value: accumTarget.texture }, factor: { value: FADE_SPEED } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
    fragmentShader: `uniform sampler2D tAccum; uniform float factor; varying vec2 vUv; 
        void main() { vec4 c = texture2D(tAccum, vUv); gl_FragColor = c * factor; }`
});
const fadeQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fadeMat);
quadScene.add(fadeQuad);

const displayMat = new THREE.ShaderMaterial({
    uniforms: { tAccum: { value: accumTarget.texture }, tViridis: { value: viridisTex } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
    fragmentShader: `
        uniform sampler2D tAccum; uniform sampler2D tViridis; varying vec2 vUv;
        void main() {
            float d = texture2D(tAccum, vUv).r;
            // Log scale normalization. 10 is an empirical scaling factor for density depth
            float val = clamp(log2(1.0 + d) / 8.0, 0.0, 1.0);
            gl_FragColor = texture2D(tViridis, vec2(val, 0.5));
        }
    `
});
const displayQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), displayMat);
const displayScene = new THREE.Scene();
displayScene.add(displayQuad);

function updateParameters() {
    const now = performance.now();
    if (now - lastMorphTime > MORPH_INTERVAL) {
        targetParams = {
            a: (Math.random() * 4 - 2),
            b: (Math.random() * 4 - 2),
            c: (Math.random() * 2 - 1),
            d: (Math.random() * 2 - 1)
        };
        lastMorphTime = now;
    }
    params.a += (targetParams.a - params.a) * 0.01;
    params.b += (targetParams.b - params.b) * 0.01;
    params.c += (targetParams.c - params.c) * 0.01;
    params.d += (targetParams.d - params.d) * 0.01;
}

function animate() {
    requestAnimationFrame(animate);
    updateParameters();

    // Compute Attractor points on CPU
    let x = 0.1, y = 0.1;
    const a = params.a, b = params.b, c = params.c, d = params.d;
    for (let i = 0; i < COUNT; i++) {
        let nx = Math.sin(a * y) + c * Math.cos(a * x);
        let ny = Math.sin(b * x) + d * Math.cos(b * y);
        x = nx; y = ny;
        posArray[i * 2] = x;
        posArray[i * 2 + 1] = y;
    }
    geometry.attributes.position.needsUpdate = true;

    // Step 1: Fade Accumulator
    renderer.setRenderTarget(accumTarget);
    renderer.render(quadScene, quadCam);

    // Step 2: Draw points into accumulator using additive blending
    // We must map the attractor coordinates [-2.5, 2.5] to NDC [-1, 1] for the texture
    const scale = 1024 / 5.0; 
    pointsMat.uniforms = { /* not needed, but keeping structure */ };
    // Since points are in world space and we want them in a fixed texture, 
    // we'll use a simple projection inside the vertex shader or just adjust camera.
    camera.left = -2.5; camera.right = 2.5; camera.top = 2.5; camera.bottom = -2.5;
    camera.updateProjectionMatrix();

    // Use standard additive blending to accumulate hits
    renderer.autoClear = false;
    renderer.render(scene, camera);

    // Step 3: Render result to screen
    renderer.setRenderTarget(null);
    renderer.render(displayScene, quadCam);
}

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
