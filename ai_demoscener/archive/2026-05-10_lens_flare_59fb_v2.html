<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ethereal Nexus Projection</title>
    <style>
        body { margin: 0; overflow: hidden; background: #05050a; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.136.0/build/three.module.js';

    // Scene Setup - Deep dark aesthetic
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05050a, 0.15);
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Procedural Texture Generation - Glitch/Star Dust Style
    const createGlowTexture = (isMain) => {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        
        const centerX = 128;
        const centerY = 128;

        if (isMain) {
            const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 128);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.1, 'rgba(0, 255, 255, 0.8)');
            grad.addColorStop(0.3, 'rgba(0, 100, 255, 0.3)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            
            for(let i=0; i<30; i++) {
                ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.5})`;
                ctx.fillRect(Math.random()*256, Math.random()*256, 2, 2);
            }
        } else {
            const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 128);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
    };

    // Central Geometry - A crystalline polyhedron
    const coreGeom = new THREE.IcosahedronGeometry(1.5, 0);
    const coreMat = new THREE.MeshPhysicalMaterial({
        color: 0x112244,
        metalness: 0.9,
        roughness: 0.1,
        wireframe: false,
        emissive: 0x001133,
        transparent: true,
        opacity: 0.8
    });
    const core = new THREE.Mesh(coreGeom, coreMat);
    scene.add(core);

    // Wireframe overlay for high-tech look
    const wireframe = new THREE.Mesh(
        coreGeom,
        new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.2 })
    );
    core.add(wireframe);

    // The "Projector" - An invisible mathematical point in space
    const projectorPoint = new THREE.Vector3();
    
    // Main Sprite (The visual focal point)
    const mainSprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: createGlowTexture(true),
        transparent: true,
        blending: THREE.AdditiveBlending
    }));
    scene.add(mainSprite);

    // Secondary "Trace" Sprites (Connecting the eye to the center)
    const traceCount = 12;
    const traces = [];
    for (let i = 0; i < traceCount; i++) {
        const mat = new THREE.SpriteMaterial({
            map: createGlowTexture(false),
            transparent: true,
            blending: THREE.AdditiveBlending,
            opacity: 1 - (i / traceCount)
        });
        const s = new THREE.Sprite(mat);
        scene.add(s);
        traces.push({
            mesh: s,
            scaleFactor: 1.0 - (i * 0.06),
            phaseOffset: Math.random() * Math.PI * 2
        });
    }

    // Lights
    const pLight = new THREE.PointLight(0x00ffff, 2, 10);
    scene.add(pLight);
    scene.add(new THREE.AmbientLight(0x111122));

    // Helper: Unproject NDC to World Space at specific distance
    const unprojectAtDepth = (ndc, depth) => {
        const vec = new THREE.Vector3(ndc.x, ndc.y, 0.5).unproject(camera);
        const dir = vec.sub(camera.position).normalize();
        return camera.position.clone().add(dir.multiplyScalar(depth));
    };

    function animate() {
        requestAnimationFrame(animate);
        const time = performance.now() * 0.001;

        // Rotate Core
        core.rotation.y += 0.005;
        core.rotation.z += 0.003;
        wireframe.rotation.y -= 0.002;

        // Orbit the projector point in a complex path (Lissajous-like)
        projectorPoint.set(
            Math.sin(time * 0.7) * 3,
            Math.cos(time * 0.5) * 2,
            Math.sin(time * 1.1) * 1.5
        );

        // Update light to follow projector
        pLight.position.copy(projectorPoint);

        // Projection Logic
        const projectedNDC = projectorPoint.clone().project(camera);
        const screenCenterNDC = new THREE.Vector2(0, 0);
        const targetNDC = new THREE.Vector2(projectedNDC.x, projectedNDC.y);

        // Update Main Sprite (Placed in front of camera)
        const mainPosWorld = unprojectAtDepth(targetNDC, 4);
        mainSprite.position.copy(mainPosWorld);
        const pulse = 0.6 + Math.sin(time * 4) * 0.1;
        mainSprite.scale.set(pulse, pulse, 1);

        // Update Trace Sprites (Connecting center to projected point in NDC space)
        traces.forEach((t, i) => {
            const tParam = (i + 1) / (traceCount + 1);
            const lerpNDC = new THREE.Vector2().lerpVectors(screenCenterNDC, targetNDC, tParam);
            
            const posWorld = unprojectAtDepth(lerpNDC, 5 - (i * 0.1));
            t.mesh.position.copy(posWorld);
            
            const s = t.scaleFactor * (0.4 + Math.sin(time * 2 + t.phaseOffset) * 0.1);
            t.mesh.scale.set(s, s, 1);
            t.mesh.material.opacity = (1 - tParam) * 0.5;
        });

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
