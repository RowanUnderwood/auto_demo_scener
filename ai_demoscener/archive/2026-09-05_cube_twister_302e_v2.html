<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Twisting Hex Stack</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070f, 0.004);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 2, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.target.set(0, 0, 0);
controls.minDistance = 12;
controls.maxDistance = 60;

// Post processing / bloom
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.85, 0.55, 0.2
);
composer.addPass(bloom);

// Lighting
const ambientLight = new THREE.AmbientLight(0x1a2a4a, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xbfd4ff, 1.1);
dirLight.position.set(8, 18, 14);
scene.add(dirLight);

const pointLight1 = new THREE.PointLight(0x00ccff, 160, 110);
pointLight1.position.set(15, 20, 15);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0x7733ff, 140, 110);
pointLight2.position.set(-15, -15, -10);
scene.add(pointLight2);

const pointLight3 = new THREE.PointLight(0x00ffcc, 110, 90);
pointLight3.position.set(0, 0, 20);
scene.add(pointLight3);

// Round glow sprite texture (fixes square point artifacts)
function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,255,255,0.85)');
  g.addColorStop(0.5, 'rgba(255,255,255,0.25)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTexture();

// Soft central aura behind the column
const auraMat = new THREE.SpriteMaterial({
  map: glowTex, color: 0x3a5bff, transparent: true,
  opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false
});
const aura = new THREE.Sprite(auraMat);
aura.scale.set(46, 70, 1);
aura.position.set(0, 0, -6);
scene.add(aura);

// Hexagonal flat prisms
const COUNT = 60;
const Y_MIN = -24;
const Y_MAX = 24;
const step = (Y_MAX - Y_MIN) / (COUNT - 1);

const materials = [];
for (let i = 0; i < COUNT; i++) {
  const t = i / (COUNT - 1);
  const hue = 0.5 + t * 0.34;            // cyan -> magenta/purple
  const sat = 0.85;
  const lig = 0.5 - t * 0.06;
  const color = new THREE.Color().setHSL(hue, sat, lig);
  const mat = new THREE.MeshStandardMaterial({
    color: color,
    emissive: color,
    emissiveIntensity: 0.55 + t * 0.35,
    metalness: 0.55,
    roughness: 0.32,
  });
  materials.push(mat);
}

const hexGeo = new THREE.CylinderGeometry(4.2, 4.2, 1.0, 6);
const hexGeoFlat = hexGeo.clone();
hexGeoFlat.rotateX(Math.PI / 2);

const discs = [];
for (let i = 0; i < COUNT; i++) {
  const disc = new THREE.Mesh(hexGeoFlat, materials[i]);
  disc.position.y = Y_MIN + i * step;
  disc.userData.baseY = disc.position.y;
  disc.userData.index = i;
  scene.add(disc);
  discs.push(disc);
}

// Outer particle field (round glowing)
const particleCount = 360;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount; i++) {
  const radius = 9 + Math.random() * 28;
  const theta = Math.random() * Math.PI * 2;
  const y = (Math.random() - 0.5) * 56;
  particlePositions[i * 3] = Math.cos(theta) * radius;
  particlePositions[i * 3 + 1] = y;
  particlePositions[i * 3 + 2] = Math.sin(theta) * radius;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

const particleMat = new THREE.PointsMaterial({
  color: 0x66aaff, size: 0.55, map: glowTex,
  transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// Inner particle layer
const particleCount2 = 220;
const particleGeo2 = new THREE.BufferGeometry();
const particlePositions2 = new Float32Array(particleCount2 * 3);
for (let i = 0; i < particleCount2; i++) {
  const radius = 4 + Math.random() * 9;
  const theta = Math.random() * Math.PI * 2;
  const y = (Math.random() - 0.5) * 44;
  particlePositions2[i * 3] = Math.cos(theta) * radius;
  particlePositions2[i * 3 + 1] = y;
  particlePositions2[i * 3 + 2] = Math.sin(theta) * radius;
}
particleGeo2.setAttribute('position', new THREE.BufferAttribute(particlePositions2, 3));

const particleMat2 = new THREE.PointsMaterial({
  color: 0x33ffcc, size: 0.32, map: glowTex,
  transparent: true, opacity: 0.7,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
const particles2 = new THREE.Points(particleGeo2, particleMat2);
scene.add(particles2);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const time = clock.getElapsedTime();

  for (let i = 0; i < COUNT; i++) {
    const t = i / (COUNT - 1);
    const phase = time * 0.9 + i * 0.2;
    discs[i].rotation.z = phase;

    // Gentle S-curve displacement
    const curve = Math.sin(time * 0.4 + i * 0.09) * 2.4;
    discs[i].position.x = curve;
    discs[i].position.z = Math.cos(time * 0.3 + i * 0.07) * 1.4;

    // Subtle breathing scale
    const breathe = 1 + Math.sin(time * 1.1 + i * 0.22) * 0.06;
    discs[i].scale.setScalar(breathe);

    // Emissive pulse
    materials[i].emissiveIntensity =
      0.5 + Math.sin(time * 1.8 + i * 0.28) * 0.22 + t * 0.35;
  }

  // Rotate particle systems slowly
  particles.rotation.y = time * 0.06;
  particles2.rotation.y = -time * 0.09;
  particles2.rotation.x = Math.sin(time * 0.2) * 0.1;

  // Animate lights
  pointLight1.position.x = Math.sin(time * 0.5) * 20;
  pointLight1.position.z = Math.cos(time * 0.5) * 20;
  pointLight3.position.x = Math.sin(time * 0.7) * 12;
  pointLight3.position.z = Math.cos(time * 0.7) * 12;

  // Aura pulse
  auraMat.opacity = 0.18 + Math.sin(time * 0.8) * 0.06;
  const auraScale = 1 + Math.sin(time * 0.6) * 0.05;
  aura.scale.set(46 * auraScale, 70 * auraScale, 1);

  controls.update();
  composer.render();
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.resolution.set(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
