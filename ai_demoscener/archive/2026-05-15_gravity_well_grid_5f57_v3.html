<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bathymetric Flux Field</title>
<style>
  body { margin: 0; background: #03060b; overflow: hidden; }
  canvas { display: block; }
  #label {
    position: fixed; bottom: 16px; left: 22px;
    font-family: 'Courier New', monospace; font-size: 10px;
    letter-spacing: 3px; color: rgba(150,220,235,0.42);
    pointer-events: none; text-transform: uppercase;
  }
  #vig {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,2,4,0.78) 100%);
  }
</style>
</head>
<body>
<div id="label">isobaric drift · cursor drops wells</div>
<div id="vig"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const N_MOVING = 7;
const N_MASSES = N_MOVING + 1;
const SEGMENTS = 280;
const SIZE = 72;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03060b);
scene.fog = new THREE.FogExp2(0x03060b, 0.0135);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const moving = [];
for (let i = 0; i < N_MOVING; i++) {
  moving.push({
    ax: 7 + Math.random() * 17,
    az: 7 + Math.random() * 17,
    fx: 0.12 + Math.random() * 0.4,
    fz: 0.12 + Math.random() * 0.4,
    px: Math.random() * Math.PI * 2,
    pz: Math.random() * Math.PI * 2,
    strength: 4.5 + Math.random() * 7.5,
    sigma: 1.9 + Math.random() * 2.7,
    phase: Math.random() * Math.PI * 2
  });
}

const mouseWorld = new THREE.Vector3(0, 0, 0);
const pointer = new THREE.Vector2(9999, 9999);
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

const sharedUniforms = {
  uTime: { value: 0 },
  uMasses: { value: Array(N_MASSES).fill(new THREE.Vector4()) }
};

const displace = `
  float depth = 0.0;
  for (int i = 0; i < ${N_MASSES}; i++) {
    vec4 m = uMasses[i];
    vec2 diff = pos.xz - m.xy;
    float d2 = dot(diff, diff);
    float g = m.z * exp(-d2 / (m.w * m.w));
    depth += g;
    float env = exp(-d2 / (m.w * m.w * 6.0));
    depth += sin(sqrt(d2) * 1.35 - uTime * 2.1 + m.phase_unused) * 0.0;
    depth += sin(sqrt(d2) * 1.35 - uTime * 2.1) * env * m.z * 0.16;
  }
  depth += 0.55 * sin(pos.x * 0.28 + uTime * 0.42) * cos(pos.z * 0.31 - uTime * 0.33);
  pos.y += depth;
  vDepth = depth;
`;

const surfMat = new THREE.ShaderMaterial({
  uniforms: sharedUniforms,
  vertexShader: `
    varying float vDepth; varying vec3 vWorld;
    uniform float uTime; uniform vec4 uMasses[${N_MASSES}];
    void main() {
      vec3 pos = position;
      float depth = 0.0;
      for (int i = 0; i < ${N_MASSES}; i++) {
        vec4 m = uMasses[i];
        vec2 diff = pos.xz - m.xy;
        float d2 = dot(diff, diff);
        depth += m.z * exp(-d2 / (m.w * m.w));
        float env = exp(-d2 / (m.w * m.w * 6.0));
        depth += sin(sqrt(d2) * 1.35 - uTime * 2.1) * env * m.z * 0.16;
      }
      depth += 0.55 * sin(pos.x * 0.28 + uTime * 0.42) * cos(pos.z * 0.31 - uTime * 0.33);
      pos.y += depth;
      vDepth = depth;
      vWorld = (modelMatrix * vec4(pos,1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
    }
  `,
  fragmentShader: `
    varying float vDepth; varying vec3 vWorld;
    uniform float uTime;
    void main() {
      float d = vDepth;
      float t = clamp(d / 15.0, 0.0, 1.0);

      vec3 abyss = vec3(0.012, 0.045, 0.10);
      vec3 shelf = vec3(0.020, 0.380, 0.550);
      vec3 crest = vec3(0.680, 0.960, 1.000);

      vec3 col = mix(abyss, shelf, smoothstep(0.0, 0.5, t));
      col = mix(col, crest, smoothstep(0.5, 1.0, t));

      float iso = d * 0.55;
      float f = abs(fract(iso) - 0.5);
      float minor = 1.0 - smoothstep(0.0, 0.12, f);
      float f2 = abs(fract(iso * 0.2) - 0.5);
      float major = 1.0 - smoothstep(0.0, 0.05, f2);

      col = mix(col, vec3(0.55, 0.85, 0.95), major * 0.55 * (0.35 + t));
      col += minor * vec3(0.25, 0.55, 0.7) * 0.22 * (0.3 + t);

      // drifting scan band
      float scan = fract(vWorld.z * 0.008 + uTime * 0.045);
      float band = smoothstep(0.48, 0.5, scan) * (1.0 - smoothstep(0.5, 0.52, scan));
      col += band * vec3(0.35, 0.6, 0.7) * 0.5;

      // crest glow
      col += pow(t, 3.0) * vec3(0.35, 0.55, 0.62) * 0.45;

      float dist = length(vWorld - cameraPosition);
      float fog = smoothstep(38.0, 115.0, dist);
      col = mix(col, vec3(0.012, 0.024, 0.045), fog);

      gl_FragColor = vec4(col, 0.92);
    }
  `,
  transparent: true, side: THREE.DoubleSide
});

const pointMat = new THREE.ShaderMaterial({
  uniforms: sharedUniforms,
  vertexShader: `
    varying float vDepth;
    uniform float uTime; uniform vec4 uMasses[${N_MASSES}];
    void main() {
      vec3 pos = position;
      float depth = 0.0;
      for (int i = 0; i < ${N_MASSES}; i++) {
        vec4 m = uMasses[i];
        vec2 diff = pos.xz - m.xy;
        float d2 = dot(diff, diff);
        depth += m.z * exp(-d2 / (m.w * m.w));
        float env = exp(-d2 / (m.w * m.w * 6.0));
        depth += sin(sqrt(d2) * 1.35 - uTime * 2.1) * env * m.z * 0.16;
      }
      depth += 0.55 * sin(pos.x * 0.28 + uTime * 0.42) * cos(pos.z * 0.31 - uTime * 0.33);
      pos.y += depth + 0.05;
      vDepth = depth;
      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      gl_PointSize = 2.4 * (240.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDepth;
    void main() {
      vec2 p = gl_PointCoord - 0.5;
      float r = dot(p, p);
      if (r > 0.25) discard;
      float a = (1.0 - smoothstep(0.02, 0.25, r)) * 0.5;
      float t = clamp(vDepth / 15.0, 0.0, 1.0);
      vec3 c = mix(vec3(0.05, 0.2, 0.35), vec3(0.8, 0.95, 1.0), t);
      gl_FragColor = vec4(c, a * (0.2 + t));
    }
  `,
  blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
});

const geom = new THREE.PlaneGeometry(SIZE, SIZE, SEGMENTS, SEGMENTS);
geom.rotateX(-Math.PI / 2);

scene.add(new THREE.Mesh(geom, surfMat));
scene.add(new THREE.Points(geom, pointMat));

window.addEventListener('pointermove', e => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const el = clock.getElapsedTime();

  raycaster.setFromCamera(pointer, camera);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(groundPlane, hit)) mouseWorld.lerp(hit, 0.14);

  const pulse = 10.5 + 1.8 * Math.sin(el * 0.9);
  const list = [new THREE.Vector4(mouseWorld.x, mouseWorld.z, pulse, 2.7)];

  for (let i = 0; i < N_MOVING; i++) {
    const m = moving[i];
    const x = Math.cos(el * m.fx + m.px) * m.ax + Math.sin(el * 0.11 + m.px) * 3.0;
    const z = Math.sin(el * m.fz + m.pz) * m.az + Math.cos(el * 0.09 + m.pz) * 3.0;
    const s = m.strength * (0.78 + 0.26 * Math.sin(el * 0.6 + m.phase));
    list.push(new THREE.Vector4(x, z, s, m.sigma));
  }

  sharedUniforms.uTime.value = el;
  sharedUniforms.uMasses.value = list;

  const r = 60 + Math.sin(el * 0.11) * 6;
  camera.position.x = Math.cos(el * 0.07) * r;
  camera.position.z = Math.sin(el * 0.07) * r;
  camera.position.y = 15 + Math.sin(el * 0.18) * 9;
  camera.lookAt(Math.sin(el * 0.05) * 4, 1.5, Math.cos(el * 0.05) * 4);

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
