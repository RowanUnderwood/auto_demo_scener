<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CYBER-RECURSION // NEURAL DRIFT</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/**
 * CONCEPT: "NEURAL DRIFT"
 * A hybrid of Reaction-Diffusion, Vector Fields, and Fractal Flames.
 * It simulates a "dreaming machine" where recursive patterns emerge 
 * from a shifting vector field of light particles that leave chemical trails.
 */

let scene, camera, renderer, clock;
let points, geometry, material;
const PARTICLE_COUNT = 15000;
const trailCanvas = document.createElement('canvas');
const trailCtx = trailCanvas.getContext('2d');
let trailTexture;
let width, height;

// Simulation state
const particles = [];
const fieldScale = 0.05;

function init() {
    width = window.innerWidth;
    height = window.innerHeight;
    trailCanvas.width = width;
    trailCanvas.height = height;
    
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
    camera.position.z = 50;

    renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(width, height);
    document.body.appendChild(renderer.domElement);

    clock = new THREE.Clock();

    // Setup Trail Texture (Feedback Loop)
    trailTexture = new THREE.CanvasTexture(trailCanvas);

    // Geometry for particles
    geometry = new THREE.BufferGeometry();
    const posArray = new Float32Array(PARTICLE_COUNT * 3);
    const colorArray = new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
            x: (Math.random() - 0.5) * 100,
            y: (Math.random() - 0.5) * 100,
            z: (Math.random() - 0.5) * 20,
            vx: 0, vy: 0, vz: 0,
            life: Math.random(),
            hue: Math.random()
        });

        posArray[i * 3] = particles[i].x;
        posArray[i * 3 + 1] = particles[i].y;
        posArray[i * 3 + 2] = particles[i].z;

        colorArray[i * 3] = 1;
        colorArray[i * 3 + 1] = 1;
        colorArray[i * 3 + 2] = 1;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

    material = new THREE.PointsMaterial({
        size: 0.4,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        opacity: 0.8
    });

    points = new THREE.Points(geometry, material);
    scene.add(points);

    // Background Quad for "Chemical" feedback effect via texture manipulation
    // We use the canvas to create a persistent trail that decays over time
    window.addEventListener('resize', onWindowResize);
}

function onWindowResize() {
    width = window.innerWidth;
    height = window.innerHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
    trailCanvas.width = width;
    trailCanvas.height = height;
}

// Noise-like vector field function (Simulating curl noise)
function getField(x, y, t) {
    const f1 = Math.sin(x * 0.1 + t) * Math.cos(y * 0.1 - t);
    const f2 = Math.cos(x * 0.15 - t * 0.7) * Math.sin(y * 0.12 + t);
    return { vx: f1 * 0.5, vy: f2 * 0.5 };
}

function updateParticles(dt, time) {
    const posAttr = geometry.attributes.position;
    const colAttr = geometry.attributes.color;

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particles[i];
        
        // Apply Vector Field
        const force = getField(p.x * fieldScale, p.y * fieldScale, time);
        p.vx += force.vx * dt * 10;
        p.vy += force.vy * dt * 10;

        // Friction / Dampening
        p.vx *= 0.98;
        p.vy *= 0.98;

        p.x += p.vx;
        p.y += p.vy;
        p.z += Math.sin(time + p.x * 0.1) * 0.1;

        // Boundary check & Respawn
        if (Math.abs(p.x) > 60 || Math.abs(p.y) > 60) {
            p.x = (Math.random() - 0.5) * 20;
            p.y = (Math.random() - 0.5) * 20;
            p.vx = 0; p.vy = 0;
            p.life = Math.random();
        }

        posAttr.setXYZ(i, p.x, p.y, p.z);

        // Color by velocity and life
        const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        const color = new THREE.Color();
        color.setHSL((p.hue + time * 0.1) % 1, 0.8, 0.5 + speed * 2.0);
        colAttr.setXYZ(i, color.r, color.g, color.b);

        // Draw to "trail" canvas for a feedback-like effect if we were using post-processing
        // But since we are doing pure Three.js particles, we simulate trails by 
        // modulating the point size and opacity based on velocity.
    }
    posAttr.needsUpdate = true;
    colAttr.needsUpdate = true;

    // Subtle camera movement
    camera.position.x = Math.sin(time * 0.2) * 10;
    camera.position.y = Math.cos(time * 0.2) * 10;
    camera.lookAt(0, 0, 0);
}

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    const time = clock.elapsedTime;

    updateParticles(delta, time);
    
    // Rotate the whole system slightly
    points.rotation.z += 0.001;

    renderer.render(scene, camera);
}

init();
animate();
</script>
</body>
</html>
