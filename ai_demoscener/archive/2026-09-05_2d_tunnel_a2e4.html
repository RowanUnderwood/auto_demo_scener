<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Hex Tunnel</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;}
  canvas{display:block;}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const uniforms = {
  uTime: { value: 0 },
  uRes:  { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
};

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;
    uniform vec2 uRes;

    // ---- hex grid ----
    vec2 hexGrid(vec2 p){
      const vec2 s = vec2(1.0, 1.7320508);
      p *= s;
      vec2 h = abs(fract(p - 0.5) - 0.5) / fwidth(p);
      float d = min(min(h.x, h.y), 1.0);
      return vec2(d, length(p - floor(p + 0.5)));
    }

    float hash(vec2 p){
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    void main(){
      vec2 uv = vUv * 2.0 - 1.0;
      uv.x *= uRes.x / uRes.y; // keep circle circular

      float r   = length(uv);
      float ang = atan(uv.y, uv.x);

      float rr = clamp(r, 0.015, 1.2);

      // perspective scroll: deeper (smaller r) moves faster
      float u = 1.0 / rr + uTime * 1.2;

      // unwrap angle -> 4 full pattern repeats around circumference (periodic)
      float v = ang * 4.0 / 6.28318530718 * 6.28318530718; // = ang*4

      // pattern space: rings scroll outward, walls are angular
      vec2 p = vec2(u * 2.2, v * 0.9);
      vec2 h = hexGrid(p);
      float edge   = h.x;
      float cellId = h.y;

      vec2 cellPos = floor(p * vec2(1.0, 1.0));
      float rnd = hash(cellPos);

      // vivid high-contrast palette: cyan / magenta / electric yellow
      vec3 c1 = vec3(0.0, 1.0, 0.95);
      vec3 c2 = vec3(1.0, 0.08, 0.75);
      vec3 c3 = vec3(1.0, 0.85, 0.05);
      vec3 col;
      if      (rnd < 0.45) col = c1;
      else if (rnd < 0.85) col = c2;
      else                 col = c3;

      // cell interior: dark core, colour blooms toward cell centre
      float inner = smoothstep(1.0, 0.0, cellId);
      vec3 cellCol = mix(vec3(0.02, 0.0, 0.06), col * 0.55, inner * inner);

      // glowing lattice lines
      float line = 1.0 - smoothstep(0.0, 0.06, edge);
      line = pow(line, 1.5);
      vec3 lineCol = col * (1.6 + 1.4 * sin(u * 3.1 + rnd * 6.28));

      vec3 tunnel = mix(cellCol, lineCol, line);

      // ring pulse racing outward
      float pulse = pow(0.5 + 0.5 * sin(u * 12.56 - 0.0), 6.0);
      tunnel += col * pulse * 0.35 * line;

      // perspective foreshortening: brightness scales with 1/r falloff
      float depth = 1.0 / rr;
      tunnel *= smoothstep(0.02, 0.55, rr) * (0.35 + 0.65 * min(depth, 3.0) * 0.5);

      // far end of tunnel fades to near-black
      tunnel *= smoothstep(0.0, 0.12, rr);

      // hot core glow at the vanishing point
      float core = exp(-rr * 9.0);
      vec3 coreCol = mix(c2, c1, 0.5 + 0.5 * sin(uTime * 2.0));
      tunnel += coreCol * core * 0.9;

      // subtle angular shimmer
      tunnel *= 0.92 + 0.08 * sin(ang * 16.0 + uTime * 3.0);

      // strong vignette
      float vig = smoothstep(1.35, 0.35, length(uv * vec2(0.85, 1.0)));
      vig = pow(vig, 1.6);
      tunnel *= vig;

      // gentle tone curve
      tunnel = pow(clamp(tunnel, 0.0, 1.0), vec3(0.85));

      gl_FragColor = vec4(tunnel, 1.0);
    }
  `
});

const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
scene.add(quad);

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  uniforms.uTime.value = clock.getElapsedTime();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  uniforms.uRes.value.set(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
