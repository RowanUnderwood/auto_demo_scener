<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rotating Checker</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const geometry = new THREE.PlaneGeometry(2, 2);

const material = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;

    void main() {
      // Center UV
      vec2 uv = vUv - 0.5;

      // Rotation matrix
      float angle = uTime * 0.3;
      float c = cos(angle);
      float s = sin(angle);
      mat2 rot = mat2(c, -s, s, c);

      vec2 p = rot * uv;

      // Scale
      p *= (1.5 + sin(uTime) * 0.7);

      // Procedural checker: fract ensures infinite tiling in every direction
      vec2 fp = fract(p);
      float checker = mod(floor(p.x) + floor(p.y), 2.0);

      // Two contrasting colors
      vec3 colA = vec3(0.05, 0.05, 0.12);
      vec3 colB = vec3(0.95, 0.45, 0.15);

      vec3 color = mix(colA, colB, checker);
      gl_FragColor = vec4(color, 1.0);
    }
  `
});

const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  material.uniforms.uTime.value = clock.getElapsedTime();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
