<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volumetric Clouds Raymarching</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            uniform vec2 uResolution;
            varying vec2 vUv;

            // Pseudo-random hash
            float hash(vec3 p) {
                p = fract(p * 0.1031);
                p += dot(p, p.yzx + 33.33);
                return fract((p.x + p.y) * p.z);
            }

            // Value Noise
            float valueNoise(vec3 p) {
                vec3 i = floor(p);
                vec3 f = fract(p);
                f = f * f * (3.0 - 2.0 * f);

                return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                               mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                           mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                               mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
            }

            // 4-Octave FBM
            float fbm(vec3 p) {
                float v = 0.0;
                float amp = 0.5;
                for (int i = 0; i < 4; i++) {
                    v += amp * valueNoise(p);
                    p *= 2.02;
                    amp *= 0.5;
                }
                return v;
            }

            // Density function
            float getDensity(vec3 p) {
                // Drift logic
                vec3 drift = vec3(uTime * 0.1, 0.0, uTime * 0.05);
                float d = fbm(p + drift);
                // Thresholding to create cloud shapes
                return smoothstep(0.4, 0.7, d);
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / min(uResolution.y, uResolution.x);
                
                // Camera setup
                vec3 ro = vec3(0.0, 1.0, 5.0); // Ray origin
                vec3 rd = normalize(vec3(uv, -1.5)); // Ray direction

                // Sun setup
                vec3 sunDir = normalize(vec3(0.5, 0.7, -0.5));
                vec3 skyColor = mix(vec3(0.4, 0.6, 0.9), vec3(0.1, 0.2, 0.5), uv.y + 0.5);
                vec3 sunColor = vec3(1.0, 0.9, 0.7);

                // Background sky
                vec3 color = skyColor;

                // Raymarching params
                const int steps = 64;
                float stepSize = 0.2;
                float transmittance = 1.0;
                vec3 lightEnergy = vec3(0.0);

                // Cloud plane height range
                float cloudMinY = -1.0;
                float cloudMaxY = 2.5;

                for (int i = 0; i < steps; i++) {
                    vec3 p = ro + rd * float(i) * stepSize;
                    
                    // Only sample if within height bounds to optimize/focus
                    if (p.y > cloudMinY && p.y < cloudMaxY) {
                        float d = getDensity(p);

                        if (d > 0.01) {
                            // Self-shadowing: sample towards sun
                            float shadowDist = 0.0;
                            float shadowStep = 0.25;
                            float shadowDensity = 0.0;
                            for (int j = 1; j < 6; j++) {
                                vec3 sp = p + sunDir * float(j) * shadowStep;
                                shadowDensity += getDensity(sp);
                            }
                            float shadow = exp(-shadowDensity * 0.5);

                            // Lighting integration (Beer-Lambert approximation)
                            float absorption = d * stepSize;
                            vec3 scattering = sunColor * shadow * d;
                            
                            lightEnergy += transmittance * scattering * 0.4;
                            transmittance *= exp(-absorption * 1.5);
                        }
                    }

                    if (transmittance < 0.01) break;
                }

                color = mix(color, lightEnergy, 1.0 - transmittance);
                // Add sun disk
                float sunDisk = pow(max(dot(rd, sunDir), 0.0), 512.0);
                color += sunColor * sunDisk * 0.8;

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const uniforms = {
            uTime: { value: 0 },
            uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        function animate(time) {
            uniforms.uTime.value = time * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
