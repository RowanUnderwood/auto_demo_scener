<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SYNAPTIC GARDEN</title>
<style>
*{margin:0;padding:0}
body{overflow:hidden;background:#000}
canvas{display:block}
#ui{position:fixed;top:18px;width:100%;text-align:center;font-family:'Courier New',monospace;color:rgba(180,255,220,0.25);font-size:11px;letter-spacing:10px;pointer-events:none;text-transform:uppercase}
</style>
</head>
<body>
<div id="ui">synaptic garden // procedural bioluminescence</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x000508,0.018);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000508);
document.body.appendChild(renderer.domElement);

const garden=new THREE.Group();
scene.add(garden);

const leafMats=[];
const branchMats=[];
const leafMeshes=[];

function hslColor(h,s,l){return new THREE.Color().setHSL(h%1,s,l)}

function createBranch(origin,dir,length,thickness,depth,maxDepth){
if(depth>maxDepth)return;
const geo=new THREE.CylinderGeometry(thickness*0.5,thickness,length,6,1);
const mat=new THREE.MeshBasicMaterial({color:0x00ff88,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending});
const mesh=new THREE.Mesh(geo,mat);
const mid=origin.clone().add(dir.clone().multiplyScalar(length*0.5));
mesh.position.copy(mid);
mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
garden.add(mesh);
branchMats.push({mat,baseH:0.35+depth*0.08,dist:origin.length()});

const tip=origin.clone().add(dir.clone().multiplyScalar(length));

if(depth===maxDepth){
const shapes=[new THREE.IcosahedronGeometry(thickness*2,0),new THREE.OctahedronGeometry(thickness*1.8,0),new THREE.TetrahedronGeometry(thickness*2.2,0)];
const sg=shapes[depth%shapes.length];
const sm=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,wireframe:true});
const leaf=new THREE.Mesh(sg,sm);
leaf.position.copy(tip);
garden.add(leaf);
leafMats.push({mat:sm,phase:Math.random()*Math.PI*2,dist:tip.length()});
leafMeshes.push({mesh:leaf,phase:Math.random()*Math.PI*2,speed:1+Math.random()*3});

const sg2=shapes[(depth+1)%shapes.length].clone();
const sm2=new THREE.MeshBasicMaterial({color:0x00ffaa,transparent:true,opacity:0.4,blending:THREE.AdditiveBlending});
const leaf2=new THREE.Mesh(sg2,sm2);
leaf2.position.copy(tip);
leaf2.scale.setScalar(0.5);
garden.add(leaf2);
leafMats.push({mat:sm2,phase:Math.random()*Math.PI*2,dist:tip.length()});
leafMeshes.push({mesh:leaf2,phase:Math.random()*Math.PI*2,speed:2+Math.random()*4});
}

const branches=depth===0?5:2+Math.floor(Math.random()*2);
for(let i=0;i<branches;i++){
const angle=(i/branches)*Math.PI*2+Math.random()*0.5;
const spread=0.4+Math.random()*0.5;
const newDir=dir.clone();
newDir.x+=Math.cos(angle)*spread;
newDir.y+=Math.sin(angle)*spread*0.5;
newDir.z+=Math.sin(angle+1)*spread;
newDir.normalize();
const newLen=length*(0.55+Math.random()*0.2);
const newThick=thickness*0.6;
createBranch(tip,newDir,newLen,newThick,depth+1,maxDepth);
}
}

createBranch(new THREE.Vector3(0,0,0),new THREE.Vector3(0,1,0),4,0.6,0,4);
createBranch(new THREE.Vector3(0,0,0),new THREE.Vector3(0,1,0),3.5,0.5,0,4);
createBranch(new THREE.Vector3(0,0,0),new THREE.Vector3(0.3,1,-0.2),3,0.45,0,4);

// Ground
const groundGeo=new THREE.PlaneGeometry(200,200);
const groundMat=new THREE.MeshBasicMaterial({color:0x000a08,transparent:true,opacity:0.8});
const ground=new THREE.Mesh(groundGeo,groundMat);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.5;
scene.add(ground);

// Grid
const gridHelper=new THREE.GridHelper(100,50,0x003322,0x001a11);
gridHelper.position.y=-0.49;
gridHelper.material.transparent=true;
gridHelper.material.opacity=0.3;
scene.add(gridHelper);

// Particles
const pCount=1500;
const pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(pCount*3);
const pCol=new Float32Array(pCount*3);
const pData=[];
for(let i=0;i<pCount;i++){
const r=5+Math.random()*25;
const theta=Math.random()*Math.PI*2;
const phi=Math.random()*Math.PI;
pPos[i*3]=r*Math.sin(phi)*Math.cos(theta);
pPos[i*3+1]=Math.abs(r*Math.cos(phi))*0.5+1;
pPos[i*3+2]=r*Math.sin(phi)*Math.sin(theta);
pData.push({r,theta,phi,speed:0.1+Math.random()*0.3,phase:Math.random()*Math.PI*2,yOff:Math.random()*2});
const c=hslColor(0.3+Math.random()*0.3,1,0.5);
pCol[i*3]=c.r;pCol[i*3+1]=c.g;pCol[i*3+2]=c.b;
}
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const pMat=new THREE.PointsMaterial({size:0.08,vertexColors:true,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending,depthWrite:false});
const particles=new THREE.Points(pGeo,pMat);
scene.add(particles);

// Ring
const ringGeo=new THREE.TorusGeometry(6,0.05,8,100);
const ringMat=new THREE.MeshBasicMaterial({color:0x00ffcc,transparent:true,opacity:0.4,blending:THREE.AdditiveBlending});
const ring1=new THREE.Mesh(ringGeo,ringMat);
ring1.rotation.x=Math.PI/2;
ring1.position.y=0.1;
scene.add(ring1);
const ring2=new THREE.Mesh(ringGeo.clone(),ringMat.clone());
ring2.rotation.x=Math.PI/2;
ring2.rotation.z=0.3;
ring2.position.y=0.1;
ring2.scale.setScalar(1.3);
scene.add(ring2);

let time=0;
function animate(){
requestAnimationFrame(animate);
time+=0.008;

// Camera orbit
const camAngle=time*0.15;
const camR=18+Math.sin(time*0.3)*4;
camera.position.x=Math.cos(camAngle)*camR;
camera.position.z=Math.sin(camAngle)*camR;
camera.position.y=6+Math.sin(time*0.2)*2;
camera.lookAt(0,4,0);

// Color waves
const waveSpeed=time*2;
branchMats.forEach((b,i)=>{
const h=(0.3+b.baseH+b.dist*0.02-waveSpeed*0.1)%1;
const pulse=0.4+0.5*Math.sin(time*3-b.dist*0.5);
b.mat.color.setHSL(Math.abs(h),1,0.3+pulse*0.3);
b.mat.opacity=0.3+pulse*0.5;
});

leafMats.forEach((l,i)=>{
const h=(l.dist*0.03+l.phase*0.1-time)%1;
const pulse=0.5+0.5*Math.sin(time*4+l.phase);
l.mat.color.setHSL(Math.abs(h),0.9,0.4+pulse*0.4);
l.mat.opacity=0.3+pulse*0.6;
});

leafMeshes.forEach(l=>{
l.mesh.rotation.x+=l.speed*0.02;
l.mesh.rotation.y+=l.speed*0.015;
const s=1+0.3*Math.sin(time*2+l.phase);
l.mesh.scale.setScalar(s*(l.mesh===leafMeshes[0].mesh?1:0.5));
});

// Particles
const pos=pGeo.attributes.position.array;
for(let i=0;i<pCount;i++){
const d=pData[i];
d.theta+=d.speed*0.01;
pos[i*3]=d.r*Math.sin(d.phi+Math.sin(time+d.phase)*0.1)*Math.cos(d.theta);
pos[i*3+1]=Math.abs(d.r*Math.cos(d.phi))*0.4+d.yOff+Math.sin(time*2+d.phase)*0.5;
pos[i*3+2]=d.r*Math.sin(d.phi+Math.sin(time+d.phase)*0.1)*Math.sin(d.theta);
}
pGeo.attributes.position.needsUpdate=true;

// Rings
ring1.rotation.z=time*0.5;
ring2.rotation.z=-time*0.3;
const ringPulse=0.3+0.3*Math.sin(time*2);
ring1.material.opacity=ringPulse;
ring2.material.opacity=ringPulse*0.7;
ring1.scale.setScalar(1+0.1*Math.sin(time));
ring2.scale.setScalar(1.3+0.1*Math.sin(time+1));

// Garden breathe
const breathe=1+0.02*Math.sin(time*1.5);
garden.scale.set(breathe,breathe,breathe);
garden.rotation.y=time*0.05;

renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
