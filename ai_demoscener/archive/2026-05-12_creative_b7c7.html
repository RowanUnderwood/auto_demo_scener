<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS WEAVER</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const vertexShader = `
    varying vec2 vUv;
    varying float vDistortion;
    uniform float uTime;
    
    // Simplified noise function for stability
    float hash(float n) { return fract(sin(n) * 43758.5453123); }
    float noise(vec3 x) {
        vec3 p = floor(x);
        vec3 f = fract(x);
        f = f*f*(3.0-2.0*f);
        float n = p.x + p.y*57.0 + 113.0*p.z;
        return mix(mix(mix(hash(n+0.0), hash(n+1.0),f.x),
                   mix(hash(n+57.0), hash(n+58.0),f.x),f.y),
               mix(mix(hash(n+113.0), hash(n+114.0),f.x),
                   mix(hash(n+170.0), hash(n+171.0),f.x),f.y),f.z);
    }

    void main() {
        vUv = uv;
        vec3 pos = position;
        float n = noise(vec3(pos.x * 0.2, pos.y * 0.1, uTime * 0.5));
        float n2 = noise(vec3(pos.z * 0.2, pos.y * 0.2, uTime * 0.8));
        vDistortion = n + n2;
        
        float angle = uTime * 0.2 + length(pos.xy) * 0.1;
        pos.x += cos(angle) * vDistortion * 5.0;
        pos.y += sin(angle) * vDistortion * 5.0;
        pos.z += n * 4.0;

        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * mvPosition;
    }
`;

const fragmentShader = `
    varying vec2 vUv;
    varying float vDistortion;
    uniform float uTime;
    uniform vec3 uColorA;
    uniform vec3 uColorB;

    void main() {
        float intensity = smoothstep(-1.0, 1.0, vDistortion);
        vec3 color = mix(uColorA, uColorB, intensity * 0.5 + 0.5);
        color += sin(uTime + vDistortion * 5.0) * 0.2;
        gl_FragColor = vec4(color, 1.0);
    }
`;

class WeaverScene {
    constructor() {
        this.init();
        this.createObjects();
        this.animate();
    }

    init() {
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.camera.position.z = 60;

        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(this.renderer.domElement);

        // Use HalfFloatType for better Bloom results
        const renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
            type: THREE.HalfFloatType,
            format: THREE.RGBAFormat
        });

        this.composer = new EffectComposer(this.renderer, renderTarget);
        const renderPass = new RenderPass(this.scene, this.camera);
        this.composer.addPass(renderPass);

        this.bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        this.composer.addPass(this.bloomPass);

        window.addEventListener('resize', () => this.onResize());
    }

    createObjects() {
        const count = 100;
        const segments = 60;
        this.threads = [];

        for (let i = 0; i < count; i++) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(segments * 3);
            const uvs = new Float32Array(segments * 2);

            for (let j = 0; j < segments; j++) {
                const t = j / segments;
                const radius = 5 + Math.random() * 15;
                const angle = t * Math.PI * 6 + i * (Math.PI * 2 / count);
                
                positions[j * 3] = Math.cos(angle) * radius;
                positions[j * 3 + 1] = (t - 0.5) * 80;
                positions[j * 3 + 2] = Math.sin(angle) * radius;

                uvs[j * 2] = t;
                uvs[j * 2 + 1] = i / count;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uColorA: { value: new THREE.Color() },
                    uColorB: { value: new THREE.Color() }
                },
                vertexShader,
                fragmentShader,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            if (i % 2 === 0) {
                material.uniforms.uColorA.value.set(0x0088ff);
                material.uniforms.uColorB.value.set(0x00ffff);
            } else {
                material.uniforms.uColorA.value.set(0xff00aa);
                material.uniforms.uColorB.value.set(0xffffff);
            }

            const line = new THREE.Line(geometry, material);
            this.scene.add(line);
            this.threads.push({ line, material });
        }

        const coreGeom = new THREE.IcosahedronGeometry(2, 4);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.5 });
        this.core = new THREE.Mesh(coreGeom, coreMat);
        this.scene.add(this.core);
    }

    onResize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        this.camera.aspect = width / height;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(width, height);
        this.composer.setSize(width, height);
    }

    animate() {
        requestAnimationFrame(() => this.animate());
        const time = performance.now() * 0.001;

        this.threads.forEach((t) => {
            t.material.uniforms.uTime.value = time;
        });

        this.core.rotation.y += 0.01;
        this.core.rotation.z += 0.005;
        const coreScale = 1 + Math.sin(time * 2) * 0.3;
        this.core.scale.set(coreScale, coreScale, coreScale);

        this.camera.position.x = Math.sin(time * 0.2) * 50;
        this.camera.position.y = Math.cos(time * 0.15) * 20;
        this.camera.position.z = 70 + Math.sin(time * 0.3) * 20;
        this.camera.lookAt(0, 0, 0);

        this.composer.render();
    }
}

new WeaverScene();
</script>
</body>
</html>
