<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voronoi Flow</title>
<style>
  * { margin: 0; padding: 0; }
  body { overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const uniforms = {
  uTime: { value: 0.0 },
  uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
};

const vertexShader = `
  void main() {
    gl_Position = vec4(position, 1.0);
  }
`;

const fragmentShader = `
  uniform float uTime;
  uniform vec2 uResolution;

  void main() {
    vec2 uv = gl_FragCoord.xy / uResolution;

    // Perturb UV with sin/cos
    float freq = 4.0;
    float amp = 0.12;
    vec2 p = uv;
    p.x += sin(p.y * freq + uTime * 0.7) * amp;
    p.y += cos(p.x * freq + uTime * 0.5) * amp;

    vec3 color = vec3(0.0);

    // 3 layers of Voronoi-like accumulation
    for (int layer = 0; layer < 3; layer++) {
      float lf = float(layer);
      float layerScale = 1.8 + lf * 1.2;
      float layerSpeed = 0.25 + lf * 0.18;
      float layerPhase = lf * 2.094;

      vec2 sp = p * layerScale;

      float minD = 10.0;

      // 7 moving feature points
      for (int j = 0; j < 7; j++) {
        float fj = float(j);
        float a = fj * 0.897 + uTime * layerSpeed + layerPhase;
        float b = fj * 1.137 - uTime * layerSpeed * 0.7 + layerPhase;
        vec2 fp = vec2(
          cos(a) * 0.6 + sin(b * 0.8) * 0.2,
          sin(a * 0.9) * 0.6 + cos(b * 1.1) * 0.2
        );
        float d = length(sp - fp);
        minD = min(minD, d);
      }

      // pow(1 - d, 60) accumulation
      float glow = pow(clamp(1.0 - minD, 0.0, 1.0), 60.0);
      color += glow * (0.4 + 0.3 / (lf + 1.0));
    }

    // Tint blue-green
    color *= vec3(0.25, 0.95, 0.82);

    // Add a subtle ambient base
    color += vec3(0.02, 0.06, 0.07) * (1.0 - length(uv - 0.5) * 1.2);

    // Subtle vignette
    vec2 vuv = uv - 0.5;
    float vig = 1.0 - dot(vuv, vuv) * 1.1;
    color *= clamp(vig, 0.0, 1.0);

    gl_FragColor = vec4(color, 1.0);
  }
`;

const material = new THREE.ShaderMaterial({
  uniforms: uniforms,
  vertexShader: vertexShader,
  fragmentShader: fragmentShader
});

const geometry = new THREE.BufferGeometry();
const vertices = new Float32Array([-1, -1, 0, 1, -1, 0, -1, 1, 0, 1, 1, 0]);
const indices = [0, 1, 2, 2, 1, 3];
geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
geometry.setIndex(indices);

const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);
  renderer.setPixelRatio(window.devicePixelRatio);
  uniforms.uResolution.value.set(w * window.devicePixelRatio, h * window.devicePixelRatio);
});

// Set initial resolution with pixel ratio
uniforms.uResolution.value.set(
  window.innerWidth * window.devicePixelRatio,
  window.innerHeight * window.devicePixelRatio
);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  uniforms.uTime.value = clock.getElapsedTime();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
