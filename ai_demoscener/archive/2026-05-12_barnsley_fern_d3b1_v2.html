<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyssal Flora</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020810; }
        canvas { display: block; }
        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(100, 220, 255, 0.3);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="info">abyssal flora · move cursor</div>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020810, 0.012);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 22);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x020810);
    document.body.appendChild(renderer.domElement);

    // --- Barnsley Fern Generation ---
    const NUM_POINTS = 180000;
    const posArray = new Float32Array(NUM_POINTS * 3);
    const seedArray = new Float32Array(NUM_POINTS);

    function generateFern() {
        let x = 0, y = 0;
        for (let i = 0; i < NUM_POINTS; i++) {
            const r = Math.random();
            if (r < 0.01) {
                x = 0;
                y = 0.16 * y;
            } else if (r < 0.86) {
                const nx = 0.85 * x + 0.04 * y;
                const ny = -0.04 * x + 0.85 * y + 1.6;
                x = nx; y = ny;
            } else if (r < 0.94) {
                const nx = 0.2 * x - 0.26 * y;
                const ny = 0.23 * x + 0.22 * y + 1.6;
                x = nx; y = ny;
            } else {
                const nx = -0.15 * x + 0.28 * y;
                const ny = 0.26 * x + 0.24 * y + 0.4;
                x = nx; y = ny;
            }
            const idx = i * 3;
            posArray[idx] = x;
            posArray[idx + 1] = y - 5.5;
            posArray[idx + 2] = (Math.random() - 0.5) * 0.8;
            seedArray[i] = Math.random();
        }
    }
    generateFern();

    // --- Main Fern Shader ---
    const fernMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uMouse: { value: new THREE.Vector2(0, 0) },
            uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
        },
        vertexShader: `
            uniform float uTime;
            uniform vec2 uMouse;
            uniform float uPixelRatio;
            attribute float aSeed;
            varying float vHeight;
            varying float vSeed;

            void main() {
                vHeight = (position.y + 5.5) / 11.0;
                vSeed = aSeed;

                vec3 pos = position;

                // Underwater current - layered sine displacement
                float currentFreq = 0.4;
                float t = uTime * 0.6;
                float dx = sin(pos.y * currentFreq + t + aSeed * 6.28) * 0.15 * vHeight;
                dx += sin(pos.y * 0.8 - t * 0.7 + pos.x * 0.3) * 0.08 * vHeight;
                float dy = cos(pos.x * 0.5 + t * 0.5 + aSeed * 3.14) * 0.05;
                float dz = sin(pos.x * 0.7 + t * 0.3 + aSeed * 4.0) * 0.3 * vHeight;
                dz += cos(pos.y * 0.6 - t * 0.4) * 0.15;

                // Mouse influence
                dx += uMouse.x * 0.4 * vHeight;
                dy += uMouse.y * 0.2 * vHeight;

                pos.x += dx;
                pos.y += dy;
                pos.z += dz;

                // Breathing pulse
                float breathe = 1.0 + sin(uTime * 0.8) * 0.02;
                pos.xz *= breathe;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);

                // Point size varies with height and pulse
                float pulse = 0.8 + 0.4 * sin(uTime * 1.5 + aSeed * 6.28);
                float size = mix(1.2, 2.8, vHeight) * pulse * uPixelRatio;
                size *= (1.0 + 0.3 * sin(uTime * 2.0 + aSeed * 12.0));
                gl_PointSize = size * (18.0 / -mvPosition.z);

                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            varying float vHeight;
            varying float vSeed;

            void main() {
                float dist = length(gl_PointCoord - vec2(0.5));
                if (dist > 0.5) discard;

                // Bioluminescent color palette: deep indigo -> teal -> bright aqua
                vec3 deepColor = vec3(0.08, 0.02, 0.25);
                vec3 midColor = vec3(0.0, 0.6, 0.55);
                vec3 tipColor = vec3(0.4, 0.95, 1.0);
                vec3 accentColor = vec3(0.8, 0.2, 0.9);

                vec3 color;
                if (vHeight < 0.4) {
                    color = mix(deepColor, midColor, vHeight / 0.4);
                } else {
                    color = mix(midColor, tipColor, (vHeight - 0.4) / 0.6);
                }

                // Occasional magenta accent
                float accent = step(0.92, vSeed) * 0.5;
                color = mix(color, accentColor, accent);

                // Soft glow falloff
                float glow = 1.0 - smoothstep(0.0, 0.5, dist);
                glow *= glow;

                float alpha = glow * 0.7;
                gl_FragColor = vec4(color * (1.0 + glow * 0.5), alpha);
            }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const fernGeometry = new THREE.BufferGeometry();
    fernGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    fernGeometry.setAttribute('aSeed', new THREE.BufferAttribute(seedArray, 1));
    const fernPoints = new THREE.Points(fernGeometry, fernMaterial);
    fernPoints.position.set(0, -1, 0);
    scene.add(fernPoints);

    // --- Ambient Floating Particles ---
    const AMBIENT_COUNT = 2000;
    const ambPos = new Float32Array(AMBIENT_COUNT * 3);
    const ambSeed = new Float32Array(AMBIENT_COUNT);

    for (let i = 0; i < AMBIENT_COUNT; i++) {
        const idx = i * 3;
        const radius = 4 + Math.random() * 14;
        const theta = Math.random() * Math.PI * 2;
        const phi = (Math.random() - 0.5) * Math.PI;
        ambPos[idx] = radius * Math.cos(phi) * Math.cos(theta);
        ambPos[idx + 1] = radius * Math.sin(phi) * 0.6 - 1;
        ambPos[idx + 2] = radius * Math.cos(phi) * Math.sin(theta);
        ambSeed[i] = Math.random();
    }

    const ambMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
        },
        vertexShader: `
            uniform float uTime;
            uniform float uPixelRatio;
            attribute float aSeed;
            varying float vAlpha;

            void main() {
                vec3 pos = position;
                float t = uTime * 0.2;
                pos.x += sin(t + aSeed * 6.28) * 1.5;
                pos.y += cos(t * 0.7 + aSeed * 4.0) * 1.0;
                pos.z += sin(t * 0.5 + aSeed * 3.0) * 1.5;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                float size = (1.0 + sin(uTime * 1.0 + aSeed * 10.0) * 0.5) * uPixelRatio;
                gl_PointSize = size * (14.0 / -mvPosition.z);

                vAlpha = 0.3 + 0.3 * sin(uTime * 0.8 + aSeed * 6.28);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            varying float vAlpha;
            void main() {
                float dist = length(gl_PointCoord - vec2(0.5));
                if (dist > 0.5) discard;
                float glow = 1.0 - smoothstep(0.0, 0.5, dist);
                vec3 color = vec3(0.15, 0.5, 0.6);
                gl_FragColor = vec4(color, glow * vAlpha * 0.4);
            }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const ambGeometry = new THREE.BufferGeometry();
    ambGeometry.setAttribute('position', new THREE.BufferAttribute(ambPos, 3));
    ambGeometry.setAttribute('aSeed', new THREE.BufferAttribute(ambSeed, 1));
    const ambPoints = new THREE.Points(ambGeometry, ambMaterial);
    scene.add(ambPoints);

    // --- Mouse ---
    const mouse = new THREE.Vector2(0, 0);
    const mouseTarget = new THREE.Vector2(0, 0);
    window.addEventListener('mousemove', (e) => {
        mouseTarget.x = (e.clientX / window.innerWidth - 0.5) * 2;
        mouseTarget.y = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // --- Animate ---
    function animate(time) {
        requestAnimationFrame(animate);
        const t = time * 0.001;

        mouse.lerp(mouseTarget, 0.03);

        fernMaterial.uniforms.uTime.value = t;
        fernMaterial.uniforms.uMouse.value.copy(mouse);
        ambMaterial.uniforms.uTime.value = t;

        // Slow rotation
        fernPoints.rotation.y = Math.sin(t * 0.15) * 0.1 + mouse.x * 0.1;
        fernPoints.rotation.x = mouse.y * 0.05;

        // Subtle camera drift
        camera.position.x = Math.sin(t * 0.1) * 0.5 + mouse.x * 1.5;
        camera.position.y = Math.cos(t * 0.13) * 0.3 + mouse.y * 1.0;
        camera.lookAt(0, -1, 0);

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(animate);
</script>
</body>
</html>
