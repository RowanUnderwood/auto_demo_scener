<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Physics Spheres</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Constants
    const COUNT = 30;
    const BOX_SIZE = 10;
    const HALF_BOX = BOX_SIZE / 2;
    const RADIUS = 0.4;
    const GRAVITY = -9.8;
    const DAMPING = 0.95;
    const DT = 1/60;

    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 12, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.update();

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xffffff, 100);
    pointLight.position.set(5, 10, 5);
    scene.add(pointLight);

    // Bounding Box Wireframe
    const boxGeo = new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE);
    const edges = new THREE.EdgesGeometry(boxGeo);
    const wireframe = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
    scene.add(wireframe);

    // Sphere Data Structure
    const spheres = [];
    const sphereGeo = new THREE.SphereGeometry(RADIUS, 32, 32);

    for (let i = 0; i < COUNT; i++) {
        const color = new THREE.Color().setHSL(Math.random(), 0.7, 0.5);
        const material = new THREE.MeshPhongMaterial({ color: color, shininess: 100 });
        const mesh = new THREE.Mesh(sphereGeo, material);

        // Random position within bounds (accounting for radius)
        const pos = new THREE.Vector3(
            (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2) + (Math.random() > 0.5 ? HALF_BOX - RADIUS : -HALF_BOX + RADIUS),
            (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2) + (Math.random() > 0.5 ? HALF_BOX - RADIUS : -HALF_BOX + RADIUS),
            (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2) + (Math.random() > 0.5 ? HALF_BOX - RADIUS : -HALF_BOX + RADIUS)
        );
        // Simplified safe range logic:
        const safeRange = HALF_BOX - RADIUS;
        mesh.position.set(
            (Math.random() * 2 - 1) * safeRange,
            (Math.random() * 2 - 1) * safeRange,
            (Math.random() * 2 - 1) * safeRange
        );

        const velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 10,
            (Math.random() - 0.5) * 10,
            (Math.random() - 0.5) * 10
        );

        scene.add(mesh);
        spheres.push({ mesh, velocity });
    }

    // Animation Loop
    function animate() {
        requestAnimationFrame(animate);

        for (let i = 0; i < COUNT; i++) {
            const s = spheres[i];
            const p = s.mesh.position;
            const v = s.velocity;

            // Integrate Gravity
            v.y += GRAVITY * DT;

            // Integrate Velocity
            p.x += v.x * DT;
            p.y += v.y * DT;
            p.z += v.z * DT;

            // Collision Detection (X)
            if (p.x + RADIUS > HALF_BOX) {
                p.x = HALF_BOX - RADIUS;
                v.x *= -DAMPING;
            } else if (p.x - RADIUS < -HALF_BOX) {
                p.x = -HALF_BOX + RADIUS;
                v.x *= -DAMPING;
            }

            // Collision Detection (Y)
            if (p.y + RADIUS > HALF_BOX) {
                p.y = HALF_BOX - RADIUS;
                v.y *= -DAMPING;
            } else if (p.y - RADIUS < -HALF_BOX) {
                p.y = -HALF_BOX + RADIUS;
                v.y *= -DAMPING;
            }

            // Collision Detection (Z)
            if (p.z + RADIUS > HALF_BOX) {
                p.z = HALF_BOX - RADIUS;
                v.z *= -DAMPING;
            } else if (p.z - RADIUS < -HALF_BOX) {
                p.z = -HALF_BOX + RADIUS;
                v.z *= -DAMPING;
            }
        }

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
