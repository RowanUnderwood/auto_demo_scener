<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shader Bars</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const uniforms = {
            u_time: { value: 0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float u_time;
                uniform vec2 u_resolution;
                varying vec2 vUv;

                vec3 getPalette(float t) {
                    // Blue -> Red -> Gold
                    vec3 blue = vec3(0.0, 0.4, 1.0);
                    vec3 red = vec3(1.0, 0.1, 0.2);
                    vec3 gold = vec3(1.0, 0.8, 0.2);

                    if (t < 0.5) {
                        return mix(blue, red, t * 2.0);
                    } else {
                        return mix(red, gold, (t - 0.5) * 2.0);
                    }
                }

                void main() {
                    vec3 finalColor = vec3(0.02, 0.01, 0.05); // Dark background
                    float phase = 0.785; // PI / 4 approx

                    for (int i = 0; i < 8; i++) {
                        float fi = float(i);
                        
                        // Formula from prompt: sin(time + i*phase)*0.4 + 0.5
                        float y_pos = sin(u_time + fi * phase) * 0.4 + 0.5;
                        
                        // Distance from current Y to bar center
                        float dist = abs(vUv.y - y_pos);
                        
                        // Smoothstep falloff (width of the bar is roughly 0.15)
                        float strength = smoothstep(0.15, 0.0, dist);

                        if (strength > 0.0) {
                            // Color mapping based on index i for variety
                            vec3 baseColor = getPalette(fi / 7.0);
                            
                            // Add a horizontal gradient sweep to each bar
                            vec3 grad = mix(baseColor * 0.5, baseColor, vUv.x);
                            
                            finalColor += strength * grad;
                        }
                    }

                    // Subtle vignette
                    float vignette = smoothstep(1.2, 0.4, length(vUv - 0.5));
                    finalColor *= vignette;

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        function animate(time) {
            uniforms.u_time.value = time * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
