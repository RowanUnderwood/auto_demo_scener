<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Neural Bloom</title>
<style>
*{margin:0;padding:0;overflow:hidden}
body{background:#000}
canvas{display:block}
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020208);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 80;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.5, 0.4, 0.85
);
bloomPass.threshold = 0.1;
bloomPass.strength = 2.0;
bloomPass.radius = 0.8;
composer.addPass(bloomPass);

const neuronCount = 200;
const neurons = new Float32Array(neuronCount * 3);
const neuronColors = new Float32Array(neuronCount * 3);
const neuronSizes = new Float32Array(neuronCount);
const velocities = [];
const hueBase = [];

const spread = 50;
for (let i = 0; i < neuronCount; i++) {
  neurons[i * 3] = (Math.random() - 0.5) * spread * 2;
  neurons[i * 3 + 1] = (Math.random() - 0.5) * spread * 2;
  neurons[i * 3 + 2] = (Math.random() - 0.5) * spread;
  velocities.push(new THREE.Vector3(
    (Math.random() - 0.5) * 0.02,
    (Math.random() - 0.5) * 0.02,
    (Math.random() - 0.5) * 0.01
  ));
  const h = Math.random();
  hueBase.push(h);
  const c = new THREE.Color().setHSL(h, 0.9, 0.6);
  neuronColors[i * 3] = c.r;
  neuronColors[i * 3 + 1] = c.g;
  neuronColors[i * 3 + 2] = c.b;
  neuronSizes[i] = 1.5 + Math.random() * 3;
}

const neuronGeo = new THREE.BufferGeometry();
neuronGeo.setAttribute('position', new THREE.BufferAttribute(neurons, 3));
neuronGeo.setAttribute('color', new THREE.BufferAttribute(neuronColors, 3));
neuronGeo.setAttribute('size', new THREE.BufferAttribute(neuronSizes, 1));

const neuronMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: `
    attribute float size;
    attribute vec3 color;
    varying vec3 vColor;
    varying float vAlpha;
    uniform float time;
    void main() {
      vColor = color;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      float pulse = 1.0 + 0.3 * sin(time * 2.0 + position.x * 0.5);
      gl_PointSize = size * pulse * (200.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
      vAlpha = 0.8 + 0.2 * sin(time + position.y);
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float glow = exp(-d * 6.0);
      gl_FragColor = vec4(vColor * glow * 2.0, glow * vAlpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const neuronPoints = new THREE.Points(neuronGeo, neuronMat);
scene.add(neuronPoints);

const maxDist = 20;
const connectionCount = neuronCount * 6;
const connPositions = new Float32Array(connectionCount * 2 * 3);
const connColors = new Float32Array(connectionCount * 2 * 3);
const connGeo = new THREE.BufferGeometry();
connGeo.setAttribute('position', new THREE.BufferAttribute(connPositions, 3));
connGeo.setAttribute('color', new THREE.BufferAttribute(connColors, 3));
const connMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.4,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const connections = new THREE.LineSegments(connGeo, connMat);
scene.add(connections);

function updateConnections() {
  let idx = 0;
  const posArr = neuronGeo.attributes.position.array;
  const colArr = neuronGeo.attributes.color.array;
  const maxLines = connectionCount;
  let linesUsed = 0;

  for (let i = 0; i < neuronCount && linesUsed < maxLines; i++) {
    for (let j = i + 1; j < neuronCount && linesUsed < maxLines; j++) {
      const dx = posArr[i*3] - posArr[j*3];
      const dy = posArr[i*3+1] - posArr[j*3+1];
      const dz = posArr[i*3+2] - posArr[j*3+2];
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (dist < maxDist) {
        connPositions[idx*6] = posArr[i*3];
        connPositions[idx*6+1] = posArr[i*3+1];
        connPositions[idx*6+2] = posArr[i*3+2];
        connPositions[idx*6+3] = posArr[j*3];
        connPositions[idx*6+4] = posArr[j*3+1];
        connPositions[idx*6+5] = posArr[j*3+2];

        const fade = 1.0 - dist / maxDist;
        connColors[idx*6] = colArr[i*3] * fade;
        connColors[idx*6+1] = colArr[i*3+1] * fade;
        connColors[idx*6+2] = colArr[i*3+2] * fade;
        connColors[idx*6+3] = colArr[j*3] * fade;
        connColors[idx*6+4] = colArr[j*3+1] * fade;
        connColors[idx*6+5] = colArr[j*3+2] * fade;

        idx++;
        linesUsed++;
      }
    }
  }
  connGeo.setDrawRange(0, idx * 2);
  connGeo.attributes.position.needsUpdate = true;
  connGeo.attributes.color.needsUpdate = true;
}

const pulseGeo = new THREE.SphereGeometry(0.5, 16, 16);
const pulseMat = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending
});
const pulses = [];

function spawnPulse() {
  const i = Math.floor(Math.random() * neuronCount);
  const posArr = neuronGeo.attributes.position.array;
  const colArr = neuronGeo.attributes.color.array;
  const mesh = new THREE.Mesh(pulseGeo, pulseMat.clone());
  mesh.position.set(posArr[i*3], posArr[i*3+1], posArr[i*3+2]);
  mesh.material.color.setRGB(colArr[i*3], colArr[i*3+1], colArr[i*3+2]);
  const speed = 0.3 + Math.random() * 0.5;
  const dir = new THREE.Vector3(
    (Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5)
  ).normalize().multiplyScalar(speed);
  scene.add(mesh);
  pulses.push({ mesh, dir, life: 1.0, decay: 0.005 + Math.random() * 0.01 });
}

function updatePulses() {
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.mesh.position.add(p.dir);
    p.life -= p.decay;
    p.mesh.scale.setScalar(1.0 + (1.0 - p.life) * 3.0);
    p.mesh.material.opacity = p.life * 0.8;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mesh.material.dispose();
      pulses.splice(i, 1);
    }
  }
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  const posArr = neuronGeo.attributes.position.array;
  const colArr = neuronGeo.attributes.color.array;

  for (let i = 0; i < neuronCount; i++) {
    posArr[i*3] += velocities[i].x + Math.sin(t * 0.5 + i) * 0.01;
    posArr[i*3+1] += velocities[i].y + Math.cos(t * 0.3 + i) * 0.01;
    posArr[i*3+2] += velocities[i].z;

    const h = hueBase[i] + t * 0.02;
    const c = new THREE.Color().setHSL(h % 1.0, 0.9, 0.55);
    colArr[i*3] = c.r;
    colArr[i*3+1] = c.g;
    colArr[i*3+2] = c.b;

    if (Math.abs(posArr[i*3]) > spread) velocities[i].x *= -1;
    if (Math.abs(posArr[i*3+1]) > spread) velocities[i].y *= -1;
    if (Math.abs(posArr[i*3+2]) > spread * 0.5) velocities[i].z *= -1;
  }

  neuronGeo.attributes.position.needsUpdate = true;
  neuronGeo.attributes.color.needsUpdate = true;
  neuronMat.uniforms.time.value = t;

  updateConnections();

  if (Math.random() < 0.08) spawnPulse();
  updatePulses();

  camera.position.x = Math.sin(t * 0.1) * 10;
  camera.position.y = Math.cos(t * 0.08) * 8;
  camera.lookAt(0, 0, 0);

  composer.render();
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
