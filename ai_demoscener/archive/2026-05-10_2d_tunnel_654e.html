<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polar Checker Shader</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec2 vUv;
                #define PI 3.14159265359

                void main() {
                    // Center UVs to [-0.5, 0.5]
                    vec2 uv = vUv - 0.5;
                    
                    // Convert to Polar: r = length, a = atan2
                    float r = length(uv);
                    float a = atan(uv.y, uv.x);

                    // Compute u and v as specified
                    // max() prevents division by zero at the very center
                    float u = (1.0 / max(r, 0.0001)) + uTime;
                    float v = a / PI;

                    // Procedural checker logic:
                    // step(0.5, fract(u*4)) XOR step(0.5, fract(v*8))
                    float checkU = step(0.5, fract(u * 4.0));
                    float checkV = step(0.5, fract(v * 8.0));
                    
                    // Logical XOR for float values (0 or 1) is equivalent to abs difference
                    float checker = abs(checkU - checkV);

                    // Darken by r so the center stays bright.
                    // Since r increases from 0 at center, (1.0 - r) provides attenuation.
                    float brightness = max(0.0, 1.0 - r);

                    gl_FragColor = vec4(vec3(checker * brightness), 1.0);
                }
            `
        });

        const quad = new THREE.Mesh(geometry, material);
        scene.add(quad);

        function animate(time) {
            material.uniforms.uTime.value = time * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
