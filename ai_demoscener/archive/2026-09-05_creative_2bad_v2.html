<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bioluminescent Bloom</title>
<style>
*{margin:0;padding:0;overflow:hidden;background:#050510}
canvas{display:block}
#info{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(180,220,255,0.5);font-family:'Courier New',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;pointer-events:none;text-align:center}
#title{position:fixed;top:28px;left:50%;transform:translateX(-50%);color:rgba(200,180,255,0.4);font-family:'Courier New',monospace;font-size:10px;letter-spacing:6px;text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>
<div id="title">BIOLUMINESCENT BLOOM</div>
<div id="info">move to attract · click to pulse</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const COUNT = 45000;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050510, 0.008);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 45);
const renderer = new THREE.WebGLRenderer({antialias:false, alpha:false});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x050510);
document.body.appendChild(renderer.domElement);

const geo = new THREE.BufferGeometry();
const positions = new Float32Array(COUNT * 3);
const aSeed = new Float32Array(COUNT * 4);
const aSize = new Float32Array(COUNT);

for (let i = 0; i < COUNT; i++) {
  aSeed[i*4]   = Math.random() * Math.PI * 2;
  aSeed[i*4+1] = Math.random() * 30 + 2;
  aSeed[i*4+2] = (Math.random() - 0.5) * 2;
  aSeed[i*4+3] = Math.random();
  aSize[i]     = Math.random() * 2.2 + 0.6;
}
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('aSeed', new THREE.BufferAttribute(aSeed, 4));
geo.setAttribute('aSize', new THREE.BufferAttribute(aSize, 1));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: {value: 0},
    uPulse: {value: 0},
    uMouse: {value: new THREE.Vector2(0, 0)},
    uPixelRatio: {value: Math.min(devicePixelRatio, 2)},
    uMorph: {value: 0}
  },
  vertexShader: `
    attribute vec4 aSeed;
    attribute float aSize;
    uniform float uTime;
    uniform float uPulse;
    uniform vec2 uMouse;
    uniform float uPixelRatio;
    uniform float uMorph;
    varying vec3 vColor;
    varying float vAlpha;

    vec3 palette(float t) {
      vec3 a = vec3(0.15, 0.05, 0.35);
      vec3 b = vec3(0.9, 0.4, 0.1);
      vec3 c = vec3(0.1, 0.8, 0.9);
      vec3 d = vec3(0.6, 0.1, 0.8);
      float s = sin(t * 6.28318 + uTime * 0.1);
      vec3 col = mix(a, b, smoothstep(0.0, 0.33, fract(t)));
      col = mix(col, c, smoothstep(0.33, 0.66, fract(t)));
      col = mix(col, d, smoothstep(0.66, 1.0, fract(t)));
      return col * (0.7 + 0.3 * s);
    }

    void main() {
      float angle = aSeed.x;
      float radius = aSeed.y;
      float vOffset = aSeed.z;
      float phase = aSeed.w;
      float t = uTime;

      float m1 = 4.0 + 2.0 * sin(t * 0.13 + phase);
      float m2 = 6.0 + 3.0 * cos(t * 0.09 + phase * 1.5);
      float breathe = 1.0 + 0.15 * sin(t * 0.4 + phase * 0.5);

      float r = radius * 0.3 * breathe;
      float petal = 1.0 + 0.4 * sin(m1 * angle + t * 0.3);
      r *= petal;

      float x = r * cos(angle + t * 0.15);
      float y = r * sin(angle + t * 0.15);
      float z = vOffset * 8.0 * (1.0 + 0.3 * sin(t * 0.2 + phase));

      float wobble = sin(angle * 3.0 + t * 0.7 + phase * 4.0) * 0.8;
      x += wobble * 0.5;
      y += cos(angle * 2.0 + t * 0.5 + phase) * 0.6;
      z += sin(t * 0.3 + angle * 5.0) * 1.2;

      float twist = t * 0.2 + radius * 0.04;
      float cx = x * cos(twist) - y * sin(twist);
      float cy = x * sin(twist) + y * cos(twist);

      float dist = length(vec3(cx, cy, z));
      float ripple = sin(dist * 0.5 - uPulse * 8.0) * uPulse * 3.0;
      float rippleMask = smoothstep(0.0, 2.0, dist - uPulse * 12.0) * smoothstep(15.0, 8.0, dist - uPulse * 12.0);
      vec3 dir = normalize(vec3(cx, cy, z) + vec3(0.001));
      cx += dir.x * ripple * rippleMask;
      cy += dir.y * ripple * rippleMask;
      z  += dir.z * ripple * rippleMask;

      float mDist = length(vec2(cx - uMouse.x * 15.0, cy - uMouse.y * 15.0));
      float mForce = 2.0 / (1.0 + mDist * 0.1);
      cx += (uMouse.x * 15.0 - cx) * mForce * 0.15;
      cy += (uMouse.y * 15.0 - cy) * mForce * 0.15;

      vec3 pos = vec3(cx, cy, z);

      float colorT = fract(dist * 0.04 + angle / 6.28318 + t * 0.05 + phase * 0.3);
      vColor = palette(colorT);
      vColor *= 0.8 + 0.4 * sin(t * 0.5 + phase * 6.0);
      vColor += vec3(0.1, 0.2, 0.4) * uPulse * rippleMask;

      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPosition;

      float dist2 = length(mvPosition.xyz);
      float fade = 1.0 - smoothstep(15.0, 80.0, dist2);
      vAlpha = fade * (0.6 + 0.4 * sin(phase * 12.0 + t));
      gl_PointSize = aSize * uPixelRatio * (80.0 / dist2) * (1.0 + uPulse * 0.8);
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;

    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if (d > 0.5) discard;
      float glow = 1.0 - d * 2.0;
      glow = pow(glow, 2.0);
      float core = smoothstep(0.15, 0.0, d);
      vec3 col = vColor * glow + vec3(1.0, 0.95, 0.9) * core * 0.3;
      gl_FragColor = vec4(col, glow * vAlpha * 0.8);
    }
  `,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true
});

const points = new THREE.Points(geo, mat);
scene.add(points);

// Ambient dust
const dustGeo = new THREE.BufferGeometry();
const dustCount = 2000;
const dustPos = new Float32Array(dustCount * 3);
const dustCol = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPos[i*3]   = (Math.random() - 0.5) * 120;
  dustPos[i*3+1] = (Math.random() - 0.5) * 120;
  dustPos[i*3+2] = (Math.random() - 0.5) * 120;
  let b = Math.random() * 0.15 + 0.02;
  dustCol[i*3]   = b * 0.7;
  dustCol[i*3+1] = b * 0.8;
  dustCol[i*3+2] = b * 1.5;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCol, 3));
const dustMat = new THREE.PointsMaterial({size:0.15, vertexColors:true, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending, depthWrite:false});
scene.add(new THREE.Points(dustGeo, dustMat));

// Interaction
let pulseVal = 0;
let pulseTarget = 0;
let mouseX = 0, mouseY = 0;
let targetMouseX = 0, targetMouseY = 0;

document.addEventListener('click', () => {
  pulseTarget = 1;
});
document.addEventListener('keydown', e => {
  if (e.key === ' ') pulseTarget = 1;
});
document.addEventListener('mousemove', e => {
  targetMouseX = (e.clientX / innerWidth) * 2 - 1;
  targetMouseY = -((e.clientY / innerHeight) * 2 - 1);
});
document.addEventListener('touchmove', e => {
  if (e.touches.length > 0) {
    targetMouseX = (e.touches[0].clientX / innerWidth) * 2 - 1;
    targetMouseY = -((e.touches[0].clientY / innerHeight) * 2 - 1);
  }
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  mat.uniforms.uTime.value = t;

  pulseVal += (pulseTarget - pulseVal) * 0.04;
  if (pulseTarget === 1 && pulseVal > 0.92) pulseTarget = 0;
  mat.uniforms.uPulse.value = pulseVal;

  mouseX += (targetMouseX - mouseX) * 0.05;
  mouseY += (targetMouseY - mouseY) * 0.05;
  mat.uniforms.uMouse.value.set(mouseX, mouseY);

  const orbitR = 45;
  camera.position.x = Math.sin(t * 0.08) * orbitR * 0.3 + mouseX * 5;
  camera.position.y = Math.cos(t * 0.06) * orbitR * 0.2 + mouseY * 5;
  camera.position.z = orbitR * (0.9 + 0.1 * Math.sin(t * 0.1));
  camera.lookAt(0, 0, 0);

  dustGeo.rotateY(0.0004);
  dustGeo.rotateZ(0.0002);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
