<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0}
body{overflow:hidden;background:#000}
canvas{display:block}
#title{position:fixed;top:20px;width:100%;text-align:center;font-family:monospace;color:rgba(100,180,255,0.6);font-size:11px;letter-spacing:8px;pointer-events:none}
</style>
</head>
<body>
<div id="title">ENTROPY BLOOM</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000508, 0.015);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const COUNT = 4000;
const tetraGeo = new THREE.TetrahedronGeometry(0.055);
const tetraMat = new THREE.MeshBasicMaterial({
  transparent:true, opacity:0.85,
  blending:THREE.AdditiveBlending,
  depthWrite:false
});
const mesh = new THREE.InstancedMesh(tetraGeo, tetraMat, COUNT);
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(mesh);

const targets = new Float32Array(COUNT*3);
const scatter = new Float32Array(COUNT*3);
const phase = new Float32Array(COUNT);
const sBase = new Float32Array(COUNT);
const angleOffset = new Float32Array(COUNT);

for(let i=0;i<COUNT;i++){
  // Icosahedron-like shell (use 5 rings for structure)
  const ring = i % 5;
  const y = (ring - 2) * 0.7;
  const ringR = Math.sqrt(Math.max(0.01, 2.4 - y*y));
  const a = (Math.floor(i/5)/COUNT*5*6.2832) + ring*1.256;
  targets[i*3]   = Math.cos(a)*ringR;
  targets[i*3+1] = y;
  targets[i*3+2] = Math.sin(a)*ringR;

  // Scatter: galactic spiral
  const arm = i%3;
  const dist = 2.5 + Math.pow(Math.random(),0.7)*14;
  const spiralA = dist*0.55 + arm*2.094 + (Math.random()-0.5)*0.6;
  scatter[i*3]   = Math.cos(spiralA)*dist;
  scatter[i*3+1] = (Math.random()-0.5)*5*Math.exp(-dist*0.08) + Math.sin(spiralA*2)*0.5;
  scatter[i*3+2] = Math.sin(spiralA)*dist;

  phase[i] = Math.random()*6.2832;
  sBase[i] = 0.6 + Math.random()*1.2;
  angleOffset[i] = Math.atan2(targets[i*3+2], targets[i*3]);
}

// Background nebula particles
const nCount = 3000;
const nPos = new Float32Array(nCount*3);
const nCol = new Float32Array(nCount*3);
for(let i=0;i<nCount;i++){
  const r = 40+Math.random()*160;
  const th = Math.random()*6.2832;
  const ph = Math.acos(2*Math.random()-1);
  nPos[i*3]=r*Math.sin(ph)*Math.cos(th);
  nPos[i*3+1]=r*Math.sin(ph)*Math.sin(th);
  nPos[i*3+2]=r*Math.cos(ph);
  const v = 0.1+Math.random()*0.15;
  nCol[i*3]=v*0.3; nCol[i*3+1]=v*0.5; nCol[i*3+2]=v*0.9;
}
const nGeo = new THREE.BufferGeometry();
nGeo.setAttribute('position',new THREE.BufferAttribute(nPos,3));
nGeo.setAttribute('color',new THREE.BufferAttribute(nCol,3));
scene.add(new THREE.Points(nGeo,new THREE.PointsMaterial({size:0.3,vertexColors:true,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false})));

// Central energy core
const coreGeo = new THREE.SphereGeometry(0.4,32,32);
const coreMat = new THREE.ShaderMaterial({
  uniforms:{time:{value:0},entropy:{value:0}},
  vertexShader:`varying vec3 vNorm;varying vec3 vPos;
  void main(){vNorm=normalize(normalMatrix*normal);vPos=(modelViewMatrix*vec4(position,1.0)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`uniform float time;uniform float entropy;varying vec3 vNorm;varying vec3 vPos;
  void main(){
    float fresnel=pow(1.0-abs(dot(vNorm,normalize(-vPos))),2.0);
    vec3 c1=vec3(0.2,0.5,1.0);
    vec3 c2=vec3(1.0,0.3,0.1);
    vec3 col=mix(c1,c2,entropy)*fresnel*2.0;
    col+=vec3(0.1,0.2,0.5)*sin(time*3.0)*0.3;
    gl_FragColor=vec4(col,0.7+fresnel*0.3);
  }`,
  transparent:true,blending:THREE.AdditiveBlending,depthWrite:false
});
const core = new THREE.Mesh(coreGeo, coreMat);
scene.add(core);

// Light ring
const ringGeo = new THREE.TorusGeometry(3.5,0.02,8,128);
const ringMat = new THREE.MeshBasicMaterial({color:0x2266ff,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI/2;
scene.add(ring);

const dummy = new THREE.Object3D();
const clock = new THREE.Clock();
const colorAttr = new THREE.InstancedBufferAttribute(new Float32Array(COUNT*3), 3);
mesh.instanceColor = colorAttr;

function smoothstep(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x);}

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const cycle = (t%10)/10;

  let entropy;
  if(cycle<0.25) entropy=0;
  else if(cycle<0.45) entropy=smoothstep(0,1,(cycle-0.25)/0.2);
  else if(cycle<0.65) entropy=1;
  else entropy=1-smoothstep(0,1,(cycle-0.65)/0.35);

  const globalRot = t*0.15;
  const cY=Math.cos(globalRot),sY=Math.sin(globalRot);
  const cX=Math.cos(t*0.08),sX=Math.sin(t*0.08);

  coreMat.uniforms.time.value=t;
  coreMat.uniforms.entropy.value=entropy;
  core.scale.setScalar(1+Math.sin(t*2)*0.15*(1-entropy*0.6));
  ringMat.opacity = 0.2+0.15*Math.sin(t*1.5)*(1-entropy);
  ring.rotation.z = t*0.1;

  for(let i=0;i<COUNT;i++){
    const p=phase[i];
    // Staggered scatter based on angle
    const localE = smoothstep(0,1,entropy*1.5 - Math.abs(angleOffset[i]-globalRot)*0.15);
    const e = Math.min(1, Math.max(0, localE));

    // Rotated target
    let ox=targets[i*3],oy=targets[i*3+1],oz=targets[i*3+2];
    let rx=ox*cY-oz*sY, rz=ox*sY+oz*cY, ry=oy;
    let ry2=ry*cX-rz*sX, rz2=ry*sX+rz*cX;

    const wobble = Math.sin(t*2.5+p)*0.12*e;
    const px = rx*(1-e) + scatter[i*3]*e + wobble;
    const py = ry2*(1-e) + scatter[i*3+1]*e + Math.cos(t*2+p)*0.12*e;
    const pz = rz2*(1-e) + scatter[i*3+2]*e + Math.sin(t*1.7+p*1.3)*0.12*e;

    const s = sBase[i]*(1+e*2.5)*Math.max(0.3, 1-Math.abs(Math.sin(t*4+p))*0.3*e);
    dummy.position.set(px,py,pz);
    dummy.scale.setScalar(s);
    dummy.rotation.set(t*0.8+p, t*0.5+p*2.1, t*1.1+p*0.7);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);

    // Color: cyan -> green -> yellow -> orange -> red
    const hue = e;
    const flicker = 0.6+0.4*Math.sin(t*5+p*3);
    const r = (0.1+hue*0.9)*flicker;
    const g = (0.7-hue*0.4)*flicker;
    const b = (1.0-hue*0.85)*flicker;
    colorAttr.setXYZ(i, r, g, b);
  }

  mesh.instanceMatrix.needsUpdate = true;
  colorAttr.needsUpdate = true;

  // Camera
  const camA = t*0.08;
  const camR = 11+Math.sin(t*0.2)*2;
  camera.position.set(Math.sin(camA)*camR, 2.5+Math.sin(t*0.15)*1.5, Math.cos(camA)*camR);
  camera.lookAt(0,0,0);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
