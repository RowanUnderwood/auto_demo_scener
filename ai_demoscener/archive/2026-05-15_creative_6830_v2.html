<body>
    <div id="ui">ABYSSAL BLOOM &middot; DEPTH 4200M</div>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020810, 0.035);

        const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
        camera.position.set(0, 1, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.9;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;
        controls.minDistance = 3;
        controls.maxDistance = 15;

        const noiseGLSL = `
        vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
        vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
        vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
        vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
        float snoise(vec3 v){
            const vec2 C=vec2(1.0/6.0,1.0/3.0);
            const vec4 D=vec4(0.0,0.5,1.0,2.0);
            vec3 i=floor(v+dot(v,C.yyy));
            vec3 x0=v-i+dot(i,C.xxx);
            vec3 g=step(x0.yzx,x0.xyz);
            vec3 l=1.0-g;
            vec3 i1=min(g.xyz,l.zxy);
            vec3 i2=max(g.xyz,l.zxy);
            vec3 x1=x0-i1+C.xxx;
            vec3 x2=x0-i2+C.yyy;
            vec3 x3=x0-D.yyy;
            i=mod289(i);
            vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
            float n_=0.142857142857;
            vec3 ns=n_*D.wyz-D.xzx;
            vec4 j=p-49.0*floor(p*ns.z*ns.z);
            vec4 x_=floor(j*ns.z);
            vec4 y_=floor(j-7.0*x_);
            vec4 x=x_*ns.x+ns.yyyy;
            vec4 y=y_*ns.x+ns.yyyy;
            vec4 h=1.0-abs(x)-abs(y);
            vec4 b0=vec4(x.xy,y.xy);
            vec4 b1=vec4(x.zw,y.zw);
            vec4 s0=floor(b0)*2.0+1.0;
            vec4 s1=floor(b1)*2.0+1.0;
            vec4 sh=-step(h,vec4(0.0));
            vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
            vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
            vec3 p0=vec3(a0.xy,h.x);
            vec3 p1=vec3(a0.zw,h.y);
            vec3 p2=vec3(a1.xy,h.z);
            vec3 p3=vec3(a1.zw,h.w);
            vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
            p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
            vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
            m=m*m;
            return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
        }
        `;

        // --- Core: Breathing Organic Blob ---
        const coreGeo = new THREE.SphereGeometry(1.5, 128, 128);
        const coreMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColor1: { value: new THREE.Color(0xff6622) },
                uColor2: { value: new THREE.Color(0x22ffaa) },
                uColor3: { value: new THREE.Color(0xffaa00) }
            },
            vertexShader: `
                ${noiseGLSL}
                uniform float uTime;
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying float vNoise;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = position;
                    float n1 = snoise(position * 1.5 + uTime * 0.3) * 0.4;
                    float n2 = snoise(position * 3.0 + uTime * 0.5) * 0.15;
                    float n3 = snoise(position * 6.0 + uTime * 0.8) * 0.05;
                    float displacement = n1 + n2 + n3;
                    float breath = sin(uTime * 0.8) * 0.15;
                    vNoise = displacement;
                    vec3 newPos = position + normal * (displacement + breath);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec3 uColor1;
                uniform vec3 uColor2;
                uniform vec3 uColor3;
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying float vNoise;
                void main() {
                    float mix1 = vNoise * 2.0 + 0.5;
                    float mix2 = sin(vPosition.y * 2.0 + uTime * 0.5) * 0.5 + 0.5;
                    vec3 color = mix(uColor1, uColor2, mix1);
                    color = mix(color, uColor3, mix2 * 0.4);
                    float pulse = sin(uTime * 1.2 + vPosition.x * 3.0) * 0.3 + 0.7;
                    color *= pulse;
                    color += uColor2 * smoothstep(0.0, -0.3, vNoise) * 0.5;
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            side: THREE.DoubleSide
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        scene.add(core);

        // --- Outer Membrane: Fresnel Rim ---
        const membraneGeo = new THREE.SphereGeometry(2.5, 64, 64);
        const membraneMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColor: { value: new THREE.Color(0x00ffcc) }
            },
            vertexShader: `
                ${noiseGLSL}
                uniform float uTime;
                varying vec3 vNormal;
                varying vec3 vWorldPos;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    float n = snoise(position * 2.0 + uTime * 0.2) * 0.2;
                    vec3 newPos = position + normal * n;
                    vec4 worldPos = modelMatrix * vec4(newPos, 1.0);
                    vWorldPos = worldPos.xyz;
                    gl_Position = projectionMatrix * viewMatrix * worldPos;
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec3 uColor;
                varying vec3 vNormal;
                varying vec3 vWorldPos;
                void main() {
                    vec3 viewDir = normalize(cameraPosition - vWorldPos);
                    float fresnel = pow(1.0 - abs(dot(viewDir, vNormal)), 3.0);
                    float pulse = sin(uTime * 0.5 + vWorldPos.y * 2.0) * 0.3 + 0.7;
                    vec3 color = uColor * fresnel * pulse * 1.5;
                    float alpha = fresnel * 0.6;
                    gl_FragColor = vec4(color, alpha);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const membrane = new THREE.Mesh(membraneGeo, membraneMat);
        scene.add(membrane);

        // --- Tendrils ---

        const tendrils = [];
        for (let t = 0; t < tendrilCount; t++) {

                const y = baseY + f * (Math.random() - 0.5) * 3.0 + Math.sin(f * 3 + t * 2) * 0.5;
                const z = Math.sin(baseAngle) * (1.0 + f * 0.5) + Math.cos(f
