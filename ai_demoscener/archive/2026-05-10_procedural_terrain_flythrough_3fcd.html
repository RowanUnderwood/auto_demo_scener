<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Infinite Noise Terrain</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.05);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const width = 200;
    const height = 200;
    const segments = 256;
    const geometry = new THREE.PlaneGeometry(width, height, segments, segments);
    geometry.rotateX(-Math.PI / 2);

    const vertexShader = `
        varying float vZ;
        uniform float uTime;

        // Pseudo-random noise function
        float hash(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
        }

        float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = hash(i);
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        float fbm(vec2 p) {
            float v = 0.0;
            float amp = 0.5;
            for (int i = 0; i < 3; i++) {
                v += amp * noise(p);
                p *= 2.1;
                amp *= 0.5;
            }
            return v;
        }

        void main() {
            vec3 pos = position;
            // We use the world-space Z to offset the noise sampling to simulate movement
            // The geometry is rotated, so "forward" in scene is -Z. 
            // Plane's local Y becomes World Z after rotation.
            float sampleX = pos.x * 0.1;
            float sampleZ = (pos.z + uTime) * 0.1;
            
            pos.y -= fbm(vec2(sampleX, sampleZ)) * 5.0;
            vZ = pos.y;

            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    `;

    const fragmentShader = `
        varying float vZ;
        void main() {
            vec3 colorA = vec3(0.1, 0.5, 0.2); // Grass
            vec3 colorB = vec3(0.5, 0.4, 0.3); // Dirt
            vec3 color = mix(colorA, colorB, smoothstep(-2.0, 1.0, vZ));
            gl_FragColor = vec4(color, 1.0);
        }
    `;

    const material = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        vertexShader,
        fragmentShader,
        side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    let time = 0;
    const speed = 0.1;

    function animate() {
        requestAnimationFrame(animate);
        
        time += speed;
        material.uniforms.uTime.value = time;

        // Move camera forward along -Z
        camera.position.z -= speed;
        
        // To keep the terrain "infinite", we move the mesh with the camera 
        // but offset its sampling so it feels seamless.
        // Actually, a simpler trick for infinite feeling is to loop the geometry or just let it fly.
        // Given instructions: "advance noise sample so terrain appears infinite"
        // We will keep the plane centered on the camera's X/Z movement.
        mesh.position.z = camera.position.z;
        mesh.position.x = camera.position.x;

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
