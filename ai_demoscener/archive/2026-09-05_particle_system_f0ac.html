<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Particle Fountain</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
const COUNT = 5000;
const GRAVITY = 9.8;
const KILL_Y = -10;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 3, 18);
camera.lookAt(0, 2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// --- Soft circular sprite via canvas ---
function makeSprite() {
  const size = 64;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,255,255,0.6)');
  g.addColorStop(0.6, 'rgba(255,255,255,0.15)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// --- Buffers ---
const positions = new Float32Array(COUNT * 3);
const colors = new Float32Array(COUNT * 3);
const velocities = new Float32Array(COUNT * 3);
const lifetimes = new Float32Array(COUNT);   // remaining seconds
const maxLifetimes = new Float32Array(COUNT);

function respawn(i) {
  const i3 = i * 3;
  positions[i3] = 0;
  positions[i3 + 1] = 0;
  positions[i3 + 2] = 0;

  // Random outward direction (uniform on sphere)
  const theta = Math.random() * Math.PI * 2;
  const u = Math.random() * 2 - 1;
  const s = Math.sqrt(1 - u * u);
  let dx = s * Math.cos(theta);
  let dy = u;
  let dz = s * Math.sin(theta);

  const speed = 6 + Math.random() * 8;
  velocities[i3] = dx * speed;
  velocities[i3 + 1] = dy * speed + 4 + Math.random() * 4; // slight upward bias
  velocities[i3 + 2] = dz * speed;

  maxLifetimes[i] = 2.5 + Math.random() * 2.5;
  lifetimes[i] = maxLifetimes[i];
}

for (let i = 0; i < COUNT; i++) {
  respawn(i);
  // Stagger initial lifetimes so the burst looks continuous
  lifetimes[i] = Math.random() * maxLifetimes[i];
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.35,
  map: makeSprite(),
  vertexColors: true,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
});

const points = new THREE.Points(geometry, material);
scene.add(points);

// Color ramp: hot (white/orange) -> mid (orange/red) -> cool (dark blue)
const cHot = new THREE.Color(1.0, 0.95, 0.85);
const cMid = new THREE.Color(1.0, 0.35, 0.08);
const cCool = new THREE.Color(0.15, 0.05, 0.45);
const tmp = new THREE.Color();

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  for (let i = 0; i < COUNT; i++) {
    const i3 = i * 3;

    positions[i3] += velocities[i3] * dt;
    positions[i3 + 1] += velocities[i3 + 1] * dt;
    positions[i3 + 2] += velocities[i3 + 2] * dt;
    velocities[i3 + 1] -= GRAVITY * dt;

    lifetimes[i] -= dt;
    if (positions[i3 + 1] < KILL_Y || lifetimes[i] <= 0) {
      respawn(i);
    }

    const t = Math.max(lifetimes[i] / maxLifetimes[i], 0); // 1 = fresh, 0 = dead
    if (t > 0.5) {
      tmp.lerpColors(cMid, cHot, (t - 0.5) * 2);
    } else {
      tmp.lerpColors(cCool, cMid, t * 2);
    }
    // Fade out near death for smoother look
    const fade = Math.min(t * 4, 1);
    colors[i3] = tmp.r * fade;
    colors[i3 + 1] = tmp.g * fade;
    colors[i3 + 2] = tmp.b * fade;
  }

  geometry.attributes.position.needsUpdate = true;
  geometry.attributes.color.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
