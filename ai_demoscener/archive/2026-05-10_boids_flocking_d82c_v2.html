<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Swarm - Neural Boids</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020205; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Configuration
    const COUNT = 600; // Higher count for swarm feel
    const BOUNDS = 25;
    const MAX_SPEED = 0.4;
    const MAX_FORCE = 0.015;
    
    const SEP_RADIUS = 1.8;
    const ALI_RADIUS = 4.5;
    const COH_RADIUS = 8.0;

    // Setup Scene
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020205, 0.015);
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(40, 30, 40);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lighting for "Glow" effect simulation
    const ambientLight = new THREE.AmbientLight(0x4040ff, 0.2);
    scene.add(ambientLight);
    
    const pointLight = new THREE.PointLight(0xff00ff, 500);
    pointLight.position.set(0, 20, 0);
    scene.add(pointLight);

    // Boid Data Structure
    const boids = [];
    const dummy = new THREE.Object3D();
    const colorArr = new Float32Array(COUNT * 3);

    for (let i = 0; i < COUNT; i++) {
        const pos = new THREE.Vector3(
            (Math.random() - 0.5) * BOUNDS * 2,
            (Math.random() - 0.5) * BOUNDS * 2,
            (Math.random() - 0.5) * BOUNDS * 2
        );
        const vel = new THREE.Vector3(
            Math.random() - 0.5,
            Math.random() - 0.5,
            Math.random() - 0.5
        ).normalize().multiplyScalar(MAX_SPEED);

        boids.push({
            pos: pos,
            vel: vel,
            acc: new THREE.Vector3(),
            hue: Math.random() * 0.2 + 0.5 // Blues to purples/cyans
        });

        // Set initial colors
        const color = new THREE.Color().setHSL(boids[i].hue, 1.0, 0.5);
        colorArr[i * 3] = color.r;
        colorArr[i * 3 + 1] = color.g;
        colorArr[i * 3 + 2] = color.b;
    }

    // Geometry: Instead of cones, using small elongated capsules/sparks for a "digital stream" feel
    const geometry = new THREE.CapsuleGeometry(0.05, 0.4, 4, 8);
    geometry.rotateX(Math.PI / 2); // Align with velocity vector

    const material = new THREE.MeshPhongMaterial({
        shininess: 100,
        specular: 0xffffff,
        vertexColors: true
    });

    const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
    instancedMesh.instanceColor = new THREE.InstancedBufferAttribute(colorArr, 3);
    scene.add(instancedMesh);

    // Background Grid/Atmosphere
    const grid = new THREE.GridHelper(100, 20, 0x222244, 0x111122);
    grid.position.y = -BOUNDS;
    scene.add(grid);

    function applyBoidRules() {
        for (let i = 0; i < COUNT; i++) {
            const bA = boids[i];
            bA.acc.set(0, 0, 0);

            let sepForce = new THREE.Vector3();
            let aliVel = new THREE.Vector3();
            let cohPos = new THREE.Vector3();
            
            let sepCount = 0;
            let aliCount = 0;
            let cohCount = 0;

            for (let j = 0; j < COUNT; j++) {
                if (i === j) continue;
                const bB = boids[j];
                const distSq = bA.pos.distanceToSquared(bB.pos);

                // Separation (using squared distance for speed)
                if (distSq > 0 && distSq < SEP_RADIUS * SEP_RADIUS) {
                    let diff = new THREE.Vector3().subVectors(bA.pos, bB.pos);
                    diff.divideScalar(Math.sqrt(distSq));
                    sepForce.add(diff);
                    sepCount++;
                }

                // Alignment
                if (distSq < ALI_RADIUS * ALI_RADIUS) {
                    aliVel.add(bB.vel);
                    aliCount++;
                }

                // Cohesion
                if (distSq < COH_RADIUS * COH_RADIUS) {
                    cohPos.add(bB.pos);
                    cohCount++;
                }
            }

            if (sepCount > 0) {
                sepForce.divideScalar(sepCount).normalize().multiplyScalar(MAX_SPEED);
                const steer = new THREE.Vector3().subVectors(sepForce, bA.vel);
                steer.clampLength(0, MAX_FORCE * 5);
                bA.acc.add(steer);
            }

            if (aliCount > 0) {
                aliVel.divideScalar(aliCount).normalize().multiplyScalar(MAX_SPEED);
                const steer = new THREE.Vector3().subVectors(aliVel, bA.vel);
                steer.clampLength(0, MAX_FORCE * 2);
                bA.acc.add(steer);
            }

            if (cohCount > 0) {
                cohPos.divideScalar(cohCount);
                const desired = new THREE.Vector3().subVectors(cohPos, bA.pos).setLength(MAX_SPEED);
                const steer = new THREE.Vector3().subVectors(desired, bA.vel);
                steer.clampLength(0, MAX_FORCE * 1.5);
                bA.acc.add(steer);
            }
        }
    }

    function update() {
        applyBoidRules();

        const time = performance.now() * 0.001;

        for (let i = 0; i < COUNT; i++) {
            const b = boids[i];

            b.vel.add(b.acc);
            b.vel.clampLength(0, MAX_SPEED);
            b.pos.add(b.vel);

            // Soft Boundary Wrap (toroidal)
            if (b.pos.x > BOUNDS) b.pos.x = -BOUNDS;
            if (b.pos.x < -BOUNDS) b.pos.x = BOUNDS;
            if (b.pos.y > BOUNDS) b.pos.y = -BOUNDS;
            if (b.pos.y < -BOUNDS) b.pos.y = BOUNDS;
            if (b.pos.z > BOUNDS) b.pos.z = -BOUNDS;
            if (b.pos.z < -BOUNDS) b.pos.z = BOUNDS;

            // Matrix Update
            dummy.position.copy(b.pos);
            const lookTarget = b.pos.clone().add(b.vel);
            dummy.lookAt(lookTarget);
            
            // Slight scale pulse based on velocity magnitude for organic feel
            const s = 0.5 + (b.vel.length() * 2.0);
            dummy.scale.set(s, s, s);
            
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(i, dummy.matrix);
        }
        instancedMesh.instanceMatrix.needsUpdate = true;

        // Subtle camera movement
        camera.position.x += Math.sin(time * 0.2) * 0.02;
    }

    function animate() {
        requestAnimationFrame(animate);
        update();
        controls.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
