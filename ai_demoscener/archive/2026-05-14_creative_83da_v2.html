<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINETIC_FLUX // NEON_VOID</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050508; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const vertexShader = `
        varying vec3 vColor;
        varying float vDistortion;
        uniform float uTime;
        uniform float uMorph;
        attribute vec3 targetPosition;
        attribute vec3 noiseOffset;
        attribute vec3 color;

        // High-frequency Noise
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
            const vec2 C = vec2(1.0/6.0, 1.0/3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod(i, 289.0);
            vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 1.0/7.0;
            vec3 ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ * ns.x + ns.yyyy;
            vec4 y = y_ * ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
            vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            return 42.0 * dot(m*m*m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
        }

        void main() {
            vec3 basePos = mix(position, targetPosition, uMorph);
            
            // Layered noise for organic "drift"
            float n1 = snoise(basePos * 0.4 + uTime * 0.3 + noiseOffset);
            float n2 = snoise(basePos * 1.2 - uTime * 0.5 + noiseOffset);
            float combinedNoise = (n1 * 0.7) + (n2 * 0.3);
            
            vDistortion = combinedNoise;
            vec3 pos = basePos + (combinedNoise * 0.6);

            // Spiral/Vortex influence
            float angle = atan(pos.x, pos.z);
            float radius = length(pos.xz);
            float swirl = sin(radius * 2.0 - uTime) * 0.15;
            pos.x += cos(angle + swirl) * 0.1;
            pos.z += sin(angle + swirl) * 0.1;

            vColor = color;
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            // Point size grows with distance and distortion
            gl_PointSize = (35.0 / -mvPosition.z) * (1.2 + combinedNoise);
            gl_Position = projectionMatrix * mvPosition;
        }
    `;

    const fragmentShader = `
        varying vec3 vColor;
        varying float vDistortion;

        void main() {
            float d = length(gl_PointCoord - vec2(0.5));
            if (d > 0.5) discard;
            
            // Sharp glowing core
            float strength = pow(1.0 - d * 2.0, 3.0);
            // Pulse color based on distortion
            vec3 glowColor = vColor + (vDistortion * 0.4);
            
            gl_FragColor = vec4(glowColor, strength * 0.8);
        }
    `;

    let scene, camera, renderer, points, material;
    const particleCount = 120000;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 7;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const targets = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const noiseOffsets = new Float32Array(particleCount * 3);

        // Electric/Neon Palette: Cyan, Hot Pink, Gold, Deep Blue
        const palette = [
            new THREE.Color(0x00f2ff), 
            new THREE.Color(0xff007a),
            new THREE.Color(0x7000ff),
            new THREE.Color(0xffd700)
        ];

        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;

            // Start: Chaos / Cloud
            positions[i3] = (Math.random() - 0.5) * 12;
            positions[i3 + 1] = (Math.random() - 0.5) * 12;
            positions[i3 + 2] = (Math.random() - 0.5) * 12;

            // End: Double Torus / Ring Structure
            const t = i / particleCount;
            const angle = t * Math.PI * 20; // Multi-layered rings
            const r1 = 3.0 + Math.sin(t * 50.0) * 0.5;
            const r2 = 1.0 + Math.cos(t * 30.0) * 0.3;
            
            targets[i3] = (r1 + r2 * Math.cos(angle)) * Math.cos(angle * 0.2);
            targets[i3 + 1] = r2 * Math.sin(angle);
            targets[i3 + 2] = (r1 + r2 * Math.cos(angle)) * Math.sin(angle * 0.2);

            const col = palette[Math.floor(Math.random() * palette.length)];
            colors[i3] = col.r;
            colors[i3+1] = col.g;
            colors[i3+2] = col.b;

            noiseOffsets[i3] = Math.random() * 100;
            noiseOffsets[i3+1] = Math.random() * 100;
            noiseOffsets[i3+2] = Math.random() * 100;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('targetPosition', new THREE.BufferAttribute(targets, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('noiseOffset', new THREE.BufferAttribute(noiseOffsets, 3));

        material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uMorph: { value: 0 }
            },
            vertexShader,
            fragmentShader,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        points = new THREE.Points(geometry, material);
        scene.add(points);

        window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        const time = performance.now() * 0.001;
        material.uniforms.uTime.value = time;

        // Morph between Cloud (0) and Rings (1) using a complex wave
        const morphBase = Math.sin(time * 0.3);
        const morph = (morphBase * 0.5 + 0.5);
        material.uniforms.uMorph.value = morph;

        points.rotation.y += 0.002;
        points.rotation.z += 0.001;

        // Subtle camera drift
        camera.position.x = Math.sin(time * 0.2) * 0.5;
        camera.position.y = Math.cos(time * 0.2) * 0.5;
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
    }

    init();
    animate();
</script>
</body>
</html>
