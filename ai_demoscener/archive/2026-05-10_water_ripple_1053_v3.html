<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; overflow: hidden; background: radial-gradient(circle at 50% 40%, #04151a 0%, #010609 70%, #000000 100%); }
        canvas { display: block; }
        #label {
            position: fixed; bottom: 22px; left: 0; right: 0; text-align: center;
            font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 6px;
            color: #3fd6c4; opacity: 0.55; pointer-events: none; user-select: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
<div id="label">abyssal core · v2</div>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const geometry = new THREE.IcosahedronGeometry(4, 96);

    const material = new THREE.MeshPhongMaterial({
        color: 0x0a2f33,
        emissive: 0x08231f,
        shininess: 90,
        specular: 0x66fff0
    });

    material.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = { value: 0 };
        shader.vertexShader = `
            uniform float uTime;
            varying float vGlow;
            ` + shader.vertexShader;
        shader.vertexShader = shader.vertexShader.replace(
            '#include <begin_vertex>',
            `
            vec3 transformed = vec3( position );
            float t = uTime * 0.6;

            float s1 = sin(transformed.x * 1.3 + t)          * 0.5;
            float s2 = sin(transformed.y * 2.1 - t * 1.3)    * 0.5;
            float s3 = cos(transformed.z * 3.7 + t * 0.8)    * 0.4;
            float ripple = sin(length(position) * 6.0 - t * 3.0) * 0.25;

            float disp = s1 + s2 + s3 + ripple;
            transformed *= 1.0 + disp * 0.18;
            transformed += normalize(position) * (sin(t * 2.0) * 0.06);

            vGlow = disp * 0.5 + 0.5;
            `
        );
        shader.fragmentShader = `
            varying float vGlow;
            ` + shader.fragmentShader;
        shader.fragmentShader = shader.fragmentShader.replace(
            '#include <emissivemap_fragment>',
            `
            #include <emissivemap_fragment>
            totalEmissiveRadiance += vec3(0.05, 0.85, 0.75) * vGlow * 0.6;
            `
        );
        material.userData.shader = shader;
    };

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // faint wireframe shell
    const wireGeo = new THREE.IcosahedronGeometry(5.4, 2);
    const wireMat = new THREE.MeshBasicMaterial({
        color: 0x1f8f83, wireframe: true, transparent: true, opacity: 0.12
    });
    const wire = new THREE.Mesh(wireGeo, wireMat);
    scene.add(wire);

    // drifting particles
    const pCount = 600;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount; i++) {
        const r = 8 + Math.random() * 14;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pPos[i*3]   = r * Math.sin(ph) * Math.cos(th);
        pPos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
        pPos[i*3+2] = r * Math.cos(ph);
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({
        color: 0x3fd6c4, size: 0.06, transparent: true, opacity: 0.6,
        blending: THREE.AdditiveBlending, depthWrite: false
    });
    const points = new THREE.Points(pGeo, pMat);
    scene.add(points);

    const dirLight1 = new THREE.DirectionalLight(0x5ffbe8, 1.4);
    dirLight1.position.set(4, 3, 5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xff5fd0, 0.9);
    dirLight2.position.set(-5, -2, -4);
    scene.add(dirLight2);

    const ambient = new THREE.AmbientLight(0x0a2a2c, 1.2);
    scene.add(ambient);

    camera.position.set(0, 0, 16);
    camera.lookAt(0, 0, 0);

    const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
    window.addEventListener('mousemove', (e) => {
        mouse.tx = (e.clientX / window.innerWidth - 0.5) * 2;
        mouse.ty = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();

        mesh.rotation.x += 0.0015;
        mesh.rotation.y += 0.0025;
        wire.rotation.x -= 0.0008;
        wire.rotation.y += 0.0012;
        points.rotation.y += 0.0004;

        mouse.x += (mouse.tx - mouse.x) * 0.04;
        mouse.y += (mouse.ty - mouse.y) * 0.04;
        camera.position.x = mouse.x * 3.5;
        camera.position.y = -mouse.y * 3.5;
        camera.lookAt(0, 0, 0);

        if (material.userData.shader) {
            material.userData.shader.uniforms.uTime.value = elapsedTime;
        }

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
