<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowing Curtains</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #00050a; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    // --- Shader Code ---
    const curtainVertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;

    const curtainFragmentShader = `
        uniform float uTime;
        varying vec2 vUv;

        // Simplex-style noise function for smooth flowing patterns
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

        float snoise(vec2 v) {
            const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
            vec2 i  = floor(v + dot(v, C.yy) );
            vec2 x0 = v -   i + dot(i, C.xx);
            vec2 i1;
            i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
            vec4 x12 = x0.xyxy + C.xxzz;
            x12.xy -= i1;
            i = mod289(i);
            vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
            vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
            m = m*m ;
            m = m*m ;
            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
            vec3 g;
            g.x  = a0.x  * x0.x  + h.x  * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
        }

        void main() {
            // Sideways scrolling noise logic
            float scroll = uTime * 0.4;
            
            // 2-Octave Noise for modulation
            float n1 = snoise(vec2(vUv.x * 2.0 + scroll, vUv.y * 1.5));
            float n2 = snoise(vec2(vUv.x * 4.0 + scroll * 1.5, vUv.y * 3.0));
            float combinedNoise = (n1 * 0.6) + (n2 * 0.4);

            // Create vertical bands using sine modulated by noise
            float bandFreq = 6.0;
            float wave = sin(vUv.x * bandFreq + combinedNoise * 5.0);
            float stripe = smoothstep(-0.2, 0.2, wave);

            // Color Gradient: Lime -> Teal -> Violet
            vec3 lime = vec3(0.4, 1.0, 0.1);
            vec3 teal = vec3(0.0, 0.9, 0.8);
            vec3 violet = vec3(0.3, 0.0, 0.6);

            vec3 gradient = mix(lime, teal, vUv.y);
            gradient = mix(gradient, violet, pow(vUv.y, 2.5));

            // Apply bands
            vec3 color = gradient * stripe;

            // Occasional pink flares
            float flareNoise = snoise(vec2(scroll * 0.5, vUv.y * 2.0 + uTime * 0.2));
            if (flareNoise > 0.6) {
                float flareMask = smoothstep(0.6, 1.0, flareNoise);
                color += vec3(1.0, 0.2, 0.7) * flareMask * stripe;
            }

            // Add some brightness/glow based on the noise
            color *= (0.8 + combinedNoise * 0.4);

            gl_FragColor = vec4(color, 0.7); // Alpha for additive blending interaction
        }
    `;

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x00050a);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- Starry Sky ---
    const starCount = 4000;
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) {
        starPositions[i] = (Math.random() - 0.5) * 150;
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.07, transparent: true, opacity: 0.8 });
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // --- Jagged Mountains (Silhouette) ---
    function createMountains() {
        const geometry = new THREE.PlaneGeometry(100, 20, 64, 1);
        const pos = geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            // Move vertices in Z to create peaks, but keep them on a flat-ish plane
            let x = pos.getX(i);
            // Use noise or math to create jaggedness
            let z = Math.sin(x * 0.2) * 1.5 + Math.sin(x * 0.5) * 0.5;
            // Make it a silhouette by pushing "up" (in our case, Z is depth, so we manipulate Y/Z)
            // Let's treat X as width and Y as vertical for the plane, but rotate it to horizon.
            pos.setZ(i, z); 
        }
        geometry.computeVertexNormals();
        const material = new THREE.MeshBasicMaterial({ color: 0x000205, side: THREE.DoubleSide });
        const mountains = new THREE.Mesh(geometry, material);
        mountains.rotation.x = -Math.PI / 2;
        mountains.position.y = -4; // Place at bottom horizon
        mountains.position.z = -10;
        scene.add(mountains);
    }
    createMountains();

    // --- Curtains ---
    const curtains = [];
    const curtainCount = 6;
    const material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 }
        },
        vertexShader: curtainVertexShader,
        fragmentShader: curtainFragmentShader,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
    });

    for (let i = 0; i < curtainCount; i++) {
        const geo = new THREE.PlaneGeometry(6, 15);
        const mesh = new THREE.Mesh(geo, material);
        
        // Varying depth and position
        mesh.position.z = -i * 2.5 + 2;
        mesh.position.x = (Math.random() - 0.5) * 4;
        mesh.position.y = 0;
        
        scene.add(mesh);
        curtains.push(mesh);
    }

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();

        material.uniforms.uTime.value = elapsedTime;

        // Subtle camera movement
        camera.position.x += (Math.sin(elapsedTime * 0.3) * 0.2 - camera.position.x) * 0.05;
        camera.lookAt(0, 0, -10);

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
