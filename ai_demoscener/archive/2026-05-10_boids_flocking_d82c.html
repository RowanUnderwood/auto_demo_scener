<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Boids Instanced</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const COUNT = 200;
    const BOUNDS = 15;
    const MAX_SPEED = 0.15;
    const MAX_FORCE = 0.01;
    
    // Boid Rule Radii
    const SEP_RADIUS = 1.0;
    const ALI_RADIUS = 3.0;
    const COH_RADIUS = 5.0;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(25, 25, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    
    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xffffff, 100);
    pointLight.position.set(10, 20, 10);
    scene.add(pointLight);

    // Visualizing the Cube Bounds
    const boxGeom = new THREE.BoxGeometry(BOUNDS * 2, BOUNDS * 2, BOUNDS * 2);
    const edges = new THREE.EdgesGeometry(boxGeom);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x444444 }));
    scene.add(line);

    // Boids Data
    const positions = new Float32Array(COUNT * 3);
    const velocities = new Float32Array(COUNT * 3);
    const boidData = [];

    for (let i = 0; i < COUNT; i++) {
        const pos = new THREE.Vector3(
            (Math.random() - 0.5) * BOUNDS * 1.8,
            (Math.random() - 0.5) * BOUNDS * 1.8,
            (Math.random() - 0.5) * BOUNDS * 1.8
        );
        const vel = new THREE.Vector3(
            (Math.random() - 0.5),
            (Math.random() - 0.5),
            (Math.random() - 0.5)
        ).normalize().multiplyScalar(MAX_SPEED);

        positions[i * 3] = pos.x;
        positions[i * 3 + 1] = pos.y;
        positions[i * 3 + 2] = pos.z;
        velocities[i * 3] = vel.x;
        velocities[i * 3 + 1] = vel.y;
        velocities[i * 3 + 2] = vel.z;

        boidData.push({
            pos: pos,
            vel: vel,
            acc: new THREE.Vector3()
        });
    }

    // Instanced Mesh
    const geometry = new THREE.ConeGeometry(0.2, 0.6, 8);
    // Rotate cone so tip points along +Y (standard) to align with velocity later
    geometry.rotateX(Math.PI / 2); 
    const material = new THREE.MeshStandardMaterial({ color: 0x00ffcc });
    const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
    scene.add(instancedMesh);

    const dummy = new THREE.Object3D();

    function applyRules() {
        for (let i = 0; i < COUNT; i++) {
            const boidA = boidData[i];
            boidA.acc.set(0, 0, 0);

            let sepForce = new THREE.Vector3();
            let aliVel = new THREE.Vector3();
            let cohPos = new THREE.Vector3();
            
            let sepCount = 0;
            let aliCount = 0;
            let cohCount = 0;

            for (let j = 0; j < COUNT; j++) {
                if (i === j) continue;
                const boidB = boidData[j];
                const dist = boidA.pos.distanceTo(boidB.pos);

                // Separation
                if (dist > 0 && dist < SEP_RADIUS) {
                    let diff = new THREE.Vector3().subVectors(boidA.pos, boidB.pos);
                    diff.divideScalar(dist); // Weight by distance
                    sepForce.add(diff);
                    sepCount++;
                }

                // Alignment
                if (dist < ALI_RADIUS) {
                    aliVel.add(boidB.vel);
                    aliCount++;
                }

                // Cohesion
                if (dist < COH_RADIUS) {
                    cohPos.add(boidB.pos);
                    cohCount++;
                }
            }

            if (sepCount > 0) {
                sepForce.divideScalar(sepCount);
                sepForce.multiplyScalar(MAX_SPEED);
                const steer = new THREE.Vector3().subVectors(sepForce, boidA.vel);
                steer.clampLength(0, MAX_FORCE * 2);
                boidA.acc.add(steer);
            }

            if (aliCount > 0) {
                aliVel.divideScalar(aliCount).normalize().multiplyScalar(MAX_SPEED);
                const steer = new THREE.Vector3().subVectors(aliVel, boidA.vel);
                steer.clampLength(0, MAX_FORCE * 2);
                boidA.acc.add(steer);
            }

            if (cohCount > 0) {
                cohPos.divideScalar(cohCount);
                const desired = new THREE.Vector3().subVectors(cohPos, boidA.pos).setLength(MAX_SPEED);
                const steer = new THREE.Vector3().subVectors(desired, boidA.vel);
                steer.clampLength(0, MAX_FORCE * 2);
                boidA.acc.add(steer);
            }
        }
    }

    function update() {
        applyRules();

        for (let i = 0; i < COUNT; i++) {
            const boid = boidData[i];

            // Integration
            boid.vel.add(boid.acc);
            boid.vel.clampLength(0, MAX_SPEED);
            boid.pos.add(boid.vel);

            // Wrap Cube
            if (boid.pos.x > BOUNDS) boid.pos.x = -BOUNDS;
            if (boid.pos.x < -BOUNDS) boid.pos.x = BOUNDS;
            if (boid.pos.y > BOUNDS) boid.pos.y = -BOUNDS;
            if (boid.pos.y < -BOUNDS) boid.pos.y = BOUNDS;
            if (boid.pos.z > BOUNDS) boid.pos.z = -BOUNDS;
            if (boid.pos.z < -BOUNDS) boid.pos.z = BOUNDS;

            // Update Instance Matrix
            dummy.position.copy(boid.pos);
            // Orient to velocity: Look at position + velocity
            const target = new THREE.Vector3().addVectors(boid.pos, boid.vel);
            dummy.lookAt(target);
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(i, dummy.matrix);
        }
        instancedMesh.instanceMatrix.needsUpdate = true;
    }

    function animate() {
        requestAnimationFrame(animate);
        update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
