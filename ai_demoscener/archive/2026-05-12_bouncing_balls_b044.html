<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Physics Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // Configuration
        const COUNT = 30;
        const BOX_SIZE = 10;
        const HALF_BOX = BOX_SIZE / 2;
        const GRAVITY = -9.8;
        const DAMPING = 0.85;
        const RADIUS = 0.4;

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 12, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Lights - Using high intensity to account for physically correct lighting in newer Three.js versions
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 100);
        pointLight.position.set(10, 15, 10);
        scene.add(pointLight);

        const directLight = new THREE.DirectionalLight(0xffffff, 2);
        directLight.position.set(-5, 10, 5);
        scene.add(directLight);

        // Bounding Box Wireframe
        const boxGeo = new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE);
        const edges = new THREE.EdgesGeometry(boxGeo);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
        scene.add(line);

        // Spheres Initialization
        const spheres = [];
        const sphereGeo = new THREE.SphereGeometry(RADIUS, 32, 32);

        for (let i = 0; i < COUNT; i++) {
            const color = new THREE.Color(`hsl(${Math.random() * 360}, 70%, 50%)`);
            // Using MeshStandardMaterial for better response to lights
            const material = new THREE.MeshStandardMaterial({ 
                color: color, 
                roughness: 0.2, 
                metalness: 0.5 
            });
            const mesh = new THREE.Mesh(sphereGeo, material);

            // Safe random position within the bounding box bounds
            mesh.position.x = (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2);
            mesh.position.y = (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2);
            mesh.position.z = (Math.random() - 0.5) * (BOX_SIZE - RADIUS * 2);

            const velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 10
            );

            scene.add(mesh);
            spheres.push({ mesh, velocity });
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            // Use a fixed timestep for physics stability or capped delta
            const dt = Math.min(clock.getDelta(), 0.03);

            spheres.forEach(obj => {
                // Apply Gravity
                obj.velocity.y += GRAVITY * dt;

                // Integrate Position
                obj.mesh.position.addScaledVector(obj.velocity, dt);

                const pos = obj.mesh.position;
                const vel = obj.velocity;

                // Collision Detection with Walls (X)
                if (pos.x + RADIUS > HALF_BOX) {
                    pos.x = HALF_BOX - RADIUS;
                    vel.x *= -DAMPING;
                } else if (pos.x - RADIUS < -HALF_BOX) {
                    pos.x = -HALF_BOX + RADIUS;
                    vel.x *= -DAMPING;
                }

                // Collision Detection with Walls (Y)
                if (pos.y + RADIUS > HALF_BOX) {
                    pos.y = HALF_BOX - RADIUS;
                    vel.y *= -DAMPING;
                } else if (pos.y - RADIUS < -HALF_BOX) {
                    pos.y = -HALF_BOX + RADIUS;
                    vel.y *= -DAMPING;
                }

                // Collision Detection with Walls (Z)
                if (pos.z + RADIUS > HALF_BOX) {
                    pos.z = HALF_BOX - RADIUS;
                    vel.z *= -DAMPING;
                } else if (pos.z - RADIUS < -HALF_BOX) {
                    pos.z = -HALF_BOX + RADIUS;
                    vel.z *= -DAMPING;
                }
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
