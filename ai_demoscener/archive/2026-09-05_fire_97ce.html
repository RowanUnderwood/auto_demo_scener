<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Plasma Fire</title>
<style>
* { margin: 0; padding: 0; }
body { overflow: hidden; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const vertexShader = `
void main() {
    gl_Position = vec4(position, 1.0);
}
`;

const fragmentShader = `
precision highp float;

uniform float uTime;
uniform vec2 uResolution;

float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
}

float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
    float value = 0.0;
    float amplitude = 0.5;
    for (int i = 0; i < 6; i++) {
        value += amplitude * noise(p);
        p *= 2.1;
        amplitude *= 0.5;
    }
    return value;
}

vec3 plasmaPalette(float t) {
    // Blue plasma / purple demon flame
    vec3 c0 = vec3(0.02, 0.0, 0.08);     // deep void purple
    vec3 c1 = vec3(0.15, 0.02, 0.45);    // rich purple
    vec3 c2 = vec3(0.0, 0.35, 0.95);     // electric blue
    vec3 c3 = vec3(0.2, 0.8, 1.0);       // cyan plasma
    vec3 c4 = vec3(0.9, 0.95, 1.0);      // white-hot

    if (t < 0.25) return mix(c0, c1, t / 0.25);
    if (t < 0.5) return mix(c1, c2, (t - 0.25) / 0.25);
    if (t < 0.75) return mix(c2, c3, (t - 0.5) / 0.25);
    return mix(c3, c4, (t - 0.75) / 0.25);
}

void main() {
    vec2 uv = gl_FragCoord.xy / uResolution;
    float aspect = uResolution.x / uResolution.y;
    vec2 p = uv;
    p.x *= aspect;

    float time = uTime;

    // Horizontal sway
    p.x += 0.05 * sin(time + uv.y * 10.0);

    // Domain warping
    float warpNoise = noise(p * 3.0 + vec2(0.0, time * 1.5));
    vec2 warped = p + 0.4 * vec2(warpNoise, noise(p * 3.0 + vec2(5.2, time * 1.5)));

    // FBM with animated offset
    float n = fbm(warped * 2.5 + vec2(0.0, -time * 0.8));

    // Secondary warp for extra organic detail
    float warp2 = fbm(warped * 4.0 + vec2(time * 0.3, -time * 1.2));
    n = mix(n, warp2, 0.35);

    // Vertical profile: dense at bottom, wisps at top
    float verticalProfile = smoothstep(1.0, 0.0, uv.y);
    verticalProfile = pow(verticalProfile, 1.5);

    // Shape the fire density
    float density = n * verticalProfile;
    density = smoothstep(0.15, 0.85, density);

    // Color through palette
    vec3 col = plasmaPalette(density);

    // Brighter glowing ember layer for density > 0.8 near the base
    float emberMask = smoothstep(0.8, 1.0, density) * smoothstep(0.35, 0.0, uv.y);
    vec3 emberColor = vec3(1.0, 0.95, 0.7) * 1.8;
    col = mix(col, emberColor, emberMask);

    // Add subtle inner glow for mid-density
    float glow = smoothstep(0.3, 0.7, density) * 0.3;
    col += vec3(0.1, 0.2, 0.5) * glow * verticalProfile;

    // Dark background
    vec3 bg = vec3(0.01, 0.0, 0.03);
    col = mix(bg, col, smoothstep(0.0, 0.1, density));

    // Subtle vignette
    float vig = 1.0 - 0.3 * length(uv - 0.5);
    col *= vig;

    gl_FragColor = vec4(col, 1.0);
}
`;

const material = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms: {
        uTime: { value: 0 },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    }
});

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.Float32BufferAttribute([-1,-1,0, 1,-1,0, 1,1,0, -1,1,0], 3));
geometry.setAttribute('uv', new THREE.Float32BufferAttribute([0,0, 1,0, 1,1, 0,1], 2));
geometry.setIndex([0,1,2, 0,2,3]);

const quad = new THREE.Mesh(geometry, material);
scene.add(quad);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

material.uniforms.uResolution.value.set(
    window.innerWidth * window.devicePixelRatio,
    window.innerHeight * window.devicePixelRatio
);

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    material.uniforms.uResolution.value.set(
        window.innerWidth * window.devicePixelRatio,
        window.innerHeight * window.devicePixelRatio
    );
});

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    material.uniforms.uTime.value = clock.getElapsedTime();
    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
