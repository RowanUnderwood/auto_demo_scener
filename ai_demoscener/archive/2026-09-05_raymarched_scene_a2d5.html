<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SDF Raymarch</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const uniforms = {
  uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
};

const vertexShader = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const fragmentShader = `
  precision highp float;
  uniform vec2 uResolution;
  varying vec2 vUv;

  float sdSphere(vec3 p, float r) {
    return length(p) - r;
  }

  float sdBox(vec3 p, vec3 b) {
    vec3 q = abs(p) - b;
    return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
  }

  float smin(float a, float b, float k) {
    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
    return mix(b, a, h) - k * h * (1.0 - h);
  }

  float map(vec3 p) {
    p = mod(p, 4.0) - 2.0;
    float s = sdSphere(p, 0.6);
    float b = sdBox(p, vec3(0.5));
    return smin(s, b, 0.3);
  }

  vec3 calcNormal(vec3 p) {
    const vec2 e = vec2(1.0, -1.0);
    const float eps = 0.001;
    return normalize(
      e.xyy * map(p + e.xyy * eps) +
      e.yxy * map(p + e.yxy * eps) +
      e.yyx * map(p + e.yyx * eps) -
      e.xyy * map(p - e.xyy * eps) -
      e.yxy * map(p - e.yxy * eps) -
      e.yyx * map(p - e.yyx * eps)
    );
  }

  void main() {
    float aspect = uResolution.x / uResolution.y;
    vec3 ro = vec3(0.0, 0.0, 5.0);
    vec3 rd = normalize(vec3((vUv - 0.5) * vec2(aspect, 1.0), -1.5));

    float t = 0.0;
    float hit = -1.0;

    for (int i = 0; i < 80; i++) {
      vec3 p = ro + rd * t;
      float d = map(p);
      if (d < 0.001) {
        hit = t;
        break;
      }
      t += d;
      if (t > 40.0) break;
    }

    vec3 col;

    if (hit >= 0.0 && hit <= 40.0) {
      vec3 p = ro + rd * hit;
      vec3 n = calcNormal(p);

      vec3 lightDir = normalize(vec3(-0.4, 1.0, 0.3));
      float diff = max(dot(n, lightDir), 0.0);

      vec3 navy = vec3(0.02, 0.03, 0.10);
      vec3 magenta = vec3(1.0, 0.05, 1.0);

      col = mix(navy, magenta, diff * diff);

      vec3 teal = vec3(0.0, 0.55, 0.55);
      col += teal * 0.12;

      float fogFactor = 1.0 - exp(-hit * 0.12);
      col = mix(col, navy, fogFactor);
    } else {
      col = vec3(0.02, 0.03, 0.10);
    }

    col = pow(col, vec3(0.9));
    gl_FragColor = vec4(col, 1.0);
  }
`;

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader
});

const geometry = new THREE.PlaneGeometry(2, 2);
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio || 1);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h);
  uniforms.uResolution.value.set(w * (window.devicePixelRatio || 1), h * (window.devicePixelRatio || 1));
});

uniforms.uResolution.value.set(
  window.innerWidth * (window.devicePixelRatio || 1),
  window.innerHeight * (window.devicePixelRatio || 1)
);

renderer.render(scene, camera);
</script>
</body>
</html>
