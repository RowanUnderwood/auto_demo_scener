<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neural Lattice Flux</title>
    <style>
        body { margin: 0; overflow: hidden; background: #02040a; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02040a, 0.15);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- Constants & Settings ---
    const PARTICLE_COUNT = 12000;
    const CONNECTION_DISTANCE = 1.5;
    const clock = new THREE.Clock();

    // --- Particle System ---
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const sizes = new Float32Array(PARTICLE_COUNT);
    
    // Physics state
    const velocities = new Float32Array(PARTICLE_COUNT * 3);

    const colorPalette = [
        new THREE.Color(0x4e00ff), // Deep Purple
        new THREE.Color(0x00f2ff), // Cyan
        new THREE.Color(0xff007a), // Magenta
        new THREE.Color(0xffffff)  // White
    ];

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        // Sphere distribution with noise
        const r = Math.random() * 5;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);

        positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = r * Math.cos(phi);

        velocities[i * 3]     = (Math.random() - 0.5) * 0.01;
        velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.01;
        velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.01;

        const col = colorPalette[Math.floor(Math.random() * colorPalette.length)];
        colors[i * 3]     = col.r;
        colors[i * 3 + 1] = col.g;
        colors[i * 3 + 2] = col.b;

        sizes[i] = Math.random() * 0.05;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const pointsMaterial = new THREE.ShaderMaterial({
        uniforms: {
            time: { value: 0 },
            uColor: { value: new THREE.Color(0x00f2ff) }
        },
        vertexShader: `
            attribute float size;
            attribute vec3 color;
            varying vec3 vColor;
            uniform float time;
            void main() {
                vColor = color;
                vec3 pos = position;
                // Subtle wave oscillation
                pos.y += sin(time * 0.5 + position.x) * 0.1;
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_PointSize = size * (300.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            varying vec3 vColor;
            void main() {
                float dist = distance(gl_PointCoord, vec2(0.5));
                if (dist > 0.5) discard;
                float alpha = smoothstep(0.5, 0.1, dist);
                gl_FragColor = vec4(vColor, alpha * 0.8);
            }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const particleSystem = new THREE.Points(geometry, pointsMaterial);
    scene.add(particleSystem);

    // --- Connection Lines (Dynamic Geometry) ---
    // We use a limited number of lines for performance to represent the "Lattice"
    const lineCount = 150;
    const lineGeometry = new THREE.BufferGeometry();
    const linePositions = new Float32Array(lineCount * 6); // 2 points per line (x,y,z, x,y,z)
    lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

    const lineMaterial = new THREE.LineBasicMaterial({
        color: 0x00f2ff,
        transparent: true,
        opacity: 0.2,
        blending: THREE.AdditiveBlending
    });

    const latticeLines = new THREE.LineSegments(lineGeometry, lineMaterial);
    scene.add(latticeLines);

    // --- Central Pulsar (The Core) ---
    const coreGroup = new THREE.Group();
    scene.add(coreGroup);

    const coreGeom = new THREE.IcosahedronGeometry(0.4, 2);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
    const coreMesh = new THREE.Mesh(coreGeom, coreMat);
    coreGroup.add(coreMesh);

    // --- Animation Loop ---
    function animate() {
        requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();
        pointsMaterial.uniforms.time.value = elapsed;

        // 1. Update Particle Physics
        const posAttr = geometry.attributes.position;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const idx = i * 3;
            
            // Brownian-ish motion + orbital drift
            posAttr.array[idx] += velocities[idx] + Math.sin(elapsed * 0.2 + i) * 0.001;
            posAttr.array[idx+1] += velocities[idx+1] + Math.cos(elapsed * 0.3 + i) * 0.001;
            posAttr.array[idx+2] += velocities[idx+2];

            // Containment field (spherical boundary)
            const x = posAttr.array[idx];
            const y = posAttr.array[idx+1];
            const z = posAttr.array[idx+2];
            const d = Math.sqrt(x*x + y*y + z*z);

            if (d > 6) {
                posAttr.array[idx] *= -0.9;
                posAttr.array[idx+1] *= -0.9;
                posAttr.array[idx+2] *= -0.9;
            }
        }
        posAttr.needsUpdate = true;

        // 2. Update Core Pulsar
        coreGroup.position.set(
            Math.sin(elapsed * 0.5) * 2,
            Math.cos(elapsed * 0.4) * 1.5,
            Math.sin(elapsed * 0.3) * 2
        );
        coreMesh.rotation.x += 0.01;
        coreMesh.scale.setScalar(1 + Math.sin(elapsed * 2) * 0.1);

        // 3. Update Lattice Connections (Linking core to particles)
        const lPosAttr = lineGeometry.attributes.position;
        for (let i = 0; i < lineCount; i++) {
            const pIdx = Math.floor(Math.random() * PARTICLE_COUNT);
            const startIdx = i * 6;
            
            // Line segment starts at core and goes to a random particle
            lPosAttr.array[startIdx]     = coreGroup.position.x;
            lPosAttr.array[startIdx + 1] = coreGroup.position.y;
            lPosAttr.array[startIdx + 2] = coreGroup.position.z;

            lPosAttr.array[startIdx + 3] = posAttr.array[pIdx * 3];
            lPosAttr.array[startIdx + 4] = posAttr.array[pIdx * 3 + 1];
            lPosAttr.array[startIdx + 5] = posAttr.array[pIdx * 3 + 2];
        }
        lPosAttr.needsUpdate = true;

        // 4. Camera Movement (Cinematic drift)
        camera.position.x = Math.sin(elapsed * 0.1) * 2;
        camera.position.y = Math.cos(elapsed * 0.15) * 1;
        camera.lookAt(coreGroup.position);

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
