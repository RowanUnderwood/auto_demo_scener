<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Tunnel</title>
<style>
  body { margin: 0; overflow: hidden; background: #05010f; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://unpkg.com/three@latest/build/three.module.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05010f, 0.035);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const points = [];
for (let i = 0; i < 18; i++) {
  const a = i / 18 * Math.PI * 2;
  points.push(new THREE.Vector3(
    Math.sin(a * 2) * 22 + Math.sin(a * 5) * 4,
    Math.cos(a * 3) * 13 + Math.cos(a * 2) * 3,
    Math.cos(a * 2) * 22
  ));
}
const curve = new THREE.CatmullRomCurve3(points, true, 'catmullrom', 0.5);

const tubeGeo = new THREE.TubeGeometry(curve, 800, 2.4, 28, true);
const uTime = { value: 0 };
const tubeMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uTime },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main() {
      float scroll = vUv.x * 40.0 - uTime * 1.2;
      float f = fract(scroll);
      float stripe = smoothstep(0.0, 0.4, f) * (1.0 - smoothstep(0.4, 0.8, f));
      float grid = smoothstep(0.46, 0.5, abs(fract(vUv.y * 14.0) - 0.5));
      vec3 colA = vec3(1.0, 0.15, 0.55);
      vec3 colB = vec3(0.15, 0.9, 1.0);
      vec3 col = mix(colA, colB, 0.5 + 0.5 * sin(scroll * 0.35 + uTime * 0.7));
      float glow = stripe * 0.9 + grid * 0.5 + 0.06;
      col *= glow;
      col += 0.015 * colB;
      gl_FragColor = vec4(col, 1.0);
    }`,
  side: THREE.BackSide
});
const tube = new THREE.Mesh(tubeGeo, tubeMat);
scene.add(tube);

const hoops = [];
const HOOP_COUNT = 90;
for (let i = 0; i < HOOP_COUNT; i++) {
  const t = i / HOOP_COUNT;
  const pos = curve.getPointAt(t);
  const tan = curve.getTangentAt(t).normalize();
  const geo = new THREE.TorusGeometry(2.25, 0.05, 6, 40);
  const mat = new THREE.MeshBasicMaterial({
    color: i % 2 ? new THREE.Color(0xff2d78) : new THREE.Color(0x30e8ff)
  });
  const hoop = new THREE.Mesh(geo, mat);
  hoop.position.copy(pos);
  hoop.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tan);
  hoop.userData.phase = i * 0.4;
  scene.add(hoop);
  hoops.push(hoop);
}

const pCount = 1200;
const pPos = new Float32Array(pCount * 3);
const pCol = new Float32Array(pCount * 3);
const cA = new THREE.Color(0xff2d78), cB = new THREE.Color(0x30e8ff), cW = new THREE.Color(0xc8a8ff);
const tmp = new THREE.Vector3();
for (let i = 0; i < pCount; i++) {
  const t = Math.random();
  const pos = curve.getPointAt(t);
  const ang = Math.random() * Math.PI * 2;
  const rad = 0.6 + Math.random() * 1.6;
  const tan = curve.getTangentAt(t);
  const nrm = new THREE.Vector3(0, 1, 0).cross(tan).normalize();
  const bn = new THREE.Vector3().crossVectors(tan, nrm);
  tmp.copy(pos)
    .addScaledVector(nrm, Math.cos(ang) * rad)
    .addScaledVector(bn, Math.sin(ang) * rad);
  pPos[i * 3] = tmp.x; pPos[i * 3 + 1] = tmp.y; pPos[i * 3 + 2] = tmp.z;
  const c = Math.random() < 0.4 ? cA : Math.random() < 0.7 ? cB : cW;
  pCol[i * 3] = c.r; pCol[i * 3 + 1] = c.g; pCol[i * 3 + 2] = c.b;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.14, vertexColors: true, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
}));
scene.add(particles);

const startTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const time = (performance.now() - startTime) / 1000;
  uTime.value = time;

  const speed = 0.055 + Math.sin(time * 0.3) * 0.012;
  const t = (time * speed) % 1;
  camera.position.copy(curve.getPointAt(t));
  const look = curve.getPointAt((t + 0.02) % 1);
  camera.lookAt(look);
  camera.rotateZ(Math.sin(time * 0.9) * 0.15);

  for (const h of hoops) {
    const s = 1 + Math.sin(time * 2.5 + h.userData.phase) * 0.08;
    h.scale.setScalar(s);
  }
  particles.rotation.y = Math.sin(time * 0.1) * 0.05;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
