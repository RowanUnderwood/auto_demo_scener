<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.150.1/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Geometry setup
    const geometry = new THREE.IcosahedronGeometry(2, 1);
    const edges = new THREE.EdgesGeometry(geometry);

    // Container for rotation
    const container = new THREE.Group();
    scene.add(container);

    // Main Wireframe
    const mainMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88 });
    const mainWireframe = new THREE.LineSegments(edges, mainMaterial);
    container.add(mainWireframe);

    // Glow Hint Wireframe (Scaled and Transparent)
    const glowMaterial = new THREE.LineBasicMaterial({ 
        color: 0x00ff88, 
        transparent: true, 
        opacity: 0.3 
    });
    const glowWireframe = new THREE.LineSegments(edges, glowMaterial);
    glowWireframe.scale.set(1.05, 1.05, 1.05);
    container.add(glowWireframe);

    // Animation loop
    function animate() {
        requestAnimationFrame(animate);

        container.rotation.x += 0.005;
        container.rotation.y += 0.01;

        renderer.render(scene, camera);
    }

    // Handle resizing
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
