<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry Shader</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float u_time;
            uniform vec2 u_resolution;
            varying vec2 vUv;

            #define PI 3.14159265359
            #define N 8.0

            void main() {
                // Normalize UV to centered aspect-corrected coordinates
                vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.y, u_resolution.x);

                // Convert to polar
                float r = length(uv);
                float theta = atan(uv.y, uv.x);

                // Fold the angle into a wedge using the requested formula: 
                // a = abs(mod(a, 2*PI/N) - PI/N)
                float angleStep = (2.0 * PI) / N;
                float a = abs(mod(theta, angleStep) - (angleStep / 2.0));

                // Convert back to cartesian for sampling
                vec2 p = vec2(r * cos(a), r * sin(a));

                // Procedural pattern: sums of sin(p * freq + time)
                vec3 color = vec3(0.0);
                float t = u_time * 0.5;
                
                // Layered sine waves for complexity
                color += 0.5 * sin(p.x * 4.0 + t) * cos(p.y * 3.0 - t);
                color += 0.3 * sin(p.y * 10.0 + t * 1.5) * sin(p.x * 8.0 + t * 0.7);
                color += 0.2 * sin((p.x + p.y) * 20.0 - t * 2.0);

                // Colorize the pattern using cosine palette technique
                vec3 baseCol = 0.5 + 0.5 * cos(t + p.xyx + vec3(0.0, 2.0, 4.0));
                color *= baseCol;

                // Add some vignette/radial falloff
                color *= smoothstep(1.8, 0.2, r);

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        let scene, camera, renderer, material;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const geometry = new THREE.PlaneGeometry(2, 2);
            material = new THREE.ShaderMaterial({
                uniforms: {
                    u_time: { value: 0 },
                    u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
                },
                vertexShader,
                fragmentShader
            });

            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);
            material.uniforms.u_time.value = time * 0.001;
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
