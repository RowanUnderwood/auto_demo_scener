<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Icosahedron</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Geometry Creation
        const geometry = new THREE.IcosahedronGeometry(2, 1);
        const edges = new THREE.EdgesGeometry(geometry);
        const neonColor = 0x00ff88;

        // Main Line Group
        const group = new THREE.Group();

        // Primary Edges
        const mainMaterial = new THREE.LineBasicMaterial({ 
            color: neonColor,
            linewidth: 2 // Note: linewidth is often ignored in WebGL except on some OS/drivers
        });
        const mainLines = new THREE.LineSegments(edges, mainMaterial);

        // Glow Edges (Scaled and transparent)
        const glowMaterial = new THREE.LineBasicMaterial({ 
            color: neonColor,
            transparent: true,
            opacity: 0.3
        });
        const glowLines = new THREE.LineSegments(edges, glowMaterial);
        glowLines.scale.set(1.05, 1.05, 1.05);

        group.add(mainLines);
        group.add(glowLines);
        scene.add(group);

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            group.rotation.x += 0.005;
            group.rotation.y += 0.01;

            renderer.render(scene, camera);
        }

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
