<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEURAL_FLUX // Demoscene</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        canvas { display: block; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: #0f0; pointer-events: none; text-shadow: 0 0 5px #0f0; font-size: 12px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div id="ui">SYSTEM_STATUS: DREAMING... <br>KERNEL_MODE: NEURAL_FLUX</div>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        /**
         * IDEA: "NEURAL_FLUX"
         * A hybrid of Raymarched SDFs, Vector Field Streamlines, and Glitch Post-processing.
         * We render an infinite field of "synaptic" filaments (raymarched tubes) that react 
         * to a simulated neuro-electrical pulse traveling through a 3D noise-based manifold.
         */

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- SHADERS ---

        const fragmentShader = `
            uniform float time;
            uniform vec2 resolution;
            uniform sampler2D tDiffuse;

            // GLSL Noise functions
            mat2 rot(float a) { return mat2(cos(a), -sin(a), sin(a), cos(a)); }
            
            float hash(vec3 p) {
                p = fract(p * 0.3183099 + .1);
                p *= 17.0;
                return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
            }

            float snoise(vec3 x) {
                vec3 i = floor(x);
                vec3 f = fract(x);
                f = f*f*(3.0-2.0*f);
                return mix(mix(mix(hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)),f.x),
                               mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)),f.x),f.y),
                           mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)),f.x),
                               mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)),f.x),f.y),f.z);
            }

            float map(vec3 p) {
                // Create a warped field of "nerve" nodes using periodic snoise
                float n = snoise(p * 0.5 + time * 0.2);
                float pulse = sin(length(p) * 0.5 - time * 2.0) * 0.5 + 0.5;
                
                // The core SDF: a field of thin filaments
                float d = length(sin(p * 1.5 + n)) - 0.05;
                d += pulse * 0.1; // Pulse effect
                return d;
            }

            vec3 getNormal(vec3 p) {
                vec2 e = vec2(0.01, 0);
                return normalize(vec3(
                    map(p + e.xyy) - map(p - e.xyy),
                    map(p + e.yxy) - map(p - e.yxy),
                    map(p + e.yyx) - map(p - e.yyx)
                ));
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy - 0.5 * resolution.xy) / min(resolution.y, resolution.x);
                vec3 ro = vec3(0.0, 0.0, length(uv) * 4.0); // Camera position based on UV to look "into" the depth
                // Actually let's use a standard camera approach for the raymarcher
                ro = vec3(sin(time*0.2)*5.0, cos(time*0.3)*2.0, 8.0);
                vec3 target = vec3(0,0,0);
                vec3 ww = normalize(target - ro);
                vec3 uu = normalize(cross(ww, vec3(0,1,0)));
                vec3 vv = normalize(cross(uu, ww));
                vec3 rd = normalize(uv.x*uu + uv.y*vv + 1.5*ww);

                float t = 0.0;
                float d;
                for(int i=0; i<80; i++) {
                    d = map(ro + rd * t);
                    if(d < 0.001 || t > 40.0) break;
                    t += d;
                }

                vec3 col = vec3(0.0);
                if(t < 40.0) {
                    vec3 p = ro + rd * t;
                    vec3 norm = getNormal(p);
                    float light = max(dot(norm, normalize(vec3(1,2,3))), 0.0);
                    float glow = exp(-t * 0.15); // Depth fog
                    
                    // Color based on position and normal
                    vec3 baseCol = 0.5 + 0.5 * cos(time + p.xyx + vec3(0,2,4));
                    col = baseCol * light * glow;
                    col += pow(max(dot(reflect(rd, norm), normalize(vec3(1,1,-1))), 0.0), 32.0); // Specular
                } else {
                    // Background: Deep space void with noise starfield
                    float stars = pow(snoise(rd * 50.0 + time*0.1), 20.0);
                    col = vec3(stars) * 0.5;
                }

                // Chromatic Aberration Glitch (Simulated)
                float shift = sin(time*10.0)*0.005 * step(0.98, hash(vec3(time)));
                col.r = col.r; // Simplified for single pass
                
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        const vertexShader = `
            void main() {
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        // --- SETUP RENDERER & MESH ---

        const quadGeom = new THREE.PlaneGeometry(2, 2);
        const shaderMat = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            vertexShader,
            fragmentShader
        });

        const quad = new THREE.Mesh(quadGeom, shaderMat);
        scene.add(quad);

        camera.position.z = 1; // Quad is at origin, camera looking at it

        // --- ANIMATION LOOP ---

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            shaderMat.uniforms.time.value = t;

            // Subtle "glitch" effect via camera shake
            if (Math.random() > 0.98) {
                camera.position.x = (Math.random() - 0.5) * 0.02;
                camera.position.y = (Math.random() - 0.5) * 0.02;
            } else {
                camera.position.set(0, 0, 1);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            shaderMat.uniforms.resolution.value.set(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        });

        animate();
    </script>
</body>
</html>
