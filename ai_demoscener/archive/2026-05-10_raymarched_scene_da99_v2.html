<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Fractal SDF</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);
        const uniforms = {
            u_time: { value: 0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            u_mouse: { value: new THREE.Vector2(0.5, 0.5) }
        };

        const material = new THREE.ShaderMaterial({
            uniforms,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                precision highp float;
                uniform float u_time;
                uniform vec2 u_resolution;
                uniform vec2 u_mouse;
                varying vec2 vUv;

                #define MAX_STEPS 100
                #define SURFACE_DIST 0.001
                #define MAX_DIST 40.0

                mat2 rot(float a) {
                    float s = sin(a), c = cos(a);
                    return mat2(c, -s, s, c);
                }

                float sdTorus(vec3 p, vec2 t) {
                    vec2 q = vec2(length(p.xz) - t.x, p.y);
                    return length(q) - t.y;
                }

                float sdOctahedron(vec3 p, float s) {
                    p = abs(p);
                    return (p.x + p.y + p.z - s) * 0.57735027;
                }

                float map(vec3 p) {
                    // Fractal rotation/warping
                    p.yz *= rot(u_time * 0.3);
                    p.xz *= rot(u_time * 0.2);
                    
                    // Infinite space folding
                    vec3 q = mod(p + 4.0, 8.0) - 4.0;
                    
                    // Geometric combination
                    float torus = sdTorus(q, vec2(1.5, 0.4));
                    float octa = sdOctahedron(q, 1.2);
                    
                    // Smooth blending (metaball effect)
                    float d = mix(torus, octa, 0.5 + 0.5 * sin(u_time * 0.5));
                    
                    // Distort based on distance to origin for more complexity
                    d += sin(p.x * 2.0 + u_time) * 0.1 * cos(p.y * 2.0);

                    return d;
                }

                vec3 getNormal(vec3 p) {
                    vec2 e = vec2(0.002, 0.0);
                    float d = map(p);
                    vec3 n = d - vec3(
                        map(p - e.xyy),
                        map(p - e.yxy),
                        map(p - e.yyx)
                    );
                    return normalize(n);
                }

                void main() {
                    vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.y, u_resolution.x);
                    
                    // Dynamic Camera
                    float camDist = 6.0;
                    vec3 ro = vec3(sin(u_time * 0.1) * camDist, cos(u_time * 0.2) * 2.0, cos(u_time * 0.1) * camDist);
                    vec3 target = vec3(0.0, 0.0, 0.0);
                    vec3 ww = normalize(target - ro);
                    vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
                    vec3 vv = normalize(cross(uu, ww));
                    vec3 rd = normalize(uv.x * uu + uv.y * vv + 1.5 * ww);

                    // Raymarching loop
                    float dO = 0.0;
                    int steps = 0;
                    for(int i = 0; i < MAX_STEPS; i++) {
                        vec3 p = ro + rd * dO;
                        float dS = map(p);
                        dO += dS;
                        steps = i;
                        if(dO > MAX_DIST || dS < SURFACE_DIST) break;
                    }

                    vec3 color = vec3(0.02, 0.01, 0.05); // Deep space dark blue/purple

                    if(dO < MAX_DIST) {
                        vec3 p = ro + rd * dO;
                        vec3 n = getNormal(p);
                        
                        // Lighting setup
                        vec3 lightPos = vec3(5.0 * sin(u_time), 5.0, 5.0 * cos(u_time));
                        vec3 l = normalize(lightPos - p);
                        float diff = max(dot(n, l), 0.0);
                        float spec = pow(max(dot(reflect(-l, n), -rd), 0.0), 32.0);
                        
                        // Material coloring (Neon/Cyberpunk)
                        vec3 objCol = mix(vec3(0.1, 0.8, 1.0), vec3(1.0, 0.1, 0.5), sin(dO * 0.5 + u_time) * 0.5 + 0.5);
                        
                        // Ambient occlusion approximation
                        float ao = 1.0 - float(steps) / float(MAX_STEPS);
                        
                        color = objCol * diff;
                        color += spec * 0.8; // Highlights
                        color *= ao;
                        
                        // Fresnel effect for edges
                        float fresnel = pow(1.0 + dot(rd, n), 4.0);
                        color += fresnel * vec3(0.5, 0.0, 1.0) * 2.0;
                    } else {
                        // Background stars/glimmer
                        float stars = pow(fract(sin(dot(uv, vec2(12.9898, 78.233))) * 43758.5453), 20.0);
                        color += stars * 0.3;
                    }

                    // Post-process: Vignette and Bloom simulation
                    float vignette = smoothstep(1.2, 0.4, length(uv));
                    color *= vignette;
                    
                    // Color grading/Gamma
                    color = pow(color, vec3(0.4545));

                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });

        scene.add(new THREE.Mesh(geometry, material));

        function animate(time) {
            uniforms.u_time.value = time * 0.001;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });

        window.addEventListener('mousemove', (e) => {
            uniforms.u_mouse.value.x = e.clientX / window.innerWidth;
            uniforms.u_mouse.value.y = 1.0 - e.clientY / window.innerHeight;
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
