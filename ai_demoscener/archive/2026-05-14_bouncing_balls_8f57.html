<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Gravity Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        // Camera Setup
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 10, 15);
        camera.lookAt(0, 0, 0);

        // Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xffffff, 0.5);
        pointLight.position.set(0, 5, 0);
        scene.add(pointLight);

        // Parameters
        const boxSize = 10;
        const sphereRadius = 0.5;
        const limit = boxSize / 2 - sphereRadius; // Collision boundary
        const gravity = -9.8;
        const damping = 0.95;

        // Create Bounding Box Wireframe
        const boxGeometry = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
        const edges = new THREE.EdgesGeometry(boxGeometry);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x4444ff });
        const wireframeBox = new THREE.LineSegments(edges, lineMaterial);
        scene.add(wireframeBox);

        // Create Spheres
        const spheres = [];
        const sphereGeo = new THREE.SphereGeometry(sphereRadius, 32, 32);

        for (let i = 0; i < 30; i++) {
            const material = new THREE.MeshPhongMaterial({
                color: new THREE.Color(Math.random(), Math.random(), Math.random()),
                shininess: 50
            });
            const mesh = new THREE.Mesh(sphereGeo, material);

            // Random Position within box
            mesh.position.x = (Math.random() - 0.5) * (boxSize - 1);
            mesh.position.y = (Math.random() - 0.5) * (boxSize - 1);
            mesh.position.z = (Math.random() - 0.5) * (boxSize - 1);

            // Random Initial Velocity
            const velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5
            );

            scene.add(mesh);
            spheres.push({ mesh, velocity });
        }

        // Animation Loop
        let previousTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const dt = (time - previousTime) / 1000; // Delta time in seconds
            previousTime = time;

            // Cap dt to prevent physics explosions on lag spikes
            const safeDt = Math.min(dt, 0.1);

            spheres.forEach(obj => {
                const { mesh, velocity } = obj;

                // Apply Gravity
                velocity.y += gravity * safeDt;

                // Integrate Position
                mesh.position.addScaledVector(velocity, safeDt);

                // Wall Collision Detection (X)
                if (mesh.position.x > limit) {
                    mesh.position.x = limit;
                    velocity.x *= -damping;
                } else if (mesh.position.x < -limit) {
                    mesh.position.x = -limit;
                    velocity.x *= -damping;
                }

                // Wall Collision Detection (Z)
                if (mesh.position.z > limit) {
                    mesh.position.z = limit;
                    velocity.z *= -damping;
                } else if (mesh.position.z < -limit) {
                    mesh.position.z = -limit;
                    velocity.z *= -damping;
                }

                // Wall Collision Detection (Y)
                if (mesh.position.y > limit) {
                    mesh.position.y = limit;
                    velocity.y *= -damping;
                } else if (mesh.position.y < -limit) {
                    mesh.position.y = -limit;
                    velocity.y *= -damping;
                }
            });

            renderer.render(scene, camera);
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
