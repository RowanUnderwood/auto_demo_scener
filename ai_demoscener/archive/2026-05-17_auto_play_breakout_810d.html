<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Playing Breakout</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script type="module">
    import * as THREE from 'three';

    const COLS = 14;
    const ROWS = 8;
    const BRICK_W = 1.2;
    const BRICK_H = 0.5;
    const GAP = 0.2;
    const PADDLE_W = 3;
    const PADDLE_H = 0.4;
    const BALL_RADIUS = 0.25;
    const SPEED = 0.18;

    const scene = new THREE.Scene();
    const aspect = window.innerWidth / window.innerHeight;
    const viewWidth = 20;
    const viewHeight = 26;
    
    const camera = new THREE.OrthographicCamera(
        -viewWidth / 2, viewWidth / 2, 
        viewHeight / 2, -viewHeight / 2, 
        0.1, 1000
    );
    camera.position.z = 15;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xffffff, 1);
    pointLight.position.set(0, 0, 10);
    scene.add(pointLight);

    let bricks = [];
    let paddle, ball, ballVel;

    function initGame() {
        // Clear existing
        bricks.forEach(b => scene.remove(b.mesh));
        bricks = [];
        if (paddle) scene.remove(paddle);
        if (ball) scene.remove(ball);

        // Bricks
        const brickGeo = new THREE.BoxGeometry(BRICK_W, BRICK_H, 0.5);
        const startX = -((COLS * (BRICK_W + GAP)) / 2) + BRICK_W/2;
        const startY = viewHeight / 2 - 3;

        for (let r = 0; r < ROWS; r++) {
            const hue = r / ROWS;
            const color = new THREE.Color().setHSL(hue, 0.8, 0.5);
            const material = new THREE.MeshPhongMaterial({ color });

            for (let c = 0; c < COLS; c++) {
                const mesh = new THREE.Mesh(brickGeo, material);
                mesh.position.set(
                    startX + c * (BRICK_W + GAP),
                    startY - r * (BRICK_H + GAP),
                    0
                );
                scene.add(mesh);
                bricks.push({ 
                    mesh, 
                    xMin: mesh.position.x - BRICK_W/2,
                    xMax: mesh.position.x + BRICK_W/2,
                    yMin: mesh.position.y - BRICK_H/2,
                    yMax: mesh.position.y + BRICK_H/2
                });
            }
        }

        // Paddle
        const paddleGeo = new THREE.PlaneGeometry(PADDLE_W, PADDLE_H);
        const paddleMat = new THREE.MeshPhongMaterial({ color: 0xffffff, side: THREE.DoubleSide });
        paddle = new THREE.Mesh(paddleGeo, paddleMat);
        paddle.position.set(0, -viewHeight / 2 + 2, 0);
        scene.add(paddle);

        // Ball
        const ballGeo = new THREE.SphereGeometry(BALL_RADIUS, 16, 16);
        const ballMat = new THREE.MeshPhongMaterial({ color: 0xffff00 });
        ball = new THREE.Mesh(ballGeo, ballMat);
        ball.position.set(0, 0, 0);
        scene.add(ball);

        // Velocity (normalized direction * speed)
        const angle = Math.PI / 4;
        ballVel = new THREE.Vector3(Math.cos(angle) * SPEED, Math.sin(angle) * SPEED, 0);
    }

    initGame();

    function reset() {
        if (bricks.length === 0) {
            initGame();
        } else {
            ball.position.set(0, 0, 0);
            ballVel.set(SPEED * Math.cos(Math.PI/4), SPEED * Math.sin(Math.PI/4), 0);
        }
    }

    function animate() {
        requestAnimationFrame(animate);

        // Ball movement
        ball.position.add(ballVel);

        // Paddle Tracking
        paddle.position.x += (ball.position.x - paddle.position.x) * 0.12;

        // Wall Collisions
        if (Math.abs(ball.position.x) > viewWidth / 2) {
            ballVel.x *= -1;
            ball.position.x = Math.sign(ball.position.x) * (viewWidth/2 - 0.1);
        }
        if (ball.position.y > viewHeight / 2) {
            ballVel.y *= -1;
            ball.position.y = viewHeight / 2 - 0.1;
        }

        // Paddle Collision
        const dx = Math.abs(ball.position.x - paddle.position.x);
        const dy = Math.abs(ball.position.y - paddle.position.y);
        if (dx < PADDLE_W/2 + BALL_RADIUS && dy < PADDLE_H/2 + BALL_RADIUS) {
            // Ensure ball is moving downwards to hit paddle
            if (ballVel.y < 0) {
                ballVel.y *= -1;
                // Add some spin based on where it hits the paddle
                const impact = (ball.position.x - paddle.position.x) / (PADDLE_W/2);
                ballVel.x += impact * 0.05;
            }
        }

        // Brick Collisions
        for (let i = bricks.length - 1; i >= 0; i--) {
            const b = bricks[i];
            if (ball.position.x > b.xMin && ball.position.x < b.xMax &&
                ball.position.y > b.yMin && ball.position.y < b.yMax) {
                
                ballVel.y *= -1;
                scene.remove(b.mesh);
                bricks.splice(i, 1);
                break; // One brick per frame to prevent multi-hits
            }
        }

        // Loss Condition
        if (ball.position.y < -viewHeight / 2) {
            reset();
        }

        // Win condition check handled in reset() via bricks.length

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        const aspect = window.innerWidth / window.innerHeight;
        camera.left = -viewWidth/2 * (aspect > 1 ? 1 : aspect); // simplified scaling
        // For simplicity in this specific fixed view, we just resize the renderer
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
