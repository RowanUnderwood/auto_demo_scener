<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Polar Checkerboard</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<!-- Load Three.js from CDN -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- Shader Code ---
    const vertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;

    const fragmentShader = `
        uniform float u_time;
        uniform vec2 u_resolution;
        varying vec2 vUv;

        #define PI 3.14159265359

        void main() {
            // Center UVs to range [-1, 1]
            vec2 uv = vUv * 2.0 - 1.0;
            
            // Adjust for aspect ratio to keep circle circular
            uv.x *= u_resolution.x / u_resolution.y;

            // Convert to Polar Coordinates
            float r = length(uv);
            float a = atan(uv.y, uv.x);

            // Prevent division by zero at the center
            float safeR = max(r, 0.001);

            // Compute u and v as requested
            // u = 1/r + time (creates the infinite zoom effect towards center)
            // v = a / PI
            float u = (1.0 / safeR) + u_time;
            float v = a / PI;

            // Procedural Checkerboard logic
            // step(0.5, fract(u * 4.0)) XOR step(0.5, fract(v * 8.0))
            float checkU = step(0.5, fract(u * 4.0));
            float checkV = step(0.5, fract(v * 8.0));
            
            // XOR for binary values (0 or 1) is equivalent to abs(a - b)
            float pattern = abs(checkU - checkV);

            // Darken by r so the center stays bright
            // We use (1.0 - r) so that at r=0, multiplier is 1 (bright), 
            // and as r increases, it gets darker.
            float vignette = clamp(1.0 - r, 0.0, 1.0);

            vec3 color = vec3(pattern) * vignette;

            gl_FragColor = vec4(color, 1.0);
        }
    `;

    // --- Three.js Setup ---

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Fullscreen Quad (Plane covering the whole screen)
    const geometry = new THREE.PlaneGeometry(2, 2);
    const uniforms = {
        u_time: { value: 0.0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    const material = new THREE.ShaderMaterial({
        uniforms: uniforms,
        vertexShader: vertexShader,
        fragmentShader: fragmentShader
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // Handle Resize
    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    function animate(time) {
        // Convert time to seconds
        uniforms.u_time.value = time * 0.001;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
</script>
</body>
</html>
