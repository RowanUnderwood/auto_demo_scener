<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Shader Quad</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<!-- Load Three.js from CDN -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Orthographic Camera for a fullscreen quad
    // We set the frustum to -1 to 1 so a plane of size 2 covers it perfectly
    const aspect = window.innerWidth / window.innerHeight;
    const camera = new THREE.OrthographicCamera(-aspect, aspect, 1, -1, 0.1, 10);
    camera.position.z = 1;

    // --- Shader Material Definition ---
    const vertexShader = `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `;

    const fragmentShader = `
        uniform float u_time;
        varying vec2 vUv;

        // Smooth RGB palette function
        vec3 palette(float t) {
            // Standard cosine palette formula
            vec3 a = vec3(0.5, 0.5, 0.5);
            vec3 b = vec3(0.5, 0.5, 0.5);
            vec3 c = vec3(1.0, 1.0, 1.0);
            vec3 d = vec3(0.263, 0.416, 0.557);
            return a + b * cos(6.28318 * (c * t + d));
        }

        void main() {
            // The requested pattern logic
            float val = sin(vUv.x * 10.0 + u_time) + 
                        sin(vUv.y * 8.0 + u_time) + 
                        sin(length(vUv - 0.5) * 15.0 + u_time * 2.0);
            
            vec3 color = palette(val);
            gl_FragColor = vec4(color, 1.0);
        }
    `;

    const shaderMaterial = new THREE.ShaderMaterial({
        uniforms: {
            u_time: { value: 0.0 }
        },
        vertexShader: vertexShader,
        fragmentShader: fragmentShader
    });

    // --- Geometry Setup ---
    // A plane covering -aspect to aspect on X and -1 to 1 on Y matches the camera
    const geometry = new THREE.PlaneGeometry(2 * aspect, 2);
    const quad = new THREE.Mesh(geometry, shaderMaterial);
    scene.add(quad);

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        
        // Update time uniform
        shaderMaterial.uniforms.u_time.value = clock.getElapsedTime();
        
        renderer.render(scene, camera);
    }

    // Handle Window Resize
    window.addEventListener('resize', () => {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const newAspect = width / height;

        renderer.setSize(width, height);
        
        // Update camera frustum to prevent stretching
        camera.left = -newAspect;
        camera.right = newAspect;
        camera.top = 1;
        camera.bottom = -1;
        camera.updateProjectionMatrix();

        // Scale the quad geometry to match the new aspect ratio
        quad.geometry.dispose();
        quad.geometry = new THREE.PlaneGeometry(2 * newAspect, 2);
    });

    animate();
</script>
</body>
</html>
