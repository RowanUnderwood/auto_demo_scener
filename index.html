<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Demoscener — Archive</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  font-family: 'Courier New', 'Lucida Console', monospace;
  font-size: clamp(11px, min(2.2vh, 1.4vw), 18px);
  background: #0d0800;
  color: #ffb000;
  --bg:      #0d0800;
  --bg2:     #1a1200;
  --fg:      #ffb000;
  --fg-dim:  #7a5500;
  --accent:  #ff8800;
  --scanlines: rgba(0,0,0,0.15);
  --glow:    0 0 8px rgba(255,176,0,0.5);
  --border:  #331a00;
  --titlebar:#1a1000;
  --btn:     #2a1a00;
}

#app {
  width: 100vw;
  height: 100vh;
  position: relative;
  background: var(--bg);
}

/* ── Demo iframe ──────────────────────────────────────────────────────────── */
#demoFrame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.6s ease;
}
#demoFrame.visible { opacity: 1; }

/* ── Overlay ──────────────────────────────────────────────────────────────── */
#overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  background: var(--bg);
  display: grid;
  grid-template-rows: auto 1fr auto;
  opacity: 1;
  transition: opacity 0.5s ease;
  pointer-events: auto;
}
#overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

/* Scanlines */
#overlay::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px, transparent 2px,
    var(--scanlines) 2px, var(--scanlines) 4px
  );
  pointer-events: none;
  z-index: 10;
}

/* ── Title bar ────────────────────────────────────────────────────────────── */
#titleBar {
  background: var(--titlebar);
  border-bottom: 1px solid var(--border);
  padding: 0.3em 0.8em;
  display: flex;
  align-items: center;
  gap: 0.6em;
  user-select: none;
}

.win-btn {
  width: 0.9em;
  height: 0.9em;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--btn);
  flex-shrink: 0;
}

#titleText {
  flex: 1;
  text-align: center;
  color: var(--fg);
  font-weight: bold;
  letter-spacing: 0.1em;
  text-shadow: var(--glow);
  font-size: 0.9em;
}

#countChip {
  font-size: 0.75em;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 0.1em 0.5em;
  border-radius: 2px;
}

/* ── Main content ─────────────────────────────────────────────────────────── */
#main {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1em;
  padding: 2em;
  text-align: center;
}

#loadLabel {
  color: var(--fg-dim);
  font-size: 0.8em;
  letter-spacing: 0.2em;
}

#loadDots::after {
  content: '';
  animation: dots 1.2s steps(4, end) infinite;
}
@keyframes dots {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
  100% { content: ''; }
}

#effectName {
  font-size: clamp(1.4em, 5vw, 3.5em);
  font-weight: bold;
  color: var(--accent);
  text-shadow: var(--glow);
  letter-spacing: 0.15em;
  word-break: break-word;
}

#demoTitle {
  font-size: clamp(0.85em, 2vw, 1.2em);
  color: var(--fg);
  margin-top: 0.2em;
  font-style: italic;
}

#demoDesc {
  font-size: clamp(0.7em, 1.5vw, 0.9em);
  color: var(--fg-dim);
  margin-top: 0.15em;
  font-style: italic;
  max-width: 60vw;
}

#modelLabel {
  font-size: 0.65em;
  color: var(--fg-dim);
  margin-top: 0.2em;
}

#fileLabel {
  color: var(--fg-dim);
  font-size: 0.75em;
  letter-spacing: 0.05em;
  word-break: break-all;
}

/* ── Status bar ───────────────────────────────────────────────────────────── */
#statusBar {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 0.2em 0.8em;
  display: flex;
  align-items: center;
  gap: 1em;
  font-size: 0.8em;
  color: var(--fg-dim);
  user-select: none;
}

#statusText {
  flex: 1;
  color: var(--accent);
  font-weight: bold;
  letter-spacing: 0.05em;
  text-shadow: var(--glow);
}

#statsLine { font-size: 0.8em; color: var(--fg-dim); }
#keyHints { color: var(--fg-dim); font-size: 0.9em; }

/* ── Progress bar ─────────────────────────────────────────────────────────── */
#progressBar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  z-index: 3;
  background: var(--bg2);
  opacity: 0;
  transition: opacity 0.4s;
}

#progressFill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  box-shadow: var(--glow);
}

/* ── Error state ──────────────────────────────────────────────────────────── */
#effectName.error { color: var(--fg-dim); font-size: 1.2em; }

/* ── Music button ─────────────────────────────────────────────────────────── */
#musicBtn {
  position: absolute;
  bottom: 30px;
  right: 12px;
  z-index: 4;
  font-family: 'Courier New', 'Lucida Console', monospace;
  font-size: 0.75em;
  cursor: pointer;
  color: var(--fg-dim);
  background: var(--bg2);
  border: 1px solid var(--border);
  padding: 0.15em 0.5em;
  user-select: none;
  white-space: nowrap;
  transition: color 0.3s;
}
#musicBtn:hover { color: var(--fg); }
#musicBtn.playing { color: var(--accent); text-shadow: var(--glow); border-color: var(--accent); }
</style>
</head>
<body>
<div id="app">

  <iframe id="demoFrame" sandbox="allow-scripts" src="about:blank"></iframe>

  <div id="overlay">
    <div id="titleBar">
      <div class="win-btn"></div>
      <div class="win-btn"></div>
      <div class="win-btn"></div>
      <div id="titleText">DEMOWRITER&nbsp;1.0 — ARCHIVE</div>
      <div id="countChip">— / —</div>
    </div>

    <div id="main">
      <div id="loadLabel">LOADING<span id="loadDots"></span></div>
      <div id="effectName"></div>
      <div id="demoTitle"></div>
      <div id="demoDesc"></div>
      <div id="modelLabel"></div>
      <div id="fileLabel"></div>
    </div>

    <div id="statusBar">
      <span id="statusText">INITIALISING</span>
      <span id="statsLine"></span>
      <span id="keyHints">← prev &nbsp;·&nbsp; → / space next</span>
    </div>
  </div>

  <div id="progressBar"><div id="progressFill"></div></div>
  <span id="musicBtn" title="Toggle music">♪ MUSIC</span>
  <audio id="bgMusic" preload="auto"></audio>

</div>
<script>
'use strict';

const ARCHIVE_BASE = 'ai_demoscener/archive/';
const params  = new URLSearchParams(location.search);
const RUNTIME = Math.max(5, parseInt(params.get('runtime') || '15', 10));

const demoFrame   = document.getElementById('demoFrame');
const overlay     = document.getElementById('overlay');
const effectName  = document.getElementById('effectName');
const demoTitle   = document.getElementById('demoTitle');
const demoDesc    = document.getElementById('demoDesc');
const modelLabel  = document.getElementById('modelLabel');
const fileLabel   = document.getElementById('fileLabel');
const statsLine   = document.getElementById('statsLine');
const countChip   = document.getElementById('countChip');
const statusText  = document.getElementById('statusText');
const progressBar = document.getElementById('progressBar');
const progressFill= document.getElementById('progressFill');

let entries = [];
let statsData = {};
let idx = 0;
let displayTimer = null;
let transTimer   = null;

// ── Shuffle ───────────────────────────────────────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  statusText.textContent = 'LOADING INDEX…';
  try {
    const [indexResp, statsResp] = await Promise.all([
      fetch(ARCHIVE_BASE + 'archive_index.json'),
      fetch('ai_demoscener/prompt_stats.json').catch(() => null),
    ]);
    if (!indexResp.ok) throw new Error(`HTTP ${indexResp.status}`);
    const data = await indexResp.json();
    if (statsResp && statsResp.ok) {
      statsData = await statsResp.json().catch(() => ({}));
    }
    entries = Object.entries(data)
      .filter(([k]) => k.toLowerCase().endsWith('.html'))
      .sort((a, b) => (a[1].created || '').localeCompare(b[1].created || ''));
    if (entries.length === 0) {
      showError('ARCHIVE EMPTY', 'No demos found in archive_index.json');
      return;
    }
    shuffle(entries);
    showDemo(0);
  } catch (e) {
    showError('COULD NOT LOAD INDEX', e.message);
  }
}

// ── Demo cycle ────────────────────────────────────────────────────────────────
function showDemo(i) {
  idx = ((i % entries.length) + entries.length) % entries.length;

  // Reshuffle when we wrap around to keep it fresh
  if (i !== 0 && idx === 0) shuffle(entries);

  clearTimers();

  const [filename, meta] = entries[idx];
  const effect = (meta.effect || filename).replace(/_/g, ' ');

  // Update overlay text
  effectName.className   = '';
  effectName.textContent = effect.toUpperCase();
  demoTitle.textContent  = meta.title || '';
  demoDesc.textContent   = meta.description || '';
  modelLabel.textContent = meta.model ? 'by ' + meta.model : '';
  fileLabel.textContent  = filename;
  countChip.textContent  = `${idx + 1} / ${entries.length}`;
  statusText.textContent = 'LOADING…';

  // Stats line from prompt_stats.json
  const st    = statsData[meta.effect || ''] || {};
  const runs  = st.runs || 0;
  const fails = st.total || 0;
  const dels  = st.deletions || 0;
  statsLine.textContent = runs > 0
    ? `${runs} runs · ${fails} fail · ${dels} del`
    : '';

  // Show overlay, hide frame and progress
  overlay.classList.remove('hidden');
  demoFrame.classList.remove('visible');
  progressBar.style.opacity = '0';

  // Load the demo
  demoFrame.src = ARCHIVE_BASE + filename;

  // After a short delay, reveal the demo
  transTimer = setTimeout(() => {
    transTimer = null;
    overlay.classList.add('hidden');
    demoFrame.classList.add('visible');
    statusText.textContent = 'RUNNING';
    startProgress();
    displayTimer = setTimeout(() => showDemo(idx + 1), RUNTIME * 1000);
  }, 5000);
}

// ── Progress bar ──────────────────────────────────────────────────────────────
function startProgress() {
  progressFill.style.transition = 'none';
  progressFill.style.width = '0%';
  progressBar.style.opacity = '1';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    progressFill.style.transition = `width ${RUNTIME}s linear`;
    progressFill.style.width = '100%';
  }));
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function clearTimers() {
  if (displayTimer) { clearTimeout(displayTimer); displayTimer = null; }
  if (transTimer)   { clearTimeout(transTimer);   transTimer   = null; }
}

function showError(title, detail) {
  effectName.className = 'error';
  effectName.textContent = title;
  fileLabel.textContent  = detail || '';
  countChip.textContent  = '— / —';
  statusText.textContent = 'HALTED';
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    showDemo(idx + 1);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    showDemo(idx - 1);
  }
});

// Relay keydown events from iframe (demo steals focus when WebGL loads)
window.addEventListener('message', (ev) => {
  if (ev.data?.type === 'probe_keydown') {
    const k = ev.data.key;
    if (k === 'ArrowRight' || k === ' ') showDemo(idx + 1);
    else if (k === 'ArrowLeft') showDemo(idx - 1);
  }
});

// Reclaim focus after iframe loads so keyboard shortcuts keep working
demoFrame.addEventListener('load', () => {
  if (demoFrame.src !== 'about:blank') window.focus();
});

// ── Background music ──────────────────────────────────────────────────────────
const TRACKS = [
  'Cinder Server.mp3',
  'Cinder Server (1).mp3',
  'Cobalt Footnotes.mp3',
  'Cobalt Footnotes (1).mp3',
  'Copper Synapse.mp3',
  'Copper Synapse (1).mp3',
  'Stacklight Syntax.mp3',
  'Stacklight Syntax (1).mp3',
];

const bgMusic  = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');
let lastTrackIdx = -1;
let musicStarted = false;
bgMusic.volume = 0.5;

function pickTrack() {
  let i;
  do { i = Math.floor(Math.random() * TRACKS.length); }
  while (i === lastTrackIdx && TRACKS.length > 1);
  lastTrackIdx = i;
  return TRACKS[i];
}

function trackName(f) {
  return f.replace(/\.mp3$/i, '').replace(/\s*\(\d+\)$/, '');
}

function playNext() {
  const track = pickTrack();
  bgMusic.src = ARCHIVE_BASE + encodeURIComponent(track);
  bgMusic.play().catch(() => {});
}

function startMusic() {
  if (musicStarted) return;
  musicStarted = true;
  playNext();
}

bgMusic.addEventListener('ended', playNext);

bgMusic.addEventListener('play', () => {
  musicBtn.textContent = '♫ ' + trackName(TRACKS[lastTrackIdx]);
  musicBtn.classList.add('playing');
});

bgMusic.addEventListener('pause', () => {
  if (!bgMusic.ended) {
    musicBtn.textContent = '♪ MUTED';
    musicBtn.classList.remove('playing');
  }
});

musicBtn.addEventListener('click', () => {
  if (bgMusic.paused) {
    bgMusic.play().catch(() => {});
    if (!musicStarted) musicStarted = true;
  } else {
    bgMusic.pause();
  }
});

// Start on first keyboard gesture (covers autoplay block)
document.addEventListener('keydown', function onFirstKey() {
  startMusic();
  document.removeEventListener('keydown', onFirstKey, true);
}, true);

// Try immediate autoplay; show MUTED if blocked (music is on by default)
{
  const track = pickTrack();
  bgMusic.src = ARCHIVE_BASE + encodeURIComponent(track);
  bgMusic.play().then(() => { musicStarted = true; }).catch(() => {
    musicBtn.textContent = '♪ MUTED';
  });
}

init();
</script>
</body>
</html>
